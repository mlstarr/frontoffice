/* ---------- ratings in context ---------- */
function posPercentile(p){
  const peers=S.teams.flatMap(t=>t.roster.map(id=>S.players[id]))
    .filter(x=>x&&x.pos===p.pos);
  if(peers.length<8) return null;
  const below=peers.filter(x=>x.ovr<p.ovr).length;
  return {pct:Math.round(below/peers.length*100), n:peers.length,
    mean:Math.round(avg(peers.map(x=>x.ovr)))};
}
function percentileLine(p){
  const q=posPercentile(p);
  if(!q) return "";
  const word=q.pct>=95?"elite for the position":q.pct>=80?"well above the position average"
    :q.pct>=55?"above average":q.pct>=30?"below average":"replacement level";
  return `<div class="pb tight"><div class="row spread"><span class="small">Against other ${p.pos}s</span>
      <span class="small"><b>${q.pct}${q.pct%100>=11&&q.pct%100<=13?"th":["th","st","nd","rd"][q.pct%10]||"th"} percentile</b></span></div>
    <div class="meter"><i class="${q.pct>=70?"green":q.pct>=35?"":"red"}" style="width:${q.pct}%"></i></div>
    <p class="tiny dim">${word} — the league average ${p.pos} is ${q.mean}.</p></div>`;
}

/* ---------- league-wide search and comparison ---------- */
function searchPlayers(q,limit){
  q=(q||"").toLowerCase().trim();
  if(q.length<2) return [];
  const out=[];
  for(const id in S.players){
    const p=S.players[id];
    if(!p||!p.pos||p.retired) continue;
    if(`${p.f} ${p.l}`.toLowerCase().includes(q)||p.pos.toLowerCase()===q){
      out.push(p);
      if(out.length>400) break;
    }
  }
  return out.sort((a,b)=>b.ovr-a.ovr).slice(0,limit||40);
}
function compareSlots(){ V.compare=V.compare||[]; return V.compare; }
function comparePanel(){
  const ids=compareSlots();
  if(ids.length<2) return "";
  const ps=ids.map(id=>S.players[id]).filter(Boolean);
  if(ps.length<2) return "";
  const rows=[["Overall",p=>p.ovr],["Age",p=>p.age],["Experience",p=>p.exp+"y"],
    ["Cap hit",p=>p.contract?fmtM(capHit(p)):"—"],
    ["Years left",p=>p.contract?p.contract.left:"—"],
    ["Dead if cut",p=>p.contract?fmtM(deadMoney(p)):"—"],
    ["Scheme fit",p=>fitWord(schemeFit(p))],
    ["Mood",p=>moraleWord(moraleOf(p))],
    ["Percentile",p=>{const q=posPercentile(p);return q?q.pct+"%":"—";}]];
  return `<div class="panel"><div class="ph"><h3>Side by side</h3>
      <span class="sub"><button class="chip" data-act="clearcompare">Clear</button></span></div>
    <div class="scroll"><table><thead><tr><th></th>
      ${ps.map(p=>`<th class="n">${posTag(p.pos)} ${esc(p.l)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(([label,f])=>{
        const vals=ps.map(f);
        const nums=vals.map(v=>typeof v==="number"?v:NaN);
        const best=Math.max(...nums.filter(v=>!isNaN(v)));
        return `<tr><td class="small muted">${label}</td>
          ${vals.map((v,i)=>`<td class="n ${nums[i]===best&&!isNaN(best)?"good":""}">${v}</td>`).join("")}</tr>`;
      }).join("")}</tbody></table></div></div>`;
}

/* ---------- your own draft board ---------- */
function bigBoard(){
  const t=S.teams[S.userTeam];
  if(!S.board||S.board.year!==S.year) S.board={year:S.year,ids:[]};
  // anyone you've ranked stays where you put him; everyone else sits below by grade
  const ranked=S.board.ids.filter(id=>S.prospects.includes(id));
  const rest=S.prospects.filter(id=>!ranked.includes(id))
    .sort((a,b)=>boardGrade(S.players[b])-boardGrade(S.players[a]));
  S.board.ids=ranked;
  return {ranked,rest};
}
function boardMove(pid,dir){
  bigBoard();
  const ids=S.board.ids;
  const i=ids.indexOf(+pid);
  if(i<0){ ids.push(+pid); return; }
  const j=i+dir;
  if(j<0||j>=ids.length) return;
  const x=ids[i]; ids[i]=ids[j]; ids[j]=x;
}
function boardTop(){
  const {ranked,rest}=bigBoard();
  return ranked.concat(rest);
}

const SLOTS=3;

let SLOT_INFO=[];
function slotMeta(){ return (S&&S.slotInfo)||SLOT_INFO||[]; }
async function readSlots(){
  const raw=await storeGet(slotMetaKey());
  let info=[];
  try{ info=raw?JSON.parse(raw):[]; }catch(e){ info=[]; }
  SLOT_INFO=info;
  if(S) S.slotInfo=info;          // S may not exist yet at boot
  return info;
}
async function writeSlotMeta(info){
  SLOT_INFO=info;
  if(S) S.slotInfo=info;
  await storePut(slotMetaKey(),JSON.stringify(info));
}
async function saveToSlot(i){
  const t=S.teams[S.userTeam];
  const ok=await storePut(slotKey(i),serialiseState());
  const info=slotMeta().slice();
  info[i]={club:`${t.city} ${t.name}`, year:S.year, phase:phaseLabel(),
           record:`${t.w}-${t.l}`, at:Date.now(), ok};
  await writeSlotMeta(info);
  S.saveOK=ok;
  return ok;
}
async function loadFromSlot(i){
  const raw=await storeGet(slotKey(i));
  if(!raw) return "That slot is empty.";
  try{
    S=JSON.parse(raw); migrateSave(); S.slotInfo=SLOT_INFO;
    return null;
  }catch(e){ return "That save wouldn't open."; }
}
async function clearSlot(i){
  await storePut(slotKey(i),"");
  const info=slotMeta().slice();
  info[i]=null;
  await writeSlotMeta(info);
}

/* the weekly housekeeping */
function runAutoJobs(){
  const t=S.teams[S.userTeam];
  if(autoOn("ir")){
    for(const id of t.roster.slice()){
      const p=S.players[id];
      if(!p||p.pinActive) continue;
      if(p.injury>=4&&(t.ir||[]).length<IR_SLOTS&&t.roster.length>ROSTER_MAX-8){
        if(!placeIR(t,p)) news(`${p.pos} ${p.l} placed on reserve — he's out ${p.injury} weeks.`,"info",p.id);
      }
    }
  }
  if(autoOn("squad")){
    let guard=0;
    while((t.ps||[]).length<PS_SLOTS-3&&guard++<4){
      const pool=S.freeAgents.map(id=>S.players[id])
        .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56)
        .sort((a,b)=>b.ovr-a.ovr);
      let man=pool[0];
      if(!man){
        // the AI clubs stock their squads too; there are always more kids
        man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24));
        man.exp=ri(0,1);
        S.players[man.id]=man; S.freeAgents.push(man.id);
      }
      if(signToPS(t,man)) break;
    }
  }
}
function runAutoCuts(){
  const t=S.teams[S.userTeam];
  if(!autoOn("cuts")||t.roster.length<=ROSTER_MAX) return;
  const n=t.roster.length-ROSTER_MAX;
  if(typeof ACT!=="undefined"&&ACT.autocut) ACT.autocut(true);
  if(t.roster.length<=ROSTER_MAX)
    news(`${n} player${n===1?"":"s"} released to reach the roster limit.`,"info");
}

        if(!placeIR(t,p)) n++; }
      let back=0;
      for(const id of (t.ir||[]).slice()){ const p=S.players[id];
        if(p&&p.injury<=0&&S.week>=(p.irReturn||0)&&t.roster.length<ROSTER_MAX&&!activateFromIR(t,p)) back++; }
      return n||back ? `${n} placed on reserve, ${back} brought back.` : "Nobody to move.";
    }},
  squad:{label:"Fill the practice squad", where:"team",
    run(t){ const before=(t.ps||[]).length; let guard=0;
      while((t.ps||[]).length<PS_SLOTS&&guard++<12){
        const pool=S.freeAgents.map(id=>S.players[id])
          .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56).sort((a,b)=>b.ovr-a.ovr);
        let man=pool[0];
        if(!man){ man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24)); man.exp=ri(0,1);
          S.players[man.id]=man; S.freeAgents.push(man.id); }
        if(signToPS(t,man)) break; }
      const n=(t.ps||[]).length-before;
      return n?`${n} added to the squad.`:"The squad is as full as it can be.";
    }},
  cuts:{label:"Get to the roster limit", where:"team",
    run(t){ if(t.roster.length<=ROSTER_MAX) return "You're already at the limit.";
      const n=t.roster.length-ROSTER_MAX;
      ACT.autocut(true);
      return `${n} released.`; }},
  fill:{label:"Fill the empty roster spots", where:"team",
    run(t){ const before=t.roster.length;
      if(before>=ROSTER_MAX) return "The roster is full.";
      fillRosterFromFA(t,false);
      const n=t.roster.length-before;
      return n?`${n} signed to fill out the roster.`:"Nobody worth signing.";
    }},
  cap:{label:"Get us under the cap", where:"office",
    run(t){ if(capSpace(t)>=0) return "You're already legal.";
      const over=-capSpace(t);
      enforceCap(t);
      return capSpace(t)>=0 ? `${fmtM(over)} cleared.` : "Couldn't clear it all — you'll have to trade somebody.";
    }},
  board:{label:"Have the room rank the board", where:"scout",
    run(t){ if(!S.prospects||!S.prospects.length) return "There's no class to rank.";
      bigBoard();
      S.board.ids=S.prospects.slice()
        .sort((a,b)=>(boardGrade(S.players[b])+needScore(t,S.players[b].pos)*0.3)
                    -(boardGrade(S.players[a])+needScore(t,S.players[a].pos)*0.3))
        .slice(0,25);
      return "The board is ranked. Move anyone you disagree with."; }}
};
function staffButton(job,cls){
  const j=STAFF_JOBS[job];
  if(!j) return "";
  return `<button class="btn ${cls||""}" data-act="staffdo" data-arg="${job}">${esc(j.label)}</button>`;
}
function staffButtonsFor(where){
  return `<div class="pb"><div class="row wrap">${
    Object.keys(STAFF_JOBS).filter(k=>STAFF_JOBS[k].where===where)
      .map(k=>staffButton(k,"sm")).join("")}</div></div>`;
}
function runEverything(){
  const t=S.teams[S.userTeam];
  const order=["cap","cuts","fill","ir","squad","depth"];
  const said=[];
  for(const k of order){
    try{ const msg=STAFF_JOBS[k].run(t); if(msg&&!/already|Nobody|as full|no class/i.test(msg)) said.push(msg); }
    catch(e){}
  }
  return said.length?said.join(" "):"Nothing needed doing.";
}

/* ============================================================
   "Have the staff do it" — every routine job, on demand
   ============================================================ */
const STAFF_TASKS=[
  {k:"depth", label:"Set the depth chart",
   blurb:"Coordinators order every position by rating and by fit.",
   can:()=>true,
   run:t=>{ t.depthManual=false; autoDepth(t); return "The coaches have set the order."; }},

  {k:"reserve", label:"Sort the reserve list",
   blurb:"Place the badly hurt, activate anyone fit and eligible.",
   can:t=>t.roster.some(id=>S.players[id]&&S.players[id].injury>=4&&!S.players[id].pinActive)
        ||(t.ir||[]).some(id=>S.players[id]&&S.players[id].injury<=0),
   run:t=>{
     let on=0,off=0;
     for(const id of (t.ir||[]).slice()){
       const p=S.players[id];
       if(p&&p.injury<=0&&!activateFromIR(t,p)) off++;
     }
     for(const id of t.roster.slice()){
       const p=S.players[id];
       if(p&&!p.pinActive&&p.injury>=4&&(t.ir||[]).length<IR_SLOTS&&!placeIR(t,p)) on++;
     }
     return `${on} to reserve, ${off} activated.`;
   }},

  {k:"squad", label:"Stock the practice squad",
   blurb:"Fill the empty places with young free agents.",
   can:t=>(t.ps||[]).length<PS_SLOTS,
   run:t=>{
     let n=0,guard=0;
     while((t.ps||[]).length<PS_SLOTS&&guard++<12){
       const pool=S.freeAgents.map(id=>S.players[id])
         .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56)
         .sort((a,b)=>b.ovr-a.ovr);
       let man=pool[0];
       if(!man){ man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24)); man.exp=ri(0,1);
                 S.players[man.id]=man; S.freeAgents.push(man.id); }
       if(signToPS(t,man)) break;
       n++;
     }
     return n?`${n} signed to the squad.`:"Nobody worth adding.";
   }},

  {k:"fill", label:"Fill the roster",
   blurb:"Sign free agents until the roster is up to strength.",
   can:t=>t.roster.length<ROSTER_MAX,
   run:t=>{ const before=t.roster.length; fillRosterFromFA(t,true); autoDepth(t);
            return `${t.roster.length-before} signed.`; }},

  {k:"trim", label:"Trim to the limit",
   blurb:"Release the weakest until the roster is legal. Pinned men are kept.",
   can:t=>t.roster.length>ROSTER_MAX,
   run:t=>{ const before=t.roster.length; ACT.autocut(true);
            return `${before-t.roster.length} released.`; }},

  {k:"cap", label:"Get under the cap",
   blurb:"Restructure where possible, release where it isn't.",
   can:t=>capSpace(t)<0,
   run:t=>{ const before=capSpace(t); enforceCap(t);
            return capSpace(t)>=0?`Back under, with ${fmtM(capSpace(t))} to spare.`
              :`Still ${fmtM(-capSpace(t))} over — there is nothing left to move.`; }},

  {k:"scout", label:"Spend the scouting hours",
   blurb:"Put the remaining hours across the men highest on the board.",
   can:t=>S.phase==="predraft"&&t.scoutPts>=8,
   run:t=>{ const before=t.scoutPts;
     const board=S.prospects.slice().sort((a,b)=>
       (S.players[b].draft.consensus)-(S.players[a].draft.consensus));
     let guard=0;
     while(t.scoutPts>=8&&guard++<400){
       let spent=false;
       for(const id of board){
         if(t.scoutPts<8) break;
         const r=S.scout[id];
         if(r&&r.k>=70) continue;
         if(doScout(id,"tape",(t.scouts[0]||{}).id).ok) spent=true;
       }
       if(!spent) break;
     }
     return `${before-t.scoutPts} hours put to work.`; }},

  {k:"board", label:"Build our draft board",
   blurb:"Rank the men your scouts rate highest, in their order.",
   can:()=>S.prospects&&S.prospects.length>0,
   run:()=>{ bigBoard();
     const top=S.prospects.slice().sort((a,b)=>boardGrade(S.players[b])-boardGrade(S.players[a])).slice(0,12);
     S.board.ids=top;
     return `${top.length} men placed on the board.`; }}
];
function staffTaskPanel(){
  const t=S.teams[S.userTeam];
  const jobs=STAFF_TASKS.filter(j=>{ try{ return j.can(t); }catch(e){ return false; } });
  return `<div class="ph"><h3>Have the staff do it</h3>
      <span class="sub">${jobs.length} to hand</span></div>
    <div class="pb stack">
      ${jobs.length?jobs.map(j=>`<div class="note">
        <div class="row spread"><b class="small">${j.label}</b>
          <button class="mini" data-act="stafftask" data-arg="${j.k}">Do it</button></div>
        <div class="tiny dim">${j.blurb}</div></div>`).join("")
        :`<p class="small muted">Nothing needs doing. The building is in order.</p>`}
      ${jobs.length>1?`<button class="btn primary full" data-act="stafftask" data-arg="*">Have them do all of it</button>`:""}
      <p class="tiny dim">Anything here can also be done by hand. These are shortcuts, not the only way.</p>
    </div>`;
}
function runStaffTask(k){
  const t=S.teams[S.userTeam];
  if(k==="*"){
    const done=[];
    for(const j of STAFF_TASKS){
      try{ if(j.can(t)) done.push(`${j.label}: ${j.run(t)}`); }catch(e){}
    }
    return done.length?done.join(" "):"Nothing needed doing.";
  }
  const j=STAFF_TASKS.find(x=>x.k===k);
  if(!j) return "No such job.";
  try{ return j.run(t); }catch(e){ return "That didn't work."; }
}
