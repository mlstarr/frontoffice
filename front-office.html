<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Front Office</title>
<style>
:root{
  --paper:#E3E2D3; --paper2:#EDECE2; --card:#F3F2E9;
  --ink:#1C2833; --ink2:#57616B; --ink3:#8A9099;
  --field:#2E5E4E; --field2:#3F7A66;
  --red:#A32B2B; --gold:#9C7220; --blue:#2B4E7A;
  --rule:#C7C4B2; --rule2:#D9D7C8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:19px} h3{font-size:16px}
a{color:var(--blue)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
header{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#EFEEE4;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex; align-items:center; gap:10px;
  border-bottom:3px solid var(--field);
}
header .crest{width:34px;height:34px;border-radius:2px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:14px;color:#fff}
header .who{flex:1;min-width:0}
header .who b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who span{font-size:11.5px;color:#A9B4BC}
header .cap{text-align:right;font-family:var(--mono);font-size:12px;line-height:1.25}
header .cap i{font-style:normal;color:#A9B4BC;font-family:var(--sans);font-size:10.5px;display:block}

/* ---- layout ---- */
main{max-width:840px;margin:0 auto;padding:12px 12px 24px}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:3px; margin:0 0 12px}
.panel > .ph{display:flex;align-items:baseline;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule2)}
.panel > .ph h2,.panel > .ph h3{flex:1}
.panel > .ph .sub{font-size:12px;color:var(--ink2)}
.pb{padding:12px}
.pb.tight{padding:0}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
hr.rule{border:0;border-top:1px solid var(--rule2);margin:10px 0}

/* ---- buttons ---- */
button{font:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--ink2);color:var(--ink);
  padding:7px 12px;border-radius:3px;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--field);border-color:var(--field);color:#fff;font-weight:600}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.full{width:100%;justify-content:center}
.btn.big{padding:13px;font-size:16px;width:100%;font-family:var(--serif)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper2);border-radius:99px;
  padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
select,input[type=text],input[type=number]{font:inherit;font-size:14px;padding:6px 8px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--field)}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);
  padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--paper2)}
th.n,td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
th.sortable:active{opacity:.6}
th.sortable.on{color:var(--ink)}
th .ar{font-style:normal;font-size:8px;margin-left:3px;opacity:.45}
th.sortable.on .ar{opacity:1}
select{appearance:none;-webkit-appearance:none;padding:6px 26px 6px 10px;font-size:12.5px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),
    linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.searchbox{flex:1;min-width:120px;padding:6px 10px;font-size:12.5px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink)}
.mini{border:1px solid var(--rule);background:var(--paper2);border-radius:3px;
  color:var(--ink2);font-size:11px;line-height:1;padding:3px 6px}
.mini:active{background:var(--ink);color:#fff}
.ul{text-decoration:underline;text-underline-offset:2px}
/* ---- the club's own colour, set on every render ---- */
:root{--team:#2E5E4E;--teamink:#fff}
.ph{border-left:3px solid transparent}
.panel>.ph:first-child{border-left-color:var(--team)}
.chip[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--teamink)}
nav button[aria-current="page"]{color:var(--team)}
nav button[aria-current="page"] .ic{background:var(--team);color:var(--teamink)}
.meter i{background:var(--team)}
.meter i.green{background:var(--field2)} .meter i.red{background:var(--red)}
.btn.primary{background:var(--team);border-color:var(--team);color:var(--teamink)}

/* ---- the number you are actually looking for ---- */
.bignum{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.midnum{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:22px;line-height:1;font-weight:600}
.stat b{font-size:19px}

/* ---- matchday ---- */
.hero{border-radius:4px;overflow:hidden;margin:0 0 10px}
.hero .top{display:flex;align-items:stretch}
.hero .side{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .side.us{color:#fff}
.hero .side.them{background:var(--paper2)}
.hero .side .ab{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em}
.hero .side .rec{font-size:11px;opacity:.75}
.hero .vs{display:grid;place-items:center;padding:0 10px;background:var(--card);
  font-family:var(--serif);font-size:12px;color:var(--ink3)}
.hero .line{padding:8px 12px;background:var(--card);border-top:1px solid var(--rule2);
  font-size:12px;color:var(--ink2)}
.hero .score{font-family:var(--mono);font-size:30px;line-height:1;font-weight:600}

/* ---- a moment that deserves the whole screen ---- */
.takeover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--ink);color:#fff;padding:28px;text-align:center}
.takeover .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
.takeover h1{font-size:34px;line-height:1.1;margin:10px 0;color:#fff}
.takeover p{font-size:14px;opacity:.8;max-width:30ch;margin:0 auto 20px}
.takeover .btn{background:#fff;color:var(--ink);border-color:#fff}
.takeover.win h1{color:#E8C87A}
.takeover.loss h1{color:#E39A9A}

/* ---- a phone is narrow ---- */
@media (max-width:430px){
  table{font-size:12.5px}
  td,th{padding:5px 6px}
  .hide-sm{display:none}
}
.attn{padding:7px 12px;border-bottom:1px solid var(--rule2)}
.attn:last-child{border-bottom:0}
.panel.hint{border-left:3px solid var(--field)}
.panel.guide{border-left:3px solid var(--gold)}

/* ---- the front door ---- */
body.at-menu nav{display:none}
body.at-menu #hdr .cap,body.at-menu #hdr .crest{display:none}
.menu{max-width:460px;margin:0 auto;padding:22px 4px 40px;text-align:center}
.menu-head{padding:26px 0 30px}
.menu-mark{width:58px;height:58px;border-radius:5px;background:var(--field);
  color:#fff;font-family:var(--serif);font-size:23px;font-weight:600;
  display:grid;place-items:center;margin:0 auto 16px;letter-spacing:.04em}
.menu h1{font-size:31px;margin:0 0 8px;letter-spacing:-.01em}
.menu-head p{font-size:13.5px;color:var(--ink2);margin:0 auto;max-width:30ch;line-height:1.5}
.menu-acts{display:flex;flex-direction:column;gap:9px;text-align:left}
.menu-acts .btn{padding:13px 15px;line-height:1.3}
.menu-acts .btn.big{font-size:16px}
.sub2{display:block;font-size:11.5px;font-weight:400;opacity:.72;margin-top:3px}
.menu-foot{font-size:11.5px;color:var(--ink3);margin:26px auto 0;max-width:34ch;line-height:1.55}
.panel.guide .ph{border-left-color:transparent}
.red{color:var(--loss)}
.depthgrp{padding:8px 12px;border-bottom:1px solid var(--rule2)}
.depthrow{padding:2px 0}
.depthrow .num.d{display:inline-block;width:14px;color:var(--ink3);font-size:11px}
tr.mine td{background:var(--paper2);font-weight:600}
.good{color:var(--field)}
.ph.tight{padding-top:4px;padding-bottom:2px}
h3.sm{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
td{padding:7px 8px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click:active{background:var(--paper2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:700;
  padding:2px 4px;border-radius:2px;background:var(--ink);color:#fff;font-family:var(--sans)}
.pos.o{background:var(--field)} .pos.d{background:var(--blue)} .pos.s{background:var(--ink2)}
.ovr{font-family:var(--mono);font-weight:700}

/* ---- misc marks ---- */
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--rule);background:var(--paper2);color:var(--ink2)}
.tag.gold{border-color:var(--gold);color:var(--gold);background:#F7F1DF}
.tag.red{border-color:var(--red);color:var(--red);background:#F8EAE8}
.tag.green{border-color:var(--field);color:var(--field);background:#E7F0EA}
.tag.blue{border-color:var(--blue);color:var(--blue);background:#E8EEF6}
.starmark{color:var(--gold)}
.band{position:relative;height:8px;background:var(--rule2);border-radius:2px;overflow:hidden}
.band i{position:absolute;top:0;bottom:0;background:var(--field);opacity:.35}
.band u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
.meter{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--field)}
.note{border-left:3px solid var(--rule);padding:6px 0 6px 10px;font-size:13px}
.note.tell{border-left-color:var(--field)}
.note.warn{border-left-color:var(--red)}
.note .src{font-size:11px;color:var(--ink3)}
.newsitem{padding:8px 12px;border-bottom:1px solid var(--rule2);font-size:13.5px}
.newsitem:last-child{border-bottom:0}
.newsitem .w{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper2);border:1px solid var(--rule2);border-radius:3px;padding:8px}
.stat b{display:block;font-family:var(--mono);font-size:18px;line-height:1.1}
.stat span{font-size:11px;color:var(--ink2)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);
  display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #000}
nav button{flex:1;min-width:0;background:none;border:0;color:#8D979F;padding:8px 1px 9px;
  font-size:9.5px;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:420px){ nav button{font-size:10.5px;padding:8px 2px 9px} }
nav button b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1}
nav button[aria-current="page"]{color:#F2F1E7;box-shadow:inset 0 3px 0 var(--field2)}

/* ---- sheet / modal ---- */
.veil{position:fixed;inset:0;background:rgba(20,26,32,.55);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:840px;max-height:92vh;overflow-y:auto;
  border-radius:8px 8px 0 0;border-top:3px solid var(--field);
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet .sh{position:sticky;top:0;background:var(--paper);padding:12px;border-bottom:1px solid var(--rule);
  display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet .sh .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink2);padding:0 4px}
.sheet .sb{padding:12px}
@media (min-width:700px){
  .veil{align-items:center}
  .sheet{border-radius:6px;border:1px solid var(--rule);border-top:3px solid var(--field);max-height:88vh}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:70;
  background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:13.5px;
  max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .18s ease-out}
  @keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
:focus-visible{outline:2px solid var(--field2);outline-offset:2px}
.split{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){ .split{grid-template-columns:1fr 1fr} }
.hidden{display:none !important}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
/* ============================================================
   THE FRONT OFFICE — a pro football front-office simulation
   Module 1: core utilities, constants, name data
   ============================================================ */
"use strict";

/* ---------- deterministic RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG = mulberry32(12345);
const rnd = ()=>RNG();
const ri = (a,b)=>a+Math.floor(RNG()*(b-a+1));            // inclusive int
const rf = (a,b)=>a+RNG()*(b-a);
const pick = arr=>arr[Math.floor(RNG()*arr.length)];
function gauss(mu,sd){let u=0,v=0;while(!u)u=RNG();while(!v)v=RNG();
  return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function chance(p){return RNG()<p;}
function wpick(pairs){ // [[val,weight],...]
  let t=0;for(const p of pairs)t+=p[1];let r=RNG()*t;
  for(const p of pairs){r-=p[1];if(r<=0)return p[0];}return pairs[pairs.length-1][0];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- math ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const c99=v=>clamp(Math.round(v),25,99);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmtM=n=>(n<0?"-":"")+"$"+(Math.abs(n)/1e6).toFixed(1)+"M";
const fmtK=n=>"$"+Math.round(n/1000)+"k";
const pct=n=>(n*100).toFixed(1)+"%";
const ordinal=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};

/* ---------- positions ---------- */
const POS = ["QB","RB","WR","TE","LT","LG","C","RG","RT","EDGE","DT","LB","CB","S","K","P"];
const POSGROUP = {QB:"o",RB:"o",WR:"o",TE:"o",LT:"o",LG:"o",C:"o",RG:"o",RT:"o",
  EDGE:"d",DT:"d",LB:"d",CB:"d",S:"d",K:"s",P:"s"};
const OL = ["LT","LG","C","RG","RT"];
const ATTRS = ["spd","acc","agi","str","jmp","awr","thp","tha","cth","rte","elu","trk","rbk","pbk","tak","cov","prs","dur"];
const ATTRNAME = {spd:"Speed",acc:"Acceleration",agi:"Agility",str:"Strength",jmp:"Jumping",
  awr:"Awareness",thp:"Arm strength",tha:"Accuracy",cth:"Hands",rte:"Route running",
  elu:"Elusiveness",trk:"Power running",rbk:"Run blocking",pbk:"Pass blocking",
  tak:"Tackling",cov:"Coverage",prs:"Pass rush",dur:"Durability"};

// which attributes are meaningful for each position (shown on player cards)
const POSATTRS = {
  QB:["thp","tha","awr","spd","elu","dur"],
  RB:["spd","acc","agi","elu","trk","cth","str","dur"],
  WR:["spd","acc","agi","cth","rte","jmp","str","dur"],
  TE:["cth","rte","rbk","str","spd","awr","dur"],
  LT:["pbk","rbk","str","agi","awr","dur"],LG:["rbk","pbk","str","agi","awr","dur"],
  C:["awr","rbk","pbk","str","agi","dur"],RG:["rbk","pbk","str","agi","awr","dur"],
  RT:["pbk","rbk","str","agi","awr","dur"],
  EDGE:["prs","spd","str","tak","acc","awr","dur"],
  DT:["str","prs","tak","awr","acc","dur"],
  LB:["tak","spd","cov","awr","str","prs","dur"],
  CB:["cov","spd","acc","agi","awr","jmp","tak","dur"],
  S:["cov","tak","spd","awr","str","jmp","dur"],
  K:["thp","tha","awr","dur"],P:["thp","tha","awr","dur"]
};

// overall weights
const OVRW = {
  QB:{tha:.30,thp:.14,awr:.30,spd:.06,elu:.06,agi:.04,str:.04,dur:.06},
  RB:{spd:.16,acc:.14,agi:.13,elu:.16,trk:.13,cth:.09,str:.08,awr:.06,dur:.05},
  WR:{spd:.17,acc:.11,agi:.11,cth:.21,rte:.19,jmp:.08,awr:.07,str:.03,dur:.03},
  TE:{cth:.20,rte:.16,rbk:.17,str:.12,spd:.10,awr:.11,agi:.07,dur:.07},
  LT:{pbk:.36,rbk:.22,str:.15,agi:.10,awr:.11,dur:.06},
  LG:{rbk:.31,pbk:.27,str:.19,agi:.07,awr:.10,dur:.06},
  C: {awr:.20,rbk:.26,pbk:.26,str:.15,agi:.07,dur:.06},
  RG:{rbk:.31,pbk:.27,str:.19,agi:.07,awr:.10,dur:.06},
  RT:{pbk:.33,rbk:.24,str:.16,agi:.10,awr:.11,dur:.06},
  EDGE:{prs:.32,spd:.15,str:.15,tak:.13,acc:.10,awr:.09,dur:.06},
  DT:{str:.26,prs:.24,tak:.20,awr:.13,acc:.10,dur:.07},
  LB:{tak:.22,cov:.18,awr:.17,spd:.15,str:.12,prs:.10,dur:.06},
  CB:{cov:.34,spd:.20,acc:.12,agi:.11,awr:.11,jmp:.05,tak:.04,dur:.03},
  S: {cov:.26,tak:.20,awr:.19,spd:.15,str:.09,jmp:.06,dur:.05},
  K: {thp:.45,tha:.40,awr:.10,dur:.05},
  P: {thp:.45,tha:.40,awr:.10,dur:.05}
};

// roster construction targets
const ROSTER_NEED = {QB:3,RB:4,WR:6,TE:3,LT:2,LG:2,C:2,RG:2,RT:2,EDGE:5,DT:5,LB:5,CB:6,S:4,K:1,P:1};
const ROSTER_MAX = 53;

/* ---------- physical templates: [htIn mean/sd, wt mean/sd] ---------- */
const BODY = {
  QB:[75,1.6,225,12], RB:[70,1.7,215,13], WR:[73,2.2,200,14], TE:[77,1.4,250,12],
  LT:[78,1.3,315,14], LG:[77,1.3,318,14], C:[76,1.2,305,12], RG:[77,1.3,318,14], RT:[78,1.3,315,14],
  EDGE:[76,1.5,262,15], DT:[75,1.4,305,17], LB:[74,1.4,240,11],
  CB:[71,1.6,193,10], S:[73,1.4,205,10], K:[73,1.8,195,12], P:[74,1.8,205,12]
};

function rookieAPY(overall){

function computeOVR(pos,a){
  const w=OVRW[pos]; let t=0;
  for(const k in w) t += w[k]*a[k];
  return Math.round(t);
}
function makeAttrs(pos,target,spread){
  const b=baseA(pos), a={};
  for(const k of ATTRS) a[k]=c99(b[k]+gauss(0,spread||6.5));
  const cur=computeOVR(pos,a), d=target-cur;
  for(const k in OVRW[pos]) a[k]=c99(a[k]+d);
  // second pass to correct clamping error
  const d2=target-computeOVR(pos,a);
  if(Math.abs(d2)>0) for(const k in OVRW[pos]) a[k]=c99(a[k]+d2);
  return a;
}

/* ---------- money curves ---------- */
const POSVAL = {QB:2.05,RB:.52,WR:1.18,TE:.78,LT:1.22,LG:.80,C:.82,RG:.80,RT:1.02,
  EDGE:1.40,DT:1.05,LB:.72,CB:1.18,S:.72,K:.16,P:.14};
function ovrMoney(o){ // base APY before position/age scaling
  if(o<=62) return 1.0e6;
  return 1.0e6 * Math.pow(1.128, o-62);
}
function ageMult(age,pos){
  if(age<=23) return .92;
  if(age<=28) return 1.0;
  if(age<=30) return .90;
  if(age<=32) return .74;
  if(age<=34) return .55;
  return .38;
}
function capScaleSafe(){ return (S&&S.cap?S.cap:CAP_BASE)/CAP_BASE; }
function minSalary(){ return Math.round(MIN_SALARY*capScaleSafe()/1e4)*1e4; }
function marketAPY(p){
  // wages ride the cap: a flat scale would let the cap outrun the payroll
  const v = ovrMoney(p.ovr)*POSVAL[p.pos]*ageMult(p.age,p.pos)*(S.moneyScale||0.62)*capScaleSafe();
  const ceiling = S.cap*(p.pos==="QB"?0.175:0.125);
  return clamp(Math.round(v/1e5)*1e5, minSalary(), Math.round(ceiling));
}
function contractYears(p){
  if(p.age>=33) return ri(1,2);
  if(p.age>=30) return ri(1,3);
  if(p.ovr>=78) return ri(3,5);
  return ri(2,4);
}

/* ---------- players ---------- */
function devFromRoll(r){
  if(r>.985) return 4; if(r>.94) return 3; if(r>.78) return 2; if(r>.30) return 1; return 0;
}
const DEVNAME=["Slow","Steady","Quick","Star","Generational"];

function makePlayer(pos,target,age,opts){
  opts=opts||{};
  const a=makeAttrs(pos,target,opts.spread);
  const [hm,hs,wm,ws]=BODY[pos];
  const p={
    id:S.nextId++, f:pick(FIRST), l:pick(LAST), pos, age,
    ht:Math.round(gauss(hm,hs)), wt:Math.round(gauss(wm,ws)/2)*2,
    a, ovr:computeOVR(pos,a),
    exp:opts.exp!==undefined?opts.exp:Math.max(0,age-22),
    teamId:null, injury:0, injDesc:"", morale:ri(55,85),
    stats:{}, career:{gp:0,gs:0,seasons:0}, accolades:[], retired:false,
    hidden:{}
  };
  // hidden development profile
  const gap = opts.potGap!==undefined?opts.potGap:Math.max(0,gauss(age<=23?9:3,age<=23?6:3));
  p.hidden.pot = c99(p.ovr+gap);
  if(pos==="K"||pos==="P") p.hidden.pot = Math.max(p.ovr, Math.min(p.hidden.pot, ri(74,88))); // specialists don't become superstars
  p.hidden.dev = opts.dev!==undefined?opts.dev:devFromRoll(rnd());
  p.hidden.wrk = c99(gauss(65,15));            // work ethic
  p.hidden.inj = c99(gauss(100-p.a.dur,10));   // injury proneness
  p.hidden.chr = c99(gauss(68,16));            // character / locker room
  rollTraits(p);
  p.morale = ri(62,80);
  p.tenure = 0;
  return p;
}

function signPlayer(p,teamId,apy,years,gtdPct){
  p.teamId=teamId;
  if(S.freeAgents) S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
  const a=Math.round(apy);
  const share=clamp(a/(S.cap*0.11),0,1);
  const bonusPct=clamp(0.06+share*0.58+((gtdPct||.45)-0.45)*0.12,0.06,0.64);
  const st=contractHits(a,years,bonusPct);
  p.contract={apy:a,years,left:years,signedYear:S.year,
    gtd:Math.round(a*years*(gtdPct||.45)),
    bonus:st.bonus, prorate:st.prorate, hits:st.hits,
    gtdYears:Math.min(years, a>=12e6?3:a>=5e6?2:1)};
}

/* ---------- staff ---------- */
const SCOUT_FIRST=FIRST, SCOUT_LAST=LAST;
function makeScout(){
  const s={
    id:S.nextId++, f:pick(SCOUT_FIRST), l:pick(SCOUT_LAST),
    region: chance(.72)?pick(REGIONS):null,       // null = national
    posSpec: chance(.55)?pick([["QB","RB","WR","TE"],OL,["EDGE","DT","LB"],["CB","S"]]):null,
    acc: c99(gauss(62,14)),        // how fast/accurate knowledge accrues
    eye: c99(gauss(62,14)),        // low bias, low false-positive notes
    salary: 0, years: ri(1,3)
  };
  // personal biases (systematic, persistent) — this is what makes multiple scouts useful
  s.bias = {
    athlete: gauss(0,4.5)*(1-s.eye/140),   // overrates combine testing
    school:  gauss(0,4.0)*(1-s.eye/140),   // overrates blue bloods
    prod:    gauss(0,4.0)*(1-s.eye/140),   // overrates college production
    flat:    gauss(0,3.0)*(1-s.eye/140)
  };
  s.salary = Math.round((0.35e6 + (s.acc+s.eye)/200*1.1e6)/1e4)*1e4;
  s.name = s.f+" "+s.l;
  return s;
}
function makeCoach(role){
  const c={id:S.nextId++, f:pick(FIRST), l:pick(LAST), role,
    off:c99(gauss(62,13)), def:c99(gauss(62,13)),
    dev:c99(gauss(62,13)),      // player development
    gm:c99(gauss(62,13)),       // game management / clutch
    disc:c99(gauss(62,13)),     // discipline (penalties, morale)
    years:ri(1,4),
    age: role==="HC"? ri(41,63) : ri(33,58),
    onMarket:0};
  if(role==="OC"){c.def=c99(c.def-14);} if(role==="DC"){c.off=c99(c.off-14);}
  c.salary=Math.round((role==="HC"?4e6:1.6e6)*(0.6+ (c.off+c.def+c.dev)/300));
  c.name=c.f+" "+c.l;
  if(typeof TEAM_SCHEMES!=="undefined"&&TEAM_SCHEMES[role])
    c.scheme=pick(Object.keys(TEAM_SCHEMES[role]));
  if(typeof rollCoachPotential==="function"){
    rollCoachPotential(c);
    c.salary=c.value=coachValue(c);
  }
  return c;
}

/* ---------- roster construction ---------- */
function fillRoster(team,strength){
  const order=[];
  for(const pos in ROSTER_NEED) for(let i=0;i<ROSTER_NEED[pos];i++) order.push([pos,i]);
  for(const [pos,depth] of order){
    // starters good, backups worse
    // depth falls away sharply at first and then flattens — the back of an
    // NFL roster is marginal, not amateur
    let base = 77.0 - (depth<=1 ? depth*5.8 : 5.8+(depth-1)*3.0);
    if(pos==="WR"||pos==="CB") base = 77.0 - (depth<=1 ? depth*4.5 : 4.5+(depth-1)*2.5);
    if(pos==="K"||pos==="P") base = 70;
    const target=c99(gauss(base+strength, 5.4));
    const age=wpick([[ri(22,24),28],[ri(25,27),32],[ri(28,30),24],[ri(31,35),16]]);
    const p=makePlayer(pos,target,age);
    p.exp=Math.max(0,p.age-22-ri(0,1));
    const yrs=contractYears(p);
    signPlayer(p,team.id,marketAPY(p),yrs,rf(.3,.6));
    p.contract.left=ri(1,yrs);
    S.players[p.id]=p; team.roster.push(p.id);
  }
}

function makeTeam(i){
  const R=REAL_TEAMS[i];
  const [city,name,abbr,conf,div,color]=[R[0],R[1],R[2],+R[3],R[4],R[5]];
  return {
    id:i, city, name, abbr, conf, div, color,
    roster:[], picks:[], staff:{}, scouts:[],
    w:0,l:0,t:0, pf:0, pa:0, divW:0,divL:0,confW:0,confL:0,
    streak:0, seed:0, madePlayoffs:false,
    scoutBudget:0, scoutPts:0,
    deadCap:0, history:[], ir:[], ps:[],
    ai:{ scoutSkill: clamp(gauss(.55,.18),.15,.95),
         aggression: rf(.3,.9), draftBPA: rf(.35,.85), winNow: rf(.2,.9) },
    prestige: c99(gauss(60,12))
  };
}

function calibrateMoney(){
  // set the league-wide pay scale so an average roster costs ~86% of the cap
  S.moneyScale=1;
  const raw=S.teams.map(t=>sum(t.roster.map(id=>{
    const p=S.players[id];
    return ovrMoney(p.ovr)*POSVAL[p.pos]*ageMult(p.age,p.pos);
  })));
  const mean=avg(raw)||1;
  S.moneyScale = clamp((S.cap*0.86)/mean,0.05,3);
  for(const t of S.teams) for(const id of t.roster){
    const p=S.players[id];
    const left=p.contract?p.contract.left:contractYears(p);
    signPlayer(p,t.id,marketAPY(p),Math.max(1,left),rf(.3,.6));
    p.contract.left=left;
  }
  // every club starts the game cap-legal: stars are on the books, the rest gets squeezed
  for(const t of S.teams){
    const target=S.cap*rf(0.84,0.965);
    let pr=payroll(t), guard=0;
    while(Math.abs(pr-target)/target>0.02&&guard++<7){
      const k=target/pr;
      for(const id of t.roster){ const p=S.players[id];
        setAPY(p,Math.round(p.contract.apy*k/1e5)*1e5); }
      pr=payroll(t);
    }
  }
}
function buildLeague(){
  S.teams = REAL_TEAMS.map((_,i)=>makeTeam(i));
  const strengths = shuffle(S.teams.map((_,i)=>gauss(0,3.6)));
  S.teams.forEach((t,i)=>{
    initOps(t);
    assignSchemes(t);
    fillRoster(t,strengths[i]);
    t.staff.HC=makeCoach("HC"); t.staff.OC=makeCoach("OC"); t.staff.DC=makeCoach("DC");
    t.staff.SD=makeCoach("SD"); // scouting director
    const n=ri(3,5); for(let k=0;k<n;k++) t.scouts.push(makeScout());
    for(const y of [S.year,S.year+1,S.year+2])
      for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
    autoDepth(t);
  });
  calibrateMoney();
}

/* ---------- depth chart ---------- */
function posScore(p,pos){
  // what your coordinator asks for counts as much as what the rating says
  const fit = (typeof schemeFit==="function"&&p.pos===pos) ? (schemeFit(p)-50)*0.11 : 0;
  if(p.pos===pos) return p.ovr+fit;
  const near={LT:["RT","LG","RG","C"],RT:["LT","RG","LG","C"],LG:["RG","C","LT","RT"],
    RG:["LG","C","RT","LT"],C:["LG","RG"],EDGE:["DT","LB"],DT:["EDGE"],LB:["EDGE","S"],
    CB:["S"],S:["CB","LB"],WR:["TE"],TE:["WR"],RB:["TE"]};
  const alt=near[pos]||[];
  const i=alt.indexOf(p.pos);
  return i<0 ? -99 : p.ovr - 6 - i*3;   // out of position, and it shows
}
function autoDepth(t){
  // if you've taken the chart off the coaches, they leave it alone
  if(t.id===S.userTeam&&typeof autoOn==="function"&&!autoOn("depth")&&t.depth) return;
  const prev = t.depthManual ? (t.depth||{}) : null;
  t.depth={};
  const used={};
  for(const pos of POS){
    const cands=t.roster.map(id=>S.players[id]).filter(p=>!p.retired)
      .map(p=>({p,s:posScore(p,pos)-(used[p.id]?45:0)}))
      .filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    const n = pos==="WR"?4:(pos==="RB"||pos==="TE"||pos==="LB"||pos==="DT"||pos==="EDGE"||pos==="CB")?3:pos==="S"?3:2;
    let ids=cands.slice(0,n).map(x=>x.p.id);
    if(prev&&prev[pos]){
      // a chart the user arranged by hand keeps its order; departed men drop out
      const keep=prev[pos].filter(id=>t.roster.includes(id)&&S.players[id]&&!S.players[id].retired);
      ids=keep.concat(ids.filter(id=>!keep.includes(id))).slice(0,n);
    }
    t.depth[pos]=ids; ids.forEach(id=>{used[id]=1;});
  }
}
function starter(t,pos,i){
  const d=t.depth&&t.depth[pos]; if(!d||!d[i||0]) return null;
  const p=S.players[d[i||0]];
  return (p&&!p.retired)?p:null;
}
function healthyStarter(t,pos,i){
  const d=(t.depth&&t.depth[pos])||[];
  let k=0;
  for(const id of d){ const p=S.players[id];
    if(p&&!p.retired&&p.injury<=0&&!p.holdout){ if(k===(i||0)) return p; k++; } }
  return d.length?S.players[d[0]]:null;
}
function unitRating(t,pos,weightArr){
  // weighted mean of top players at a position
  const w=weightArr||[1];
  let tot=0,ws=0;
  for(let i=0;i<w.length;i++){ const p=healthyStarter(t,pos,i);
    if(p){tot+=p.ovr*w[i]; ws+=w[i];} else {tot+=48*w[i]; ws+=w[i];} }
  return ws?tot/ws:50;
}
function payroll(t){
  let s=t.deadCap||0;
  for(const id of t.roster){const p=S.players[id]; if(p&&p.contract) s+=capHit(p);}
  // reserve and practice-squad men are still paid, and still count
  for(const id of (t.ir||[])){const p=S.players[id]; if(p&&p.contract) s+=capHit(p);}
  for(const id of (t.ps||[])){const p=S.players[id]; if(p&&p.contract) s+=capHit(p);}
  return s;
}
function capSpace(t){return S.cap - payroll(t);}
/* ============================================================
   Module 3: schedule + game simulation + season structure
   ============================================================ */

const WEEKS = 18;

function circleRounds(n){            // n even: n-1 perfect matchings
  const arr=[]; for(let i=1;i<n;i++) arr.push(i);
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[[0,arr[r%(n-1)]]];
    for(let i=1;i<n/2;i++){
      const a=arr[(r+i)%(n-1)], b=arr[(r-i+2*(n-1))%(n-1)];
      pairs.push([a,b]);
    }
    rounds.push(pairs);
  }
  return rounds;
}
const DIVWEEKS=[1,4,8,11,15,18];
function sameDiv(a,b){const x=S.teams[a],y=S.teams[b];return x.conf===y.conf&&x.div===y.div;}

function buildSchedule(){
  const sched=[], homeCount=new Array(S.teams.length).fill(0);
  const addGame=(week,a,b)=>{
    let home=a,away=b;
    if(homeCount[b]<homeCount[a]) {home=b;away=a;}
    else if(homeCount[a]===homeCount[b]&&chance(.5)) {home=b;away=a;}
    homeCount[home]++;
    sched.push({week,home,away,played:false,hs:0,as:0});
  };

  /* --- divisional double round robin: six weeks where everyone plays a rival --- */
  const rr4=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  for(let leg=0;leg<2;leg++) for(let r=0;r<3;r++){
    const week=DIVWEEKS[leg*3+r];
    for(let c=0;c<2;c++) for(let d=0;d<4;d++){
      const ts=S.teams.filter(t=>t.conf===c&&t.div===d).map(t=>t.id);
      for(const [i,j] of rr4[r]){
        // second leg flips the host
        const a=leg===0?ts[i]:ts[j], b=leg===0?ts[j]:ts[i];
        homeCount[a]++;
        sched.push({week,home:a,away:b,played:false,hs:0,as:0});
      }
    }
  }

  /* --- eleven non-division games across the other twelve weeks --- */
  const openWeeks=[]; for(let w=1;w<=WEEKS;w++) if(!DIVWEEKS.includes(w)) openWeeks.push(w);
  const rounds=shuffle(circleRounds(S.teams.length));
  const used=new Set(); // pair keys already scheduled
  const key=(a,b)=>Math.min(a,b)+":"+Math.max(a,b);
  for(let c=0;c<2;c++) for(let d=0;d<4;d++){
    const ts=S.teams.filter(t=>t.conf===c&&t.div===d).map(t=>t.id);
    for(let i=0;i<4;i++) for(let j=i+1;j<4;j++) used.add(key(ts[i],ts[j]));
  }
  const chosen=[];
  for(const round of rounds){
    if(chosen.length>=12) break;
    const pairs=round.map(p=>p.slice());
    // repair any divisional or duplicate pairing by swapping partners inside the round
    for(let i=0;i<pairs.length;i++){
      const [a,b]=pairs[i];
      if(!sameDiv(a,b)&&!used.has(key(a,b))) continue;
      let fixed=false;
      for(let j=0;j<pairs.length&&!fixed;j++){
        if(i===j) continue;
        const [c2,d2]=pairs[j];
        for(const [x,y,z,w] of [[a,c2,b,d2],[a,d2,b,c2]]){
          if(!sameDiv(x,y)&&!sameDiv(z,w)&&!used.has(key(x,y))&&!used.has(key(z,w))){
            pairs[i]=[x,y]; pairs[j]=[z,w]; fixed=true; break;
          }
        }
      }
      if(!fixed){ pairs[i]=null; }
    }
    const clean=pairs.filter(Boolean);
    if(clean.length<15) continue;      // too broken, skip this round
    clean.forEach(p=>used.add(key(p[0],p[1])));
    chosen.push(clean);
  }
  while(chosen.length<12) chosen.push([]);  // safety valve

  /* --- one bye per team: pull a perfect matching out of the twelve rounds --- */
  const NT=S.teams.length;
  const flat=[];
  chosen.forEach((round,ri)=>round.forEach((p,pi)=>flat.push({ri,pi,a:p[0],b:p[1]})));
  // a greedy matching often strands a club or two without a bye, and those clubs
  // end up playing eighteen games — so try until every one of them is covered
  let bye=null, dropped=null;
  for(let attempt=0;attempt<80;attempt++){
    shuffle(flat);
    const bt=new Array(NT).fill(false), dr=new Set();
    for(const g of flat){
      if(bt[g.a]||bt[g.b]) continue;
      bt[g.a]=bt[g.b]=true;
      dr.add(g.ri+"/"+g.pi);
    }
    const covered=bt.filter(Boolean).length;
    if(!bye||covered>bye.filter(Boolean).length){ bye=bt; dropped=dr; }
    if(covered===NT) break;
  }
  chosen.forEach((round,ri)=>{
    const week=openWeeks[ri];
    round.forEach((p,pi)=>{ if(!dropped.has(ri+"/"+pi)) addGame(week,p[0],p[1]); });
  });

  /* --- top up anyone short (rare, from a skipped round) --- */
  const count=new Array(NT).fill(0);
  sched.forEach(g=>{count[g.home]++;count[g.away]++;});
  for(let pass=0;pass<400;pass++){
    const short=[]; for(let i=0;i<NT;i++) if(count[i]<17) short.push(i);
    if(short.length<2) break;
    let placed=false;
    for(let i=0;i<short.length&&!placed;i++) for(let j=i+1;j<short.length&&!placed;j++){
      const a=short[i],b=short[j];
      if(sameDiv(a,b)||used.has(key(a,b))) continue;
      for(const w of shuffle(openWeeks.slice())){
        const busy=sched.some(g=>g.week===w&&(g.home===a||g.away===a||g.home===b||g.away===b));
        if(busy) continue;
        used.add(key(a,b)); addGame(w,a,b); count[a]++;count[b]++; placed=true; break;
      }
    }
    if(!placed) break;
  }
  // anyone still on eighteen loses a non-division game, and his opponent picks up another
  for(let i=0;i<NT;i++){
    if(count[i]<=17) continue;
    const cand=sched.filter(g=>(g.home===i||g.away===i)&&!sameDiv(g.home,g.away));
    for(const g of shuffle(cand.slice())){
      const other=g.home===i?g.away:g.home;
      if(count[other]<=17) continue;
      sched.splice(sched.indexOf(g),1);
      count[i]--; count[other]--;
      used.delete(key(g.home,g.away));
      break;
    }
  }
  sched.sort((a,b)=>a.week-b.week);
  S.schedule=sched;
  return true;
}

/* ---------- team unit ratings ---------- */
function synTeam(t){
  const c={anchor:0,puller:0,bend:0,push:0,rangy:0,thumper:0,press:0,centerfield:0,ballhawk:0};
  for(const pos of POS) for(const id of (t.depth[pos]||[]).slice(0,2)){
    const p=S.players[id]; if(!p) continue;
    for(const k in c) if(hasSyn(p,k)) c[k]+=synWeight(p,k);
  }
  return c;
}
/* what the men on the field are worth today, over and above their ratings:
   how happy they are, whether they fit what we ask them to do, and who
   grows or shrinks in the fourth quarter */
function sideAdjust(t,side,late){
  const men=[];
  for(const pos of POS){
    if(POSGROUP[pos]!==side) continue;
    for(let i=0;i<2;i++){ const p=healthyStarter(t,pos,i); if(p) men.push(p); }
  }
  if(!men.length) return 0;
  return avg(men.map(p=>gameOvr(p,{late:!!late})));
}
function teamUnits(t){
  const c=t.staff;
  const qb=healthyStarter(t,"QB",0);
  const olp=avg(OL.map(p=>{const x=healthyStarter(t,p,0);return x?x.a.pbk:45;}));
  const olr=avg(OL.map(p=>{const x=healthyStarter(t,p,0);return x?x.a.rbk:45;}));
  const wr=[0,1,2].map(i=>healthyStarter(t,"WR",i)).filter(Boolean);
  const te=healthyStarter(t,"TE",0);
  const rbs=[0,1].map(i=>healthyStarter(t,"RB",i)).filter(Boolean);
  const rec = avg([...wr.map((p,i)=>(p.a.cth*.5+p.a.rte*.3+p.a.spd*.2)*(i===0?1:i===1?.9:.75)),
                   te?(te.a.cth*.55+te.a.rte*.3+te.a.spd*.15)*.8:38]);
  const rush = rbs.length? avg(rbs.map((p,i)=>(p.a.elu*.35+p.a.trk*.25+p.a.spd*.25+p.a.acc*.15)*(i?.55:1)))*1.25 : 45;
  const ed=[0,1].map(i=>healthyStarter(t,"EDGE",i)).filter(Boolean);
  const dt=[0,1].map(i=>healthyStarter(t,"DT",i)).filter(Boolean);
  const lb=[0,1].map(i=>healthyStarter(t,"LB",i)).filter(Boolean);
  const cb=[0,1,2].map(i=>healthyStarter(t,"CB",i)).filter(Boolean);
  const sf=[0,1].map(i=>healthyStarter(t,"S",i)).filter(Boolean);
  const prs = avg([...ed.map(p=>p.a.prs*1.0),...dt.map(p=>p.a.prs*.8)].concat([40]));
  const rund= avg([...dt.map(p=>p.a.tak*.5+p.a.str*.5),...lb.map(p=>p.a.tak*.7+p.a.str*.3)].concat([45]));
  const cov = avg([...cb.map((p,i)=>p.a.cov*(i<2?1:.8)),...sf.map(p=>p.a.cov*.85),
                   ...lb.map(p=>p.a.cov*.5)].concat([42]));
  const ocb=(c.HC?c.HC.off:60)*.4+(c.OC?c.OC.off:60)*.6;
  const dcb=(c.HC?c.HC.def:60)*.4+(c.DC?c.DC.def:60)*.6;
  return {
    qbA: qb? qb.a.tha*.45+qb.a.awr*.35+qb.a.thp*.20 : 40,
    qbM: qb? qb.a.spd*.5+qb.a.elu*.5 : 40,
    qb, pblk:olp, rblk:olr, rec, rush, prs, rund, cov,
    ocoach:(ocb-60)*.15, dcoach:(dcb-60)*.15,
    oAdjust:sideAdjust(t,"o",false)+(t.id===S.userTeam?planEffect(t,"o"):0),
    dAdjust:sideAdjust(t,"d",false)+(t.id===S.userTeam?planEffect(t,"d"):0),
    oAdjustLate:sideAdjust(t,"o",true)+(t.id===S.userTeam?planEffect(t,"o"):0),
    dAdjustLate:sideAdjust(t,"d",true)+(t.id===S.userTeam?planEffect(t,"d"):0),
    disc: c.HC?c.HC.disc:60, gm:c.HC?c.HC.gm:60,
    k: healthyStarter(t,"K",0), p: healthyStarter(t,"P",0)
  };
}
function usageShares(t){
  const g=[];
  const add=(p,w)=>{if(p)g.push([p,w]);};
  const w1=healthyStarter(t,"WR",0),w2=healthyStarter(t,"WR",1),w3=healthyStarter(t,"WR",2),w4=healthyStarter(t,"WR",3);
  const t1=healthyStarter(t,"TE",0),t2=healthyStarter(t,"TE",1);
  const r1=healthyStarter(t,"RB",0),r2=healthyStarter(t,"RB",1),r3=healthyStarter(t,"RB",2);
  add(w1,.272);add(w2,.180);add(w3,.105);add(w4,.040);
  add(t1,.150);add(t2,.042);add(r1,.140);add(r2,.056);add(r3,.015);
  // shift toward the better players
  const base=avg(g.map(x=>x[0].ovr))||70;
  g.forEach(x=>x[1]*=Math.pow(Math.max(.5,x[0].ovr/base),1.9));
  g.forEach(x=>{ for(const k of ["scramble","contested","yac","seam","thirddown"])
    if(hasSyn(x[0],k)) x[1]*=1+0.085*synWeight(x[0],k); });
  const s=sum(g.map(x=>x[1])); g.forEach(x=>x[1]/=s);
  const carr=[]; const ca=(p,w)=>{if(p)carr.push([p,w]);};
  ca(r1,.55);ca(r2,.28);ca(r3,.11);
  if(carr.length){const cb=avg(carr.map(x=>x[0].ovr));
    carr.forEach(x=>x[1]*=Math.pow(Math.max(.5,x[0].ovr/cb),1.15));
    carr.forEach(x=>{ if(hasSyn(x[0],"onecut")) x[1]*=1+0.10*synWeight(x[0],"onecut"); });
    const cs=sum(carr.map(x=>x[1])); carr.forEach(x=>x[1]/=cs);}
  const def=[], seen=new Set();
  for(const pos of ["EDGE","DT","LB","CB","S"]){
    const n=pos==="CB"?3:2;
    for(let i=0;i<n;i++){const p=healthyStarter(t,pos,i);
      if(p&&!seen.has(p.id)){seen.add(p.id); def.push([p,pos]);}}
  }
  return {targets:g,carries:carr,def};
}
function ws(arr){ // weighted pick from [[item,weight]] — weights need not be normalized
  if(!arr.length) return null;
  let tot=0; for(const x of arr) tot+=Math.max(0,x[1]);
  if(tot<=0) return arr[Math.floor(rnd()*arr.length)][0];
  let r=rnd()*tot;
  for(const x of arr){ r-=Math.max(0,x[1]); if(r<=0) return x[0]; }
  return arr[arr.length-1][0];
}
function st(p,k,v){ if(!p) return; p.stats[k]=(p.stats[k]||0)+v; }

/* ---------- injuries ---------- */
function tryInjure(p,mult){
  if(!p||p.injury>0) return null;
  const club = p.teamId!==null&&p.teamId!==undefined ? S.teams[p.teamId] : null;
  let risk = club ? injuryMult(club)*0.92 : 0.92;
  if(hasTrait(p,"glass")) risk*=1.38;
  if(hasTrait(p,"iron")) risk*=0.66;
  if(rnd()>=risk) return null;
  const base=0.165*mult*(0.55+p.hidden.inj/90);
  if(rnd()<base){
    const sev=wpick([[1,42],[2,22],[3,12],[4,8],[6,7],[9,5],[14,3],[20,1]]);
    p.injury=sev; p.injWeek=S.week;
    p.injDesc=pick(["hamstring","high ankle sprain","MCL sprain","shoulder","concussion protocol",
      "turf toe","groin","hip flexor","broken hand","ribs","Achilles strain","knee"]);
    return sev;
  }
  return null;
}

/* ---------- the game ---------- */
function fgProb(k,dist){
  const skill=k?(k.a.thp*.5+k.a.tha*.5):55;
  // flat-ish inside 45, falls off a cliff beyond it, leg strength shifts the cliff
  let p=1.065-(dist-17)*0.0078-Math.max(0,dist-45)*0.0165+(skill-64)*0.0060;
  return clamp(p,0.015,0.985);
}
function fgRange(k){                      // longest attempt a coach will send out
  const skill=k?(k.a.thp*.5+k.a.tha*.5):55;
  return 57+(skill-64)*0.50;
}
function simGame(g,neutral){
  const it=simGamePlay(g,neutral);
  let r=it.next();
  while(!r.done) r=it.next(autoChoice(r.value));
  return r.value;
}
function* simGamePlay(g,neutral){
  const H=S.teams[g.home], A=S.teams[g.away];
  const U={}; U[H.id]=teamUnits(H); U[A.id]=teamUnits(A);
  const SY={}; SY[H.id]=synTeam(H); SY[A.id]=synTeam(A);
  const SH={}; SH[H.id]=usageShares(H); SH[A.id]=usageShares(A);
  const hfa=neutral?0:2.2;
  const score={}; score[H.id]=0; score[A.id]=0;
  const log=[];
  let off=chance(.5)?H.id:A.id;
  let def=off===H.id?A.id:H.id;
  let ballOn=25, down=1, toGo=10, clock=900, qtr=1;
  const gp=new Set();
  const track=p=>{if(p&&!gp.has(p.id)){gp.add(p.id);st(p,"gp",1);}};
  const drives={}; drives[H.id]=0; drives[A.id]=0;
  let plays=0;

  const changeposs=(spot)=>{ off=def; def=off===H.id?A.id:H.id;
    ballOn=clamp(spot,1,99); down=1; toGo=10; drives[off]++; };

  while(qtr<=4 && plays<330){
    const o=U[off], d=U[def], sho=SH[off];

    const dAdj=(homeOff?0:hfa)+d.dcoach+(lateQ?d.dAdjustLate:d.dAdjust);
    const scoreDiff=score[off]-score[def];
    const late = (qtr>=4 && clock<300) || (qtr===2&&clock<120);
    // 4th down logic
    if(down===4){
      const fgDist=(100-ballOn)+17;
      const rng=fgRange(o.k);

                  (late&&scoreDiff<0&&ballOn>45&&toGo<=6) ||
                  (ballOn>52&&toGo<=1&&ballOn<62) || (late&&scoreDiff<-8&&ballOn>40) ||
                  (ballOn>=96&&toGo<=1);

      if(typeof momentHere==="function"){

            clock-=5; changeposs(25);
          } else {

      const m = runSyn+3.17+(ballOn>=88?0.75:(ballOn>=58?0.18:0))+(o.rblk*.62+rq*.38-d.rund+oAdj-dAdj)/16;

      timeoff=ri(28,39);
      const rrisk = typeof planRisk==="function" ? planRisk(S.teams[off]) : 0;
      if(rnd()<0.0095+rrisk*0.0035){ turnover=true; st(rb,"fum",1); if(rnd()<0.075) scoopTD=true; }
    }
    // tackle credit
    if(!turnover&&gain<20&&rnd()<.8){
      const tk=ws(SH[def].def.map(x=>[x[0],x[0].a.tak
        *(hasSyn(x[0],"rangy")?1.20:1)*(hasSyn(x[0],"thumper")?1.14:1)]));
      if(tk){st(tk,"tkl",1);track(tk);}
    }
    // injuries
    if(rnd()<.10){
      const cands=[qb, ws(sho.carries), ws(sho.targets), ws(SH[def].def.map(x=>[x[0],1]))].filter(Boolean);
      const victim=pick(cands);
      const sev=tryInjure(victim,1);
      if(sev&&sev>=3) log.push({q:qtr,t:victim.teamId,txt:`${victim.pos} ${victim.l} left with a ${victim.injDesc}`});
    }
    plays++;
    if(late) timeoff=Math.round(timeoff*0.55);
    clock-=timeoff;
    ballOn+=gain;
    if(turnover){
      if(scoopTD){
        const rec2=ws(SH[def].def.map(x=>[x[0],x[0].a.tak]));
        score[def]+=7; if(rec2){st(rec2,"dtd",1);st(rec2,"ff",1);track(rec2);}
        log.push({q:qtr,t:def,txt:`${rec2?rec2.pos+" "+rec2.l:"Defense"} scoops it up and scores`});
        ballOn=25; down=1; toGo=10; continue;
      }
      log.push({q:qtr,t:def,txt:`Turnover — ${S.teams[def].abbr} takes over`});
      changeposs(100-clamp(ballOn,1,99));
    } else if(ballOn>=100){
      td=true; score[off]+=6;
      if(scorer){
        if(viaPass){ st(qb,"ptd",1); st(scorer,"rectd",1); }
        else st(scorer,"rtd",1);
      }
      let two=null;
      if(typeof momentHere==="function"){
        two = yield momentHere("twopoint",{off,def,qtr,clock,scoreDiff:scoreDiff+6,
          neutral,home:H.id,away:A.id,score});
      }
      if(two==="two"){
        const oU=U[off];
        const p2=clamp(0.475+(oU.qbA-U[def].cov)/430,0.30,0.68);
        if(rnd()<p2){ score[off]+=2; log.push({q:qtr,t:off,txt:"Two-point conversion is good"}); }
        else log.push({q:qtr,t:off,txt:"Two-point try fails"});
      } else {
        score[off]+= (rnd()<.955?1:0);
      }
      log.push({q:qtr,t:off,txt:`Touchdown ${S.teams[off].abbr}${scorer?" — "+scorer.pos+" "+scorer.l:""}`});
      changeposs(25);
    } else if(ballOn<=0){
      score[def]+=2; changeposs(25);
    } else {
      toGo-=gain;
      if(toGo<=0){ down=1; toGo=10; } else { down++; if(down>4){ changeposs(100-ballOn); } }
    }
    if(clock<=0){ qtr++; clock=900;
      if(qtr===3){ ballOn=25; down=1; toGo=10; off=(off===H.id?A.id:H.id); def=off===H.id?A.id:H.id; }
    }
  }
  // overtime
  if(score[H.id]===score[A.id]){
    if(chance(.86)){ const w=chance(.5)?H.id:A.id; score[w]+=3; }
  }
  g.hs=score[H.id]; g.as=score[A.id]; g.played=true; g.log=log.slice(-14);
  if(g.week!==99){                     // the postseason has its own book
    H.pf+=g.hs; H.pa+=g.as; A.pf+=g.as; A.pa+=g.hs;
    recordResult(H,A,g.hs,g.as);
  } else {
    H.postPf=(H.postPf||0)+g.hs; H.postPa=(H.postPa||0)+g.as;
    A.postPf=(A.postPf||0)+g.as; A.postPa=(A.postPa||0)+g.hs;
    if(g.hs>g.as){H.postW=(H.postW||0)+1;A.postL=(A.postL||0)+1;}
    else {A.postW=(A.postW||0)+1;H.postL=(H.postL||0)+1;}
  }
  return g;
}
function recordResult(H,A,hs,as){
  const same=H.conf===A.conf, div=same&&H.div===A.div;
  if(hs>as){H.w++;A.l++; if(div){H.divW++;A.divL++;} if(same){H.confW++;A.confL++;}}
  else if(as>hs){A.w++;H.l++; if(div){A.divW++;H.divL++;} if(same){A.confW++;H.confL++;}}
  else {H.t++;A.t++;}
}

/* ---------- weekly advance ---------- */
function playWeek(){
  const wk=S.week;
  const games=S.schedule.filter(g=>g.week===wk&&!g.played);
  for(const g of games) simGame(g);
  // injuries tick, morale
  for(const t of S.teams){
    for(const id of t.roster){const p=S.players[id];
      if(p.injury>0){
        p.injury--;
        if(p.injury>0 && rnd()<0.28*(healMult(t)-1)) p.injury--;
        if(p.injury<=0){p.injury=0;p.injDesc="";}}}
    autoDepth(t);
  }
  weeklyNews(wk,games);
  S.week++;
}

/* ---------- standings ---------- */
function winPct(t){const g=t.w+t.l+t.t; return g? (t.w+t.t*.5)/g : 0;}
function sortTeams(list){
  return list.slice().sort((a,b)=> winPct(b)-winPct(a) ||
    (b.divW-b.divL)-(a.divW-a.divL) || (b.confW-b.confL)-(a.confW-a.confL) ||
    (b.pf-b.pa)-(a.pf-a.pa) || b.pf-a.pf || a.id-b.id);
}
function confSeeds(conf){
  const divWinners=[];
  for(let d=0;d<4;d++) divWinners.push(sortTeams(S.teams.filter(t=>t.conf===conf&&t.div===d))[0]);
  const dw=sortTeams(divWinners);
  const rest=sortTeams(S.teams.filter(t=>t.conf===conf&&!dw.includes(t))).slice(0,3);
  const seeds=[...dw,...rest];
  seeds.forEach((t,i)=>{t.seed=i+1;t.madePlayoffs=true;});
  return seeds;
}

/* ---------- playoffs ---------- */
function simPlayoffs(){
  S.playoffs={rounds:[]};
  const res=[];
  const conf=[confSeeds(0),confSeeds(1)];
  const champs=[];
  for(let c=0;c<2;c++){
    let alive=conf[c].slice();
    const rnd1=[[alive[1],alive[6]],[alive[2],alive[5]],[alive[3],alive[4]]];
    const wc=rnd1.map(m=>playoffGame(m[0],m[1],`${CONFNAME[c]} Wild Card`));
    let next=sortTeams([alive[0],...wc]);
    const div=[[next[0],next[3]],[next[1],next[2]]];
    const dv=div.map(m=>playoffGame(m[0],m[1],`${CONFNAME[c]} Divisional`));
    const fin=sortTeams(dv);
    const cw=playoffGame(fin[0],fin[1],`${CONFNAME[c]} Championship`);
    champs.push(cw);
  }
  const champ=playoffGame(champs[0],champs[1],"The Championship",true);
  S.champion=champ.id;
  champ.wonTitle=S.year;   // the full season row is written when contracts roll over
  return champ;
}
function playoffGame(a,b,label,neutral){
  const g={week:99,home:a.id,away:b.id,played:false,hs:0,as:0,label};
  simGame(g,neutral);
  if(g.hs===g.as) g.hs++;
  const w=g.hs>g.as?a:b, l=g.hs>g.as?b:a;
  S.playoffs.rounds.push({label,winner:w.id,loser:l.id,ws:Math.max(g.hs,g.as),ls:Math.min(g.hs,g.as)});
  news(`${label}: ${w.city} ${w.name} ${Math.max(g.hs,g.as)}, ${l.city} ${l.name} ${Math.min(g.hs,g.as)}`,"playoff");
  return w;
}

/* ---------- age curves ---------- */
const PEAK={QB:31,RB:25,WR:27,TE:28,LT:29,LG:29,C:30,RG:29,RT:29,EDGE:28,DT:29,LB:28,CB:27,S:28,K:34,P:34};
function applyDelta(p,d){
  if(d===0) return;
  const w=OVRW[p.pos];
  const phys=["spd","acc","agi","jmp"];
  for(const k in w){
    let x=d;
    if(d<0 && phys.includes(k)) x=d*1.6;
    if(d<0 && (k==="awr")) x=d*0.15;      // awareness holds up
    if(d>0 && k==="awr") x=d*1.4;
    p.a[k]=c99(p.a[k]+x);
  }
  p.ovr=computeOVR(p.pos,p.a);
}
function progressPlayer(p,team){
  const coachDev = team&&team.staff.HC ? (team.staff.HC.dev*.5+(team.staff[POSGROUP[p.pos]==="o"?"OC":"DC"]||{dev:60}).dev*.5) : 60;
  const snaps = (p.stats.gp||0);
  const play = clamp(snaps/15,0,1);
  const peak = PEAK[p.pos];
  const devRate=[0.16,0.26,0.36,0.50,0.66][p.hidden.dev];
  let d=0;
  if(p.age<=peak){
    const room=p.hidden.pot-p.ovr;
    let traitDev = 1;
    if(hasTrait(p,"gymrat")) traitDev*=1.22;
    if(hasTrait(p,"film")) traitDev*=1.14;
    if(hasTrait(p,"coasts")) traitDev*=0.82;
    if(hasTrait(p,"motor")) traitDev*=1.06;
    const mood = 0.88 + moraleOf(p)/500;
    const fitBonus = 0.94 + schemeFit(p)/850;
    const f = devRate*(0.55+0.45*play)*(0.7+coachDev/200)*(0.75+p.hidden.wrk/260)
              *devMult(team)*traitDev*mood*fitBonus;
    d = room>0 ? room*f*rf(.6,1.4) : rf(-0.9,0.7);
    if(p.age<=23) d+= rf(0,1.0);
    if(p.exp>=5) d*=0.72;               // established men rarely take another jump
  } else {
    const over=p.age-peak;
    d = -(1.32+over*1.05)*rf(.5,1.5) + (p.hidden.wrk-60)/60;
    if(p.hidden.dev>=3) d*=0.72;
  }
  // injuries suppress
  if(p.injury>0) d-=1.2;
  d=clamp(d,-9,7.5);
  if(!team) d=Math.min(d,0)-rf(0.3,1.2);   // no facility, no coaching, no snaps
  const before=p.ovr;
  p.lastOvr=before;
  applyDelta(p,Math.round(d*10)/10);
  const gained=p.ovr-before;
  applyPotentialShift(p,team,gained);
  if(team) staffNoticeSynergies(p,team);
  return gained;
}
function retireCheck(p){
  const peak=PEAK[p.pos];
  let pr=0;
  if(p.age>=30) pr+=(p.age-29)*0.055;
  if(p.age>=34) pr+=0.18;
  if(p.ovr<62) pr+=0.16;
  if(p.ovr<55) pr+=0.30;
  if(p.age<28) pr=p.ovr<58?0.06:0.005;
  if(p.ovr>=82) pr*=0.45;
  if(p.pos==="K"||p.pos==="P") pr*=0.55;
  // a man nobody has signed in years stops waiting for the phone
  const idle=p.unsignedYears||0;
  if(idle>=1) pr+=0.10*idle*idle;
  return rnd()<clamp(pr,0,0.95);
}

/* ---------- roster ops ---------- */
/* what the books look like the moment after a release */
function capAfterRelease(p,team){
  const t=team||S.teams[p.teamId];
  if(!t||!p.contract) return capSpace(t||S.teams[0]);
  return capSpace(t)+capHit(p)-deadMoney(p);
}
function releasePlayer(p,team){
  const t=team||S.teams[p.teamId];
  const dead=deadMoney(p);
  const ceiling=S.cap*0.22;
  if(t.deadCap+dead>ceiling&&dead>S.cap*0.02){
    const now=Math.round(dead*0.5);
    t.deadCap+=now;
    t.deadCapNext=(t.deadCapNext||0)+(dead-now);   // the rest lands next season
  } else t.deadCap+=dead;
  t.roster=t.roster.filter(id=>id!==p.id);
  t.ir=(t.ir||[]).filter(id=>id!==p.id);
  t.ps=(t.ps||[]).filter(id=>id!==p.id);
  p.onIR=false; p.onPS=false;
  p.teamId=null; p.contract=null; p.holdout=false; p.holdoutWeeks=0;
  if(S.holdouts) S.holdouts=S.holdouts.filter(x=>x!==p.id);
  if(S.phase==="regular"&&capSpace(t)<0&&typeof enforceCap==="function") enforceCap(t);
  if(!S.freeAgents.includes(p.id)) S.freeAgents.push(p.id);
  autoDepth(t);
  return dead;
}
function addToTeam(p,t){
  // authoritative: a man belongs to exactly one club, on exactly one list
  for(const other of S.teams){
    if(other.id===t.id) continue;
    if(other.roster.includes(p.id)) other.roster=other.roster.filter(id=>id!==p.id);
    if((other.ir||[]).includes(p.id)) other.ir=other.ir.filter(id=>id!==p.id);
    if((other.ps||[]).includes(p.id)) other.ps=other.ps.filter(id=>id!==p.id);
  }
  t.ir=(t.ir||[]).filter(id=>id!==p.id);
  t.ps=(t.ps||[]).filter(id=>id!==p.id);
  p.onIR=false; p.onPS=false;
  S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
  p.teamId=t.id;
  if(!t.roster.includes(p.id)) t.roster.push(p.id);
  autoDepth(t);
}
function needScore(t,pos){
  const have=t.roster.map(id=>S.players[id]).filter(p=>p.pos===pos&&!p.retired).sort((a,b)=>b.ovr-a.ovr);
  const want=ROSTER_NEED[pos];
  const s1=have[0]?have[0].ovr:40, s2=have[1]?have[1].ovr:40;
  let n=(78-s1)*1.0 + (68-s2)*0.35 + Math.max(0,want-have.length)*7;
  n*= (POSVAL[pos]*0.55+0.6);
  return n;
}
function teamNeeds(t){
  return POS.map(pos=>({pos,n:needScore(t,pos)})).sort((a,b)=>b.n-a.n);
}

/* ---------- free agency ---------- */
function faValue(p){ return marketAPY(p); }
function faDesire(p,t,offerAPY,years){
  const q=winPct(t)*30 + t.prestige*0.22;
  const playing = clamp(80-(unitRating(t,p.pos)-p.ovr)*1.4,20,120)*0.18;
  const money = offerAPY/1e6;
  return money*1.0 + q*0.10 + playing*0.10 + years*0.25 + rf(0,2.2);
}
function faMarkdown(p,round,rounds){
  // the longer a man goes unsigned, the less he holds out for
  const late=clamp((round+1)/rounds,0,1);
  const idle=clamp((p.unsignedYears||0)*0.12,0,0.30);
  return clamp(1-late*0.28-idle,0.45,1);
}
function runFreeAgency(rounds){
  rounds=rounds||6;
  for(let r=0;r<rounds;r++){
    const pool=S.freeAgents.map(id=>S.players[id]).filter(p=>p&&!p.retired).sort((a,b)=>b.ovr-a.ovr);
    if(!pool.length) break;
    for(const p of pool){
      const offers=[];
      // user offers are pre-registered
      const uo=S.userOffers[p.id];
      if(uo) offers.push({t:S.teams[S.userTeam],apy:uo.apy,years:uo.years,user:true});
      for(const t of S.teams){
        if(t.id===S.userTeam) continue;
        if(t.roster.length>=ROSTER_MAX+2) continue;
        const need=needScore(t,p.pos);
        // teams sitting well under the cap floor get pushed into the market
        const floorPush=clamp((S.cap*0.90-payroll(t))/(S.cap*0.32),0,1);
        if(need< (r<2?26:12)-floorPush*14) continue;
        const mv=faValue(p)*faMarkdown(p,r,rounds);
        const space=capSpace(t);
        const bid=Math.round(mv*(0.86+t.ai.aggression*0.34+floorPush*0.50)*(1+clamp(need,0,60)/260));
        if(bid>space-6e6) continue;
        offers.push({t,apy:bid,years:contractYears(p),user:false});
      }
      if(!offers.length) continue;
      if(r<rounds-1 && offers.length===1 && !offers[0].user && chance(.45)) continue; // hold out
      let best=null,bs=-1e9;
      for(const o of offers){ const d=faDesire(p,o.t,o.apy,o.years); if(d>bs){bs=d;best=o;} }
      signPlayer(p,best.t.id,best.apy,best.years,rf(.35,.7));
      best.t.faGained=best.t.faGained||[]; if(p.ovr>=68) best.t.faGained.push(p.id);
      addToTeam(p,best.t);
      S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      delete S.userOffers[p.id];
      if(best.t.id===S.userTeam) news(`Signed ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr) — ${fmtM(best.apy)}/yr for ${best.years}`,"signing",p.id);
      else if(p.ovr>=80) news(`${best.t.city} signs ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr), ${fmtM(best.apy)}/yr`,"league",p.id);
    }
  }
}

/* ---------- pick value & trades ---------- */
function pickValue(round,slot){ // slot 1..32
  const overall=(round-1)*32+(slot||16);
  return Math.round(3000*Math.exp(-overall/38)+280*Math.exp(-overall/300));
}
function playerTradeValue(p){
  const young = clamp((30-p.age)/8,0,1);
  let v = Math.pow(Math.max(0,p.ovr-52),2.15)*1.05;
  v *= (0.55+0.75*young);
  v *= (POSVAL[p.pos]*0.5+0.62);
  if(p.hidden.dev>=3) v*=1.12;
  const capHit=p.contract?p.contract.apy:0;
  v -= capHit/1e6*11;
  return Math.max(20,Math.round(v));
}

/* ---------- season rollover ---------- */
function rollContracts(){
  for(const t of S.teams){
    t.deadCap=Math.round(t.deadCap*0.12)+(t.deadCapNext||0);
    t.deadCapNext=0;
    const keep=[];
    for(const id of t.roster){
      const p=S.players[id];
      if(!p.contract){keep.push(id);continue;}
      p.contract.left--;
      if(p.contract.left<=0){
        t.faLost=t.faLost||[]; if(p.ovr>=68) t.faLost.push(p.id);
        p.teamId=null; p.contract=null; S.freeAgents.push(p.id);
      } else keep.push(id);
    }
    t.roster=keep;
  }
}
function offseasonProgress(){
  const retirees=[];
  for(const p of Object.values(S.players)){
    if(p.retired||p.pos===undefined) continue;
    if(p.isProspect) continue;
    p.age++;
    if(p.teamId===null) p.unsignedYears=(p.unsignedYears||0)+1;
    else p.unsignedYears=0;
    p.exp++;
    p.career.gp+=(p.stats.gp||0);
    p.career.seasons++;
    const t=p.teamId!==null?S.teams[p.teamId]:null;
    progressPlayer(p,t);
    p.injury=0;p.injDesc="";
    if(retireCheck(p)){
      p.retired=true; p.lastTeam=t?t.abbr:(p.lastTeam||""); retirees.push(p);
      if(t){t.roster=t.roster.filter(id=>id!==p.id);}
      S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      if(p.ovr>=78||p.accolades.length>2)
        news(`${p.pos} ${p.f} ${p.l} retires after ${p.career.seasons} `+
          `season${p.career.seasons===1?"":"s"}`,"league",p.id);
    }
    p.lastStats=p.stats; p.stats={};
  }
  return retirees;
}
function aiRosterCleanup(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    // cut bad contracts
    let guard=0;
    while(capSpace(t)<2e6 && guard++<40){
      const cands=t.roster.map(id=>S.players[id])
        .filter(p=>p.contract&&capHit(p)>2e6)
        .filter(p=>deadMoney(p)<capHit(p)*0.75)   // no point cutting a man you still have to pay
        .sort((a,b)=>((capHit(b)-deadMoney(b))/Math.max(1,playerTradeValue(b)))
                    -((capHit(a)-deadMoney(a))/Math.max(1,playerTradeValue(a))));
      if(!cands.length) break;
      releasePlayer(cands[0],t);
    }
    // fill holes with min contracts
    guard=0;
    while(t.roster.length<ROSTER_MAX && guard++<80){
      const need=teamNeeds(t)[0];
      const pool=S.freeAgents.map(id=>S.players[id]).filter(p=>p&&!p.retired&&p.pos===need.pos)
        .sort((a,b)=>b.ovr-a.ovr);
      let p=pool[0];
      if(!p){ p=makePlayer(need.pos,c99(gauss(58,4)),ri(23,28)); S.players[p.id]=p; }
      else S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      signPlayer(p,t.id,minSalary(),1,.1); addToTeam(p,t);
    }
    while(t.roster.length>ROSTER_MAX){
      const worst=t.roster.map(id=>S.players[id]).sort((a,b)=>playerTradeValue(a)-playerTradeValue(b))[0];
      releasePlayer(worst,t);
    }
    autoDepth(t);
  }
}
function resetStandings(){
  for(const t of S.teams){
    t.history.push({year:S.year,w:t.w,l:t.l,t:t.t,pf:t.pf,pa:t.pa,
      champ:S.champion===t.id,playoffs:t.madePlayoffs});
    t.w=t.l=t.t=0;t.pf=t.pa=0;t.divW=t.divL=t.confW=t.confL=0;t.seed=0;t.madePlayoffs=false;
    t.postW=t.postL=t.postPf=t.postPa=0;
  }
}
function newDraftPicks(){
  for(const t of S.teams) t.picks=t.picks.filter(p=>p.year>S.year);
  // each year's picks are minted exactly once, league-wide, three drafts ahead
  S.seededYears=S.seededYears||[];
  for(const y of [S.year+1,S.year+2,S.year+3]){
    if(S.seededYears.indexOf(y)>=0) continue;
    S.seededYears.push(y);
    for(const t of S.teams) for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
  }
}
/* ============================================================
   Module 5: draft class, scouting fog-of-war, the draft itself
   ============================================================ */

const CLASS_POS = [["QB",16],["RB",22],["WR",40],["TE",18],["LT",12],["LG",12],["C",10],
  ["RG",12],["RT",12],["EDGE",34],["DT",30],["LB",28],["CB",34],["S",22],["K",4],["P",4]];

const SCHEMES=["air raid","triple option","spread","pro style","4-2-5 nickel","3-3-5","wide-9 front","two-gap 3-4"];

/* projection: what the player is likely to become, blended with what he is now */
function projGrade(p){
  const potA=makeAttrs(p.pos,p.hidden.pot,3);
  return Math.round(p.ovr*0.40 + p.hidden.pot*0.60);
}

function combineFrom(p){
  const a=p.a;
  const forty = clamp(5.35-(a.spd-40)*0.0175-(a.acc-40)*0.0045+gauss(0,0.045),4.19,5.45);
  const vert  = clamp(20+(a.jmp-40)*0.42+gauss(0,1.6),22,46);
  const bench = clamp(4+(a.str-40)*0.42+gauss(0,2.4),4,42);
  const cone  = clamp(8.35-(a.agi-40)*0.0175+gauss(0,0.09),6.35,8.4);
  const broad = clamp(90+(a.jmp-40)*0.62+gauss(0,3),95,145);
  return {forty:+forty.toFixed(2),vert:Math.round(vert),bench:Math.round(bench),
    cone:+cone.toFixed(2),broad:Math.round(broad)};
}
function athScore(c,pos){
  // 0..100 relative athletic testing score
  const speed=clamp((5.05-c.forty)/0.75,0,1);
  const exp=clamp((c.vert-24)/20,0,1);
  const agi=clamp((8.2-c.cone)/1.5,0,1);
  const str=clamp((c.bench-8)/30,0,1);
  const w = (pos==="DT"||OL.includes(pos))?[.2,.2,.2,.4]:
            (pos==="CB"||pos==="WR")?[.42,.24,.28,.06]:[.34,.24,.24,.18];
  return Math.round((speed*w[0]+exp*w[1]+agi*w[2]+str*w[3])*100);
}

function makeProspect(){
  const pos=wpick(CLASS_POS);
  const age=wpick([[21,26],[22,46],[23,24],[24,4]]);
  // raw talent distribution — thin at the top
  let cur=c99(gauss(63,7.5));
  if(chance(.06)) cur=c99(gauss(74,4));
  const gapRoll=Math.max(0,gauss(9,6.5)) + (age<=21?3:0);
  const p=makePlayer(pos,cur,age,{exp:0,potGap:gapRoll,spread:7.5});
  p.isProspect=true;

  const school=pick(SCHOOLS);
  const tier=school[1];
  const ctx={
    school:school[0], tier, region:school[2],
    usage: clamp(gauss(0.85,0.16),0.30,1.0),
    scheme: pick(SCHEMES),
    fit:   clamp(gauss(0.86,0.15),0.35,1.0),
    mates: clamp(gauss(0.82,0.17),0.35,1.0),
    starts: ri(1,4),
    missed: wpick([[0,62],[2,18],[5,11],[9,6],[13,3]]),
    captain: chance(.22)
  };
  p.draft={ctx, combine:combineFrom(p), arch:"normal", tells:[], noteBank:[]};

  /* ---- archetype: the *cause* of any market mispricing ---- */
  const r=rnd();
  if(r<0.13){ // hidden gem — real talent the market can't see
    p.draft.arch="gem";
    const how=pick(["buried","badmates","misfit","smallschool","latebloom","postinjury","poortest"]);
    p.draft.how=how;
    if(how==="buried") ctx.usage=rf(.30,.52);
    if(how==="badmates") ctx.mates=rf(.32,.52);
    if(how==="misfit") ctx.fit=rf(.32,.55);
    if(how==="smallschool"){ const s=pick(SCHOOLS.filter(x=>x[1]>=4)); ctx.school=s[0];ctx.tier=4;ctx.region=s[2]; }
    if(how==="latebloom"){ ctx.starts=1; ctx.usage=clamp(ctx.usage,.45,.7); }
    if(how==="postinjury"){ ctx.missed=ri(7,14); }
    if(how==="poortest"){ // real skill, bad testing day
      const c=p.draft.combine;
      c.forty=+(c.forty+rf(.10,.24)).toFixed(2); c.vert-=ri(3,7); c.cone=+(c.cone+rf(.15,.4)).toFixed(2);
    }
    // and give him more real upside
    p.hidden.pot=c99(p.hidden.pot+ri(3,9));
    if(p.hidden.dev<2) p.hidden.dev=wpick([[2,60],[3,32],[4,8]]);
  } else if(r<0.26){ // overvalued — the market loves him more than the tape deserves
    p.draft.arch="fool";
    const how=pick(["testfreak","system","weakslate","bluehalo","stiff","character"]);
    p.draft.how=how;
    if(how==="testfreak"){ const c=p.draft.combine;
      c.forty=+(c.forty-rf(.11,.22)).toFixed(2); c.vert+=ri(4,8); c.cone=+(c.cone-rf(.2,.45)).toFixed(2); }
    if(how==="system"){ ctx.fit=1.0; ctx.mates=rf(.92,1.0); }
    if(how==="weakslate"){ ctx.usage=1.0; }
    if(how==="bluehalo"){ const s=pick(SCHOOLS.filter(x=>x[1]===1)); ctx.school=s[0];ctx.tier=1;ctx.region=s[2]; }
    if(how==="stiff"){ p.hidden.pot=c99(p.ovr+ri(0,2)); p.hidden.dev=0; }
    if(how==="character"){ p.hidden.chr=ri(20,42); p.hidden.wrk=ri(22,48); }
    p.hidden.pot=c99(Math.max(p.ovr, p.hidden.pot-ri(3,10)));
    if(p.hidden.dev>1) p.hidden.dev=wpick([[0,50],[1,44],[2,6]]);
  }

  p.hidden.trueGrade = projGrade(p);

  /* ---- college production (what the public sees) ---- */
  const compAdj=[0,1.0,0.94,0.86,0.74][ctx.tier];
  const raw = (p.ovr-45)/45;
  let prod = clamp(raw*ctx.usage*ctx.fit*(0.55+0.45*ctx.mates)*(1/compAdj)*0.92 + gauss(0,.07),0,1.35);
  if(ctx.missed>6) prod*=0.72;
  p.draft.prod=+(prod).toFixed(3);
  p.draft.ath=athScore(p.draft.combine,pos);

  /* ---- raw public hype: production, brand, visible tape, résumé.
         Testing numbers are NOT in here yet — the combine hasn't happened. ---- */
  const brand=[0,86,70,54,36][ctx.tier];
  p.draft.hype = 0.46*(prod*100*0.86) + 0.24*brand + 0.20*p.ovr +
                 0.10*(ctx.starts*10 + (ctx.captain?6:0));
  p.draft.consensus = 60;

  buildNoteBank(p);
  return p;
}

function buildNoteBank(p){
  const c=p.draft.ctx, B=[], t=p.hidden.trueGrade, cons=p.draft.consensus;
  const add=(txt,req,k,truth,val)=>B.push({txt,req:req||"tape",k:k||25,truth:truth!==false,val:val||0});
  const S1=c.school;
  if(c.usage<0.6) add(`Rotational role at ${S1} — roughly half the snaps of the starter ahead of him. The per-snap numbers are a different story than the box score.`,"tape",20,true,1);
  if(c.mates<0.6) add(`Quarterback play around him was among the worst in the conference. He created almost everything himself.`,"tape",30,true,1);
  if(c.fit<0.6) add(`${S1} asked him to play a role that has nothing to do with what he'll be asked to do here. The ${c.scheme} scheme buried his best trait.`,"tape",30,true,1);
  if(c.tier>=4) add(`Level of competition is the whole argument. He was untouchable, but against opponents who won't play on Sundays.`,"tape",15,true,0);
  if(c.tier>=4 && t>cons+5) add(`Cross-checked him against the two power-conference tapes on his schedule. He was the best player on the field in both.`,"tape",55,true,2);
  if(c.missed>=7) add(`Missed ${c.missed} games over his career. Worth a hard look from the medical staff.`,"tape",20,true,-1);
  if(c.starts<=1) add(`One year of real starting experience. Everything is projection.`,"tape",15,true,0);
  if(c.captain) add(`Two-time captain. Teammates describe him running the room.`,"interview",20,true,1);

  if(p.draft.arch==="gem"){
    add(`The tape does not match the résumé. Grades out well above where the board has him.`,"tape",65,true,2);
    if(p.draft.how==="poortest") add(`Timed poorly, plays fast. Game speed and testing speed are two different things with him.`,"tape",45,true,2);
    if(p.draft.how==="postinjury") add(`Medicals are clean. The knee is a non-issue — full clearance, no arthritic changes.`,"medical",1,true,2);
    if(p.draft.how==="latebloom") add(`Only started taking the position seriously two years ago. The arrow is pointing straight up.`,"workout",1,true,2);
    if(p.draft.how==="buried") add(`Private workout confirmed it: the traits are a full tier above his college usage.`,"workout",1,true,2);
  }
  if(p.draft.arch==="fool"){
    add(`Workout numbers outrun the tape. Struggles when the play breaks down.`,"tape",55,true,-2);
    if(p.draft.how==="system") add(`Overwhelming majority of his production came schemed open. Very little of it was self-generated.`,"tape",45,true,-2);
    if(p.draft.how==="stiff") add(`Physically maxed out. What you see now is what you get in year four.`,"workout",1,true,-2);
    if(p.draft.how==="character") add(`Interview went sideways. Deflected on every question about the incident, blamed coaches for the benching.`,"interview",1,true,-2);
    if(p.draft.how==="weakslate") add(`Feasted on bad opponents. Against the two ranked teams on his schedule he disappeared.`,"tape",50,true,-2);
    if(p.draft.how==="bluehalo") add(`Benefits from the logo on the helmet. Was the fourth-best player on his own defense.`,"tape",60,true,-2);
  }
  if(p.hidden.wrk>=82) add(`Everyone at ${S1} tells the same story about his work habits. First in, last out.`,"interview",1,true,1);
  if(p.hidden.wrk<=42) add(`Two position coaches used the word "maintenance" without being asked.`,"interview",1,true,-2);
  if(p.hidden.chr<=42) add(`Character flags. Multiple sources described immaturity that will need managing.`,"interview",1,true,-2);
  if(p.hidden.inj>=68) add(`Body type and injury history suggest he'll miss time. Durability is a real risk.`,"medical",1,true,-2);
  if(p.hidden.inj<=32) add(`Never missed a practice. Built to hold up.`,"medical",1,true,1);
  if(p.hidden.dev>=3) add(`Rare learner. Coaches say he only needs to be told once.`,"workout",1,true,2);
  if(p.hidden.pot-p.ovr>=14) add(`Nowhere near his ceiling. Raw, but the traits are worth betting on.`,"workout",1,true,2);
  if(p.hidden.pot-p.ovr<=3) add(`Polished and ready, but there isn't much left to develop.`,"workout",1,true,0);
  // trait-level observations — always available, and always true
  const rel=POSATTRS[p.pos].filter(k=>k!=="dur");
  const ranked=rel.slice().sort((x,y)=>p.a[y]-p.a[x]);
  const best=ranked[0], second=ranked[1], worst=ranked[ranked.length-1];
  const strong=k=>{
    const v=p.a[k];
    return v>=85?`${ATTRNAME[k]} is a legitimate weapon — top of the class`:
           v>=75?`${ATTRNAME[k].toLowerCase()} is comfortably above the line`:
                 `${ATTRNAME[k].toLowerCase()} is his best trait, and it's ordinary`;
  };
  const weak=k=>{
    const v=p.a[k];
    return v<=45?`${ATTRNAME[k]} is a genuine problem. He will get exposed`:
           v<=58?`${ATTRNAME[k].toLowerCase()} needs work before he plays meaningful snaps`:
                 `${ATTRNAME[k].toLowerCase()} is the soft spot, though it isn't disqualifying`;
  };
  add(strong(best)+".","tape",22,true,p.a[best]>=82?1:0);
  add(`Second thing you notice: ${ATTRNAME[second].toLowerCase()} grades out at ${p.a[second]>=78?"a starter's level":p.a[second]>=66?"replacement level":"below the line"}.`,"tape",42,true,0);
  add(weak(worst)+".","tape",34,true,p.a[worst]<=52?-1:0);
  if(p.hidden.pot-p.ovr>=10) add(`Whatever he is now, he isn't finished. There's real growth left here.`,"tape",70,true,2);
  if(p.hidden.pot-p.ovr<=4) add(`He's a finished product. Draft him for what he is today.`,"tape",70,true,0);
  add(`Fits what we ask of the position. Nothing that jumps off the tape either way.`,"tape",10,true,0);
  p.draft.noteBank=B;
}
const HERRINGS=[
  "Loved him in the bowl game — might have been the best player on the field.",
  "Something about the way he carries himself. Locker room guy.",
  "Struggled badly in the second half of the season. Might have been worn down.",
  "Reminds me of a player I had in my last stop. Same build, same movement.",
  "Won't ever be a starter here. Special teams value only.",
  "Blew up the pro day. Every team in the building was talking about him after.",
  "Heard from a source at the school that other clubs have him circled.",
  "Hands are a problem. Counted four drops in the games I watched.",
  "Highest football IQ in the class at the position, full stop.",
  "The frame won't hold more weight. He's maxed out physically."
];

/* ---------- the consensus board ----------
   The league's shared opinion. Anchored to reality but compressed, noisy, and
   weighted toward what is easy to see: production, brand, and (after February)
   testing numbers. The gap between this and hidden.trueGrade is the whole game. */
function repriceBoard(useCombine){
  const list=S.prospects.map(id=>S.players[id]);
  if(!list.length) return;
  const raw=list.map(p=> useCombine
      ? p.draft.hype*0.66 + (p.draft.ath*0.62+22)*0.34
      : p.draft.hype);
  const m=avg(raw), sd=Math.sqrt(avg(raw.map(x=>(x-m)*(x-m))))||1;
  const tg=list.map(p=>p.hidden.trueGrade);
  const tm=avg(tg), tsd=Math.sqrt(avg(tg.map(x=>(x-tm)*(x-tm))))||1;
  list.forEach((p,i)=>{
    p.draft.consensus=clamp(Math.round(tm+(raw[i]-m)/sd*tsd*0.88+gauss(0,2.4)),32,97);
  });
  list.slice().sort((a,b)=>b.draft.consensus-a.draft.consensus)
      .forEach((p,i)=>{p.draft.rank=i+1;});
}

/* ---------- class + scouting state ---------- */
function generateDraftClass(){
  S.prospects=[];
  const n=278;
  for(let i=0;i<n;i++){
    const p=makeProspect();
    S.players[p.id]=p;
    S.prospects.push(p.id);
  }
  repriceBoard(false);
  // per-prospect stable evaluation error so your grade drifts toward truth, not jitters
  S.scout={};
  for(const id of S.prospects){
    S.scout[id]={k:0,notes:[],acts:{},err:gauss(0,1),scoutIds:[],medical:false,interview:false,workout:false};
  }
  // AI team boards
  for(const t of S.teams) buildAIBoard(t);
  S.classYear=S.year;
}
function buildAIBoard(t){
  t.board={};
  const skill=t.ai.scoutSkill;
  for(const id of S.prospects){
    const p=S.players[id];
    const blend=0.22+0.66*skill;
    const noise=gauss(0,13*(1-skill)+2.5);
    t.board[id]=p.hidden.trueGrade*blend + p.draft.consensus*(1-blend) + noise;
  }
}

/* ---------- your scouts ---------- */
function scoutBiasFor(p,sc){
  const d=p.draft;
  return sc.bias.athlete*((d.ath-55)/22) + sc.bias.school*((3-d.ctx.tier)/1.5) +
         sc.bias.prod*((d.prod-0.55)/0.35) + sc.bias.flat;
}
const GRADE_FLOOR=30, GRADE_CEIL=99;
function myGrade(pid){
  const p=S.players[pid], r=S.scout[pid];
  if(!r) return null;
  const k=r.k;
  // how far you trust your own eyes over the league's board
  const w = Math.pow(k/100,0.62);
  // even a finished workup leaves real uncertainty — nobody scouts a man perfectly
  const sd = 4.0 + 13*Math.pow(1-k/100,1.20);
  const scouts=r.scoutIds.map(i=>S.teams[S.userTeam].scouts.find(s=>s.id===i)).filter(Boolean);
  const bias = scouts.length? avg(scouts.map(s=>scoutBiasFor(p,s))) : 0;
  const own = p.hidden.trueGrade + r.err*sd + bias*(1-k/240);
  const est = own*w + p.draft.consensus*(1-w);
  const ana = analyticsEdge(S.teams[S.userTeam]);
  const band = (3.2 + 17*Math.pow(1-k/100,1.15))*(1-0.35*ana);
  return {est:clamp(est,30,99), band, k, lo:clamp(est-band,28,99), hi:clamp(est+band,30,99)};
}
const ACTIONS={
  tape:    {name:"Study tape",       cost:8,  gain:16, desc:"All-22 from the season. The bread and butter."},
  game:    {name:"Scout live",       cost:18, gain:30, desc:"Send a scout to see him in person."},
  interview:{name:"Interview",       cost:14, gain:10, desc:"Character, work habits, football intelligence."},
  medical: {name:"Medical check",    cost:12, gain:8,  desc:"Injury history and long-term durability."},
  workout: {name:"Private workout",  cost:22, gain:20, desc:"Reveals how much room is left to grow."}
};
function doScout(pid,action,scoutId){
  const t=S.teams[S.userTeam], r=S.scout[pid], p=S.players[pid];
  const A=ACTIONS[action];
  if(!A||!r) return {ok:false,msg:"Unavailable."};
  if(t.scoutPts<A.cost) return {ok:false,msg:`Not enough scouting hours — need ${A.cost}.`};
  const sc=t.scouts.find(s=>s.id===scoutId)||t.scouts[0];
  if(!sc) return {ok:false,msg:"No scouts on staff."};
  if((r.acts[action]||0)>= (action==="tape"?5: action==="game"?3:1))
    return {ok:false,msg:`${A.name} already exhausted for this prospect.`};
  t.scoutPts-=A.cost;
  r.acts[action]=(r.acts[action]||0)+1;
  if(!r.scoutIds.includes(sc.id)) r.scoutIds.push(sc.id);
  let mult=(0.62+sc.acc/150)*(1+0.05*(facLvl(t,"scoutdept")-1));
  if(sc.region&&sc.region===p.draft.ctx.region) mult*=1.22;
  if(sc.posSpec&&sc.posSpec.includes(p.pos)) mult*=1.20;
  r.k=clamp(r.k+A.gain*mult,0,100);
  if(action==="medical") r.medical=true;
  if(action==="interview") r.interview=true;
  if(action==="workout") r.workout=true;
  // the right kind of work turns up what a man is actually like
  if(typeof revealTrait==="function"&&(p.traits||[]).length){
    const window={medical:["glass","iron"],interview:["diva","leader","coasts","fragile"],
                  tape:["motor","clutch","fragile"],game:["motor","clutch"],
                  workout:["gymrat","iron","motor"]}[action]||[];
    const eye=clamp(sc.eye/140,0.15,0.75);
    for(const k of p.traits){
      if(!window.includes(k)) continue;
      if(rnd()<eye&&revealTrait(p,k))
        r.notes.push({txt:`${sc.name} on his makeup: ${TRAITS[k].name.toLowerCase()}.`,
                      src:sc.name, truth:true, val:0});
    }
  }
  // reveal notes
  const found=[];
  const pool=p.draft.noteBank.filter(n=>
     (n.req===action || (action==="game"&&n.req==="tape")) &&
     r.k>=n.k && !r.notes.some(x=>x.txt===n.txt));
  const nreveal = action==="tape"?1:2;
  for(let i=0;i<nreveal;i++){
    if(!pool.length) break;
    const falseChance=clamp((0.42-sc.eye/220)*(1-0.30*analyticsEdge(t)),0.02,0.40);
    if(rnd()<falseChance){
      let h=null;
      for(let tries=0;tries<6&&!h;tries++){ const c=pick(HERRINGS);
        if(!r.notes.some(x=>x.txt===c)) h=c; }
      if(h){ r.notes.push({txt:h,src:sc.name,truth:false,val:0}); found.push(h); }
      else { const n=pool.splice(Math.floor(rnd()*pool.length),1)[0];
             r.notes.push({txt:n.txt,src:sc.name,truth:true,val:n.val}); found.push(n.txt); }
    } else {
      const n=pool.splice(Math.floor(rnd()*pool.length),1)[0];
      r.notes.push({txt:n.txt,src:sc.name,truth:true,val:n.val});
      found.push(n.txt);
    }
  }
  return {ok:true,msg:`${A.name}: ${sc.name} filed a report.`,found};
}

/* ---------- draft order & the draft ---------- */
function buildDraftOrder(){
  const nonPlayoff=sortTeams(S.teams.filter(t=>!t.madePlayoffs)).reverse();
  const playoff=S.teams.filter(t=>t.madePlayoffs);
  const finish=id=>{
    if(S.champion===id) return 100;
    const r=S.playoffs.rounds;
    let best=0;
    r.forEach(x=>{ if(x.winner===id) best=Math.max(best,x.label.includes("Championship")?90:x.label.includes("Divisional")?70:50);
                   if(x.loser===id) best=Math.max(best,x.label.includes("Championship")?80:x.label.includes("Divisional")?60:40);});
    return best;
  };
  const po=playoff.slice().sort((a,b)=> finish(a)-finish(b) || winPct(a)-winPct(b));
  const order=[...nonPlayoff,...po].map(t=>t.id);
  S.draftOrder=[];
  const N=S.teams.length;
  for(let r=1;r<=7;r++){
    for(let i=0;i<N;i++){
      const teamId=order[i];
      const owner=S.teams.find(t=>t.picks.some(pk=>pk.year===S.year+1&&pk.round===r&&pk.orig===teamId&&!pk.comp));
      S.draftOrder.push({round:r,slot:i+1,orig:teamId,team:owner?owner.id:teamId,pid:null});
    }
    // compensatory selections hang off the end of their round
    let extra=0;
    for(const t of S.teams)
      for(const pk of t.picks.filter(p=>p.comp&&p.year===S.year+1&&p.round===r)){
        extra++;
        S.draftOrder.push({round:r,slot:N+extra,orig:pk.orig,team:t.id,pid:null,comp:true});
      }
  }
  S.draftOrder.forEach((s,i)=>{ s.overall=i+1; });
  S.draftIdx=0;
}
function aiPickValue(t,p){
  const g=t.board[p.id];
  const need=needScore(t,p.pos);
  const posv=POSVAL[p.pos]*0.22+0.82;
  const fit = typeof schemeDraftBonus==="function" ? schemeDraftBonus(t,p) : 0;
  return g*posv + need*(0.34-t.ai.draftBPA*0.22) + fit*(1-t.ai.draftBPA*0.5) + gauss(0,2.2);
}
function trimDraftRecord(p){
