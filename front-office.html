function makeDraftPick(pickObj,pid){
  const t=S.teams[pickObj.team], p=S.players[pid];
  pickObj.pid=pid;
  p.isProspect=false;
  trimDraftRecord(p);
  const rec=S.scout&&S.scout[pid];
  if(rec&&rec.k>=8){ const mg=myGrade(pid); if(mg) p.draft.userEst=Math.round(mg.est); }
  p.draft.pickedAt=pickObj.overall;
  p.draft.pickedRound=pickObj.round;
  p.draft.pickedSlot=pickObj.slot;
  p.draft.pickedBy=t.id;
  p.draft.pickedYear=S.year+1;
  signPlayer(p,t.id,rookieAPY(pickObj.overall-1),pickObj.round<=2?4:3,.6);
  addToTeam(p,t);
  S.prospects=S.prospects.filter(x=>x!==pid);
  if(t.id===S.userTeam) news(`Drafted ${p.pos} ${p.f} ${p.l}, ${p.draft.ctx.school} — round ${pickObj.round}, pick ${pickObj.slot}`,"draft",p.id);
  else if(pickObj.round===1) news(`${t.city} takes ${p.pos} ${p.f} ${p.l} (${p.draft.ctx.school}) at ${ordinal(pickObj.overall)}`,"draft",p.id);
}
function aiDraftPick(pickObj){
  const t=S.teams[pickObj.team];
  const avail=S.prospects.map(id=>S.players[id]);
  if(!avail.length) return false;
  if(t.roster.length>=ROSTER_MAX+8){ // still drafts, just BPA
  }
  let best=null,bv=-1e9;
  for(const p of avail){ const v=aiPickValue(t,p); if(v>bv){bv=v;best=p;} }
  makeDraftPick(pickObj,best.id);
  return true;
}
function advanceDraftToUser(){
  const picks=[];
  while(S.draftIdx<S.draftOrder.length){
    const pk=S.draftOrder[S.draftIdx];
    if(pk.team===S.userTeam) break;
    const before=pk.pid;
    aiDraftPick(pk); picks.push(pk); S.draftIdx++;
    const p=S.players[pk.pid];
    if(p){
      const r=S.scout[p.id], g=r?myGrade(p.id):null;
      if(r&&r.k>=30&&g&&g.est-p.draft.consensus>=6)
        news(`${S.teams[pk.team].abbr} takes ${p.pos} ${p.l} at ${ordinal(pk.overall)} — our board had him ${Math.round(g.est-p.draft.consensus)} points higher than the league did.`,"draft",p.id);
    }
    if(!S.prospects.length) break;
  }
  return picks;
}
function udfaSigning(){
  const rest=S.prospects.map(id=>S.players[id])
    .filter(p=>p&&p.teamId===null)          // anyone already signed is not on the market
    .sort((a,b)=>b.draft.consensus-a.draft.consensus);
  for(const p of rest){
    p.isProspect=false;
    trimDraftRecord(p);
    const teams=S.teams.filter(t=>t.roster.length<ROSTER_MAX+16&&capSpace(t)>MIN_SALARY*2);
    if(!teams.length||chance(.25)){ S.freeAgents.push(p.id); continue; }
    const t=teams.sort((a,b)=>needScore(b,p.pos)-needScore(a,p.pos))[Math.floor(rnd()*3)]||teams[0];
    signPlayer(p,t.id,minSalary(),2,.05); addToTeam(p,t);
  }
  S.prospects=[];
}

/* ---------- sortable tables ---------- */
function sortState(key,defCol,defDir){
  V.sorts=V.sorts||{};
  if(!V.sorts[key]) V.sorts[key]={col:defCol||"", dir:defDir==="asc"?1:-1};
  return V.sorts[key];
}
function sortTH(key,col,label,cls,defDir){
  const st=sortState(key);
  const on=st.col===col;
  return `<th class="${cls||""} sortable${on?" on":""}" data-act="sortcol"
    data-arg="${key}" data-arg2="${col}|${defDir||"desc"}">${label}<i class="ar">${
      on?(st.dir<0?"▼":"▲"):"·"}</i></th>`;
}
function applySort(key,rows,getters,defCol,defDir){
  const st=sortState(key,defCol,defDir);
  const g=getters[st.col];
  if(!g) return rows;
  return rows.slice().sort((a,b)=>{
    const x=g(a), y=g(b);
    const c = (typeof x==="string"||typeof y==="string")
      ? String(x).localeCompare(String(y))
      : ((x||0)-(y||0));
    return st.dir*c;
  });
}

          <td class="n ovr">${p.ovr}</td><td class="dim small">${p.injury}w</td>
          <td><button class="mini" data-act="placeir" data-arg="${p.id}">To reserve</button></td></tr>`).join("")}
        </tbody></table>`:""}
      <div class="ph"><h3>Practice squad</h3><span class="sub">${ps.length}/${PS_SLOTS}</span></div>
      ${ps.length?`<table><tbody>${ps.map(p=>`<tr>
        <td>${posTag(p.pos)} ${esc(p.l)}</td><td class="n ovr">${p.ovr}</td>
        <td class="dim small">${p.age}, ${p.exp}y</td>
        <td>${own?`<button class="mini" data-act="promoteps" data-arg="${p.id}">Promote</button>
          <button class="mini" data-act="cutps" data-arg="${p.id}">Release</button>`:""}</td></tr>`).join("")}
        </tbody></table>`:`<div class="pb muted">The squad is empty. Sign young free agents to it from the market.</div>`}`;
  } else if(V.teamTab==="depth"){
    body=`<div class="pb small muted">${own
      ? "Tap a name to move him up the chart. The order here is the order they play in."
      : "Their order of preference at each spot."}</div>`
      +(own?`<div class="pb"><button class="btn" data-act="stafftask" data-arg="depth">Let the coaches set it</button></div>`:"")
      +POS.map(pos=>{
      const d=(t.depth[pos]||[]).map(id=>S.players[id]).filter(Boolean);
      const rows=d.map((p,i)=>`<div class="row spread depthrow">
        <span class="small">${i===0?'<b class="tag">1</b>':`<span class="num d">${i+1}</span>`}
          <span class="click" data-act="player" data-arg="${p.id}">${esc(p.l)}</span>
          <span class="num">${p.ovr}</span>${p.injury>0?' <span class="tag red">out</span>':p.holdout?' <span class="tag warn">held out</span>':""}</span>
        ${own&&i>0?`<button class="mini" data-act="promote" data-arg="${pos}" data-arg2="${p.id}">▲ up</button>`:""}
      </div>`).join("");
      return `<div class="depthgrp"><div class="row spread" style="margin-bottom:4px">
        <span>${posTag(pos)}</span><span class="tiny dim">${d.length} deep</span></div>
        ${rows||"<i class='dim small'>empty</i>"}</div>`;
    }).join("");
  } else {
    const ps=t.roster.map(id=>S.players[id]).filter(p=>p&&p.stats.gp);
    const tbl=(title,key,rows,cols,defCol)=>{
      if(!rows.length) return "";
      const getters={name:p=>p.l}; cols.forEach(c=>getters[c[0]]=p=>{
        const v=c[1](p.stats); return typeof v==="string"?parseFloat(v)||0:v;});
      const sorted=applySort(key,rows,getters,defCol);
      return `<div class="ph"><h3>${title}</h3><span class="sub">${rows.length}</span></div>
      <div class="scroll"><table><thead><tr>${sortTH(key,"name","Player","","asc")}
        ${cols.map(c=>sortTH(key,c[0],c[0],"n")).join("")}</tr></thead>
      <tbody>${sorted.map(p=>`<tr class="click" data-act="player" data-arg="${p.id}">
        <td>${posTag(p.pos)} ${esc(p.l)}</td>${cols.map(c=>`<td class="n">${c[1](p.stats)}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
    };
    body=tbl("Passing","stpass",ps.filter(p=>p.stats.pa),
        [["Yds",s=>s.py||0],["TD",s=>s.ptd||0],["Int",s=>s.pint||0],
         ["Att",s=>s.pa||0],["Cmp%",s=>s.pa?Math.round(s.pc/s.pa*100):0]],"Yds")
      +tbl("Rushing","strush",ps.filter(p=>p.stats.ra),
        [["Att",s=>s.ra||0],["Yds",s=>s.ry||0],["TD",s=>s.rtd||0],
         ["Avg",s=>s.ra?(s.ry/s.ra).toFixed(1):0]],"Yds")
      +tbl("Receiving","strec",ps.filter(p=>p.stats.rec),
        [["Rec",s=>s.rec||0],["Yds",s=>s.recy||0],["TD",s=>s.rectd||0],
         ["Avg",s=>s.rec?(s.recy/s.rec).toFixed(1):0]],"Yds")
      +tbl("Defense","stdef",ps.filter(p=>p.stats.tkl||p.stats.sak),
        [["Tkl",s=>s.tkl||0],["Sk",s=>s.sak||0],["Int",s=>s.int||0],["PD",s=>s.pd||0]],"Tkl")
      +tbl("Kicking","stk",ps.filter(p=>p.stats.fga||p.stats.pnt),
        [["FGA",s=>s.fga||0],["FGM",s=>s.fgm||0],["Pct",s=>s.fga?Math.round(s.fgm/s.fga*100):0],
         ["Punts",s=>s.pnt||0]],"FGA");
    if(!body) body=`<div class="pb muted">No games played yet.</div>`;
  }
  return `<div class="panel">
    <div class="ph"><h2>${esc(t.city)} ${esc(t.name)}</h2>
      ${own?(V.teamTab==="depth"&&t.depthManual?`<button class="btn sm" data-act="depthauto">Reset chart</button>`:"")
        :`<button class="btn sm" data-act="myteam">Back to my team</button>`}</div>
    <div class="pb"><div class="chips">${tabs.map(([k,l])=>
      `<button class="chip" aria-pressed="${V.teamTab===k}" data-act="teamtab" data-arg="${k}">${l}</button>`).join("")}</div></div>
    <div class="pb tight">${body}</div></div>${hintFor("team")}`;
};

    const chips=`<div class="pb"><div class="chips">${

    }</div></div>`;
    if(view==="div"){
      body=chips+[0,1].map(c=>`<div class="ph"><h3>${CONFNAME[c]}</h3></div>`+
        [0,1,2,3].map(d=>{
          const ts=sortTeams(S.teams.filter(t=>t.conf===c&&t.div===d));
          return `<div class="ph tight"><h3 class="sm">${DIVNAME[d]}</h3></div>
            <table>${head("stand")}<tbody>${

        }).join("")).join("");
    } else if(view==="conf"){
      body=chips+[0,1].map(c=>{
        const ts=sortTeams(S.teams.filter(t=>t.conf===c));
        const sorted=applySort("stand",ts,getters,"w");
        return `<div class="ph"><h3>${CONFNAME[c]}</h3><span class="sub">top 7 make the field</span></div>
          <table>${head("stand")}<tbody>${sorted.map((t,i)=>{
            const seed=ts.indexOf(t)+1;
            return teamRow(t, seed<=7?` <span class="tag ${seed<=4?"green":""}">${seed}</span>`:"");
          }).join("")}</tbody></table>`;
      }).join("");
    } else {
      const ts=applySort("stand",sortTeams(S.teams.slice()),getters,"w");
      body=chips+`<table>${head("stand")}<tbody>${ts.map(t=>teamRow(t)).join("")}</tbody></table>`;
    }
  } else if(V.leagueTab==="power"){
    const pr=powerRankings();
    body=`<div class="pb small muted">A read on who is actually good, not who has been lucky.</div>
      <table><tbody>${pr.map((x,i)=>`<tr class="click ${x.t.id===S.userTeam?"mine":""}"
        data-act="team" data-arg="${x.t.id}">
        <td class="n dim" style="width:26px">${i+1}</td>
        <td><span class="crest sm" style="background:${x.t.color}">${esc(x.t.abbr)}</span></td>
        <td>${esc(x.t.city)} ${esc(x.t.name)}</td>
        <td class="n dim small">${x.t.w}-${x.t.l}</td></tr>`).join("")}</tbody></table>`;
  } else if(V.leagueTab==="search"){
    const res=searchPlayers(V.leagueQ,50);
    body=`<div class="pb"><input id="q-league" class="searchbox" style="width:100%"
        placeholder="Any player in the league" value="${esc(V.leagueQ||"")}" data-act="lsearch"></div>
      ${(V.leagueQ||"").length<2?`<div class="pb muted">Type at least two letters.</div>`
      :res.length?`<div class="scroll"><table><tbody>${res.map(p=>`<tr class="click"
          data-act="player" data-arg="${p.id}"><td>${posTag(p.pos)}</td>
          <td>${esc(p.f)} ${esc(p.l)}</td>
          <td class="dim small">${p.teamId!==null&&S.teams[p.teamId]?esc(S.teams[p.teamId].abbr):"free agent"}</td>
          <td class="n ovr">${p.ovr}</td><td class="n dim">${p.age}</td></tr>`).join("")}</tbody></table></div>`
      :`<div class="pb muted">Nobody by that name.</div>`}`;
  } else if(V.leagueTab==="awards"){
    const aw=S.awards||[];
    body=aw.length?aw.map(y=>`<div class="ph"><h3>${y.year}</h3></div>
      <table><tbody>${y.list.map(a=>`<tr class="click" data-act="player" data-arg="${a.id}">
        <td class="small muted">${esc(a.label)}</td>
        <td>${posTag(a.pos)} ${esc(a.name)} <span class="dim small">${esc(a.team)}</span></td></tr>`).join("")}
      </tbody></table>`).join("")
      :`<div class="pb muted">Nothing has been handed out yet.</div>`;
  } else if(V.leagueTab==="leaders"){
    const stat=V.leaderStat||"py";
    const label=(LEADER_CATS.find(c=>c[0]===stat)||LEADER_CATS[0])[1];
    const L=leaders(stat,25);
    body=`<div class="pb"><div class="chips">${LEADER_CATS.map(([k,l])=>
      `<button class="chip" aria-pressed="${stat===k}" data-act="leadercat" data-arg="${k}">${l}</button>`).join("")}</div></div>`
      +(L.length?`<div class="ph"><h3>${label}</h3><span class="sub">top ${L.length}</span></div>
      <div class="scroll"><table><tbody>${L.map((p,i)=>
        `<tr class="click ${p.teamId===S.userTeam?"mine":""}" data-act="player" data-arg="${p.id}">
          <td class="n dim" style="width:26px">${i+1}</td>
          <td>${posTag(p.pos)} ${esc(p.f[0])}. ${esc(p.l)}
            <span class="dim small">${S.teams[p.teamId]?S.teams[p.teamId].abbr:""}</span></td>
          <td class="n">${p.stats[stat]}</td></tr>`).join("")}</tbody></table></div>`
      :`<div class="pb muted">Nobody has recorded that yet this season.</div>`);
  } else if(V.leagueTab==="scores"){
    const played=S.schedule.filter(g=>g.played);
    const maxWk=played.length?Math.max(...played.map(g=>g.week)):1;
    const wk=clamp(V.scoreWeek||maxWk,1,WEEKS);
    const gs=S.schedule.filter(g=>g.week===wk);
    body=`<div class="pb"><div class="chips">${Array.from({length:WEEKS},(_,i)=>i+1).map(w=>
      `<button class="chip" aria-pressed="${w===wk}" data-act="scoreweek" data-arg="${w}">${w}</button>`).join("")}</div></div>
      <div class="ph"><h3>Week ${wk}</h3><span class="sub">${gs.filter(g=>g.played).length}/${gs.length} played</span></div>
      <table><tbody>${gs.map(g=>{
        const H=S.teams[g.home],A=S.teams[g.away];
        const mine=g.home===S.userTeam||g.away===S.userTeam;
        const aw=g.played&&g.as>g.hs, hw=g.played&&g.hs>g.as;
        return `<tr class="${mine?"mine":""}">
          <td><span class="${aw?"":"muted"}">${esc(A.abbr)}</span>
            <span class="dim">at</span> <span class="${hw?"":"muted"}">${esc(H.abbr)}</span></td>
          <td class="n">${g.played?`${g.as}–${g.hs}`:"—"}</td></tr>`;}).join("")}</tbody></table>`;

    const rows=[];
    for(const t of S.teams) for(const h of t.history) if(h.champ) rows.push([h.year,t]);
    rows.sort((a,b)=>b[0]-a[0]);
    body=rows.length?`<div class="ph"><h3>Champions</h3></div><table><tbody>${rows.map(r=>

      :`<div class="pb muted">No champion crowned yet.</div>`;
    if(S.playoffs&&S.playoffs.rounds.length){
      body=`<div class="ph"><h3>${S.year} playoffs</h3></div><table><tbody>${
        S.playoffs.rounds.map(r=>`<tr><td class="small">${esc(r.label)}</td>
        <td>${esc(S.teams[r.winner].abbr)} <span class="num">${r.ws}</span>
        <span class="dim">over</span> ${esc(S.teams[r.loser].abbr)} <span class="num">${r.ls}</span></td></tr>`).join("")
      }</tbody></table>`+body;

  return `<div class="panel"><div class="pb"><div class="chips">${tabs.map(([k,l])=>
    `<button class="chip" aria-pressed="${V.leagueTab===k}" data-act="leaguetab" data-arg="${k}">${l}</button>`).join("")}</div></div>

/* ============================================================
   Module 7: scouting UI, office, sheets, actions, boot
   ============================================================ */

function gradeLetter(g){
  if(g>=88) return "blue chip"; if(g>=82) return "top 15";
  if(g>=76) return "first round"; if(g>=71) return "day two";
  if(g>=65) return "day three"; if(g>=58) return "late flier";
  return "priority free agent";
}
function tierMark(t){return ["","blue blood","major","mid-major","small school"][t];}

/* ============================ SCOUTING ============================ */
const SCREENS_SCOUT=function(){
  const t=S.teams[S.userTeam];
  if(!S.prospects.length&&S.phase!=="draft")
    return `<div class="panel"><div class="pb">
      <h2>No class on the board</h2>
      <p class="muted">Next year's class is posted when the season kicks off.</p></div></div>`;
  let list=S.prospects.map(id=>S.players[id]);
  if(V.scoutPos!=="ALL") list=list.filter(p=>p.pos===V.scoutPos||
    (V.scoutPos==="OL"&&OL.includes(p.pos))||(V.scoutPos==="DB"&&(p.pos==="CB"||p.pos==="S")));
  if(V.scoutOnly==="scouted") list=list.filter(p=>S.scout[p.id].k>0);
  if(V.scoutOnly==="gems") list=list.filter(p=>{const g=myGrade(p.id);
    return S.scout[p.id].k>=25 && g.est-p.draft.consensus>=4;});
  const sortFn={
    board:(a,b)=>a.draft.rank-b.draft.rank,
    mine:(a,b)=>myGrade(b.id).est-myGrade(a.id).est,
    gap:(a,b)=>(myGrade(b.id).est-b.draft.consensus)*(S.scout[b.id].k>15?1:0)
              -(myGrade(a.id).est-a.draft.consensus)*(S.scout[a.id].k>15?1:0),
    known:(a,b)=>S.scout[b.id].k-S.scout[a.id].k
  }[V.scoutSort];
  list=list.slice().sort(sortFn).slice(0,90);
  const posFilters=["ALL","QB","RB","WR","TE","OL","EDGE","DT","LB","DB"];
  const rows=list.map(p=>{
    const r=S.scout[p.id], g=myGrade(p.id);
    const gap=g.est-p.draft.consensus;
    const known=r.k>=18;
    return `<tr class="click" data-act="prospect" data-arg="${p.id}">
      <td class="n dim">${p.draft.rank}</td>
      <td>${posTag(p.pos)}</td>
      <td>${esc(p.f[0])}. ${esc(p.l)}<br><span class="dim tiny">${esc(p.draft.ctx.school)}</span></td>
      <td class="n">${known?Math.round(g.est):`<span class="dim">–</span>`}
        <br><span class="dim tiny">${known?`±${Math.round(g.band)}`:"unseen"}</span></td>
      <td class="n">${known&&Math.abs(gap)>=3?`<span class="tag ${gap>0?"gold":"red"}">${gap>0?"+":""}${Math.round(gap)}</span>`:""}
        <div class="meter" style="margin-top:4px"><i style="width:${Math.round(r.k)}%"></i></div></td>
    </tr>`;}).join("");
  return `<div class="panel">
    <div class="ph"><h2>Scouting</h2><span class="sub">${Math.round(t.scoutPts)} hours left</span></div>
    <div class="pb stack">
      <div class="chips">${posFilters.map(p=>
        `<button class="chip" aria-pressed="${V.scoutPos===p}" data-act="spos" data-arg="${p}">${p}</button>`).join("")}</div>
      <div class="row wrap">
        <button class="btn sm" data-act="sweep">Area sweep <span class="dim">45h</span></button>
        <span class="tiny dim">A shallow look at twenty names at once.</span>
      </div>
      <div class="row wrap">
        <select data-act="ssort">
          <option value="board" ${V.scoutSort==="board"?"selected":""}>Sort: consensus board</option>
          <option value="mine" ${V.scoutSort==="mine"?"selected":""}>Sort: my grade</option>
          <option value="gap" ${V.scoutSort==="gap"?"selected":""}>Sort: value gap</option>
          <option value="known" ${V.scoutSort==="known"?"selected":""}>Sort: most scouted</option>
        </select>
        <select data-act="sonly">
          <option value="all" ${V.scoutOnly==="all"?"selected":""}>Everyone</option>
          <option value="scouted" ${V.scoutOnly==="scouted"?"selected":""}>Scouted only</option>
          <option value="gems" ${V.scoutOnly==="gems"?"selected":""}>My risers</option>
        </select>
      </div>
    </div>
    <div class="scroll"><table><thead><tr><th>Bd</th><th></th><th>Prospect</th>
      <th class="n">Grade</th><th class="n">vs board</th></tr></thead>
      <tbody>${rows||`<tr><td class="muted" colspan="5">Nobody matches that filter.</td></tr>`}</tbody></table></div>
  </div>`;
};

function prospectSheet(pid){
  const p=S.players[pid], r=S.scout[pid], g=myGrade(pid), t=S.teams[S.userTeam];
  const c=p.draft.combine, ctx=p.draft.ctx;
  const known=r.k>=18;
  const GLO=GRADE_FLOOR, GHI=GRADE_CEIL, SPAN=GHI-GLO;
  const pos=v=>clamp((v-GLO)/SPAN*100,0,100);
  const bandLeft=pos(g.lo), bandW=clamp(pos(g.hi)-bandLeft,1,100-bandLeft);
  const estL=pos(g.est);
  const combineKnown = S.phase==="predraft"||S.phase==="draft"||S.phase==="postdraft";
  const acts=Object.keys(ACTIONS).map(k=>{
    const A=ACTIONS[k], usedMax=k==="tape"?5:k==="game"?3:1;
    const used=(r.acts[k]||0);
    const off=used>=usedMax||t.scoutPts<A.cost;
    return `<button class="btn sm" data-act="doscout" data-arg="${pid}" data-arg2="${k}" ${off?"disabled":""}>
      ${A.name} <span class="dim">${A.cost}h</span>${used?` <span class="tag">${used}/${usedMax}</span>`:""}</button>`;
  }).join(" ");
  const notes=r.notes.length?r.notes.map(n=>
    `<div class="note ${n.val>0?"tell":n.val<0?"warn":""}">${esc(n.txt)}
      <div class="src">— ${esc(n.src)}</div></div>`).join(""):
    `<p class="muted small">No reports filed. Send someone to look at him.</p>`;
  return `
  <div class="sh">
    <div>${posTag(p.pos)} <b>${esc(p.f)} ${esc(p.l)}</b>
      <div class="dim small">${esc(ctx.school)} · ${tierMark(ctx.tier)} · ${ctx.region}</div></div>
    <button class="x" data-act="closesheet">×</button>
  </div>
  <div class="sb stack">
    <div class="row"><button class="chip" data-act="boardadd" data-arg="${pid}">Add to our board</button></div>
    <div class="panel"><div class="pb stack">
      <div class="spread"><span class="muted small">Board consensus</span>
        <span><b class="num">${p.draft.consensus}</b> <span class="dim small">${gradeLetter(p.draft.consensus)} · #${p.draft.rank}</span></span></div>
      <div class="spread"><span class="muted small">Our grade</span>
        <span>${known?`<b class="num">${Math.round(g.est)}</b> <span class="dim small">± ${Math.round(g.band)}</span>`:`<span class="dim">not evaluated</span>`}</span></div>
      ${known?`<div class="band"><i style="left:${bandLeft}%;width:${bandW}%"></i>
        <u style="left:${estL}%"></u></div>
        <div class="spread tiny dim"><span>${GRADE_FLOOR}</span><span>${
          r.k>=85?"we know him":r.k>=55?"a fair read":r.k>=25?"early days":"barely looked"
        }</span><span>${GRADE_CEIL}</span></div>`:""}
      ${known&&Math.abs(g.est-p.draft.consensus)>=4?
        `<p class="small" style="margin:0">${g.est>p.draft.consensus?
          `We have him <b>${Math.round(g.est-p.draft.consensus)} points above</b> where the league has him.`:

    ${(S.rumors&&S.rumors.length)?`<div class="panel">
      <div class="ph"><h3>The rumor mill</h3>
        <span class="sub">${(S.rumorReliability||0.5)>=0.75?"our sources are good"
          :(S.rumorReliability||0.5)>=0.55?"our sources are mixed":"take all of it lightly"}</span></div>
      <div class="pb stack">${S.rumors.map((r,i)=>`<div class="note">
        <div class="small">${esc(r.txt)}</div>
        ${r.checked?`<div class="tiny ${r.true_?"good":"warn"}">Ran it down — it ${r.verdict}.</div>`
          :`<button class="mini" data-act="rumorcheck" data-arg="${i}">Run it down (6h)</button>`}

      <p class="tiny dim">Better analytics and a bigger department mean fewer stories that turn out to be nothing.</p>
      </div></div>`:""}
    <div class="panel"><div class="ph"><h3>Assign work</h3>
      <span class="sub">${Math.round(t.scoutPts)}h left</span></div>
      <div class="pb stack">
        <select data-act="setscout">${t.scouts.map(s=>
          `<option value="${s.id}" ${S.activeScout===s.id?"selected":""}>${esc(s.name)}${s.region?` · ${s.region}`:" · national"}${s.posSpec?` · ${s.posSpec[0]}s`:""}</option>`).join("")}</select>
        <div class="chips">${acts}</div>
        <p class="tiny dim" style="margin:0">Scouts differ. A regional scout learns his own area faster; a scout with a poor eye will file reports that aren't true.</p>
      </div></div>

    <div class="panel"><div class="ph"><h3>The file</h3></div><div class="pb">
      <table><tbody>
        <tr><td class="muted">Age / size</td><td class="n">${p.age} · ${Math.floor(p.ht/12)}-${p.ht%12}, ${p.wt}</td></tr>
        <tr><td class="muted">Career starts</td><td class="n">${ctx.starts} ${ctx.starts===1?"season":"seasons"}</td></tr>
        <tr><td class="muted">Games missed</td><td class="n">${ctx.missed}</td></tr>
        <tr><td class="muted">College scheme</td><td class="n">${esc(ctx.scheme)}</td></tr>
        <tr><td class="muted">Production score</td><td class="n">${Math.round(p.draft.prod*100)}</td></tr>
        ${combineKnown?`<tr><td class="muted">Forty</td><td class="n">${c.forty.toFixed(2)}</td></tr>
        <tr><td class="muted">Vertical / broad</td><td class="n">${c.vert}" · ${c.broad}"</td></tr>
        <tr><td class="muted">Three cone</td><td class="n">${c.cone.toFixed(2)}</td></tr>
        <tr><td class="muted">Bench</td><td class="n">${c.bench}</td></tr>`
        :`<tr><td class="muted">Combine</td><td class="n dim">not until February</td></tr>`}
        ${r.medical?`<tr><td class="muted">Durability</td><td class="n">${p.hidden.inj>62?"concern":p.hidden.inj>40?"average":"excellent"}</td></tr>`:""}
        ${r.interview?`<tr><td class="muted">Work ethic</td><td class="n">${p.hidden.wrk>75?"outstanding":p.hidden.wrk>50?"solid":"questionable"}</td></tr>
        <tr><td class="muted">Character</td><td class="n">${p.hidden.chr>70?"no concerns":p.hidden.chr>45?"minor flags":"real concerns"}</td></tr>`:""}
        ${r.workout?`<tr><td class="muted">Room to grow</td><td class="n">${p.hidden.pot-p.ovr>12?"substantial":p.hidden.pot-p.ovr>5?"some":"limited"}</td></tr>`:""}
      </tbody></table>
    </div></div>
    ${S.phase==="draft"&&onClock()&&onClock().team===S.userTeam?
      `<button class="btn primary big" data-act="pick" data-arg="${pid}">Draft ${esc(p.l)}</button>`:""}
  </div>`;
}

/* ============================ PLAYER SHEET ============================ */
function playerSheet(pid){
  const p=S.players[pid];
  if(p.isProspect) return prospectSheet(pid);
  const t=p.teamId!==null?S.teams[p.teamId]:null;
  const own=t&&t.id===S.userTeam;
  const s=p.stats||{}, ls=p.lastStats||{};
  const line=st=>{
    const out=[];
    if(st.pa) out.push(`${st.pc}/${st.pa}, ${st.py} yds, ${st.ptd||0} TD, ${st.pint||0} int`);
    if(st.ra) out.push(`${st.ra} car, ${st.ry} yds, ${st.rtd||0} TD`);
    if(st.rec) out.push(`${st.rec} rec, ${st.recy} yds, ${st.rectd||0} TD`);
    if(st.tkl) out.push(`${st.tkl} tkl, ${st.sak||0} sk, ${st.int||0} int, ${st.pd||0} pd`);
    if(st.fga) out.push(`${st.fgm}/${st.fga} FG`);
    return out.join(" · ");
  };
  const attrs=POSATTRS[p.pos].map(k=>`
    <div class="spread" style="gap:10px"><span class="small" style="width:110px">${ATTRNAME[k]}</span>
      <div class="meter" style="flex:1"><i style="width:${p.a[k]}%"></i></div>
      <span class="num small" style="width:22px;text-align:right">${p.a[k]}</span></div>`).join("");
  const dr=p.draft&&p.draft.pickedAt?`round ${p.draft.pickedRound||Math.ceil(p.draft.pickedAt/S.teams.length)}, pick ${p.draft.pickedSlot||((p.draft.pickedAt-1)%S.teams.length)+1} (${p.draft.pickedYear||""})`:
    p.draft?"undrafted":"";
  return `
  <div class="sh"><div>${posTag(p.pos)} <b>${esc(p.f)} ${esc(p.l)}</b>
    <div class="dim small">${t?`<span class="click ul" data-act="gototeam" data-arg="${t.id}">${esc(t.city)} ${esc(t.name)}</span>`:"Free agent"} · age ${p.age} · ${p.exp===0?"rookie":p.exp+" yrs"}</div></div>
    <button class="x" data-act="closesheet">×</button></div>
  <div class="sb stack">
    <div class="row"><button class="chip" data-act="addcompare" data-arg="${pid}">Compare</button></div>
    <div class="grid3">
      <div class="stat"><b class="midnum">${p.ovr}</b><span>Overall</span></div>
      <div class="stat"><b>${Math.floor(p.ht/12)}-${p.ht%12}</b><span>${p.wt} lbs</span></div>
      <div class="stat"><b>${p.contract?fmtM(p.contract.apy):"—"}</b><span>${p.contract?p.contract.left+" yrs left":"unsigned"}</span></div>
    </div>
    ${p.injury>0?`<div class="panel"><div class="pb"><span class="tag red">Out ${p.injury} weeks</span>
      <span class="small"> ${esc(p.injDesc)}</span></div></div>`:""}
    <div class="panel"><div class="ph"><h3>Attributes</h3></div><div class="pb stack">${attrs}</div></div>
    ${line(s)||line(ls)?`<div class="panel"><div class="ph"><h3>Production</h3></div><div class="pb stack">
      ${line(s)?`<div><span class="muted small">${S.year}</span><br>${line(s)}</div>`:""}
      ${line(ls)?`<div><span class="muted small">${S.year-1}</span><br>${line(ls)}</div>`:""}
    </div></div>`:""}
    ${p.accolades.length?`<div class="panel"><div class="ph"><h3>Honors</h3></div><div class="pb">
      ${p.accolades.slice(-8).reverse().map(a=>`<div class="small">${a.year} — ${esc(a.award)}</div>`).join("")}</div></div>`:""}
    ${p.draft&&p.draft.ctx?`<div class="panel"><div class="pb small muted">
      ${esc(p.draft.ctx.school)}${dr?" · "+dr:""}</div></div>`:""}
    ${(()=>{
      const kn=knownTraits(p), hidden=(p.traits||[]).length-kn.length;
      const m=moraleOf(p), fit=schemeFit(p);
      const side=POSGROUP[p.pos];
      return `<div class="panel"><div class="ph"><h3>The man</h3></div><div class="pb">
        <div class="row spread"><span class="small">Mood</span>
          <span class="small"><b>${moraleWord(m)}</b></span></div>
        <div class="meter"><i class="${m>=70?"green":m>=45?"":"red"}" style="width:${m}%"></i></div>
        ${side!=="s"?`<div class="row spread" style="margin-top:6px"><span class="small">Scheme fit</span>
          <span class="small"><b>${fitWord(fit)}</b></span></div>
          <div class="meter"><i class="${fit>=58?"green":fit>=44?"":"red"}" style="width:${fit}%"></i></div>`:""}
        <div style="margin-top:8px">${kn.length?kn.map(k=>
          `<div class="note"><div class="small"><b>${TRAITS[k].name}</b></div>
            <div class="tiny dim">${TRAITS[k].blurb}</div></div>`).join("")
          :`<p class="tiny dim">Nothing has shown up in the file yet.</p>`}
          ${hidden?`<p class="tiny dim">${hidden} thing${hidden>1?"s":""} about him we haven't seen yet.</p>`:""}
        </div>
        ${(()=>{
          if(!own) return "";
          const ks=knownSynergies(p);
          if(!ks.length) return "";
          return `<div style="margin-top:8px"><div class="small"><b>What the staff see</b></div>
            ${ks.map(k=>`<div class="note"><div class="small">${SYNERGIES[k].name}</div>
              <div class="tiny dim">"${SYNERGIES[k].hint}"</div>
              ${synWeight(p,k)>1.2?`<div class="tiny good">Our scheme gets the most out of this.</div>`
                :synWeight(p,k)<1?`<div class="tiny warn">We don't ask him to do this often.</div>`:""}
            </div>`).join("")}</div>`;})()}
        ${(()=>{
          if(!own) return "";
          const tr=ceilingTrend(p);
          if(!tr||tr.dir==="flat") return "";
          return `<div style="margin-top:8px" class="tiny ${tr.dir==="up"?"good":"warn"}">
            Where the room thinks he ends up has been <b>${tr.word}</b> over the last
            ${tr.n} year${tr.n>1?"s":""}.</div>`;})()}
        </div></div>`;})()}
    ${p.contract?`<div class="pb tight"><p class="tiny dim">${structureLabel(p)} ·
      ${fmtM(deadMoney(p))} dead if released${p.tagged===S.year?" · franchise tagged":""}</p></div>`:""}
    ${percentileLine(p)}
    ${own?`<div class="row wrap">
      ${p.contract&&p.contract.left<=1?`<button class="btn" data-act="extend" data-arg="${pid}">Offer extension</button>`:""}
      <button class="btn danger" data-act="cut" data-arg="${pid}"
        ${own&&capAfterRelease(p,t)<0?"disabled":""}>Release — ${fmtM(deadMoney(p))} dead${
        own&&capAfterRelease(p,t)<0?" · no room":""}</button>
      ${canRestructure(p)?`<button class="btn" data-act="restructure" data-arg="${pid}">Restructure</button>`:""}
      <button class="btn" data-act="shop" data-arg="${pid}">Shop him</button>
      ${p.injury>=3&&!p.onIR?`<button class="btn" data-act="placeir" data-arg="${pid}">Injured reserve</button>`:""}
      <button class="btn" data-act="pin" data-arg="${pid}">${p.pinActive?"Unpin":"Keep him active"}</button>
      ${p.contract&&p.contract.left<=1&&S.phase==="resign"?`<button class="btn" data-act="tag" data-arg="${pid}">Franchise tag — ${fmtM(tagCost(p))}</button>`:""}
    </div>`:""}
  </div>`;
}

/* ============================ PANELS ============================ */
function onClock(){ return S.draftOrder&&S.draftIdx<S.draftOrder.length?S.draftOrder[S.draftIdx]:null; }
function draftPanel(){
  const pk=onClock();
  if(!pk) return `<div class="panel"><div class="pb"><h3>The draft is over</h3>
    <p class="muted small">Undrafted players are signing now.</p></div></div>`;
  const mine=pk.team===S.userTeam;
  const recent=S.draftOrder.slice(Math.max(0,S.draftIdx-6),S.draftIdx).reverse();
  let board="";
  if(mine){
    const list=S.prospects.map(id=>S.players[id])
      .sort((a,b)=>myGrade(b.id).est-myGrade(a.id).est).slice(0,14);
    board=`<table><thead><tr><th>Bd</th><th>Prospect</th><th class="n">Our grade</th><th></th></tr></thead><tbody>
      ${list.map(p=>{const g=myGrade(p.id),k=S.scout[p.id].k;
        return `<tr><td class="n dim">${p.draft.rank}</td>
        <td class="click" data-act="prospect" data-arg="${p.id}">${posTag(p.pos)} ${esc(p.l)}
          <br><span class="dim tiny">${esc(p.draft.ctx.school)}</span></td>
        <td class="n">${k>=18?Math.round(g.est):"–"}<br><span class="dim tiny">${k>=18?"±"+Math.round(g.band):"unseen"}</span></td>
        <td><button class="btn sm" data-act="pick" data-arg="${p.id}">Pick</button></td></tr>`;}).join("")}
    </tbody></table>`;
  }
  return `<div class="panel">
    <div class="ph"><h3>${mine?"You're on the clock":"Draft in progress"}</h3>
      <span class="sub">${ordinal(pk.overall)} overall · round ${pk.round}</span></div>
    ${mine?`<div class="pb tight">${board}</div>
      <div class="pb"><button class="btn full" data-act="bestavail">Let the room decide</button></div>
      ${(()=>{
        const mine=nextUserPick(true); if(!mine) return "";
        const rungs=tradeUpTargets(); if(!rungs.length) return "";
        return `<div class="pb"><div class="note"><div class="small"><b>Move our next pick up from ${ordinal(mine.overall)}</b></div>
          <div class="row wrap" style="margin-top:4px">${rungs.map(o=>{
            const q=tradeUpCost(o); if(!q) return "";
            return `<button class="mini" data-act="tradeup" data-arg="${o}" ${q.ok?"":"disabled"}>
              ${ordinal(o)}${q.ok?(q.extra.length?` · ${q.extra.length} pick${q.extra.length>1?"s":""}`:" · even"):" · short"}</button>`;
          }).join(" ")}</div></div></div>`;})()}
      <div class="pb stack">
        <button class="btn full" data-act="drafttrade">See who wants to move up</button>
        ${(S.draftOffers||[]).map((o,i)=>{const ot=S.teams[o.team];
          return `<div class="note"><div class="small"><b>${esc(ot.city)}</b> offer
            ${o.give.map(a=>`${a.year} R${a.round}`).join(" + ")}
            <span class="dim">(${o.value} for our ${o.mine})</span></div>
            <button class="mini" data-act="drafttradedo" data-arg="${i}">Trade down</button></div>`;}).join("")}
      </div>`
     :`<div class="pb stack"><p class="small muted">${esc(S.teams[pk.team].city)} is picking.</p>
       ${(()=>{
         const mine=nextUserPick(true);
         if(!mine) return `<p class="tiny dim">We have no picks left.</p>`;
         const rungs=tradeUpTargets();
         if(!rungs.length) return `<p class="tiny dim">We're up at ${ordinal(mine.overall)}.</p>`;
         return `<div class="note"><div class="small"><b>Move up from ${ordinal(mine.overall)}</b></div>
           <div class="row wrap" style="margin-top:4px">${rungs.map(o=>{
             const q=tradeUpCost(o); if(!q) return "";
             return `<button class="mini" data-act="tradeup" data-arg="${o}" ${q.ok?"":"disabled"}>
               ${ordinal(o)}${q.ok?(q.extra.length?` · ${q.extra.length} pick${q.extra.length>1?"s":""}`:" · even"):" · short"}</button>`;
           }).join(" ")}</div></div>`;})()}
       <button class="btn primary full" data-act="advance">Continue the draft</button></div>`}
    ${recent.length?`<div class="pb tight"><table><tbody>${recent.map(x=>{
      const p=S.players[x.pid]; if(!p) return "";
      const gem=p.hidden.trueGrade-p.draft.consensus;
      return `<tr><td class="n dim">${x.overall}</td><td>${esc(S.teams[x.team].abbr)}</td>
        <td class="click" data-act="player" data-arg="${p.id}">${posTag(p.pos)} ${esc(p.l)}</td></tr>`;}).join("")}
      </tbody></table></div>`:""}
  </div>`;
}
function faPanel(compact){
  const t=S.teams[S.userTeam];
  const grp=V.faGroup||"all";
  const q=(V.faQ||"").toLowerCase();
  let pool=S.freeAgents.map(id=>S.players[id]).filter(Boolean)
    .filter(p=>ROSTER_GROUPS[grp].includes(p.pos))
    .filter(p=>!q||`${p.f} ${p.l} ${p.pos}`.toLowerCase().includes(q));
  const total=pool.length;
  pool=applySort("fa",pool,{
    pos:p=>-POS.indexOf(p.pos), name:p=>p.l, age:p=>p.age, ovr:p=>p.ovr,
    ask:p=>marketAPY(p), fit:p=>needScore(t,p.pos)
  },"ovr");
  if(compact) pool=pool.slice(0,14);
  else if(!V.faAll) pool=pool.slice(0,60);
  const needs=teamNeeds(t).slice(0,3).map(n=>n.pos).join(", ");
  return `<div class="panel">
    <div class="ph"><h3>Free agency</h3><span class="sub">${fmtM(capSpace(t))} of room</span></div>
    <div class="pb small muted">Biggest holes: ${needs}. Offers are settled when you advance —
      players weigh money against playing time and the team around them.</div>
    <div class="pb stack">
      <div class="chips">${[["all","All"],["off","Offense"],["def","Defense"],["st","Specialists"]]
        .map(([k,l])=>`<button class="chip" aria-pressed="${grp===k}" data-act="fagroup" data-arg="${k}">${l}</button>`).join("")}</div>
      <div class="row">
        <input id="q-fa" class="searchbox" placeholder="Find a free agent"
          value="${esc(V.faQ||"")}" data-act="fasearch">
        <span class="tiny dim">${pool.length} of ${total}</span>
      </div></div>
    <div class="scroll"><table><thead><tr>
      ${sortTH("fa","pos","Pos")}${sortTH("fa","name","Player","","asc")}
      ${sortTH("fa","age","Age","n")}${sortTH("fa","ovr","Ovr","n")}
      ${sortTH("fa","fit","Fit","n")}${sortTH("fa","ask","Asking","n")}<th></th></tr></thead><tbody>
      ${pool.map(p=>{const o=S.userOffers[p.id]; const fit=Math.round(needScore(t,p.pos));
        return `<tr><td>${posTag(p.pos)}</td>
        <td class="click" data-act="player" data-arg="${p.id}">${esc(p.f[0])}. ${esc(p.l)}</td>
        <td class="n">${p.age}</td><td class="n ovr">${p.ovr}</td>
        <td class="n ${fit>30?"good":"dim"}">${fit}</td>
        <td class="n">${fmtM(marketAPY(p))}</td>
        <td>${o?`<span class="tag green">${fmtM(o.apy)}×${o.years}</span>`:
          `<button class="btn sm" data-act="offer" data-arg="${p.id}">Offer</button>`}</td></tr>`;}).join("")}
    </tbody></table></div>
    ${!compact&&!V.faAll&&total>60?`<div class="pb"><button class="btn" data-act="faall">Show all ${total}</button></div>`:""}
    ${pool.length?"":`<div class="pb muted">Nobody matches that.</div>`}</div>`;
}
function resignPanel(){

    const mine=t.picks.slice().sort((a,b)=>a.year-b.year||a.round-b.round);
    body=`<table><tbody>${mine.map(p=>`<tr><td>${p.year}</td>
      <td>Round ${p.round}${p.orig!==t.id?` <span class="dim small">(from ${S.teams[p.orig].abbr})</span>`:""}</td>
      </tr>`).join("")}</tbody></table>`;
  } else {
    body=`<div class="pb stack">
      ${S.saveOK===false?`<div class="band red">This browser isn't storing the league. It only
        exists in memory and will be gone when you close the tab — download a file now.</div>`
        :S.savedAt?`<p class="tiny dim">Last saved ${(()=>{const m=Math.round((Date.now()-S.savedAt)/60000);
          return m<1?"a moment ago":m===1?"a minute ago":`${m} minutes ago`;})()}.</p>`:""}
      <button class="btn full" data-act="save">Save league</button>

        or move it to another machine.</p></div>`;
  }
  return `<div class="panel"><div class="pb"><div class="chips">${tabs.map(([k,l])=>
    `<button class="chip" aria-pressed="${V.officeTab===k}" data-act="officetab" data-arg="${k}">${l}</button>`).join("")}

/* ============================================================
   Module 8: the calendar — phases, combine, saves, boot
   ============================================================ */

function scoutBudget(t){
  const sd=t.staff.SD;
  const dept=effLvl(t,"scoutdept");
  const bought=Math.round((t.scoutInvest||0)*0.6);
  return Math.round(17 + (sd?sd.dev:60)/7 + t.scouts.length*1.6 + (dept-2)*4 + bought);
}
function grantScoutPts(){
  for(const t of S.teams) if(t.id===S.userTeam) t.scoutPts+=scoutBudget(t);
}

/* ---------- the combine reprices the market ---------- */
function runCombine(){
  const before={};
  for(const id of S.prospects) before[id]=S.players[id].draft.rank;
  for(const id of S.prospects) S.players[id].draft.combineDone=true;
  repriceBoard(true);
  for(const t of S.teams) buildAIBoard(t);
  const moved=S.prospects.map(id=>S.players[id])
    .map(p=>({p,d:before[p.id]-p.draft.rank})).filter(x=>Math.abs(x.d)>=25);
  const up=moved.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3);
  const dn=moved.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,2);
  news("The combine is in the books. Boards are being redone across the league.","draft");
  up.forEach(x=>news(`Riser: ${x.p.pos} ${x.p.f} ${x.p.l} (${x.p.draft.ctx.school}) climbs ${x.d} spots on the consensus board`,"draft",x.p.id));
  dn.forEach(x=>news(`Faller: ${x.p.pos} ${x.p.f} ${x.p.l} slides ${-x.d} spots after a bad week in Indianapolis`,"draft",x.p.id));
}

/* ---------- AI re-signings ---------- */
function aiResign(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    const exp=t.roster.map(id=>S.players[id]).filter(p=>p.contract&&p.contract.left<=1);
    for(const p of exp){
      const v=playerTradeValue(p), apy=marketAPY(p);
      if(capSpace(t)>apy+8e6 && v>90 && chance(0.55+t.ai.winNow*0.25)){
        signPlayer(p,t.id,Math.round(apy*rf(.98,1.12)),contractYears(p),.5);
      }
    }
  }
}

/* ---------- draft wrap-up ---------- */
function endDraft(){
  recordTapeWatch();
  const t=S.teams[S.userTeam];
  const mine=t.roster.map(id=>S.players[id]).filter(p=>p.exp===0&&p.draft&&p.draft.pickedBy===t.id);
  for(const p of mine){
    const h=draftHindsight(p);
    if(h.gap>=8) news(`Our room had ${p.pos} ${p.l} well above the board — the tape said more than the résumé.`,"draft",p.id);
  }
  S.phase="postdraft";
  news(`${S.year+1} draft complete. ${mine.length} players added.`,"draft");
  // seven rounds are gone; the phones open before anyone gets cut
  if(typeof openScramble==="function" && S.prospects && S.prospects.length) openScramble();
  else udfaSigning();
}

function offseasonProgressReport(rooks){
  for(const p of rooks){
    const late=p.draft.pickedAt>96;
    if(late&&p.ovr>=72)
      news(`${p.pos} ${p.f} ${p.l}, taken ${ordinal(p.draft.pickedAt)} overall, finished his rookie year at ${p.ovr}. The rest of the league missed.`,"win",p.id);
    if((p.draft.pickedRound||1)===1&&p.ovr<=62)
      news(`Our first-round pick ${p.l} closed the year at ${p.ovr}. That one is going to sting.`,"loss",p.id);
  }
}

/* ---------- housekeeping ---------- */
function fillRosterFromFA(t,quiet){
  let added=0, guard=0;
  while(t.roster.length<ROSTER_MAX&&guard++<90){
    const need=teamNeeds(t)[0];
    const pool=S.freeAgents.map(id=>S.players[id])
      .filter(p=>p&&!p.retired&&p.teamId===null&&p.pos===need.pos).sort((a,b)=>b.ovr-a.ovr);
    // a good player still has to be paid something like his worth
    const room=Math.max(minSalary(),capSpace(t));
    let p=pool.find(x=>marketAPY(x)*0.75<=room);
    if(!p){ p=makePlayer(need.pos,c99(gauss(57,4)),ri(23,27)); S.players[p.id]=p; }
    else S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
    const price=Math.max(minSalary(),Math.min(room,Math.round(marketAPY(p)*0.82)));
    signPlayer(p,t.id,price,p.ovr>=70?ri(1,3):1,.15); addToTeam(p,t); added++;
  }
  if(added&&!quiet) news(`Front office filled ${added} roster spots with minimum deals.`,"info");
  return added;
}
/* the league has a spending floor — clubs sitting on it get pushed into the market */
function enforceCapFloor(){
  const floor=S.cap*0.88;
  for(const t of S.teams){
    let guard=0;
    while(payroll(t)<floor&&guard++<40){
      const pool=S.freeAgents.map(id=>S.players[id])
        .filter(p=>p&&!p.retired&&p.teamId===null&&p.ovr>=64).sort((a,b)=>b.ovr-a.ovr);
      const p=pool[0];
      if(p&&t.roster.length<ROSTER_MAX&&marketAPY(p)*1.35<S.cap*0.97-payroll(t)){
        S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
        signPlayer(p,t.id,Math.round(marketAPY(p)*rf(1.05,1.35)),contractYears(p),rf(.4,.75));
        addToTeam(p,t);
        if(p.ovr>=80) news(`${t.city} adds ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr) to get to the spending floor.`,"league",p.id);
        continue;
      }
      // nothing worth signing: extend the best men already in the building
      const under=t.roster.map(id=>S.players[id])
        .filter(x=>x.contract&&x.contract.apy<marketAPY(x)*0.9)
        .sort((a,b)=>b.ovr-a.ovr);
      if(!under.length) break;
      const x=under[0];
      const raise=Math.round(marketAPY(x)*rf(1.0,1.2));
      if(payroll(t)-x.contract.apy+raise>S.cap*0.97) break;
      setAPY(x,raise);
      x.contract.left=Math.max(x.contract.left,contractYears(x));
    }
  }
}
/* keep the save file from growing forever */
function pruneState(){
  const keep=new Set();
  for(const t of S.teams){
    t.roster.forEach(id=>keep.add(id));
    (t.ir||[]).forEach(id=>keep.add(id));
    (t.ps||[]).forEach(id=>keep.add(id));
  }
  S.prospects.forEach(id=>keep.add(id));
  // let weak unsigned veterans drift out of the league
  S.freeAgents=S.freeAgents.filter(id=>{
    const p=S.players[id];
    if(!p||p.retired) return false;
    if(p.ovr<62&&p.age>26) { p.retired=true; return false; }
    if(p.ovr<55) { p.retired=true; return false; }
    return true;
  });
  S.freeAgents.forEach(id=>keep.add(id));
  const awardIds=new Set();
  for(const yr of (S.awards||[])) for(const a of (yr.list||[])) awardIds.add(a.id);
  for(const h of (S.hall||[])) awardIds.add(h.id);
  let legends=0;
  for(const id in S.players){
    const p=S.players[id];
    if(keep.has(p.id)||awardIds.has(p.id)) continue;
    if(p.retired&&(p.accolades||[]).length>=4&&legends<80){ legends++; continue; }
    delete S.players[id];
  }
  for(const id in S.players){
    const p=S.players[id];
    if(p.draft&&p.draft.noteBank&&!p.isProspect) delete p.draft.noteBank;
    delete p.lastStats;
  }
  for(const t of S.teams){
    t.ir=(t.ir||[]).filter(id=>S.players[id]);
    t.ps=(t.ps||[]).filter(id=>S.players[id]);
    t.roster=t.roster.filter(id=>S.players[id]);
  }
  for(const g of S.schedule) delete g.log;
  S.news=S.news.slice(0,120);
}

/* ---------- new season ---------- */
function startSeason(){
  resetPosNorms(); resetAttrNorms();
  runHoldouts();
  for(const t of S.teams) updateMorale(t);
  S.year++;
  resetStandings();
  newDraftPicks();
  buildSchedule();
  generateDraftClass();
  S.week=1; S.phase="regular";
  S.cap=Math.round(S.cap*1.062);
  runAutoCuts();
  for(const t of S.teams){ t.scoutPts=0; fillRosterFromFA(t,t.id!==S.userTeam); assignSchemes(t); }
  aiStockPracticeSquads();
  enforceCapFloor();
  enforceCap();
  for(const t of S.teams) autoDepth(t);
  news(`${S.year} season kicks off. Next year's class is on the board.`,"info");
}

/* ---------- the one button ---------- */
function advance(){
  if(S.owner&&S.owner.fired) return;   // you don't work here any more
  topUpMarkets();                      // there is always somebody available
  const t=S.teams[S.userTeam];
  switch(S.phase){
    case "regular":
      if(S.week<=WEEKS){ tickHoldouts(); playWeek(); grantScoutPts(); aiManageIR(); psDevelop(); poachPracticeSquads(); }
      runAutoJobs();
      buildDigest();
      if(GAMEPLANS[planOf()]&&GAMEPLANS[planOf()].heals)
        for(const id of t.roster){ const p=S.players[id]; if(p&&p.injury>0&&chance(.35)) p.injury--; }
      S.gameplan="balanced";
      updateMorale(t);
      if(S.week>WEEKS){ S.phase="postseason"; news("Regular season complete.","info"); }
      break;
    case "postseason":{
      const champ=simPlayoffs();
      buildDraftOrder();
      news(`${champ.city} ${champ.name} win the championship.`,"playoff");
      if(champ.id===S.userTeam)
        raiseMoment("win","Champions",`${champ.city} ${champ.name}`,
          `${S.year}. Whatever else happens, they can't take this one off you.`);
      S.phase="offseason";
      break;}
    case "offseason":{
      const rooks=t.roster.map(id=>S.players[id])
        .filter(p=>p.exp===0&&p.draft&&p.draft.pickedBy===t.id);
      offseasonProgressReport(rooks);
      lifeSeasonEnd();
      ownerReview();
      settleBooks();
      refreshStaffMarket();
      aiStaffChurn();
      tapeRetrospective();
      aiTradeApproach();
      seasonAwards();
      clearIR();
      updatePrestige();
      logCareerSeason();
      ownerTenureRoll();
      aiOwnerChurn();
      resolveUserRelocation();
      considerRelocation();
      ageStaff();
      runCarousel();
      generateJobOffers();
      hallOfFameIntake(offseasonProgress());
      buildRecap();          // now that everyone has developed or declined
      rollContracts();
      aiResign();
      S.phase="resign";
      S.userOffers={};
      news("Contracts have rolled over. Expiring players hit the market next.","info");
      break;}
    case "resign":
      aiUseTags();
      S.phase="freeagency";
      break;
    case "freeagency":
      runFreeAgency(6);
      awardCompPicks();
      aiRosterCleanup();
      enforceCap();
      runFreeAgency(3);   // whoever the purge put on the street gets another market
      S.userOffers={};
      runCombine();
      generateRumors();
      S.phase="predraft"; S.predraftWeek=1;
      t.scoutPts+=Math.round(scoutBudget(t)*2.4);
      break;
    case "predraft":
      S.predraftWeek=(S.predraftWeek||1)+1;
      t.scoutPts+=Math.round(scoutBudget(t)*2.2);
      if(S.predraftWeek>4){
        buildDraftOrder();   // rebuilt now, so trades made during the pre-draft window count
        S.phase="draft"; advanceDraftToUser();
        if(S.draftIdx>=S.draftOrder.length) endDraft(); }
      break;
    case "draft":{
      const pk=onClock();
      if(!pk){ endDraft(); break; }
      if(pk.team===S.userTeam){ toast("You're on the clock — make a pick."); V.screen="hub"; break; }
      advanceDraftToUser();
      if(S.draftIdx>=S.draftOrder.length||!S.prospects.length) endDraft();
      break;}
    case "postdraft":
      if(t.roster.length>ROSTER_MAX){ toast(`Cut down to ${ROSTER_MAX} first (${t.roster.length} on roster).`); break; }
      aiRosterCleanup();
      pruneState();
      startSeason();
      break;
  }
  render();
}

/* ---------- persistence ---------- */
const SAVEKEY="frontoffice.save.v1";
async function storePut(k,v){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  window.__mem=window.__mem||{}; window.__mem[k]=v;
  return false;                       // it is in memory only and will not survive a reload
}
async function storeGet(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value) return r.value; } }catch(e){}
  try{ const r=localStorage.getItem(k); if(r) return r; }catch(e){}
  return (window.__mem||{})[k]||null;
}
/* underscore-prefixed fields are working caches and never belong in a save */
function serialiseState(){
  return JSON.stringify(S,(k,v)=>k.charAt(0)==="_"?undefined:v);
}
function saveSignature(){
  return S?`${S.year}|${S.week}|${S.phase}|${(S.news||[]).length}|${S.draftIdx}`:"";
}
async function saveGame(force){
  if(!S||!S.teams) return;
  const sig=saveSignature();
  if(!force&&sig===S.__lastSig) return;      // nothing has happened worth writing
  const ok=await storePut(SAVEKEY,serialiseState());
  S.__lastSig=sig;
  S.saveOK=ok;
  S.savedAt=Date.now();
  if(!ok&&!S.saveWarned){
    S.saveWarned=true;
    news("This browser won't store the league — it's only held in memory and will be lost "+
         "when you close the tab. Download a copy from the Save screen.","loss");
  }
}
async function loadGame(){
  const raw=await storeGet(SAVEKEY);
  if(!raw) return false;
  try{ S=JSON.parse(raw); migrateSave(); return true; }catch(e){ return false; }
}
/* a save written before a system existed still has to open */
function migrateSave(){
  if(!S||!S.teams) return;
  if(!S.owner) initOwner();
  if(!S.records||!S.hall) ensureBooks();
  if(!S.rumors) S.rumors=[];
  if(!S.tapeWatch) S.tapeWatch=[];
  if(!S.staffMarket) S.staffMarket=[];
  if(!S.tradeInbox) S.tradeInbox=[];
  S.scramble=null; S.draftOffers=null;
  for(const t of S.teams){
    ensureOps(t);
    assignSchemes(t);
    for(const r of ["HC","OC","DC","SD"]){
      const c=t.staff[r];
      if(!c) continue;
      if(c.age===undefined) c.age=r==="HC"?ri(41,63):ri(33,58);
      if(!c.hidden||c.hidden.pot===undefined) rollCoachPotential(c);
      if(c.value===undefined) c.value=coachValue(c);
    }
    if(!t.ir) t.ir=[];
    if(!t.ps) t.ps=[];
    if(t.irReturns===undefined) t.irReturns=0;
    if(!t.depth) autoDepth(t);
  }
  for(const c of (S.staffMarket||[])){
    if(c.age===undefined) c.age=c.role==="HC"?ri(41,63):ri(33,58);
    if(!c.hidden||c.hidden.pot===undefined) rollCoachPotential(c);
    if(c.value===undefined) c.value=coachValue(c);
  }
  if(!S.tagUsed) S.tagUsed={};
  if(!S.gameplan) S.gameplan="balanced";
  if(!S.hintsSeen) S.hintsSeen=[];
  if(!S.seededYears){
    // an old save only holds one year of picks; mint the next two
    S.seededYears=[...new Set(S.teams.flatMap(t=>t.picks.map(p=>p.year)))];
    for(const y of [S.year+1,S.year+2]){
      if(S.seededYears.indexOf(y)>=0) continue;
      S.seededYears.push(y);
      for(const t of S.teams) for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
    }
  }
  if(!S.norms) S.norms={pos:{},attr:{}};   // a save from before the baselines existed
  for(const id in S.players){
    const p=S.players[id];
    if(!p||!p.pos) continue;
    delete p._syn; delete p._synOvr;
    if(!p.traits) rollTraits(p);
    if(p.morale===undefined) p.morale=ri(62,80);
    if(p.tenure===undefined) p.tenure=0;
  }
}
function exportSave(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`front-office-${S.teams[S.userTeam].abbr}-${S.year}.json`;

function importSave(file){

}

/* ============================================================
   Module 9: running the business — money, facilities, staff,
   the trade market, and the long memory of a draft board
   ============================================================ */

/* ---------- market sizes ---------- */
function marketFor(t){
  const r=(typeof REAL_TEAMS!=="undefined")?REAL_TEAMS[t.id]:null;
  if(r) return r[6];
  return clamp(0.74 + ((t.id*37)%23)/23*0.58, 0.74, 1.32);
}

/* ---------- facilities ---------- */
const FACS = {
  train:     {name:"Training center",     short:"Training",
              blurb:"Strength staff, tech, the weight room. Players on the roster develop faster.",
              base:26e6, up:6.0e6},
  med:       {name:"Sports medicine",     short:"Medicine",
              blurb:"Trainers, imaging, recovery. Fewer soft-tissue injuries and quicker returns.",
              base:24e6, up:6.0e6},
  scoutdept: {name:"Scouting department", short:"Scouting",
              blurb:"Film rooms, travel budget, regional offices. More hours in the pre-draft window.",
              base:16e6, up:4.0e6},
  analytics: {name:"Analytics group",     short:"Analytics",
              blurb:"Modelling and cross-checking. Tightens the range on every grade and filters out bad intel.",
              base:18e6, up:4.0e6},
  stadium:   {name:"Stadium",             short:"Stadium",
              blurb:"Seats, suites, concessions. The single biggest lever on what the club earns.",
              base:55e6, up:12e6}
};
const FAC_KEYS = Object.keys(FACS);
const FAC_TIERS = 5;      // five tiers gets you level with the best in the league
const FAC_MAX = 99;       // but nothing stops a club going further
/* what a level is actually worth: linear to the fifth tier, then diminishing,
   so a club can always invest without the effects running away */
function effLvl(t,k){
  const l=facLvl(t,k);
  return l<=FAC_TIERS ? l : FAC_TIERS + (1-Math.pow(0.72,l-FAC_TIERS))*2.6;
}
function capScale(){ return S.cap/CAP_BASE; }
function facLvl(t,k){ return (t && t.fac && t.fac[k]) || 1; }
function facCost(t,k){
  const lvl=facLvl(t,k);
  // past the fifth tier you're paying for the cutting edge, and it is not cheap
  const beyond = lvl>=FAC_TIERS ? Math.pow(1.40,lvl-FAC_TIERS+1) : 1;
  return Math.round(FACS[k].base*Math.pow(lvl,1.35)*beyond*capScale()/1e6)*1e6;
}
function facUpkeep(t){
  return Math.round(sum(FAC_KEYS.map(k=>FACS[k].up*facLvl(t,k)))*capScale());
}
/* the levers facilities actually pull */
// level 2 is the league norm: level 1 is a small penalty, not a ruinous one
function devMult(t){        return 1 + 0.090*(effLvl(t,"train")-2); }
function injuryMult(t){     return Math.max(0.50, 1 - 0.085*(effLvl(t,"med")-2)); }
function healMult(t){       return 1 + 0.10*(effLvl(t,"med")-1); }
function analyticsEdge(t){  return clamp((effLvl(t,"analytics")-1)/4,0,1.35); }

function initOps(t){
  t.market = marketFor(t);
  t.fac = {train:2, med:2, scoutdept:2, analytics:2, stadium:2};
  t.scoutInvest = 0;                       // $M/yr of extra scouting money
  t.cash = Math.round(90e6*capScale()*rf(.7,1.3));
  t.books = [];                            // season-by-season P&L
}
function ensureOps(t){ if(!t.fac) initOps(t); }

/* ---------- the ledger ---------- */
function seasonRevenue(t){
  ensureOps(t);
  const cs=capScale(), mk=t.market, wp=winPct(t);
  const media = Math.round(340e6*cs);
  const gate  = Math.round(130e6*cs*mk*(0.80+0.34*wp)*(1+0.11*(effLvl(t,"stadium")-2)));
  const merch = Math.round( 92e6*cs*mk*(0.45+0.55*t.prestige/60)*(0.75+0.42*wp));
  let post=0;
  if(t.madePlayoffs)     post += Math.round(17e6*cs*mk);
  if(S.champion===t.id)  post += Math.round(28e6*cs*mk);
  return {media,gate,merch,post,total:media+gate+merch+post};
}
function seasonExpenses(t){
  ensureOps(t);
  const cs=capScale();
  const players = payroll(t);          // payroll already carries the dead money
  const staff = sum(["HC","OC","DC","SD"].map(k=>t.staff[k]?t.staff[k].salary:0))
              + t.scouts.length*Math.round(0.7e6*cs);
  const fac = facUpkeep(t);
  const ops = Math.round(196e6*cs*(0.75+0.35*t.market));
  const scouting = Math.round((t.scoutInvest||0)*1e6*cs);
  return {players,staff,fac,ops,scouting,total:players+staff+fac+ops+scouting};
}
function settleBooks(){
  for(const t of S.teams){
    ensureOps(t);
    const rev=seasonRevenue(t), exp=seasonExpenses(t);
    const net=rev.total-exp.total;
    t.cash=Math.round(t.cash+net);
    if(t.cash<0){
      const covered=-t.cash;
      t.cash=0;
      if(t.id===S.userTeam&&S.owner){
        const hit=clamp(Math.round(covered/(S.cap*0.06)),1,14);
        S.owner.patience=clamp(S.owner.patience-hit,0,100);
        news(`The owner had to put ${fmtM(covered)} in to cover the shortfall. He noticed.`,"loss");
      }
    }
    const reserve=Math.round(400e6*capScale());   // room to save for a real project
    if(t.cash>reserve){
      const draw=Math.round((t.cash-reserve)*0.45);
      t.cash-=draw;
      if(t.id===S.userTeam) news(`The owner took ${fmtM(draw)} out of the club this year. ` +
        `Money left sitting is money he assumes you don't need.`,"info");
    }
    t.books.unshift({year:S.year, rev:rev.total, exp:exp.total, net, w:t.w, l:t.l});
    if(t.books.length>12) t.books.length=12;
    if(t.id===S.userTeam){
      news(`${S.year} books closed: ${fmtM(rev.total)} in, ${fmtM(exp.total)} out — ` +
           `${net>=0?"a "+fmtM(net)+" profit":fmtM(-net)+" in the red"}. ` +
           `${fmtM(t.cash)} on hand.`, net>=0?"info":"loss");
    }
    // the AI reinvests when it can
    if(t.id!==S.userTeam) aiSpend(t);
  }
}
function aiSpend(t){
  let guard=0;
  while(guard++<2){
    const wants=FAC_KEYS.filter(k=>facLvl(t,k)<12)
      .map(k=>({k,c:facCost(t,k),w:aiFacWeight(t,k)}))
      .filter(x=>x.c && x.c < t.cash-Math.round(90e6*capScale()))
      .sort((a,b)=>b.w-a.w);
    if(!wants.length) break;
    if(!chance(0.55+t.ai.aggression*0.3)) break;
    const x=wants[0];
    t.cash-=x.c; t.fac[x.k]++;
  }
}
function aiFacWeight(t,k){
  const lvl=facLvl(t,k);
  const base={train:1.00, med:0.86, scoutdept:0.74, analytics:0.70, stadium:0.92}[k];
  const tilt = k==="stadium" ? t.market*0.9
             : k==="scoutdept"||k==="analytics" ? (1-t.ai.winNow)*1.1
             : t.ai.winNow*0.8;
  return (base+tilt)/Math.pow(lvl,0.55) + rf(0,0.35);
}

/* ---------- staff market ---------- */
function coachOverall(c){
  return Math.round((Math.max(c.off,c.def)*0.34 + c.dev*0.34 + c.gm*0.18 + c.disc*0.14));
}
function refreshStaffMarket(){
  S.staffMarket=[];
  for(const role of ["HC","OC","DC","SD"]){
    const n=ri(3,5);
    for(let i=0;i<n;i++){
      const c=makeCoach(role);
      if(TEAM_SCHEMES[role]) c.scheme=pick(Object.keys(TEAM_SCHEMES[role]));
      c.asking=Math.round(coachValue(c)*rf(1.0,1.40)/1e5)*1e5;
      c.years=ri(2,4);
      S.staffMarket.push(c);
    }
  }
}
function buyoutCost(c){ return Math.round((c.salary||0)*Math.max(1,c.years||1)*0.55); }
function fireCoach(t,role){
  const c=t.staff[role];
  if(!c) return {ok:false,msg:"Nobody in that chair."};
  const cost=buyoutCost(c);
  if(t.cash<cost) return {ok:false,msg:`Buying him out costs ${fmtM(cost)}. You don't have it.`};
  t.cash-=cost;
  delete t.staff[role];
  news(`${esc(c.name)} relieved of his duties. ${fmtM(cost)} buyout.`,"loss");
  return {ok:true,msg:`${c.name} is out. ${fmtM(cost)} buyout.`};
}
function hireCoach(t,cid){
  const c=S.staffMarket.find(x=>x.id===cid);
  if(!c) return {ok:false,msg:"He's off the market."};
  if(t.staff[c.role]) return {ok:false,msg:`Move on from your ${c.role} first.`};
  if(t.cash<c.asking) return {ok:false,msg:`He wants ${fmtM(c.asking)}. You can't cover it.`};
  c.salary=c.asking;
  t.staff[c.role]=c;
  S.staffMarket=S.staffMarket.filter(x=>x.id!==cid);
  news(`Hired ${esc(c.name)} as ${c.role} — ${fmtM(c.salary)} a year.`,"signing");
  return {ok:true,msg:`${c.name} takes the ${c.role} job.`};
}
/* AI clubs churn their staff after bad years, and fill anything the user vacated */
function aiStaffChurn(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;   // your staff is yours to choose
    for(const role of ["HC","OC","DC","SD"]){
      const c=t.staff[role];
      const bad = winPct(t)<0.34 && chance(0.55);
      const poached = c && chance(0.05);
      if(c && !bad && !poached) continue;
      if(c){ t.cash-=buyoutCost(c); delete t.staff[role]; }
      const pool=S.staffMarket.filter(x=>x.role===role)
        .sort((a,b)=>coachOverall(b)-coachOverall(a)+(rnd()-0.5)*8);
      // clubs don't strip the market bare — there is always someone left for you to hire
      const want=pool.length>2 ? (pool.find(x=>x.asking<t.cash*0.25)||pool[0]) : null;
      if(want){ want.salary=want.asking; t.staff[role]=want;
        S.staffMarket=S.staffMarket.filter(x=>x.id!==want.id); }
      else t.staff[role]=makeCoach(role);
    }
  }
}

/* ---------- the trade market ---------- */
function assetLabel(a){
  if(a.type==="pick"){
    const own = a.orig===a.holder;
    return `${a.year} round ${a.round}${own?"":` <span class="dim small">(${S.teams[a.orig].abbr})</span>`}`;
  }
  const p=S.players[a.pid];
  return `${posTag(p.pos)} ${esc(p.l)} <span class="dim small">${p.ovr} ovr · ${p.age}</span>`;
}
function assetValue(a){
  if(a.type!=="pick") return playerTradeValue(S.players[a.pid]);
  const out=Math.max(0,a.year-S.year);
  return pickValue(a.round,projectedSlot(a))*Math.pow(0.87,out);  // jam tomorrow is worth less
}
function projectedSlot(a){
  const t=S.teams[a.orig];
  if(!t) return 16;
  const order=S.teams.slice().sort((x,y)=>winPct(x)-winPct(y));
  const now=clamp(order.findIndex(x=>x.id===t.id)+1,1,32);
  // the further out you look, the more everyone resembles a .500 club
  const out=Math.max(0,a.year-S.year);
  const regress=clamp(out*0.40,0,0.85);
  return clamp(Math.round(now*(1-regress)+16.5*regress),1,32);
}
function teamAssets(t){
  ensureOps(t);
  const players=t.roster.map(id=>S.players[id]).filter(Boolean)
    .sort((a,b)=>playerTradeValue(b)-playerTradeValue(a))
    .map(p=>({type:"player",pid:p.id,holder:t.id}));
  const picks=t.picks.slice().sort((a,b)=>a.year-b.year||a.round-b.round)
    .map(pk=>({type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id}));
  return {players,picks};
}
function assetKey(a){
  return a.type==="pick" ? `k:${a.year}:${a.round}:${a.orig}` : `p:${a.pid}`;
}
function tradeVerdict(partner, theyGive, theyGet){
  const g=sum(theyGive.map(assetValue)), r=sum(theyGet.map(assetValue));
  const bar = 1.05 + partner.ai.aggression*0.10;
  // clubs pay a premium for a position they're desperate at
  let needBump=0;
  for(const a of theyGet) if(a.type==="player"){
    const p=S.players[a.pid];
    needBump += clamp(needScore(partner,p.pos),0,60)/60 * playerTradeValue(p)*0.16;
  }
  const effective=r+needBump;
  return {give:g, get:r, need:Math.round(needBump), accept: effective >= g*bar,
          margin: g>0 ? effective/g : (effective>0?9:1)};
}
function tradeLegal(a,b,aGive,bGive){
  // rosters and the cap both have to survive it
  const aRoster=a.roster.length-aGive.filter(x=>x.type==="player").length+bGive.filter(x=>x.type==="player").length;
  const bRoster=b.roster.length-bGive.filter(x=>x.type==="player").length+aGive.filter(x=>x.type==="player").length;
  if(aRoster>ROSTER_MAX+6||bRoster>ROSTER_MAX+6) return "That leaves someone with too many bodies.";
  const salIn =sum(bGive.filter(x=>x.type==="player").map(x=>S.players[x.pid].contract?S.players[x.pid].contract.apy:0));
  const salOut=sum(aGive.filter(x=>x.type==="player").map(x=>S.players[x.pid].contract?S.players[x.pid].contract.apy:0));
  if(capSpace(a)-salIn+salOut<0) return "You can't fit those contracts under the cap.";
  if(capSpace(b)+salIn-salOut<0) return "They can't fit those contracts under their cap.";
  return null;
}
function executeTrade(a,b,aGive,bGive){
  if(typeof tradesOpen==="function"&&!tradesOpen()) return false;
  if(tradeLegal(a,b,aGive,bGive)) return false;   // the cap and the roster limits bind everyone
  const move=(from,to,assets)=>{
    for(const x of assets){
      if(x.type==="player"){
        const p=S.players[x.pid];
        from.roster=from.roster.filter(id=>id!==p.id);
        from.ir=(from.ir||[]).filter(id=>id!==p.id);
        from.ps=(from.ps||[]).filter(id=>id!==p.id);
        p.onIR=false; p.onPS=false;
        addToTeam(p,to);
      } else {
        const i=from.picks.findIndex(pk=>pk.year===x.year&&pk.round===x.round&&pk.orig===x.orig);
        if(i>=0){ const pk=from.picks.splice(i,1)[0]; to.picks.push(pk); }
      }
    }
  };
  move(a,b,aGive); move(b,a,bGive);
  autoDepth(a); autoDepth(b);
  const desc=(assets)=>assets.map(x=>x.type==="player"
    ? `${S.players[x.pid].pos} ${S.players[x.pid].l}` : `${x.year} R${x.round}`).join(", ");
  news(`Trade with ${b.city}: out ${desc(aGive)||"nothing"} — in ${desc(bGive)||"nothing"}.`,"trade");
}

/* AI clubs come to you when they want something badly enough */
function aiTradeApproach(){
  const u=S.teams[S.userTeam];
  if(!u.roster.length) return;
  const targets=u.roster.map(id=>S.players[id])
    .filter(p=>p.ovr>=76 && p.age<=30).sort((a,b)=>playerTradeValue(b)-playerTradeValue(a)).slice(0,8);
  if(!targets.length) return;
  for(let attempt=0;attempt<3;attempt++){
    const p=pick(targets);
    const suitors=S.teams.filter(t=>t.id!==u.id && needScore(t,p.pos)>34 && t.ai.winNow>0.5);
    if(!suitors.length) continue;
    const t=pick(suitors);
    const want=playerTradeValue(p)*(1.08+t.ai.aggression*0.18);
    const cand=t.picks.filter(pk=>pk.year<=S.year+2)
      .map(pk=>({a:{type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id},v:pickValue(pk.round,16)}))
      .sort((x,y)=>y.v-x.v);
    const give=[]; let acc=0;
    for(const c of cand){ if(acc>=want) break; give.push(c.a); acc+=c.v; }
    if(acc<want*0.9||!give.length) continue;
    S.tradeInbox=(S.tradeInbox||[]).filter(o=>S.year-o.year<1).slice(-2);
    S.tradeInbox.push({team:t.id, want:[{type:"player",pid:p.id,holder:u.id}], give,
                       year:S.year, txt:`${t.city} want ${p.pos} ${p.l}.`});
    news(`${t.city} called about ${p.pos} ${p.l}. There's an offer on your desk.`,"trade",p.id);
    return;
  }
}

/* ---------- the long memory of a draft board ---------- */
function recordTapeWatch(){
  // every prospect we put real hours into but did not draft
  const u=S.teams[S.userTeam];
  const list=[];
  for(const id in S.scout){
    const r=S.scout[id], p=S.players[id];
    if(!p||!p.draft||r.k<12) continue;
    if(p.draft.pickedBy===u.id) continue;
    if(p.draft.pickedBy===undefined||p.draft.pickedBy===null) continue;
    list.push({pid:+id, year:S.year, k:Math.round(r.k),
               est:Math.round(p.draft.userEst!==undefined?p.draft.userEst:p.draft.consensus),
               cons:Math.round(p.draft.consensus),
               at:p.draft.pickedAt, by:p.draft.pickedBy});
  }
  S.tapeWatch=(S.tapeWatch||[]).concat(list).slice(-900);
}
function tapeRetrospective(){
  const now=S.year;
  const due=(S.tapeWatch||[]).filter(x=>now-x.year===3);
  const hits=[], misses=[];
  for(const x of due){
    const p=S.players[x.pid];
    if(!p||p.retired) continue;
    // he is a real player now, and our board had him below what was knowable at the time
    if(p.ovr>=80 && (x.est<=x.cons-3 || (x.at>=40 && x.est<=x.cons+1))) hits.push({x,p});
    if(p.ovr<=66 && x.est>=x.cons+5) misses.push({x,p});
  }
  hits.sort((a,b)=>b.p.ovr-a.p.ovr);
  for(const h of hits.slice(0,2)){
    const club=S.teams[h.x.by];
    const weGotItWrong = h.p.ovr - h.x.est >= 6;
    const wentLate = h.x.at>=60;
    news(weGotItWrong
      ? `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `He went ${ordinal(h.x.at)}. We had ${h.x.k} hours of tape on him and wrote him up as a ${h.x.est}. ` +
        `The tape was there and we read it wrong.`
      : wentLate
      ? `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `Our board had him at ${h.x.est} — we were right about him — and we sat there while he went ` +
        `${ordinal(h.x.at)} to somebody else.`
      : `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `We put ${h.x.k} hours into him, graded him ${h.x.est}, and never called his name.`,
      "loss", h.p.id);
  }
  for(const m of misses.slice(0,1)){
    news(`${m.p.pos} ${m.p.f} ${m.p.l} — the one our board loved at ${m.x.est} — is a ${m.p.ovr} ` +
         `three years in, and the league had him lower than we did the whole time. ` +
         `Somebody filed a report we nearly spent a pick on.`, "info", m.p.id);
  }
  S.tapeWatch=(S.tapeWatch||[]).filter(x=>now-x.year<4);
}

/* ---------- shopping a player around the league ---------- */
function clubInterest(t,p){
  const need=needScore(t,p.pos);
  const upgrade=clamp(p.ovr-unitRating(t,p.pos),-25,32);
  const money=p.contract? p.contract.apy/1e6*0.30 : 0;
  const room=capSpace(t)/1e6*0.06;
  return Math.round(need*0.50 + upgrade*1.6 + t.ai.winNow*20
    + (p.age<=27?9:p.age>=31?-10:0) + room - money);
}
function spareAssets(t,ceiling){
  // picks they'd part with, plus men they are genuinely deep at
  const picks=t.picks.filter(pk=>pk.year<=S.year+3)
    .map(pk=>{const a={type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id};
              return {a, v:assetValue(a)};});
  const players=t.roster.map(id=>S.players[id]).filter(Boolean)
    .filter(x=>{
      const depth=t.roster.map(id=>S.players[id]).filter(y=>y.pos===x.pos).sort((a,b)=>b.ovr-a.ovr);
      const slot=depth.findIndex(y=>y.id===x.id);
      return slot>=(ROSTER_NEED[x.pos]||1) || x.ovr<62;   // a backup or a body
    })
    .map(x=>({a:{type:"player",pid:x.id,holder:t.id}, v:playerTradeValue(x)}));
  return picks.concat(players).filter(c=>c.v<=ceiling).sort((a,b)=>b.v-a.v);
}
function buildOfferFor(t,p){
  const val=playerTradeValue(p);
  const interest=clubInterest(t,p);
  if(interest<14) return null;
  const budget=val*(0.72+t.ai.aggression*0.30)*(1+clamp(interest,0,90)/230);
  const pool=spareAssets(t,budget*1.35);
  if(!pool.length) return null;
  // clubs don't all reach for the same package — some lead with picks, some move bodies
  const bodyFirst = t.ai.winNow<0.45 || t.picks.length<5 || chance(0.30);
  let best=null;
  for(let attempt=0;attempt<5;attempt++){
    const order=pool.slice().sort((a,b)=>{
      const bias=x=>(bodyFirst&&x.a.type==="player"?1.18:1)*(attempt?rf(0.80,1.25):1);
      return b.v*bias(b)-a.v*bias(a);
    });
    const give=[]; let acc=0;
    for(const c of order){
      if(acc>=budget*0.96) break;
      if(give.length>=4) break;
      if(acc+c.v>budget*1.10) continue;
      give.push(c.a); acc+=c.v;
    }
    if(!give.length) continue;
    if(!best||Math.abs(acc-budget)<Math.abs(best.acc-budget)) best={give,acc};
  }
  if(!best||best.acc<val*0.80) return null;
  const give=best.give, acc=best.acc;
  // the deal has to be legal on both sides
  const u=S.teams[S.userTeam];
  const mine=[{type:"player",pid:p.id,holder:u.id}];
  if(tradeLegal(u,t,mine,give)) return null;
  return {team:t.id, give, value:Math.round(acc), interest,
          keen: acc>=val*1.14 ? "aggressive" : acc>=val*0.95 ? "fair" : "lowball"};
}
function solicitOffers(pid){
  const p=S.players[pid];
  const out=[];
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    const o=buildOfferFor(t,p);
    if(o) out.push(o);
  }
  out.sort((a,b)=>b.value-a.value);
  return out.slice(0,6);
}
function shopSheet(pid){
  const p=S.players[pid];
  const list=(S.shopOffers&&S.shopOffers.pid===pid)?S.shopOffers.list:[];
  const val=playerTradeValue(p);
  const body = !list.length

    : list.map((o,i)=>{
        const t=S.teams[o.team];

        return `<div class="panel"><div class="pb">
          <div class="row spread"><b>${esc(t.city)} ${esc(t.name)}</b>
            <span class="tag ${tone}">${o.keen}</span></div>
          <div class="dim small">${t.w}-${t.l} · ${fmtM(capSpace(t))} of room</div>
          <div style="margin:6px 0">${o.give.map(a=>`<div class="small">${assetLabel(a)}</div>`).join("")}</div>
          <p class="tiny dim">${o.keen==="aggressive"?"They're reaching for him."
            :o.keen==="fair"?"About what he's worth."
            :"Less than he's worth, and they know it."}</p>
          <div class="row">
            <button class="btn primary" data-act="shopaccept" data-arg="${pid}" data-arg2="${i}">Accept</button>
            <button class="btn" data-act="shopnegotiate" data-arg="${pid}" data-arg2="${i}">Take it to the table</button>
          </div></div></div>`;
      }).join("");
  return `<div class="sh"><div><b>Shopping ${esc(p.f)} ${esc(p.l)}</b>
      <div class="dim small">${p.pos} · ${p.ovr} ovr · ${p.age} · ${p.contract?fmtM(p.contract.apy)+" × "+p.contract.left:"no deal"}</div></div>
    <button class="x" data-act="closesheet">×</button></div>
    <div class="sb stack">
      <p class="small dim">${list.length?`${list.length} club${list.length>1?"s":""} came back.`:"Calls made. "}
        Offers move with the standings — a club that's winning in November will pay more than it would in August.</p>
      ${body}
    </div>`;
}

   Module 10: the things that make a roster feel like people —
   traits, morale, scheme, an owner with a temper, and a record book
