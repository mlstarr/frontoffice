/* ---------- pressure composition calibration ---------- */
async function pressureCompositionCalibration(nGames=24, budgetMs=12000){
  const requestedGames=nGames*9;
  calibrationStart(requestedGames,budgetMs);
  if(!S||!S.teams||S.teams.length<2) throw new Error("League is not ready");
  const base=JSON.parse(JSON.stringify(S));
  const calls=["base","simPressure","blitz","runBlitz","slotBlitz","pressMan","cover2","cover3","quarters"];
  const rows=[];
  for(const call of calls){
    for(let i=0;i<nGames;i++){
      if(calibrationShouldStop()) break;
      S=structuredClone(base);
      CALIBRATION_DEF_CALL=call;
      // Paired calibration: every defensive call gets the same baseline seed
      // for a given game index. This reduces noise from different offensive
      // personnel/play distributions when comparing calls.
      RNG=mulberry32(0xB17A5 + i*7919);
      const g={home:0,away:1,week:1};
      simGame(g,true);
      const plays=(g.gamebook&&g.gamebook.plays)||[];
      const r={call,passAtt:0,comp:0,passYds:0,runAtt:0,runYds:0,sacks:0,hurries:0,hits:0,ints:0,pressSnaps:0,shotAtt:0,shotYds:0,explosivePass:0,explosiveRun:0};
      for(const p of plays){
        if(p.def!==1) continue;
        if(p.kind==="pass"){
          r.passAtt += p.passResult?.attempted?1:0;
          r.comp += p.passResult?.completion?1:0;
          if(p.passResult?.completion) r.passYds += Number(p.gain)||0;
          if(p.sack){ r.sacks++; continue; }
          if(p.passResult?.interception) r.ints++;
          if(p.playType==="shot"||p.playType==="playAction") { r.shotAtt++; if(p.passResult?.completion) r.shotYds += Number(p.gain)||0; }
          if((p.passResult?.completion) && Number(p.gain)>=20){ r.explosivePass++; }
        } else if(p.kind==="run"){
          r.runAtt++; r.runYds += Number(p.gain)||0;
          if(Number(p.gain)>=15) r.explosiveRun++;
        }
      }
      // The game audit tracks actual pressure events attributed to defenders.
      const stAll=[];
      for(const tm of S.teams||[]) for(const p of (tm.roster||[])) stAll.push(p);
      // Only count pressure generated by the defending team (team 1 in this
      // two-team calibration), and read the simulator's actual `stats` store.
      // Team rosters store player IDs; resolve those IDs through S.players.
      // Reading S.teams[1].roster directly therefore returns strings, not the
      // player stat objects, which previously made hurries/hits/pressSnaps
      // appear as zero in this calibration despite the game engine recording
      // them correctly.
      for(const pid of (S.teams[1]?.roster||[])){
        const p=S.players?.[pid];
        if(!p) continue;
        r.pressSnaps += Number(p.stats?.pressSnaps||0);
        r.hurries += Number(p.stats?.hrry||0);
        // The engine records a QB hit on a sack as well. Keep pressure
        // components mutually exclusive so sacks are not double-counted.
        r.hits += Number(p.stats?.qbHit||0);
      }
      // Sacks are already counted in r.sacks, and the player stat store also
      // counts the QB hit that accompanies a sack. Remove those sack-hits so
      // pressure components remain mutually exclusive.
      r.hits=Math.max(0,r.hits-r.sacks);
      rows.push(r);
      CALIBRATION_RUNTIME.completed++;
      calibrationProgress(`Pressure composition: ${call}`);
      await calibrationYield();
    }
    if(calibrationShouldStop()) break;
  }
  const agg=call=>{
    const a=rows.filter(x=>x.call===call), sum=k=>a.reduce((z,x)=>z+x[k],0);
    const pa=sum("passAtt");
    return {games:a.length,passAtt:pa,cmpPct:pa?100*sum("comp")/pa:0,ypa:pa?sum("passYds")/pa:0,
      runAtt:sum("runAtt"),ypc:sum("runAtt")?sum("runYds")/sum("runAtt"):0,
      sacks:sum("sacks"),sackRate:pa?100*sum("sacks")/pa:0,
      hurries:sum("hurries"),hits:sum("hits"),pressSnaps:sum("pressSnaps"),
      pressureRate:sum("pressSnaps")?100*(sum("hurries")+sum("hits")+sum("sacks"))/sum("pressSnaps"):0,
      hurryRate:sum("pressSnaps")?100*sum("hurries")/sum("pressSnaps"):0,
      hitRate:sum("pressSnaps")?100*sum("hits")/sum("pressSnaps"):0,
      pressureToSackRate:(sum("hurries")+sum("hits")+sum("sacks"))?100*sum("sacks")/(sum("hurries")+sum("hits")+sum("sacks")):0,
      pressureToHurryRate:(sum("hurries")+sum("hits")+sum("sacks"))?100*sum("hurries")/(sum("hurries")+sum("hits")+sum("sacks")):0,
      pressureToHitRate:(sum("hurries")+sum("hits")+sum("sacks"))?100*sum("hits")/(sum("hurries")+sum("hits")+sum("sacks")):0,
      intRate:pa?100*sum("ints")/pa:0,shotYds:sum("shotAtt")?sum("shotYds")/sum("shotAtt"):0,
      explosivePass:sum("explosivePass"),explosiveRun:sum("explosiveRun")};
  };
  const result={version:7,gamesPerCall:nGames,pairedSeeds:true,pressureEventsMutuallyExclusive:true,coverageModifiersSignFixed:true,calls:{},runtime:calibrationResultMeta()};
  for(const call of calls) result.calls[call]=agg(call);
  S=base; CALIBRATION_DEF_CALL=null; RNG=mulberry32(12345);
  return result;
}

/* ---------- offensive tendency / play-action calibration ---------- */
async function tendencyCalibration(nGames=30,budgetMs=12000){
  const scenarios=[
    {key:"balanced",pass:.545},
    {key:"passHeavy",pass:.68},
    {key:"runHeavy",pass:.44}
  ];
  calibrationStart(nGames*scenarios.length,budgetMs);
  if(!S||!S.teams||S.teams.length<2) throw new Error("League is not ready");
  const base=JSON.parse(JSON.stringify(S)), rows=[];
  for(const sc of scenarios){
    for(let i=0;i<nGames;i++){
      if(calibrationShouldStop()) break;
      S=structuredClone(base); CALIBRATION_OFF_TENDENCY=sc;
      RNG=mulberry32(0x71000 + scenarios.indexOf(sc)*0x100000 + i*7919);
      const g={home:0,away:1,week:1}; simGame(g,true);
      const plays=(g.gamebook&&g.gamebook.plays)||[];
      const r={scenario:sc.key,plays:0,passAtt:0,passYds:0,comp:0,runAtt:0,runYds:0,paAtt:0,paYds:0,nonPaAtt:0,nonPaYds:0,paAfterRunAtt:0,paAfterRunYds:0,drawAtt:0,drawYds:0,drawAfterPassAtt:0,drawAfterPassYds:0,pressures:0,defPressureCalls:0,defPassRate:0,explosivePass:0};
      let priorPasses=0,priorRuns=0,priorPassStreak=0,priorRunStreak=0;
      for(const p of plays){
        r.plays++;
        const hadRunSetup=(priorRunStreak>=1 || priorRuns>priorPasses);
        const hadPassSetup=(priorPassStreak>=1 || priorPasses>priorRuns);
        if(p.kind==="pass"){
          if(p.passResult?.attempted) r.passAtt++;
          if(p.passResult?.completion) r.comp++;
          if(p.passResult?.completion) r.passYds+=Number(p.gain)||0;
          if(p.passResult?.attempted){
            if(p.playType==="playAction"){
              r.paAtt++;
              if(p.passResult?.completion) r.paYds+=Number(p.gain)||0;
              if(hadRunSetup){
                r.paAfterRunAtt++;
                if(p.passResult?.completion) r.paAfterRunYds+=Number(p.gain)||0;
              }
            } else {
              r.nonPaAtt++;
              if(p.passResult?.completion) r.nonPaYds+=Number(p.gain)||0;
            }
          }
          if(p.passResult?.completion && Number(p.gain)>=20) r.explosivePass++;
        } else if(p.kind==="run"){
          r.runAtt++; r.runYds+=Number(p.gain)||0;
          if(p.playType==="draw"){
            r.drawAtt++; r.drawYds+=Number(p.gain)||0;
            if(hadPassSetup){ r.drawAfterPassAtt++; r.drawAfterPassYds+=Number(p.gain)||0; }
          }
        }
        if(p.kind==="pass" && p.passResult?.attempted){ priorPasses++; priorPassStreak++; priorRunStreak=0; }
        else if(p.kind==="run"){ priorRuns++; priorRunStreak++; priorPassStreak=0; }
      }
      const audit=g.audit?.calls||{};
      r.defPressureCalls=(audit.defSimPressure||0)+(audit.defBlitz||0)+(audit.defRunBlitz||0)+(audit.defSlotBlitz||0);
      r.defPassRate=r.plays?100*r.defPressureCalls/r.plays:0;
      rows.push(r); CALIBRATION_RUNTIME.completed++; calibrationProgress(`Tendency: ${sc.key}`); await calibrationYield();
    }
    if(calibrationShouldStop()) break;
  }
  const agg=key=>{const a=rows.filter(x=>x.scenario===key),sum=k=>a.reduce((z,x)=>z+x[k],0),pa=sum("passAtt"),ra=sum("runAtt"),pA=sum("paAtt"),dA=sum("drawAtt");const npa=sum("nonPaAtt"), paRun=sum("paAfterRunAtt"), dP=sum("drawAfterPassAtt"); return {games:a.length,plays:sum("plays"),passAtt:pa,runAtt:ra,passRate:(pa+ra)?100*pa/(pa+ra):0,cmpPct:pa?100*sum("comp")/pa:0,ypa:pa?sum("passYds")/pa:0,nonPlayActionYPA:npa?sum("nonPaYds")/npa:0,ypc:ra?sum("runYds")/ra:0,playActionRate:pa?100*pA/pa:0,playActionYPA:pA?sum("paYds")/pA:0,playActionAfterRunRate:pA?100*paRun/pA:0,playActionAfterRunYPA:paRun?sum("paAfterRunYds")/paRun:0,drawRate:ra?100*dA/ra:0,drawYPC:dA?sum("drawYds")/dA:0,drawAfterPassRate:dA?100*dP/dA:0,drawAfterPassYPC:dP?sum("drawAfterPassYds")/dP:0,defPressureCallRate:sum("plays")?100*sum("defPressureCalls")/sum("plays"):0,explosivePass:sum("explosivePass")};};
  const out={version:3,gamesPerScenario:nGames,scenarios:{},hypothesis:{leaguePassYPA:"around 6.5 over all pass attempts",playAction:"should materially outperform non-play-action when run tendency creates credible deception",draw:"should gain efficiency after pass-heavy sequences",adaptation:"pass-heavy offenses should face more pressure/coverage response",paContext:true,drawContext:true,nonPaVsPa:true,drawCounterToPassTendency:true},runtime:calibrationResultMeta()};
  for(const sc of scenarios) out.scenarios[sc.key]=agg(sc.key);

}

  const agg=key=>{const a=rows.filter(x=>x.profile===key),sum=k=>a.reduce((z,x)=>z+x[k],0),pa=sum("passAtt"),ra=sum("runAtt"),pA=sum("paAtt"),dA=sum("drawAtt"),npa=sum("nonPaAtt"),paRun=sum("paAfterRunAtt"),dP=sum("drawAfterPassAtt");return {games:a.length,rbOvr:a.length?avg(a.map(x=>x.rbOvr)):0,passAtt:pa,runAtt:ra,passRate:(pa+ra)?100*pa/(pa+ra):0,cmpPct:pa?100*sum("comp")/pa:0,ypa:pa?sum("passYds")/pa:0,nonPlayActionYPA:npa?sum("nonPaYds")/npa:0,ypc:ra?sum("runYds")/ra:0,playActionRate:pa?100*pA/pa:0,playActionYPA:pA?sum("paYds")/pA:0,playActionAfterRunRate:pA?100*paRun/pA:0,playActionAfterRunYPA:paRun?sum("paAfterRunYds")/paRun:0,drawRate:ra?100*dA/ra:0,drawYPC:dA?sum("drawYds")/dA:0,drawAfterPassRate:dA?100*dP/dA:0,drawAfterPassYPC:dP?sum("drawAfterPassYds")/dP:0};};
  const out={version:1,pairs:nPairs,pairedSeeds:true,currentRBOnly:true,scenarios:{},hypothesis:{paRBThreat:"current RB rushing quality should affect PA credibility/effectiveness",drawReceivingThreat:"current RB receiving quality should affect draw efficiency after pass tendency",rotationAverage:false},runtime:calibrationResultMeta()};
  for(const p of profiles) out.scenarios[p.key]=agg(p.key); S=base;CALIBRATION_OFF_TENDENCY=null;RNG=mulberry32(12345);return out;
}

/* ---------- shell × pressure interaction calibration ---------- */
async function shellPressureCalibration(nPairs=12,budgetMs=12000){
  const calls=["base","blitz","runBlitz","slotBlitz"];
  calibrationStart(nPairs*calls.length*2,budgetMs);
  if(!S||!S.teams||S.teams.length<2) throw new Error("League is not ready");
  const base=JSON.parse(JSON.stringify(S));
  const rows=[];
  for(let pair=0;pair<nPairs;pair++){
    for(const call of calls){
      for(const shell of ["oneHigh","twoHigh"]){
        if(calibrationShouldStop()) break;
        S=structuredClone(base);
        S.teams[0].defShell="mixed"; S.teams[1].defShell=shell;
        assignDefensiveRoles(S.teams[1]);
        CALIBRATION_DEF_CALL=call;
        RNG=mulberry32(0xD5000 + pair*100003 + calls.indexOf(call)*7919 + (shell==="twoHigh"?1:0));
        const g={home:0,away:1,week:1}; simGame(g,true);
        const plays=(g.gamebook&&g.gamebook.plays)||[];
        const r={call,shell,passAtt:0,comp:0,passYds:0,runAtt:0,runYds:0,sacks:0,ints:0,shots:0,shotYds:0,explosivePass:0,explosiveRun:0};
        for(const p of plays){
          if(p.def!==1) continue;
          if(p.kind==="pass"){
            r.passAtt+=p.passResult?.attempted?1:0;
            r.comp+=p.passResult?.completion?1:0;
            if(p.passResult?.completion) r.passYds+=Number(p.gain)||0;
            if(p.playType==="shot"||p.playType==="playAction"){
              r.shots++; if(p.passResult?.completion) r.shotYds+=Number(p.gain)||0;
            }
            if(p.sack) r.sacks++;
            if(p.passResult?.interception) r.ints++;
            if(p.passResult?.completion && Number(p.gain)>=20) r.explosivePass++;
          } else if(p.kind==="run"){
            r.runAtt++; r.runYds+=Number(p.gain)||0;
            if(Number(p.gain)>=15) r.explosiveRun++;
          }
        }
        rows.push(r); CALIBRATION_RUNTIME.completed++; calibrationProgress(`${shell} + ${call}`); await calibrationYield();
      }
      if(calibrationShouldStop()) break;
    }
    if(calibrationShouldStop()) break;
  }
  const agg=(call,shell)=>{
    const a=rows.filter(x=>x.call===call&&x.shell===shell), sum=k=>a.reduce((z,x)=>z+x[k],0), pa=sum("passAtt"),ra=sum("runAtt");
    return {games:a.length,cmpPct:pa?100*sum("comp")/pa:0,ypa:pa?sum("passYds")/pa:0,ypc:ra?sum("runYds")/ra:0,sackRate:pa?100*sum("sacks")/pa:0,intRate:pa?100*sum("ints")/pa:0,shotYds:sum("shots")?sum("shotYds")/sum("shots"):0,explosivePass:sum("explosivePass"),explosiveRun:sum("explosiveRun")};
  };
  const out={version:1,pairs:nPairs,calls:{},runtime:calibrationResultMeta()};
  for(const call of calls){
    const one=agg(call,"oneHigh"),two=agg(call,"twoHigh");
    out.calls[call]={oneHigh:one,twoHigh:two,delta:{ypc:one.ypc-two.ypc,shotYds:one.shotYds-two.shotYds,sackRate:one.sackRate-two.sackRate,intRate:one.intRate-two.intRate}};
  }
  S=base; CALIBRATION_DEF_CALL=null; RNG=mulberry32(12345); return out;
}

/* ---------- defensive shell calibration ---------- */
/*
 * Runs paired games from the same baseline state and RNG seed. The only
 * intentional structural change is the defense's one-high/two-high shell.
 * Metrics are taken from the gamebook, not imposed on the result.
 */
async function shellCalibration(nPairs=40, budgetMs=12000){
  calibrationStart(nPairs*2,budgetMs);
  if(!S||!S.teams||S.teams.length<2) throw new Error("League is not ready");
  const base=JSON.parse(JSON.stringify(S));
  const games=[];
  const matchupCount=Math.min(16,Math.floor(S.teams.length/2));
  for(let pair=0;pair<nPairs;pair++){
    const a=(pair*2)%S.teams.length;
    const b=(a+1)%S.teams.length;
    const seed=0x51E11 + pair*7919;
    for(const shell of ["oneHigh","twoHigh"]){
      if(calibrationShouldStop()) break;
      S=structuredClone(base);
      S.teams[a].defShell="mixed"; S.teams[b].defShell=shell;
      RNG=mulberry32(seed);
      const g={home:a,away:b,week:1};
      simGame(g,true);
      if(((pair*2)+(shell==="twoHigh"?1:0))%4===3) await new Promise(r=>setTimeout(r,0));
      const plays=(g.gamebook&&g.gamebook.plays)||[];
      const row={shell,offense:a,defense:b,passAtt:0,comp:0,passYds:0,runAtt:0,runYds:0,
        shots:0,shotYds:0,deepCompletions:0,sacks:0,ints:0};
      for(const p of plays){
        if(p.def!==b) continue;
        if(p.kind==="pass"){
          row.passAtt += p.passResult?.attempted?1:0;
          row.comp += p.passResult?.completion?1:0;
          if(p.passResult?.completion) row.passYds += Number(p.gain)||0;
          if(p.playType==="shot"||p.playType==="playAction"){
            row.shots++;
            if(p.passResult?.completion){ row.shotYds += Number(p.gain)||0; row.deepCompletions++; }
          }
          if(p.sack) row.sacks++;
          if(p.passResult?.interception) row.ints++;
        } else if(p.kind==="run"){
          row.runAtt++;
          row.runYds += Number(p.gain)||0;
        }
      }
      games.push(row);
      CALIBRATION_RUNTIME.completed++;
      calibrationProgress(`Shell calibration: ${shell}`);
      await calibrationYield();
    }
    if(calibrationShouldStop()) break;
  }
  const agg=(shell)=>{
    const r=games.filter(x=>x.shell===shell);
    const sumk=k=>r.reduce((s,x)=>s+x[k],0);
    const n=r.length||1;
    return {
      games:r.length,
      passAtt:sumk("passAtt"),
      comp:sumk("comp"),
      cmpPct:sumk("passAtt")?100*sumk("comp")/sumk("passAtt"):0,
      passYds:sumk("passYds"),
      ypa:sumk("passAtt")?sumk("passYds")/sumk("passAtt"):0,
      runAtt:sumk("runAtt"),
      runYds:sumk("runYds"),
      ypc:sumk("runAtt")?sumk("runYds")/sumk("runAtt"):0,
      shots:sumk("shots"),
      shotYds:sumk("shots")?sumk("shotYds")/sumk("shots"):0,
      sacks:sumk("sacks"),
      sackRate:sumk("passAtt")?100*sumk("sacks")/sumk("passAtt"):0,
      ints:sumk("ints"),
      intRate:sumk("passAtt")?100*sumk("ints")/sumk("passAtt"):0
    };
  };
  const one=agg("oneHigh"), two=agg("twoHigh");
  const delta={};
  for(const k of ["cmpPct","ypa","ypc","shotYds","sackRate","intRate"])
    delta[k]=one[k]-two[k];
  const result={
    version:2,pairs:nPairs,runtime:calibrationResultMeta(),
    hypothesis:{
      runSupport:"oneHigh should reduce opponent rushing efficiency relative to twoHigh",
      deepPass:"oneHigh should allow more efficient deep passing than twoHigh"
    },
    oneHigh:one,twoHigh:two,delta,
    verdict:{
      runSupportObserved:one.ypc<two.ypc,
      deepPassObserved:one.shotYds>two.shotYds,
      bothTradeoffsObserved:one.ypc<two.ypc && one.shotYds>two.shotYds
    }
  };
  S=base; RNG=mulberry32(12345);
  return result;
}

/* Paired shell test across two distinct offensive identities.  The offense
 * stays fixed within each one-high/two-high pair; only the defensive shell
 * changes.  This checks that the shell tradeoff survives different play-call
 * environments rather than appearing only in the league-average matchup. */
async function archetypeShellCalibration(nPairs=20, budgetMs=12000){
  calibrationStart(nPairs*4,budgetMs);
  if(!S||!S.teams||S.teams.length<2) throw new Error("League is not ready");
  const base=JSON.parse(JSON.stringify(S));
  const profiles=[
    {key:"powerRun",label:"Power/ground-heavy",scheme:"power"},
    {key:"airRaid",label:"Air-raid/vertical",scheme:"airraid"}
  ];
  const rows=[];
  for(const profile of profiles){
    for(let pair=0;pair<nPairs;pair++){
      const seed=0xA1100 + profiles.indexOf(profile)*0x100000 + pair*7919;
      for(const shell of ["oneHigh","twoHigh"]){
        if(calibrationShouldStop()) break;
        S=structuredClone(base);
        S.teams[0].staff=S.teams[0].staff||{};
        S.teams[0].staff.OC=S.teams[0].staff.OC||{};
        S.teams[0].staff.OC.scheme=profile.scheme;
        S.teams[1].staff=S.teams[1].staff||{};
        S.teams[1].defShell=shell;
        RNG=mulberry32(seed);
        const g={home:0,away:1,week:1};
        simGame(g,true);
        if(((pair*2)+(shell==="twoHigh"?1:0))%4===3) await new Promise(r=>setTimeout(r,0));
        const plays=(g.gamebook&&g.gamebook.plays)||[];
        const r={profile:profile.key,label:profile.label,shell,passAtt:0,comp:0,passYds:0,runAtt:0,runYds:0,shots:0,shotYds:0,sacks:0,ints:0};
        for(const p of plays){
          if(p.def!==1) continue;
          if(p.kind==="pass"){
            r.passAtt += p.passResult?.attempted?1:0;
            r.comp += p.passResult?.completion?1:0;
            if(p.passResult?.completion) r.passYds += Number(p.gain)||0;
            if(p.playType==="shot"||p.playType==="playAction"){
              r.shots++; if(p.passResult?.completion) r.shotYds += Number(p.gain)||0;
            }
            if(p.sack) r.sacks++; if(p.passResult?.interception) r.ints++;
          } else if(p.kind==="run"){ r.runAtt++; r.runYds += Number(p.gain)||0; }
        }
        rows.push(r);
        CALIBRATION_RUNTIME.completed++;
        calibrationProgress(`${profile.label}: ${shell}`);
        await calibrationYield();
      }
      if(calibrationShouldStop()) break;
    }
    if(calibrationShouldStop()) break;
  }
  const agg=(profile,shell)=>{
    const r=rows.filter(x=>x.profile===profile&&x.shell===shell);
    const sum=k=>r.reduce((a,x)=>a+x[k],0);
    return {games:r.length,passAtt:sum("passAtt"),cmpPct:sum("passAtt")?100*sum("comp")/sum("passAtt"):0,ypa:sum("passAtt")?sum("passYds")/sum("passAtt"):0,runAtt:sum("runAtt"),ypc:sum("runAtt")?sum("runYds")/sum("runAtt"):0,shots:sum("shots"),shotYds:sum("shots")?sum("shotYds")/sum("shots"):0,sackRate:sum("passAtt")?100*sum("sacks")/sum("passAtt"):0,intRate:sum("passAtt")?100*sum("ints")/sum("passAtt"):0};
  };
  const out={version:3,pairsPerProfile:nPairs,profiles:{},verdict:{},runtime:calibrationResultMeta()};
  for(const p of profiles){
    const one=agg(p.key,"oneHigh"),two=agg(p.key,"twoHigh");
    out.profiles[p.key]={label:p.label,oneHigh:one,twoHigh:two,delta:{ypc:one.ypc-two.ypc,shotYds:one.shotYds-two.shotYds,ypa:one.ypa-two.ypa}};
    out.verdict[p.key]={runSupportObserved:one.ypc<two.ypc,deepPassObserved:one.shotYds>two.shotYds,bothTradeoffsObserved:one.ypc<two.ypc&&one.shotYds>two.shotYds};
  }
  S=base; RNG=mulberry32(12345);
  return out;
}
