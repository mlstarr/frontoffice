  return `<div class="pb">
      <div class="row spread"><b>${esc(tier[1])}</b><span class="n"><b>${s}</b></span></div>
      <p class="tiny dim">${esc(tier[2])}</p>
      ${nextTier?`<div class="meter"><i class="green" style="width:${clamp(s/nextTier[0]*100,2,100)}%"></i></div>
        <p class="tiny dim">${nextTier[0]-s} more to reach ${esc(nextTier[1])}.</p>`:""}
    </div>
    <table><tbody>${rows.map(r=>`<tr><td class="small">${r[0]}</td>
      <td class="n">${r[1]}</td></tr>`).join("")}</tbody></table>
    ${c.champs?`<div class="pb"><p class="small">A championship is worth a thousand on its own.
      Nothing else in this table comes close.</p></div>`:
      `<div class="pb"><p class="tiny dim">Championships are weighted far above everything else here.
      A long career of nine-win seasons will not get you where one title does.</p></div>`}
    ${c.clubs.length>1?`<div class="ph"><h3>Clubs</h3></div>
      <table><tbody>${c.clubs.map(x=>`<tr><td class="small">${esc(x.club)}</td>
        <td class="n dim">${x.from}${x.to&&x.to!==x.from?"–"+x.to:""}</td></tr>`).join("")}</tbody></table>`:""}
    ${(S.relocations&&S.relocations.length)?`<div class="ph"><h3>Clubs that moved</h3></div>
      <table><tbody>${S.relocations.slice(-8).reverse().map(r=>`<tr><td class="small">${esc(r.from)}</td>
        <td class="small">→ ${esc(r.to)}</td><td class="n dim">${r.year}</td></tr>`).join("")}</tbody></table>`:""}`;
}
/* ============================================================
   Module 16: contracts with teeth, players with opinions,
   coaches with other offers, and a season that tells its story
   ============================================================ */

/* ---------- contract structure ----------
   A deal is no longer one flat number. Signing bonus is paid up front and
   prorated across the term; base salary is what you can actually get off
   the books. Cutting a man accelerates every unpaid dollar of bonus.     */
const PRORATE_MAX=5;
function contractHits(apy,years,bonusPct,floor){
  const total=apy*years;
  const bonus=Math.round(total*bonusPct);
  // signing bonus spreads over the deal, but never more than five years
  const spread=Math.min(years,PRORATE_MAX);
  const prorate=Math.round(bonus/spread);
  const low=floor||minSalary();
  const hits=[];
  for(let y=0;y<years;y++){
    const pr = y<spread ? prorate : 0;
    hits[y]={hit:Math.max(low,apy), prorate:pr, base:Math.max(0,apy-pr)};
  }
  return {bonus,prorate,hits};
}
/* the only safe way to change what a man is paid */
function setAPY(p,newApy){
  const c=p.contract; if(!c) return;
  const old=c.apy||1;
  const k=Math.max(minSalary(),Math.round(newApy))/old;
  c.apy=Math.max(minSalary(),Math.round(newApy));
  if(c.hits) for(const h of c.hits){
    h.hit=Math.max(minSalary(),Math.round(h.hit*k));
    h.prorate=Math.round(h.prorate*k);
    h.base=Math.max(0,h.hit-h.prorate);
  }
  c.bonus=Math.round((c.bonus||0)*k);
  c.prorate=Math.round((c.prorate||0)*k);
}
function yearIndex(p){
  if(!p.contract) return 0;
  return clamp(p.contract.years-p.contract.left,0,p.contract.years-1);
}
function capHit(p){
  if(!p.contract) return 0;
  const v=typeof vsbHit==="function"?vsbHit(p):null;
  if(v!==null) return v;
  const h=p.contract.hits;
  if(!h||!h.length) return p.contract.apy;
  return h[clamp(yearIndex(p),0,h.length-1)].hit;
}
/* what it costs to walk away today */
function deadMoney(p){
  if(!p.contract) return 0;
  const c=p.contract, h=c.hits;
  if(!h||!h.length) return Math.round(c.apy*(c.left>1?0.45:0.22));
  const i=yearIndex(p);
  let dead=0;
  for(let y=i;y<h.length;y++) dead+=h[y].prorate;            // all unpaid bonus accelerates
  if(c.gtdYears&&i<c.gtdYears) dead+=h[i].base;              // plus this year's guaranteed base
  return Math.round(dead);
}
function structureLabel(p){
  const c=p.contract;
  if(!c||!c.hits) return "";
  const pct=c.bonus?Math.round(c.bonus/(c.apy*c.years)*100):0;
  return `${fmtM(c.bonus||0)} bonus (${pct}%)`;
}
/* trading base salary today for a bigger bill later */
function canRestructure(p){
  const c=p.contract;
  return !!(c&&c.hits&&c.left>=2&&c.hits[yearIndex(p)].base>MIN_SALARY*2);
}
function restructure(p){
  if(!canRestructure(p)) return 0;
  const c=p.contract, i=yearIndex(p);
  const move=Math.round(c.hits[i].base*0.75/1e5)*1e5;
  const spread=Math.min(c.left,PRORATE_MAX);
  const per=Math.round(move/spread);
  c.hits[i].base-=move; c.hits[i].prorate+=per; c.hits[i].hit-=move-per;
  for(let y=i+1;y<Math.min(i+spread,c.hits.length);y++){
    c.hits[y].prorate+=per; c.hits[y].hit+=per;
  }
  c.bonus=(c.bonus||0)+move;
  c.restructured=(c.restructured||0)+1;
  return move-per;
}

/* ---------- holdouts and extensions ---------- */
function wantsNewDeal(p){
  if(!p.contract||p.teamId===null) return false;
  const under=marketAPY(p)-capHit(p);
  return p.contract.left<=2 && under>marketAPY(p)*0.22 && p.ovr>=74;
}
function holdoutRisk(p){
  if(!wantsNewDeal(p)) return 0;
  const under=(marketAPY(p)-capHit(p))/Math.max(1e6,marketAPY(p));
  let r=clamp(under*0.55+(66-moraleOf(p))/150,0,0.75);
  if(hasTrait(p,"diva")) r+=0.18;
  if(hasTrait(p,"leader")) r-=0.10;
  if(hasTrait(p,"motor")) r-=0.05;
  return clamp(r,0,0.85);
}
function runHoldouts(){
  const t=S.teams[S.userTeam];
  S.holdouts=[];
  for(const id of t.roster){
    const p=S.players[id];
    if(!p||!chance(holdoutRisk(p))) continue;
    p.holdout=true;
    S.holdouts.push(p.id);
    news(`${p.pos} ${p.l} is not reporting. He wants his contract addressed.`,"loss",p.id);
  }
  // AI clubs simply pay their men or lose them; no theatre required
  for(const club of S.teams){
    if(club.id===S.userTeam) continue;
    for(const id of club.roster){
      const p=S.players[id];
      if(!p||!wantsNewDeal(p)) continue;
      if(chance(0.55)&&capSpace(club)>marketAPY(p)) extendPlayer(p,club);
    }
  }
}
function extendPlayer(p,team,generous){
  const t=team||S.teams[p.teamId];
  const yrs=contractYears(p);
  const apy=Math.round(marketAPY(p)*(generous?rf(1.06,1.22):rf(0.96,1.08)));
  if(capSpace(t)-apy+capHit(p)<0) return false;
  const share=clamp(apy/(S.cap*0.11),0,1);
  const bonusPct=clamp(0.06+share*0.58,0.06,0.64);
  const st=contractHits(apy,yrs,bonusPct,minSalaryFor(p));
  p.contract={apy,years:yrs,left:yrs,signedYear:S.year,bonus:st.bonus,
              prorate:st.prorate,hits:st.hits,gtdYears:Math.min(yrs,p.ovr>=82?3:2)};
  p.holdout=false;
  p.morale=clamp(moraleOf(p)+ri(10,22),MORALE_MIN,MORALE_MAX);
  return true;
}
/* each week a holdout stays away he loses conditioning and the room notices */
function tickHoldouts(){
  if(!S.holdouts||!S.holdouts.length) return;
  for(const id of S.holdouts.slice()){
    const p=S.players[id];
    if(!p||p.teamId!==S.userTeam){ S.holdouts=S.holdouts.filter(x=>x!==id); continue; }
    p.morale=Math.round(clamp(moraleOf(p)-rf(0.4,1.6),MORALE_MIN,MORALE_MAX)*10)/10;
    p.holdoutWeeks=(p.holdoutWeeks||0)+1;
    if(p.holdoutWeeks%4===0) applyDelta(p,-0.4);      // he is not getting any sharper
    if(chance(0.05+p.holdoutWeeks*0.012)){            // most of them fold eventually
      p.holdout=false; p.holdoutWeeks=0;
      S.holdouts=S.holdouts.filter(x=>x!==id);
      news(`${p.pos} ${p.l} has ended his holdout and reported.`,"signing",p.id);
    }
  }
}
function resolveHoldout(pid,how){
  const p=S.players[pid], t=S.teams[S.userTeam];
  if(!p) return "He's gone.";
  if(how==="pay"){
    if(!extendPlayer(p,t,true)) return "You can't fit the deal under the cap.";
    p.holdoutWeeks=0;
    S.holdouts=(S.holdouts||[]).filter(x=>x!==pid);
    news(`${p.pos} ${p.l} signs an extension and reports.`,"signing",p.id);
    return `${p.l} is back in the building.`;
  }
  if(how==="wait"){
    p.morale=clamp(moraleOf(p)-ri(8,18),MORALE_MIN,MORALE_MAX);
    if(chance(0.45)){ p.holdout=false; p.holdoutWeeks=0;
      S.holdouts=(S.holdouts||[]).filter(x=>x!==pid);
      return `${p.l} caved and reported.`; }
    return `${p.l} is still away. He'll miss time.`;
  }
  // trade him
  S.shopOffers={pid, list:solicitOffers(pid)};
  return "Calls made.";
}

/* ---------- the coaching carousel ---------- */
function runCarousel(){
  const poached=[];
  for(const t of S.teams){
    for(const role of ["OC","DC"]){
      const c=t.staff[role];
      if(!c) continue;
      // a coordinator whose unit produced gets a head-coaching job elsewhere
      const quality=coachOverall(c)+(winPct(t)-0.5)*26;
      if(quality<62||!chance(0.06+(quality-62)/150)) continue;
      const dest=pick(S.teams.filter(x=>x.id!==t.id));
      if(!dest) continue;
      const old=dest.staff.HC;
      if(old&&coachOverall(old)>=coachOverall(c)) continue;
      if(old) dest.cash-=buyoutCost(old);
      c.role="HC"; dest.staff.HC=c; delete t.staff[role];
      poached.push({name:c.name,from:t,to:dest,role});
      if(t.id===S.userTeam)
        news(`${esc(c.name)} has been hired as head coach by ${dest.city}. Your ${role} chair is empty.`,"loss");
      else if(dest.id===S.userTeam)
        news(`You've hired ${esc(c.name)} away from ${t.city} as head coach.`,"signing");
    }
  }
  return poached;
}
/* aiStaffChurn is the only thing that fills a chair, and it already ran
   earlier this offseason — before ageStaff and runCarousel had a chance to
   empty one. Left alone, a vacancy they create sits empty for a full season. */
function backfillVacantStaff(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;   // your staff is yours to choose — the
    // resign phase that follows is your hiring window; see startSeason for
    // the last-resort fallback if that window closes with a chair still open
    for(const role of ["HC","OC","DC","SD"]){
      if(t.staff[role]) continue;
      const pool=(S.staffMarket||[]).filter(x=>x.role===role)
        .sort((a,b)=>coachOverall(b)-coachOverall(a)+(rnd()-0.5)*8);
      const want=pool.length>1 ? (pool.find(x=>x.asking<t.cash*0.25)||pool[0]) : null;
      if(want){ want.salary=want.asking; t.staff[role]=want;
        S.staffMarket=(S.staffMarket||[]).filter(x=>x.id!==want.id); }
      else t.staff[role]=makeCoach(role);
    }
  }
}

/* ---------- compensatory picks ---------- */
function compPickValue(p){
  const apy=marketAPY(p);
  if(apy>=18e6*capScale()) return 3;
  if(apy>=9e6*capScale()) return 4;
  if(apy>=4.5e6*capScale()) return 5;
  if(apy>=2.2e6*capScale()) return 6;
  return 7;
}
/* the cap is a hard ceiling — a club that ends the offseason over it has to
   get compliant, by restructuring first and then by releasing */
function enforceCap(only,opts){
  const spare=opts&&opts.spareReal;
  // Getting compliant used to matter more than fielding a team: this loop cut
  // players with no floor at all, which could — and did — release the very
  // men fillRosterFromFA had just signed, moments earlier in the same
  // start-of-season call. A team can defer the rest as dead money; it cannot
  // play a game sixteen bodies short.
  const ROSTER_FLOOR=(opts&&opts.floor!==undefined)?opts.floor:46;
  for(const t of (only?[only]:S.teams)){
    let guard=0;
    while(capSpace(t)<0&&guard++<60){
      const roster=t.roster.map(id=>S.players[id]).filter(p=>p&&p.contract);
      const restr=roster.filter(p=>canRestructure(p)&&!(spare&&p.contract&&p.contract.real))
        .sort((a,b)=>capHit(b)-capHit(a))[0];
      if(restr&&restructure(restr)>0) continue;
      if(t.roster.length<=ROSTER_FLOOR) break;
      const cut=roster
        .filter(p=>capHit(p)-deadMoney(p)>0)
        .sort((a,b)=>((capHit(b)-deadMoney(b))/Math.max(1,playerTradeValue(b)))
                    -((capHit(a)-deadMoney(a))/Math.max(1,playerTradeValue(a))))[0];
      if(!cut) break;
      releasePlayer(cut,t);
      if(t.id===S.userTeam)
        news(`${cut.pos} ${cut.l} released to get under the cap.`,"loss",cut.id);
    }
    // last resort: a club that hit the roster floor before getting compliant
    // borrows the rest against next year — every other lever (restructure,
    // release) has already been tried, and a team stuck over the cap forever
    // is not a valid end state, unlike an occasional deferred-money penalty.
    // deadCap is what payroll() actually charges against the cap, so it has
    // to move now, not just be logged for later — the original version only
    // drew down an existing deadCap balance, which is nothing for a team
    // that had none, so it never actually fixed this year's number.
    const short=-capSpace(t);
    if(short>0){
      t.deadCap=(t.deadCap||0)-short;
      t.deadCapNext=(t.deadCapNext||0)+Math.round(short*1.1);   // it costs to defer
      if(t.id===S.userTeam)
        news(`${fmtM(short)} of dead money deferred to next season to get compliant.`,"info");
    }
  }
}
/* coaches age, retire, and eventually stop waiting for a job */
function ageStaff(){
  const goneNames=[];
  for(const t of S.teams){
    for(const role of ["HC","OC","DC","SD"]){
      const c=t.staff[role]; if(!c) continue;
      c.age=(c.age||50)+1;
      const moved=progressCoach(c,t,role);
      if(t.id===S.userTeam&&Math.abs(moved)>=2)
        news(`${esc(c.name)} has ${moved>0?"grown into the job":"gone backwards"} this year.`,
             moved>0?"win":"loss");
      let pr=0;
      if(c.age>=62) pr+=(c.age-61)*0.14;
      if(c.age>=70) pr+=0.35;
      if(coachOverall(c)<52) pr+=0.06;
      if(rnd()<clamp(pr,0,0.9)){
        delete t.staff[role];
        goneNames.push(`${c.name} (${t.abbr} ${role})`);
        if(t.id===S.userTeam)
          news(`${esc(c.name)} is retiring after ${c.age} years. The ${role} job is open.`,"info");
      }
    }
  }
  // and the men on the market don't wait forever
  S.staffMarket=(S.staffMarket||[]).filter(c=>{
    c.age=(c.age||50)+1;
    c.onMarket=(c.onMarket||0)+1;
    if(c.age>=66&&chance(0.45)) return false;
    if(c.onMarket>=3&&chance(0.55)) return false;
    c.asking=Math.round(coachValue(c)*rf(0.95,1.25)/1e5)*1e5;
    return true;
  });
  if(goneNames.length>2) news(`${goneNames.length} coaches retired around the league.`,"league");
}
/* there is always somebody on the street and somebody out of work */
function seedFreeAgents(n){
  for(let i=0;i<n;i++){
    const pos=pick(POS);
    const young=chance(.45);
    const ovr=c99(gauss(young?62:64,7));
    const p=makePlayer(pos,ovr,young?ri(22,24):ri(25,32));
    p.exp=young?ri(0,2):Math.max(0,p.age-22-ri(0,2));
    p.teamId=null; p.contract=null;
    S.players[p.id]=p; S.freeAgents.push(p.id);
  }
}
function topUpMarkets(){
  // enough veterans on the street to cover an injury in any week
  const live=S.freeAgents.filter(id=>S.players[id]&&!S.players[id].retired);
  if(live.length<90) seedFreeAgents(90-live.length);
  // and enough of them good enough to actually start if you're desperate
  const usable=live.filter(id=>S.players[id].ovr>=68).length;
  if(usable<28) for(let i=0;i<28-usable;i++){
    const p=makePlayer(pick(POS),c99(gauss(71,3.5)),ri(25,31));
    p.exp=Math.max(1,p.age-23); p.teamId=null; p.contract=null;
    S.players[p.id]=p; S.freeAgents.push(p.id);
  }
  // and at least a couple of candidates for every chair
  S.staffMarket=S.staffMarket||[];
  for(const role of ["HC","OC","DC","SD"]){
    let have=S.staffMarket.filter(c=>c.role===role).length;
    while(have<2){
      const c=makeCoach(role);
      c.asking=Math.round(coachValue(c)*rf(0.95,1.30)/1e5)*1e5;
      c.years=ri(2,4);
      S.staffMarket.push(c); have++;
    }
  }
}
const COMP_PICKS_PER_YEAR=32;
function awardCompPicks(){
  // net free-agent losses turn into picks two drafts out, and they are scarce
  const claims=[];
  for(const t of S.teams){
    const lost=(t.faLost||[]).map(id=>S.players[id]).filter(p=>p&&p.teamId!==null&&p.teamId!==t.id);
    const net=Math.max(0,lost.length-(t.faGained||[]).length);
    lost.sort((a,b)=>marketAPY(b)-marketAPY(a));
    for(let i=0;i<Math.min(net,4,lost.length);i++)
      claims.push({t, p:lost[i], v:marketAPY(lost[i])});
    t.faLost=[]; t.faGained=[];
  }
  claims.sort((a,b)=>b.v-a.v);
  for(const c of claims.slice(0,COMP_PICKS_PER_YEAR)){
    const rd=compPickValue(c.p);
    c.t.picks.push({year:S.year+3,round:rd,orig:c.t.id,comp:true});
    if(c.t.id===S.userTeam)
      news(`Losing ${c.p.pos} ${c.p.l} brings a compensatory pick in round ${rd}, ${S.year+2}.`,"draft");
  }
}

/* ---------- the season narrative ---------- */
function powerRankings(){
  return S.teams.map(t=>{
    const roster=t.roster.map(id=>S.players[id]).filter(Boolean)
      .sort((a,b)=>b.ovr-a.ovr).slice(0,24);
    const form=(t.w+t.l)?(t.w/(t.w+t.l)):0.5;
    const diff=(t.pf-t.pa)/Math.max(1,t.w+t.l);
    return {t, score: avg(roster.map(p=>p.ovr))*0.55 + form*34 + diff*1.1};
  }).sort((a,b)=>b.score-a.score);
}
function weeklyHeadline(){
  const played=S.schedule.filter(g=>g.played&&g.week===S.week-1);
  if(!played.length) return null;
  let best=null;
  for(const g of played){
    const H=S.teams[g.home], A=S.teams[g.away];
    const margin=Math.abs(g.hs-g.as);
    const winner=g.hs>g.as?H:A, loser=g.hs>g.as?A:H;
    const upset=(winPct(loser)-winPct(winner))*60;
    const total=(g.hs+g.as)/6;
    const drama=(margin<=3?18:margin<=7?9:0)+upset+total-(margin>21?10:0);
    if(!best||drama>best.drama) best={g,drama,winner,loser,margin};
  }
  if(!best) return null;
  const {g,winner,loser,margin}=best;
  const line = margin<=3
    ? `${winner.name} edge ${loser.name} by ${margin} in the week's best game.`
    : margin>=24
    ? `${winner.name} take ${loser.name} apart, ${Math.max(g.hs,g.as)}–${Math.min(g.hs,g.as)}.`
    : winPct(loser)>winPct(winner)+0.25
    ? `${winner.name} stun ${loser.name} — nobody saw that coming.`
    : `${winner.name} handle ${loser.name}, ${Math.max(g.hs,g.as)}–${Math.min(g.hs,g.as)}.`;
  return line;
}
function seasonAwards(){
  const all=S.teams.flatMap(t=>t.roster.map(id=>S.players[id])).filter(p=>p&&p.stats&&p.stats.gp);
  const pick1=(list,score)=>list.length?list.slice().sort((a,b)=>score(b)-score(a))[0]:null;
  const mvp=pick1(all,p=>{
    const s=p.stats;
    return (s.py||0)/24+(s.ptd||0)*9-(s.pint||0)*5+(s.ry||0)/9+(s.rtd||0)*7
         +(s.recy||0)/10+(s.rectd||0)*7+(s.sak||0)*11+(s.int||0)*9
         + (S.teams[p.teamId]?S.teams[p.teamId].w*2.2:0);
  });
  const opoy=pick1(all.filter(p=>POSGROUP[p.pos]==="o"&&p!==mvp),p=>{
    const s=p.stats;
    return (s.py||0)/26+(s.ptd||0)*8+(s.ry||0)/8+(s.rtd||0)*7+(s.recy||0)/8.5+(s.rectd||0)*7;
  });
  const dpoy=pick1(all.filter(p=>POSGROUP[p.pos]==="d"),p=>{
    const s=p.stats; return (s.sak||0)*13+(s.int||0)*12+(s.tkl||0)/2.4+(s.pd||0)*2.4;
  });
  const roy=pick1(all.filter(p=>p.exp===0),p=>{
    const s=p.stats;
    return (s.py||0)/26+(s.ptd||0)*8+(s.ry||0)/8+(s.rtd||0)*7+(s.recy||0)/8.5
         +(s.sak||0)*12+(s.int||0)*10+(s.tkl||0)/3;
  });
  const out=[];
  const add=(label,p)=>{ if(!p) return;
    out.push({label,id:p.id,name:`${p.f} ${p.l}`,pos:p.pos,
      team:S.teams[p.teamId]?S.teams[p.teamId].abbr:""});
    p.accolades=p.accolades||[]; p.accolades.push({year:S.year,award:label}); };
  add("Most Valuable Player",mvp);
  add("Offensive Player of the Year",opoy);
  add("Defensive Player of the Year",dpoy);
  add("Rookie of the Year",roy);
  S.awards=S.awards||[];
  S.awards.unshift({year:S.year,list:out});
  if(S.awards.length>12) S.awards.length=12;
  for(const a of out)
    news(`${a.label}: ${a.pos} ${a.name} (${a.team}).`,"info",a.id);
}
/* ============================================================
   Module 17: the rules a real front office actually works under
   ============================================================ */

/* The deadline is the Tuesday after week nine, as the league has run it since
   2024, so trades are open through week nine and shut from week ten.
   Reserve mirrors the real rule: a four-game minimum absence, and a limit on
   how many men you may bring back rather than how many you may place.        */
const IR_SLOTS=12, IR_RETURNS=8, PS_SLOTS=8, TRADE_DEADLINE_WEEK=9;

/* ---------- injured reserve ---------- */
function irList(t){ return (t.ir||[]).map(id=>S.players[id]).filter(Boolean); }
function psList(t){ return (t.ps||[]).map(id=>S.players[id]).filter(Boolean); }
function canPlaceIR(t,p){
  if(!p||p.teamId!==t.id) return "He isn't ours.";
  if((t.ir||[]).includes(p.id)) return "Already on the list.";
  if(p.injury<3) return "He isn't hurt badly enough — three weeks minimum.";
  if((t.ir||[]).length>=IR_SLOTS) return `All ${IR_SLOTS} reserve spots are used.`;
  return null;
}
function placeIR(t,p){
  const bad=canPlaceIR(t,p); if(bad) return bad;
  t.ir=t.ir||[];
  t.ir.push(p.id);
  t.roster=t.roster.filter(id=>id!==p.id);
  p.onIR=true;
  p.irReturn=S.week+Math.max(4,p.injury+1);      // he can't come straight back
  autoDepth(t);
  return null;
}
function activateFromIR(t,p){
  if(!t.ir||!t.ir.includes(p.id)) return "He isn't on the list.";
  if(p.injury>0) return "He still isn't fit.";
  if(S.week<(p.irReturn||0)) return `Not eligible until week ${p.irReturn}.`;
  if((t.irReturns||0)>=IR_RETURNS) return `You've used all ${IR_RETURNS} activations this season.`;
  if(t.roster.length>=ROSTER_MAX) return "No room on the roster.";
  t.irReturns=(t.irReturns||0)+1;
  t.ir=t.ir.filter(id=>id!==p.id);
  addToTeam(p,t);
  return null;
}
/* clubs run their own reserve list */
function aiManageIR(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    t.ir=t.ir||[];
    for(const id of t.roster.slice()){
      const p=S.players[id];
      if(p&&p.injury>=5&&t.ir.length<IR_SLOTS&&t.roster.length>ROSTER_MAX-6) placeIR(t,p);
    }
    for(const id of t.ir.slice()){
      const p=S.players[id];
      if(p&&p.injury<=0&&S.week>=(p.irReturn||0)&&t.roster.length<ROSTER_MAX) activateFromIR(t,p);
    }
  }
}
function clearIR(){
  // everyone comes off the list at the end of the year
  for(const t of S.teams){
    t.irReturns=0;
    for(const id of (t.ir||[]).slice()){
      const p=S.players[id];
      if(p){ p.irReturn=0; addToTeam(p,t); }
    }
    t.ir=[];
  }
}

/* ---------- practice squad ---------- */
function canSignPS(t,p){
  if((t.ps||[]).length>=PS_SLOTS) return `The squad is full at ${PS_SLOTS}.`;
  if(p.exp>2) return "Too experienced for the practice squad.";
  if(p.ovr>72) return "He's too good to clear — somebody would sign him.";
  return null;
}
function signToPS(t,p){
  const bad=canSignPS(t,p); if(bad) return bad;
  S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
  t.ps=t.ps||[];
  t.ps.push(p.id);
  p.teamId=t.id; p.onPS=true;
  signPlayer(p,t.id,Math.round(minSalary()*0.35),1,.05);
  p.onPS=true;
  return null;
}
function promoteFromPS(t,p){
  if(!t.ps||!t.ps.includes(p.id)) return "He isn't on the squad.";
  if(t.roster.length>=ROSTER_MAX) return "No room on the roster.";
  t.ps=t.ps.filter(id=>id!==p.id);
  signPlayer(p,t.id,minSalary(),1,.15);
  addToTeam(p,t);
  return null;
}
function releaseFromPS(t,p){
  if(!p||!(t.ps||[]).includes(p.id)) return "He isn't on the practice squad.";
  t.ps=t.ps.filter(id=>id!==p.id);
  p.onPS=false; p.teamId=null; p.contract=null;
  if(!S.freeAgents.includes(p.id)) S.freeAgents.push(p.id);
  return null;
}
/* rival clubs poach developing players you leave exposed */
function poachPracticeSquads(){
  for(const t of S.teams){
    for(const id of (t.ps||[]).slice()){
      const p=S.players[id];
      if(!p||p.ovr<66) continue;
      const suitor=S.teams.find(x=>x.id!==t.id&&x.roster.length<ROSTER_MAX&&needScore(x,p.pos)>40);
      if(suitor&&chance(0.10+(p.ovr-66)*0.02)){
        t.ps=t.ps.filter(i=>i!==p.id);
        p.onPS=false;
        signPlayer(p,suitor.id,minSalary(),1,.2);
        addToTeam(p,suitor);
        if(t.id===S.userTeam)
          news(`${suitor.city} have signed ${p.pos} ${p.l} off our practice squad.`,"loss",p.id);
      }
    }
  }
}
function aiStockPracticeSquads(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    t.ps=t.ps||[];
    let guard=0;
    while(t.ps.length<PS_SLOTS-2&&guard++<6){
      const pool=S.freeAgents.map(id=>S.players[id])
        .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56)
        .sort((a,b)=>b.ovr-a.ovr);
      let man=pool[0];
      if(!man){
        // there are always undrafted kids willing to take the reps
        man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24));
        man.exp=ri(0,1);
        S.players[man.id]=man; S.freeAgents.push(man.id);
      }
      if(signToPS(t,man)) break;

  }
}
function psDevelop(){
  for(const t of S.teams) for(const id of (t.ps||[])){
    const p=S.players[id];
    if(p&&chance(0.35)) applyDelta(p,rf(0.05,0.30));   // reps in the shadows
  }

/* ---------- the trade deadline ---------- */
function tradesOpen(){
  if(S.phase!=="regular") return true;
  return S.week<=TRADE_DEADLINE_WEEK;
}
function tradeWindowNote(){
  if(S.phase!=="regular") return "The market is open.";
  if(S.week<TRADE_DEADLINE_WEEK) return `${TRADE_DEADLINE_WEEK-S.week} week${TRADE_DEADLINE_WEEK-S.week===1?"":"s"} to the deadline.`;
  if(S.week===TRADE_DEADLINE_WEEK) return "Deadline day. Anything you're doing, do it now.";
  return "The deadline has passed. Nothing moves until the season ends.";
}

/* ---------- the franchise tag ---------- */
function tagCost(p){
  // the average of the five best-paid men at his position, or 120% of his own deal
  const peers=S.teams.flatMap(t=>t.roster.map(id=>S.players[id]))
    .filter(x=>x&&x.pos===p.pos&&x.contract).map(x=>capHit(x))
    .sort((a,b)=>b-a).slice(0,5);
  const top5=peers.length?avg(peers):marketAPY(p);
  return Math.round(Math.max(top5,capHit(p)*1.2)/1e5)*1e5;
}
function canTag(t,p){
  if(S.tagUsed&&S.tagUsed[t.id]===S.year) return "You've already used the tag this year.";
  if(!p.contract||p.contract.left>1) return "His deal isn't expiring.";
  if(capSpace(t)-tagCost(p)+capHit(p)<0) return "You can't fit the tag under the cap.";
  return null;
}
function applyTag(t,p){
  const bad=canTag(t,p); if(bad) return bad;
  const cost=tagCost(p);
  const st=contractHits(cost,1,0.05);
  p.contract={apy:cost,years:1,left:1,signedYear:S.year,bonus:st.bonus,
              prorate:st.prorate,hits:st.hits,gtdYears:1};
  p.tagged=S.year;
  p.morale=clamp(moraleOf(p)-ri(6,16),MORALE_MIN,MORALE_MAX);   // nobody enjoys being tagged
  S.tagUsed=S.tagUsed||{};
  S.tagUsed[t.id]=S.year;
  news(`${p.pos} ${p.l} has been given the franchise tag — ${fmtM(cost)} for one year.`,"signing",p.id);
  return null;
}
function aiUseTags(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    const best=t.roster.map(id=>S.players[id])
      .filter(p=>p&&p.contract&&p.contract.left<=1&&p.ovr>=80)
      .sort((a,b)=>b.ovr-a.ovr)[0];
    if(best&&!canTag(t,best)&&chance(0.45)) applyTag(t,best);
  }
}

/* ---------- clubs draft for their scheme ---------- */
function schemeDraftBonus(t,p){
  const side=POSGROUP[p.pos]==="o"?"OC":POSGROUP[p.pos]==="d"?"DC":null;
  if(!side||!t.staff[side]) return 0;
  const sc=TEAM_SCHEMES[side][schemeOf(t,side)];
  if(!sc||!sc.key[p.pos]) return 0;
  const attrs=sc.key[p.pos];
  const n=attrNorm(p.pos,attrs[0]);
  const keyMean=avg(attrs.map(a=>p.a[a]||55));
  const expected=Math.min(94,n.v+(p.ovr-n.o)*0.90);
  return clamp((keyMean-expected)*0.55,-6,6);
}

/* ============================================================
   Coaches have ceilings too
   ============================================================ */
const COACH_CAP=92;
function rollCoachPotential(c){
  const cur=coachOverall(c);
  const age=c.age||48;
  // the younger he is, the more room there is between what he is and what he might be
  const gap = age<=42 ? Math.max(0,gauss(14,7))
            : age<=52 ? Math.max(0,gauss(7,5))
            : Math.max(0,gauss(2,3));
  c.hidden=c.hidden||{};
  c.hidden.pot=clamp(Math.round(cur+gap),cur,COACH_CAP);
  // two things you will never be told about
  c.hidden.late = chance(.14);      // jumps sharply once he has a run of results
  c.hidden.flash= chance(.12);      // gives it back after one good year
  c.hidden.err  = gauss(0,1);       // a fixed personal bias in how he reads
}
function coachPot(c){
  if(!c.hidden||c.hidden.pot===undefined) rollCoachPotential(c);
  return c.hidden.pot;
}
/* ---------- what you can tell before you hire him ---------- */
function coachKnowledge(c){
  const t=S.teams[S.userTeam];
  const sd=t&&t.staff?t.staff.SD:null;
  const base=(sd?sd.dev:55)/9 + analyticsEdge(t)*14;
  return clamp(base+(c.interviews||0)*26,0,100);
}
function coachRead(c){
  const k=coachKnowledge(c);
  const w=Math.pow(k/100,0.6);
  const sd=5.5+13*Math.pow(1-k/100,1.2);
  const own=coachPot(c)+(c.hidden.err||0)*sd;
  const est=own*w+(coachOverall(c)+4)*(1-w);      // fall back on what he already is
  return {est, band:3.5+15*Math.pow(1-k/100,1.15), k};
}
function coachReputation(c){
  const r=coachRead(c), cur=coachOverall(c);
  const room=r.est-cur;
  const sure=r.band<7;
  if(room>=11) return sure?"Everyone expects him to be a top man":"Talked about as a rising name";
  if(room>=6)  return sure?"There is real growth in him":"Some think there's more to come";
  if(room>=2)  return sure?"A little more to come, not much":"Probably close to what he is";
  return sure?"This is what he is":"Hard to read, but nothing jumps out";
}
function interviewCost(){ return Math.round(400e3*capScale()/1e4)*1e4; }
function interviewCoach(cid){
  const t=S.teams[S.userTeam];
  const c=(S.staffMarket||[]).find(x=>x.id===cid);
  if(!c) return "He's not on the market.";
  if((c.interviews||0)>=3) return "You've spoken to him enough.";
  const cost=interviewCost();
  if(t.cash<cost) return `An interview costs ${fmtM(cost)}. You can't cover it.`;
  t.cash-=cost;
  c.interviews=(c.interviews||0)+1;
  return null;
}

/* ---------- how a coach grows ---------- */
function expectedWins(t){
  // what this roster alone should be worth, so a coach is judged on the gap
  const r=t.roster.map(id=>S.players[id]).filter(Boolean)
    .sort((a,b)=>b.ovr-a.ovr).slice(0,24);
  if(!r.length) return 8.5;
  const mine=avg(r.map(p=>p.ovr));
  const all=S.teams.map(x=>{
    const rr=x.roster.map(id=>S.players[id]).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,24);
    return rr.length?avg(rr.map(p=>p.ovr)):65;
  });
  return clamp(8.5+(mine-avg(all))*0.62,1.5,15.5);
}
function progressCoach(c,t,role){
  const cur=coachOverall(c), pot=coachPot(c), room=pot-cur;
  const age=c.age||48;
  // a baseline that follows his ceiling: real room means he improves regardless
  let d = room*0.10 * (age<=45?1.2 : age<=57?1.0 : 0.4);
  if(age>60) d -= (age-60)*0.22;
  if(t){
    const surplus=clamp(t.w-expectedWins(t),-6,6);
    d += surplus>0 ? surplus*0.55 : surplus*0.28;   // the downside is the gentler side
  }
  if(c.hidden.late&&(c.goodYears||0)>=2) d+=1.5;
  if(c.hidden.flash&&t&&t.w-expectedWins(t)>1.5) d-=1.1;
  d -= (cur-62)*0.055;        // regression toward the league's norm
  d += gauss(0,0.55);
  const applied=clamp(d,-3.2,3.6);
  const target=clamp(cur+applied,35,Math.min(pot,COACH_CAP));
  const scale=target/Math.max(1,cur);
  for(const k of ["off","def","dev","gm","disc"]) c[k]=clamp(Math.round(c[k]*scale),25,99);
  // a coordinator's own side of the ball moves fastest
  if(role==="OC") c.off=clamp(Math.round(c.off+applied*0.7),25,99);
  if(role==="DC") c.def=clamp(Math.round(c.def+applied*0.7),25,99);
  if(role==="HC"){ c.gm=clamp(Math.round(c.gm+applied*0.4),25,99);
                   c.disc=clamp(Math.round(c.disc+applied*0.4),25,99); }
  if(coachOverall(c)>pot){
    const back=pot/Math.max(1,coachOverall(c));
    for(const k of ["off","def","dev","gm","disc"]) c[k]=clamp(Math.round(c[k]*back),25,99);
  }
  if(t&&t.w-expectedWins(t)>1) c.goodYears=(c.goodYears||0)+1;
  c.log=c.log||[];
  c.log.unshift(Math.round(applied*10)/10);
  if(c.log.length>5) c.log.length=5;
  c.value=coachValue(c);       // his market worth moves; the deal you signed doesn't
  return applied;
}
function coachTrend(c){
  if(!c.log||c.log.length<2) return null;
  const net=sum(c.log.slice(0,3));
  if(net>=2) return {word:"climbing",dir:"up"};
  if(net<=-2) return {word:"slipping",dir:"down"};
  return {word:"steady",dir:"flat"};
}
/* what he is worth: what he is now, plus what the market thinks is coming */
function coachValue(c){
  const cur=coachOverall(c), pot=coachPot(c);
  const blend=cur*0.72+pot*0.28;
  const base=(c.role==="HC"?4.6e6:c.role==="SD"?1.1e6:1.9e6)*capScale();
  return Math.round(base*(0.45+Math.pow(clamp(blend,30,95)/62,2.4))/1e5)*1e5;
}

/* ============================================================
   The fifth-year option
   ============================================================
   A first-round pick can be held for a fifth season, decided in the spring of
   his fourth year. The price depends on what he has become: a man who has been
   to a Pro Bowl costs what the tag costs; one who has merely played costs the
   going rate for a starter; the rest come cheap. Exercising it guarantees the
   money — that is the whole of the decision.                                 */
function fifthYearTier(p){
  const bowls=(p.accolades||[]).filter(a=>/Pro Bowl|MVP|All-Pro|Player of the Year|Rookie of the Year/i.test(a.award||"")).length;
  const started=(p.career&&p.career.gs)||0;
  if(bowls>=2) return {n:1, why:"two honours or more", mult:1.00};
  if(bowls===1) return {n:2, why:"an honour to his name", mult:0.86};
  if(started>=28) return {n:3, why:"a starter since he arrived", mult:0.72};
  return {n:4, why:"a squad man so far", mult:0.58};
}
function fifthYearCost(p){
  const tier=fifthYearTier(p);
  // the going rate at his position, as the CBA prices it off the top of the market
  const peers=S.teams.flatMap(t=>t.roster.map(id=>S.players[id]))
    .filter(x=>x&&x.pos===p.pos&&x.contract).map(x=>capHit(x))
    .sort((a,b)=>b-a);
  const band=peers.slice(2,tier.n<=2?12:22);
  const going=band.length?avg(band):marketAPY(p);
  return {cost:Math.round(Math.max(going*tier.mult,minSalaryFor(p))/1e5)*1e5, tier};
}
/* is this the spring his club has to decide? */
function fifthYearDue(p){
  return !!(p.fifthYear&&p.fifthYear.available&&!p.fifthYear.settled
            &&p.contract&&(p.exp||0)>=ROOKIE_YEARS-1);
}
function fifthYearPending(t){
  return (t.roster||[]).map(id=>S.players[id]).filter(p=>p&&fifthYearDue(p));
}
function exerciseFifthYear(p,t){
  if(!fifthYearDue(p)) return "There's no option to take up.";
  const {cost}=fifthYearCost(p);
  if(capSpace(t)-cost<0) return `You can't fit ${fmtM(cost)} under the cap.`;
  const c=p.contract;
  const st=contractHits(cost,1,0.0,minSalaryFor(p));
  c.years+=1; c.left+=1;
  c.hits=(c.hits||[]).concat([{year:S.year+c.left-1, hit:cost, base:cost,
    prorate:0, guaranteed:cost}]);
  c.gtd=(c.gtd||0)+cost;                 // the option year is guaranteed in full
  c.gtdYears=(c.gtdYears||0)+1;
  p.fifthYear.settled=S.year; p.fifthYear.taken=true;
  p.morale=clamp(moraleOf(p)+ri(2,7),MORALE_MIN,MORALE_MAX);
  news(`${p.pos} ${p.l}'s fifth-year option taken up — ${fmtM(cost)}, guaranteed.`,"signing",p.id);
  return null;
}
function declineFifthYear(p){
  if(!fifthYearDue(p)) return "There's no option to decline.";
  p.fifthYear.settled=S.year; p.fifthYear.taken=false;
  p.morale=clamp(moraleOf(p)-ri(4,12),MORALE_MIN,MORALE_MAX);
  news(`${p.pos} ${p.l}'s fifth-year option turned down. He can leave after this season.`,"loss",p.id);
  return null;
}
/* rival clubs make the same call, and mostly get it right */
function aiFifthYears(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    for(const p of fifthYearPending(t)){
      const {cost}=fifthYearCost(p);
      const worth=marketAPY(p)*(0.92+t.ai.winNow*0.22);
      if(cost<=worth&&capSpace(t)-cost>=0&&p.ovr>=68) exerciseFifthYear(p,t);
      else declineFifthYear(p);
    }
  }
}
/* anyone still unsettled when the deadline passes has been turned down */
function closeFifthYears(){
  for(const t of S.teams)
    for(const p of fifthYearPending(t)){ p.fifthYear.settled=S.year; p.fifthYear.taken=false; }
}

function bigBoard(){

  const x=ids[i]; ids[i]=ids[j]; ids[j]=x;
}

/* ---------- more than one league at a time ---------- */
const SLOTS=3;
function slotKey(i){ return SAVEKEY+"_slot"+i; }
function slotMetaKey(){ return SAVEKEY+"_slots"; }
let SLOT_INFO=[];
function slotMeta(){ return (S&&S.slotInfo)||SLOT_INFO||[]; }
async function readSlots(){
  const raw=await storeGet(slotMetaKey());
  let info=[];
  try{ info=raw?JSON.parse(raw):[]; }catch(e){ info=[]; }
  SLOT_INFO=info;
  if(S) S.slotInfo=info;          // S may not exist yet at boot
  return info;
}
async function writeSlotMeta(info){
  SLOT_INFO=info;
  if(S) S.slotInfo=info;
  await storePut(slotMetaKey(),JSON.stringify(info));
}
async function saveToSlot(i){
  const t=S.teams[S.userTeam];
  const ok=await storePut(slotKey(i),serialiseState());
  const info=slotMeta().slice();
  info[i]={club:`${t.city} ${t.name}`, year:S.year, phase:phaseLabel(),
           record:`${t.w}-${t.l}`, at:Date.now(), ok};
  await writeSlotMeta(info);
  S.saveOK=ok;
  return ok;
}
async function loadFromSlot(i){
  const raw=await storeGet(slotKey(i));
  if(!raw) return "That slot is empty.";
  try{
    S=JSON.parse(raw); migrateSave(); S.slotInfo=SLOT_INFO;
    return null;
  }catch(e){ return "That save wouldn't open."; }
}
async function clearSlot(i){
  await storePut(slotKey(i),"");
  const info=slotMeta().slice();
  info[i]=null;
  await writeSlotMeta(info);
}
function slotsPanel(){
  const info=slotMeta();
  const when=ms=>{ if(!ms) return "";
    const d=Math.round((Date.now()-ms)/86400000);
    if(d>=1) return `${d} day${d===1?"":"s"} ago`;
    const h=Math.round((Date.now()-ms)/3600000);
    if(h>=1) return `${h} hour${h===1?"":"s"} ago`;
    const m=Math.max(1,Math.round((Date.now()-ms)/60000));
    return `${m} minute${m===1?"":"s"} ago`; };
  return `<div class="ph"><h3>Save slots</h3><span class="sub">${SLOTS} leagues</span></div>
    <div class="pb stack">${Array.from({length:SLOTS},(_,i)=>{
      const s=info[i];
      return `<div class="note">
        <div class="row spread"><b class="small">Slot ${i+1}</b>
          <span class="tiny dim">${s?when(s.at):"empty"}</span></div>
        <div class="small">${s?`${esc(s.club)} · ${s.year} · ${esc(s.record)}`:"Nothing saved here"}</div>
        <div class="row wrap" style="margin-top:5px">
          <button class="mini" data-act="slotsave" data-arg="${i}">Save here</button>
          ${s?`<button class="mini" data-act="slotload" data-arg="${i}">Load</button>
              <button class="mini" data-act="slotclear" data-arg="${i}">Erase</button>`:""}
        </div></div>`;}).join("")}
      <p class="tiny dim">Slots live in this browser like the main save. A downloaded file is the
        only copy that survives clearing your history or moving to another machine.</p>
    </div>`;
}

/* ---------- what the words mean ---------- */
const GLOSSARY=[
  ["The cap and contracts",[
    ["Cap hit","What a player counts against the salary cap this season. Not always what he is paid."],
    ["Signing bonus","Money paid up front but charged to the cap in slices across the deal. It is the part you cannot escape."],
    ["Dead money","What a released player still costs you. Every unpaid slice of his bonus lands at once."],
    ["Restructure","Turning salary into bonus. It frees room now and charges you more later."],
    ["Franchise tag","One player a year kept for a single expensive season. He will not enjoy it."],
    ["Compensatory picks","Extra selections awarded for losing more in free agency than you signed."]
  ]],
  ["Players",[
    ["Overall","A summary of what a man is now. It hides as much as it tells."],
    ["Ceiling","How good he might become. Never shown directly, and it moves with how he's treated."],
    ["Traits","Things about a man that ratings miss — durability, work, temperament. Some only surface with time."],
    ["Scheme fit","Whether what he does well is what your coordinator asks for."],
    ["Morale","How he feels about being here. It follows winning, playing time, and being paid fairly."],
    ["Holdout","A man who won't report until his contract is addressed."]
  ]],
  ["The roster",[
    ["Injured reserve","A place for the badly hurt. He misses at least four weeks and doesn't count against the 53, but he is still paid."],
    ["Practice squad","Young players kept outside the roster to develop. Rivals can sign them away."],
    ["Depth chart","The order they play in. Arrange it by hand and it stays that way."]
  ]],
  ["Scouting and the draft",[
    ["Hours","Your scouting budget for the pre-draft window. Never enough for the whole class."],
    ["Consensus","The league's shared opinion of a prospect. Roughly half of it is right."],
    ["Our grade","What your own people think, with a range around it that narrows as you work."],
    ["Board","Your own ranking. Men you place on it are taken before anyone else."]
  ]],
  ["The building",[
    ["Facilities","Paid from cash, not cap. They compound over years rather than winning games now."],
    ["Cash","Separate from the cap. It comes from gate, merchandise and shared media money."],
    ["Market","How much a city can support. It moves gate and merchandise, not the cap."]
  ]]
];
function glossaryPanel(){
  return GLOSSARY.map(([head,rows])=>`<div class="ph"><h3>${esc(head)}</h3></div>
    <div class="pb stack">${rows.map(([term,def])=>`<div class="note">
      <div class="small"><b>${esc(term)}</b></div>
      <div class="tiny dim">${esc(def)}</div></div>`).join("")}</div>`).join("");
}

}

      <p class="tiny dim">Useful when you've been away from a screen for a while, or when something
        doesn't look right. None of it touches what you've set by hand except the depth chart,

/* the weekly housekeeping */
function runAutoJobs(){
  const t=S.teams[S.userTeam];
  if(autoOn("ir")){
    for(const id of t.roster.slice()){
      const p=S.players[id];
      if(!p||p.pinActive) continue;
      if(p.injury>=4&&(t.ir||[]).length<IR_SLOTS&&t.roster.length>ROSTER_MAX-8){
        if(!placeIR(t,p)) news(`${p.pos} ${p.l} placed on reserve — he's out ${p.injury} weeks.`,"info",p.id);
      }
    }
  }
  if(autoOn("squad")){
    let guard=0;
    while((t.ps||[]).length<PS_SLOTS-3&&guard++<4){
      const pool=S.freeAgents.map(id=>S.players[id])
        .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56)
        .sort((a,b)=>b.ovr-a.ovr);
      let man=pool[0];
      if(!man){
        // the AI clubs stock their squads too; there are always more kids
        man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24));
        man.exp=ri(0,1);
        S.players[man.id]=man; S.freeAgents.push(man.id);
      }
      if(signToPS(t,man)) break;
    }
  }
}
function runAutoCuts(){
  const t=S.teams[S.userTeam];
  if(!autoOn("cuts")||t.roster.length<=ROSTER_MAX) return;
  const n=t.roster.length-ROSTER_MAX;
  if(typeof ACT!=="undefined"&&ACT.autocut) ACT.autocut(true);
  if(t.roster.length<=ROSTER_MAX)
    news(`${n} player${n===1?"":"s"} released to reach the roster limit.`,"info");
}

/* ============================================================
   "Have the staff sort it" — every routine job, on demand
   ============================================================ */
const STAFF_JOBS={
  depth:{label:"Set the depth chart", where:"team",
    run(t){ t.depthManual=false; autoDepth(t);
      return "The coaches have set the order."; }},
  ir:{label:"Manage the reserve list", where:"team",
    run(t){ let n=0;
      for(const id of t.roster.slice()){ const p=S.players[id];
        if(!p||p.pinActive||p.injury<4) continue;
        if((t.ir||[]).length>=IR_SLOTS) break;
        if(!placeIR(t,p)) n++; }
      let back=0;
      for(const id of (t.ir||[]).slice()){ const p=S.players[id];
        if(p&&p.injury<=0&&S.week>=(p.irReturn||0)&&t.roster.length<ROSTER_MAX&&!activateFromIR(t,p)) back++; }
      return n||back ? `${n} placed on reserve, ${back} brought back.` : "Nobody to move.";
    }},
  squad:{label:"Fill the practice squad", where:"team",
    run(t){ const before=(t.ps||[]).length; let guard=0;
      while((t.ps||[]).length<PS_SLOTS&&guard++<12){
        const pool=S.freeAgents.map(id=>S.players[id])
          .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56).sort((a,b)=>b.ovr-a.ovr);
        let man=pool[0];
        if(!man){ man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24)); man.exp=ri(0,1);
          S.players[man.id]=man; S.freeAgents.push(man.id); }
        if(signToPS(t,man)) break; }
      const n=(t.ps||[]).length-before;
      return n?`${n} added to the squad.`:"The squad is as full as it can be.";
    }},
  cuts:{label:"Get to the roster limit", where:"team",
    run(t){ if(t.roster.length<=ROSTER_MAX) return "You're already at the limit.";
      const n=t.roster.length-ROSTER_MAX;
      ACT.autocut(true);
      return `${n} released.`; }},
  fill:{label:"Fill the empty roster spots", where:"team",
    run(t){ const before=t.roster.length;
      if(before>=ROSTER_MAX) return "The roster is full.";
      fillRosterFromFA(t,false);
      const n=t.roster.length-before;
      return n?`${n} signed to fill out the roster.`:"Nobody worth signing.";
    }},
  cap:{label:"Get us under the cap", where:"office",
    run(t){ if(capSpace(t)>=0) return "You're already legal.";
      const over=-capSpace(t);
      enforceCap(t);
      return capSpace(t)>=0 ? `${fmtM(over)} cleared.` : "Couldn't clear it all — you'll have to trade somebody.";
    }},
  board:{label:"Have the room rank the board", where:"scout",
    run(t){ if(!S.prospects||!S.prospects.length) return "There's no class to rank.";
      bigBoard();
      S.board.ids=S.prospects.slice()
        .sort((a,b)=>(boardGrade(S.players[b])+needScore(t,S.players[b].pos)*0.3)
                    -(boardGrade(S.players[a])+needScore(t,S.players[a].pos)*0.3))
        .slice(0,25);
      return "The board is ranked. Move anyone you disagree with."; }}
};
function staffButton(job,cls){
  const j=STAFF_JOBS[job];
  if(!j) return "";
  return `<button class="btn ${cls||""}" data-act="staffdo" data-arg="${job}">${esc(j.label)}</button>`;
}
function staffButtonsFor(where){
  const jobs=Object.keys(STAFF_JOBS).filter(k=>STAFF_JOBS[k].where===where);
  if(!jobs.length) return "";
  return `<div class="pb"><div class="row wrap">${jobs.map(k=>staffButton(k,"sm")).join("")}</div></div>`;
}
function runEverything(){
  const t=S.teams[S.userTeam];
  const order=["cap","cuts","fill","ir","squad","depth"];
  const said=[];
  let broke=0;
  for(const k of order){
    try{ const msg=STAFF_JOBS[k].run(t); if(msg&&!/already|Nobody|as full|no class/i.test(msg)) said.push(msg); }
    // A job failing here used to vanish silently, and if every job failed the
    // person was told "Nothing needed doing" — the opposite of what happened.
    catch(e){ console.error("staffjob:"+k,e); broke++; }
  }
  if(said.length) return said.join(" ")+(broke?` (${broke} job${broke>1?"s":""} couldn't run — try again)`:"");
  return broke?`Something went wrong — ${broke} job${broke>1?"s":""} couldn't run. Try again.`:"Nothing needed doing.";
}

/* ============================================================
   "Have the staff do it" — every routine job, on demand
   ============================================================ */
const STAFF_TASKS=[
  {k:"depth", label:"Set the depth chart",
   blurb:"Coordinators order every position by rating and by fit.",
   can:()=>true,
   run:t=>{ t.depthManual=false; autoDepth(t); return "The coaches have set the order."; }},

  {k:"reserve", label:"Sort the reserve list",
   blurb:"Place the badly hurt, activate anyone fit and eligible.",
   can:t=>t.roster.some(id=>S.players[id]&&S.players[id].injury>=4&&!S.players[id].pinActive)
        ||(t.ir||[]).some(id=>S.players[id]&&S.players[id].injury<=0),
   run:t=>{
     let on=0,off=0;
     for(const id of (t.ir||[]).slice()){
       const p=S.players[id];
       if(p&&p.injury<=0&&!activateFromIR(t,p)) off++;
     }
     for(const id of t.roster.slice()){
       const p=S.players[id];
       if(p&&!p.pinActive&&p.injury>=4&&(t.ir||[]).length<IR_SLOTS&&!placeIR(t,p)) on++;
     }
     return `${on} to reserve, ${off} activated.`;
   }},

  {k:"squad", label:"Stock the practice squad",
   blurb:"Fill the empty places with young free agents.",
   can:t=>(t.ps||[]).length<PS_SLOTS,
   run:t=>{
     let n=0,guard=0;
     while((t.ps||[]).length<PS_SLOTS&&guard++<12){
       const pool=S.freeAgents.map(id=>S.players[id])
         .filter(p=>p&&!p.retired&&p.exp<=2&&p.ovr<=72&&p.ovr>=56)
         .sort((a,b)=>b.ovr-a.ovr);
       let man=pool[0];
       if(!man){ man=makePlayer(pick(POS),c99(gauss(60,4)),ri(22,24)); man.exp=ri(0,1);
                 S.players[man.id]=man; S.freeAgents.push(man.id); }
       if(signToPS(t,man)) break;
       n++;
     }
     return n?`${n} signed to the squad.`:"Nobody worth adding.";
   }},

  {k:"fill", label:"Fill the roster",
   blurb:"Sign free agents until the roster is up to strength.",
   can:t=>t.roster.length<ROSTER_MAX,
   run:t=>{ const before=t.roster.length; fillRosterFromFA(t,true); autoDepth(t);
            return `${t.roster.length-before} signed.`; }},

  {k:"trim", label:"Trim to the limit",
   blurb:"Release the weakest until the roster is legal. Pinned men are kept.",
   can:t=>t.roster.length>ROSTER_MAX,
   run:t=>{ const before=t.roster.length; ACT.autocut(true);
            return `${before-t.roster.length} released.`; }},

  {k:"cap", label:"Get under the cap",
   blurb:"Restructure where possible, release where it isn't.",
   can:t=>capSpace(t)<0,
   run:t=>{ const before=capSpace(t); enforceCap(t);
            return capSpace(t)>=0?`Back under, with ${fmtM(capSpace(t))} to spare.`
              :`Still ${fmtM(-capSpace(t))} over — there is nothing left to move.`; }},

  {k:"scout", label:"Spend the scouting hours",
   blurb:"Put the remaining hours across the men highest on the board.",
   can:t=>S.phase==="predraft"&&t.scoutPts>=8,
   run:t=>{ const before=t.scoutPts;
     const board=S.prospects.slice().sort((a,b)=>
       (S.players[b].draft.consensus)-(S.players[a].draft.consensus));
     let guard=0;
     while(t.scoutPts>=8&&guard++<400){
       let spent=false;
       for(const id of board){
         if(t.scoutPts<8) break;
         const r=S.scout[id];
         if(r&&r.k>=70) continue;
         if(doScout(id,"tape",(t.scouts[0]||{}).id).ok) spent=true;
       }
       if(!spent) break;
     }
     return `${before-t.scoutPts} hours put to work.`; }},

  {k:"board", label:"Build our draft board",
   blurb:"Rank the men your scouts rate highest, in their order.",
   can:()=>S.prospects&&S.prospects.length>0,
   run:()=>{ bigBoard();
     const top=S.prospects.slice().sort((a,b)=>boardGrade(S.players[b])-boardGrade(S.players[a])).slice(0,12);
     S.board.ids=top;
     return `${top.length} men placed on the board.`; }}
];
function staffTaskPanel(){
  const t=S.teams[S.userTeam];
  const jobs=STAFF_TASKS.filter(j=>{ try{ return j.can(t); }catch(e){ return false; } });
  return `<div class="ph"><h3>Have the staff do it</h3>
      <span class="sub">${jobs.length} to hand</span></div>
    <div class="pb stack">
      ${jobs.length?jobs.map(j=>`<div class="note">
        <div class="row spread"><b class="small">${j.label}</b>
          <button class="mini" data-act="stafftask" data-arg="${j.k}">Do it</button></div>
        <div class="tiny dim">${j.blurb}</div></div>`).join("")
        :`<p class="small muted">Nothing needs doing. The building is in order.</p>`}
      ${jobs.length>1?`<button class="btn primary full" data-act="stafftask" data-arg="*">Have them do all of it</button>`:""}
      <p class="tiny dim">Anything here can also be done by hand. These are shortcuts, not the only way.</p>
    </div>`;
}
function runStaffTask(k){
  const t=S.teams[S.userTeam];
  if(k==="*"){
    const done=[]; let broke=0;
    for(const j of STAFF_TASKS){
      try{ if(j.can(t)) done.push(`${j.label}: ${j.run(t)}`); }
      catch(e){ console.error("stafftask:"+j.k,e); broke++; }
    }
    if(done.length) return done.join(" ")+(broke?` (${broke} couldn't run — try again)`:"");
    return broke?`Something went wrong — ${broke} job${broke>1?"s":""} couldn't run. Try again.`:"Nothing needed doing.";
  }
  const j=STAFF_TASKS.find(x=>x.k===k);
  if(!j) return "No such job.";
  try{ return j.run(t); }catch(e){ return "That didn't work."; }
}

   A player's numbers, set out as numbers

const STAT_GROUPS={
  pass:{name:"Passing", cols:[["gp","G"],["pc","Cmp"],["pa","Att"],["pct","Pct"],["py","Yds"],["ypa","Y/A"],["ptd","TD"],["pint","Int"],["rate","Rtg"]], has:s=>s.pa>0},
  rush:{name:"Rushing", cols:[["gp","G"],["ra","Car"],["ry","Yds"],["ypc","Avg"],["rtd","TD"],["fum","Fum"]], has:s=>s.ra>0},
  recv:{name:"Receiving", cols:[["gp","G"],["tgt","Tgt"],["rec","Rec"],["recy","Yds"],["ypr","Avg"],["rectd","TD"],["drop","Drop"]], has:s=>s.tgt>0||s.rec>0},
  def:{name:"Defense", cols:[["gp","G"],["tkl","Tkl"],["sak","Sk"],["hrry","Hry"],["qbHit","Hit"],["press","Prs"],["int","Int"],["pd","PD"],["ff","FF"]], has:s=>s.tkl>0||s.sak>0||s.hrry>0||s.qbHit>0},
  kick:{name:"Kicking", cols:[["gp","G"],["fgm","FGM"],["fga","FGA"],["fgpct","Pct"],["xpm","XP"]], has:s=>s.fga>0},
  punt:{name:"Punting", cols:[["gp","G"],["pun","Punts"],["puny","Yds"],["punavg","Avg"]], has:s=>s.pun>0}
};
const ADV_GROUPS={
  qb:{name:"Passing — advanced", cols:[["drop","Drop"],["skRate","Sk%"],["pressRateFaced","Press%"],["hryRate","Hry%"],["hitRate","Hit%"],["aypa","IAY/PA"],["caypa","CAY/PA"],["yacpa","YAC/PA"],["dropPct","Drop%"],["nyA","NY/A"]], has:s=>s.pa>0||s.drop>0},
  rush:{name:"Rushing — advanced", cols:[["ybcpa","YBC/Car"],["yacpaRun","YAC/Car"],["btAtt","BT/Att"],["fumRate","Fum/Att"]], has:s=>s.ra>0},
  rec:{name:"Receiving — advanced", cols:[["tgt","Tgt"],["tgtShare","Tgt%"],["catchPct","Catch%"],["aypt","IAY/Tgt"],["yacRec","YAC/Rec"],["dropPctRec","Drop%"]], has:s=>s.tgt>0},
  def:{name:"Defense — advanced", cols:[["tgtDef","Tgt"],["cmpPctDef","Cmp%"],["ydsTgt","Yds/Tgt"],["intTgt","Int/Tgt"],["pressRate","Prs/PR"],["hurryRate","Hry/PR"],["hitRateDef","Hit/PR"],["missRate","Miss%"]], has:s=>s.tgtDef>0||s.press>0||s.tkl>0}
};
function statVal(s,k){
  const n=v=>v||0;
  switch(k){
    case "pct":    return s.pa? (n(s.pc)/s.pa*100).toFixed(1) : "—";
    case "ypa":    return s.pa? (n(s.py)/s.pa).toFixed(1) : "—";
    case "ypc":    return s.ra? (n(s.ry)/s.ra).toFixed(1) : "—";
    case "ypr":    return s.rec? (n(s.recy)/s.rec).toFixed(1) : "—";
    case "fgpct":  return s.fga? Math.round(n(s.fgm)/s.fga*100)+"%" : "—";
    case "punavg": return s.pun? (n(s.puny)/s.pun).toFixed(1) : "—";
    case "rate":   return s.pa? passerRating(s) : "—";
    case "skRate": return s.pa?(n(s.sk)/s.pa*100).toFixed(1)+"%":"—";
    case "pressRateFaced": return s.drop?(n(s.press)/s.drop*100).toFixed(1)+"%":"—";
    case "hryRate": return s.drop?(n(s.hrryFaced)/s.drop*100).toFixed(1)+"%":"—";
    case "hitRate": return s.drop?(n(s.hitFaced)/s.drop*100).toFixed(1)+"%":"—";
    case "aypa": return s.pa?(n(s.air)/s.pa).toFixed(1):"—";
    case "caypa": return s.pa?(n(s.cay)/s.pa).toFixed(1):"—";
    case "yacpa": return s.pa?(n(s.yac)/s.pa).toFixed(1):"—";
    case "dropPct": return s.tgt?(n(s.drop)/s.tgt*100).toFixed(1)+"%":"—";
    case "nyA": return (s.pa+(s.sk||0))?((n(s.py)-n(s.sackY))/(s.pa+n(s.sk))).toFixed(2):"—";
    case "ybcpa": return s.ra?(n(s.ybc)/s.ra).toFixed(1):"—";
    case "yacpaRun": return s.ra?(n(s.yacRun)/s.ra).toFixed(1):"—";
    case "btAtt": return s.ra?(n(s.bt)/s.ra*100).toFixed(1)+"%":"—";
    case "fumRate": return s.ra?(n(s.fum)/s.ra*100).toFixed(1)+"%":"—";
    case "tgtShare": return s.teamPa?(n(s.tgt)/s.teamPa*100).toFixed(1)+"%":"—";
    case "catchPct": return s.tgt?(n(s.rec)/s.tgt*100).toFixed(1)+"%":"—";
    case "aypt": return s.tgt?(n(s.air)/s.tgt).toFixed(1):"—";
    case "yacRec": return s.rec?(n(s.yac)/s.rec).toFixed(1):"—";
    case "dropPctRec": return s.tgt?(n(s.drop)/s.tgt*100).toFixed(1)+"%":"—";
    case "cmpPctDef": return s.tgtDef?(n(s.cmpDef)/s.tgtDef*100).toFixed(1)+"%":"—";
    case "ydsTgt": return s.tgtDef?(n(s.ydsDef)/s.tgtDef).toFixed(1):"—";
    case "intTgt": return s.tgtDef?(n(s.int)/s.tgtDef*100).toFixed(1)+"%":"—";
    case "pressRate": return s.pressSnaps?(n(s.press)/s.pressSnaps*100).toFixed(1)+"%":"—";
    case "hurryRate": return s.pressSnaps?(n(s.hrry)/s.pressSnaps*100).toFixed(1)+"%":"—";
    case "hitRateDef": return s.pressSnaps?(n(s.qbHit)/s.pressSnaps*100).toFixed(1)+"%":"—";
    case "missRate": return s.tkl?(n(s.mt)/s.tkl*100).toFixed(1)+"%":"—";
    default:       return n(s[k]);
  }
}
function passerRating(s){
  if(!s.pa) return "—";
  const a=clamp(((s.pc||0)/s.pa-0.3)*5,0,2.375);
  const b=clamp(((s.py||0)/s.pa-3)*0.25,0,2.375);
  const c=clamp(((s.ptd||0)/s.pa)*20,0,2.375);
  const d=clamp(2.375-((s.pint||0)/s.pa*25),0,2.375);
  return ((a+b+c+d)/6*100).toFixed(1);
}
/* which tables a man needs, from what he has actually done */
function statTablesFor(p){
  const rows=[]; const seasons=(p.seasonLog||[]).slice(); const cur=p.stats||{};
  if(cur.gp) rows.push({year:S.year,team:p.teamId!==null&&S.teams[p.teamId]?S.teams[p.teamId].abbr:"—",s:cur});
  for(const e of seasons) rows.push(e);
  if(!rows.length) return "";
  const groups=Object.keys(STAT_GROUPS).filter(g=>rows.some(r=>STAT_GROUPS[g].has(r.s)));
  const adv=Object.keys(ADV_GROUPS).filter(g=>rows.some(r=>ADV_GROUPS[g].has(r.s)));
  const renderGroup=(G,use,title)=>{
    const enriched=use.map(r=>{const ss=Object.assign({},r.s);
      if((title.includes("Receiving")||title.includes("advanced"))&&r.team){
        const team=S.teams.find(t=>t.abbr===r.team);
        ss.teamPa=team?team.roster.reduce((n,id)=>n+(S.players[id]?.stats?.pa||0),0):0;
      }
      return Object.assign({},r,{s:ss});
    });
    const tot={}; for(const r of enriched) for(const k in r.s) if(typeof r.s[k]==="number") tot[k]=(tot[k]||0)+r.s[k];
    return `<div class="ph"><h3>${G.name}</h3></div><div class="statwrap"><table class="stat"><thead><tr><th>Season</th>${G.cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
      ${enriched.map(r=>`<tr><td>${r.year}${r.team?` <span class="dim">${esc(r.team)}</span>`:""}</td>${G.cols.map(c=>`<td>${statVal(r.s,c[0])}</td>`).join("")}</tr>`).join("")}
      ${enriched.length>1?`<tr class="tot"><td>Career</td>${G.cols.map(c=>`<td>${statVal(tot,c[0])}</td>`).join("")}</tr>`:""}</tbody></table></div>`;
  };
  return groups.map(g=>renderGroup(STAT_GROUPS[g],rows,STAT_GROUPS[g].name)).join("")+adv.map(g=>renderGroup(ADV_GROUPS[g],rows,ADV_GROUPS[g].name)).join("");
}
/* the headline figures, big enough to read at a glance */
function statHeadline(p){
  const s=p.stats||{};

  if(s.pa){ pick3.push([s.py||0,"Pass yds"],[s.ptd||0,"TD"],[passerRating(s),"Rating"]); }
  else if(s.ra&&(s.ra>=(s.rec||0))){ pick3.push([s.ry||0,"Rush yds"],

  else if(s.pun){ pick3.push([s.pun,"Punts"],[((s.puny||0)/s.pun).toFixed(1),"Average"],[s.gp,"Games"]); }
  else { pick3.push([s.tkl||0,"Tackles"],[s.sak||0,"Sacks"],[s.int||0,"Picks"]); }
  return `<div class="pb grid3">${pick3.map(([v,l])=>
    `<div class="stat"><b class="midnum">${v}</b><span>${l}</span></div>`).join("")}</div>`;

/* ============================================================
   Loading a real roster
   ============================================================ */
function applyRoster(doc){
  if(!doc||doc.format!=="front-office-roster/1"||!Array.isArray(doc.players))
    return "That isn't a roster file.";
  const byAbbr={};
  for(const t of S.teams) byAbbr[t.abbr]=t;
  const groups={};
  for(const r of doc.players){
    if(!byAbbr[r.t]||!POS.includes(r.p)) continue;
    (groups[r.t]=groups[r.t]||[]).push(r);
  }
  const placed=Object.keys(groups).length;
  if(placed<20) return `Only ${placed} clubs matched. Is this for a different league?`;
  normaliseRoster(groups);

  // out with the invented men
  for(const t of S.teams){
    for(const id of t.roster.concat(t.ir||[],t.ps||[])){
      const p=S.players[id]; if(p){ p.teamId=null; p.retired=true; }
    }
    t.roster=[]; t.ir=[]; t.ps=[]; t.depth={}; t.deadCap=0; t.deadCapNext=0;
  }
  let n=0;
  const spare=[];
  for(const abbr in groups){
    const t=byAbbr[abbr];
    // a camp roster has to be cut to 53 with a whole team left standing, so
    // work down each position in turn rather than straight down the ratings
    const rows=[];
    const byPos={};
    for(const r of groups[abbr]) (byPos[r.p]=byPos[r.p]||[]).push(r);
    for(const pos in byPos) byPos[pos].sort((a,b)=>b.o-a.o);
    for(const pos of POS){                       // everyone's starters first
      const need=ROSTER_NEED[pos]||1;
      for(let i=0;i<need&&byPos[pos]&&byPos[pos].length;i++) rows.push(byPos[pos].shift());
    }
    const rest=[];
    for(const pos in byPos) rest.push(...byPos[pos]);
    rest.sort((a,b)=>b.o-a.o);
    const take=Math.max(0,ROSTER_MAX-rows.length);
    rows.push(...rest.slice(0,take));
    // everybody else is a real player too — the squad and the market, not waste
    spare.push(...rest.slice(take));
    for(const r of rows){
      const p=buildRosterPlayer(r);
      if(!p) continue;
      S.players[p.id]=p;
      if(!applyRealContract(p,t,r)){
        const yrs=clamp(Math.round(1+ (p.ovr-58)/9 + rf(0,1.4)),1,6);
        signPlayer(p, t.id, Number(r.contract_apy)||marketAPY(p), yrs,
          Number(r.contract_guarantee_pct)||clamp(0.25+(p.ovr-70)/90,0.05,0.75));
      }
      addToTeam(p,t);
      n++;
    }
    // then bring the wage bill inside the cap, keeping the shape of who earns what
    // a real contract is a fact and is left alone; only invented ones are trimmed
    const bill=payroll(t);
    const room=S.cap*rf(0.86,0.96);
    if(bill>room){
      const fixed=t.roster.map(id=>S.players[id])
        .filter(p=>p&&p.contract&&p.contract.real)
        .reduce((a,p)=>a+capHit(p),0);
      const flexible=Math.max(1,bill-fixed);
      const k=clamp((room-fixed)/flexible,0.35,1);
      for(const id of t.roster){
        const p=S.players[id];
        if(p&&p.contract&&!p.contract.real)
          setAPY(p, Math.max(minSalaryFor(p), Math.round(p.contract.apy*k)));
      }
    }
    autoDepth(t);
    assignSchemes(t);
  }
  // the men who didn't make a 53 fill out the squads and the open market
  let squadded=0, onMarket=0;
  for(const r of spare){
    const p=buildRosterPlayer(r);
    if(!p) continue;
    S.players[p.id]=p;
    const home=byAbbr[r.t];
    if(home&&(home.ps||[]).length<PS_SLOTS&&!canSignPS(home,p)){
      signToPS(home,p); squadded++;
    } else {
      p.teamId=null; p.contract=null;
      S.freeAgents.push(p.id); onMarket++;
    }
  }
  if(squadded||onMarket)
    news(`${squadded} more to practice squads, ${onMarket} onto the open market.`,"info");
  enforceCap(null,{spareReal:true});
  enforceCap();                       // whatever is still over gets the usual treatment
  // the class on the board was drawn for the old league; draw it again for this one
  S.classOffset=undefined;             // recalibrated once, to this league
  if(S.prospects&&S.prospects.length){
    for(const id of S.prospects) delete S.players[id];
    generateDraftClass();
  }
  resetPosNorms(); resetAttrNorms();
  for(const id in S.players) delete S.players[id]._syn;
  S.realRoster=doc.count||n;
  news(`${n} real players loaded across ${placed} clubs.`,"league");
  return null;
}

/* ============================================================
   What a real player has left in him
   ============================================================
   A roster file gives you what a man is today. His ceiling is the thing
   nobody actually knows, so it is inferred and then deliberately blurred —
   two identical profiles must not come out the same, or there is nothing
   left to find out.                                                        */
function rosterCeiling(p,row){
  // if the file states one, it is somebody's judgement and we take it
  if(row&&row.potential!==undefined&&Number(row.potential)>0)
    return clamp(Math.round(Number(row.potential)),p.ovr,99);

  const age=p.age, ovr=p.ovr;
  // how much room the years leave him
  let room = age<=21 ? 9
           : age<=23 ? 7
           : age<=25 ? 4.5
           : age<=27 ? 2.6
           : age<=29 ? 1.2
           : age<=31 ? 0.5
           : 0.2;
  // the higher he already is, the less headroom there physically is
  room *= clamp((99-ovr)/26, 0.12, 1);
  // a man who reached the league late has more left than his age suggests
  const lateStart=clamp((age-22)-(p.exp||0),0,4);
  room *= 1 + lateStart*0.10;
  // and the odd one still has a jump in him well past the usual age
  if(chance(0.06)) room *= rf(1.8,2.8);
  // blur it, so his ceiling is a thing to be discovered rather than worked out
  room = Math.max(0, room + gauss(0, 2.6));
  return clamp(Math.round(ovr+room), ovr, 99);
}
/* a contract lifted straight from the real thing, kept exactly as it is */
function applyRealContract(p,t,row){
  const d=row&&row.contract_detail;
  if(!d||!Array.isArray(d.years)||!d.years.length) return false;
  const hits=d.years.map(y=>({
    year:Number(y.year), hit:Math.round(Number(y.hit||0)), base:Math.round(Number(y.base||0)),
    prorate:Math.round(Number(y.prorate||0)), roster:Math.round(Number(y.roster||0)),
    workout:Math.round(Number(y.workout||0)), option:Math.round(Number(y.option||0)),
    guaranteed:Math.round(Number(y.guaranteed||0))
  }));
  const total=Number(row.contract_total_value||d.contract_total_value||row.contract_apy||0);
  const apy=Number(row.contract_apy||(total/Math.max(1,hits.length)));
  const gtd=Number(row.contract_total_guaranteed||d.contract_total_guaranteed||0);
  p.teamId=t.id;
  p.contract={
    apy:Math.round(apy), years:hits.length, left:hits.length,
    signedYear:Number(d.current_year||S.year),
    gtd:Math.round(gtd), bonus:hits.reduce((n,h)=>n+h.prorate,0),
    prorate:Math.round(hits[0]?hits[0].prorate:0), hits,
    gtdYears:hits.filter(h=>h.guaranteed>0).length,
    real:true, source:d.source||"Over The Cap", sourceUrl:d.url||row.otc_url||"",
    totalValue:Math.round(total)
  };
  return true;
}

/* the real deal, set out year by year as it actually reads */
function contractTable(p){
  const c=p.contract;
  if(!c||!c.real||!Array.isArray(c.hits)||!c.hits.length) return "";
  const cols=[["base","Base"],["prorate","Bonus"],["roster","Roster"],

  const yi=yearIndex(p);
  return `<div class="ph"><h3>Contract</h3>
      <span class="sub">${fmtM(c.totalValue||c.apy*c.years)} over ${c.years} year${c.years===1?"":"s"}</span></div>
    <div class="statwrap"><table class="stat"><thead><tr><th>Year</th>
      ${used.map(x=>`<th>${x[1]}</th>`).join("")}<th>Cap hit</th><th>Gtd</th></tr></thead>
      <tbody>${c.hits.map((h,i)=>`<tr class="${i===yi?"tot":""}">
        <td>${h.year||S.year+i}</td>
        ${used.map(x=>`<td>${h[x[0]]?fmtM(h[x[0]]):"—"}</td>`).join("")}
        <td class="big">${fmtM(h.hit)}</td>
        <td>${h.guaranteed?fmtM(h.guaranteed):"—"}</td></tr>`).join("")}
      </tbody></table></div>
    <div class="pb tight"><p class="tiny dim">
      ${c.gtd?`${fmtM(c.gtd)} guaranteed. `:""}Figures from ${esc(c.source||"the real contract")}.
      ${c.sourceUrl?"":""}</p></div>`;
}
/* how sure anyone is of what this man actually is */
function confidenceLine(p){
  const v=p.ratingConfidence;
  if(v===undefined) return "";
  const word=v>=80?"His level is well established."
    :v>=60?"There's broad agreement on what he is."
    :v>=40?"Opinions on him vary."
    :"Nobody is very sure what they have here.";
  return `<div class="pb tight"><p class="tiny dim">${word}</p></div>`;
}

/* one real player, built from his row in the file */
function buildRosterPlayer(r){
  if(!r||!POS.includes(r.p)) return null;
  const realAge=clamp(Number(r.age!==undefined?r.age:(r.a!==undefined?r.a:25)),20,45);
  const realExp=clamp(Number(r.e!==undefined?r.e:Math.max(0,realAge-22)),0,22);
  const p=makePlayer(r.p, clamp(r.o,25,99), realAge, {exp:realExp, potGap:0});
  p.f=r.f; p.l=r.l;
  p.ovr=clamp(r.o,25,99);
  p.exp=realExp;
  p.ht=Number(r.h)||p.ht; p.wt=Number(r.w)||p.wt;
  for(const k in r.r) if(ATTRS.includes(k)) p.a[k]=clamp(r.r[k],25,99);
  p.hidden=p.hidden||{};
  p.hidden.pot=rosterCeiling(p,r);
  p.hidden.dev=devFromRoll(rnd());
  // Discipline is not part of the roster OVR scale. If supplied, preserve it;
  // otherwise scout it indirectly from awareness, rating confidence and a small noise band.
  const discSeed = Number(r.disc!==undefined?r.disc:(r.discipline!==undefined?r.discipline:NaN));
  p.hidden.disc = Number.isFinite(discSeed) ? clamp(Math.round(discSeed),35,99)
    : c99(68 + ((p.a.awr||60)-68)*.12 + ((Number(r.rating_confidence)||50)-50)*.08 + gauss(0,5));
  if(r.return_rating!==undefined) p.hidden.ret=clamp(Number(r.return_rating),35,99);
  if(r.ball_security!==undefined) p.hidden.ball=clamp(Number(r.ball_security),35,99);
  if(r.rating_confidence!==undefined)
    p.ratingConfidence=clamp(Number(r.rating_confidence),0,100);
  if(r.c) p.college=r.c;
  p.draft={archived:true, school:r.c||undefined, real:true};
  p.isProspect=false;
  return p;
}

/* ============================================================
   Putting an imported roster on the league's own scale
   ============================================================
   A file can be rated on any scale its author liked. The game judges
   everything against a league averaging LEAGUE_MEAN, so the whole set is
   shifted and stretched onto that — order and spacing preserved, only the
   scale changed. Attributes move with the rating so a man's worth at another
   position stays honest.                                                  */
function normaliseRoster(groups){
  const rows=[];
  for(const k in groups) rows.push(...groups[k]);
  if(rows.length<200) return;
  // judge the scale on the men who will actually make a roster, not the camp
  const kept=[];
  for(const k in groups)
    kept.push(...groups[k].slice().sort((a,b)=>b.o-a.o).slice(0,ROSTER_MAX));
  const o=kept.map(r=>Number(r.o)||0);
  const mean=avg(o);
  const sd=Math.sqrt(avg(o.map(v=>(v-mean)*(v-mean))))||1;
  const k=clamp(LEAGUE_SD/sd,0.55,1.8);
  // if it already sits on this scale, leave it alone
  if(Math.abs(mean-LEAGUE_MEAN)<1.2&&Math.abs(k-1)<0.12) return;
  for(const r of rows){
    const was=Number(r.o)||0;
    const now=clamp(Math.round(LEAGUE_MEAN+(was-mean)*k),25,99);
    r._shift=now-was;
    r.o=now;
    if(r.potential!==undefined&&Number(r.potential)>0)
      r.potential=clamp(Math.round(LEAGUE_MEAN+(Number(r.potential)-mean)*k),now,99);
    // the attributes carry the same move, or he'd be misjudged everywhere else
    if(r.r) for(const a in r.r) r.r[a]=clamp(Math.round(r.r[a]+r._shift),25,99);
  }
  const after=avg(rows.map(r=>r.o));
  news(`Ratings normalised to the league scale — the file averaged `+
       `${mean.toFixed(1)}, the league runs at ${after.toFixed(1)}.`,"info");
}

/* ---------- calibration execution guard ---------- */
const CALIBRATION_RUNTIME = {start:0, budgetMs:12000, completed:0, requested:0, aborted:false};
function calibrationStart(requested,budgetMs=12000){
  CALIBRATION_RUNTIME.start=performance.now();
  CALIBRATION_RUNTIME.budgetMs=budgetMs;
  CALIBRATION_RUNTIME.completed=0;
  CALIBRATION_RUNTIME.requested=requested;
  CALIBRATION_RUNTIME.aborted=false;
}
function calibrationYield(){ return new Promise(resolve=>setTimeout(resolve,0)); }
function calibrationShouldStop(){
  if(CALIBRATION_RUNTIME.aborted) return true;
  if(performance.now()-CALIBRATION_RUNTIME.start>=CALIBRATION_RUNTIME.budgetMs){
    CALIBRATION_RUNTIME.aborted=true;
    return true;
  }
  return false;
}
function calibrationProgress(label){
  const el=document.getElementById("calibration-progress");
  if(el) el.textContent=`${label} — ${CALIBRATION_RUNTIME.completed}/${CALIBRATION_RUNTIME.requested} games`;
}
function calibrationResultMeta(){
  return {completedGames:CALIBRATION_RUNTIME.completed,requestedGames:CALIBRATION_RUNTIME.requested,abortedByBudget:CALIBRATION_RUNTIME.aborted,elapsedMs:Math.round(performance.now()-CALIBRATION_RUNTIME.start)};
}
