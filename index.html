/* ---------- age curves ---------- */
const PEAK={QB:31,RB:25,WR:27,TE:28,LT:29,LG:29,C:30,RG:29,RT:29,EDGE:28,DT:29,LB:28,CB:27,S:28,K:34,P:34};
// The SLOPE past peak, not just the age it starts at. Backs fall off a cliff —
// research (Football Outsiders, Football Perspective) puts the real collapse
// within a year or two of 27-28. Quarterbacks, tackles and tight ends are the
// opposite: technique-driven positions that stay productive into their
// mid-to-late 30s. A flat decline rate for every position was the gap; this
// is the position half of aging, same way ATTR_AGE_DECAY is the attribute half.
const AGE_DECLINE_RATE={QB:0.65,RB:1.20,WR:0.90,TE:0.78,LT:0.78,LG:0.80,C:0.75,RG:0.80,RT:0.78,
  EDGE:0.98,DT:0.95,LB:0.98,CB:1.12,S:1.00,K:0.55,P:0.55};
// How fast each attribute moves relative to the blended delta. Real aging
// doesn't touch a player evenly: pure explosiveness goes first, technique and
// football IQ hold up far longer, and a thrower's arm fades well before his
// accuracy does. Growth (a young player developing) skews a little the other
// way — technique and awareness sharpen faster than the athleticism a man
// mostly arrives with already.
const ATTR_AGE_DECAY = {
  spd:1.65, acc:1.55, agi:1.45, jmp:1.55, elu:1.25, trk:1.10, str:1.05, dur:1.10,
  prs:0.90, tak:0.75, cov:0.85, rbk:0.55, pbk:0.60, rte:0.55, cth:0.60,
  thp:1.15, tha:0.55, awr:0.15
};
const ATTR_AGE_GROWTH = {
  spd:0.85, acc:0.90, agi:0.90, jmp:0.85, elu:0.95, trk:1.00, str:1.00, dur:0.50,
  prs:1.00, tak:0.95, cov:1.00, rbk:1.00, pbk:1.00, rte:1.05, cth:0.95,
  thp:0.75, tha:1.05, awr:1.40
};
function applyDelta(p,d){
  if(d===0) return;
  const w=OVRW[p.pos];
  const table = d<0 ? ATTR_AGE_DECAY : ATTR_AGE_GROWTH;
  for(const k in w){
    const mult = table[k]!==undefined ? table[k] : 1;
    p.a[k]=c99(p.a[k]+d*mult);
  }
  p.ovr=computeOVR(p.pos,p.a);
}
function progressPlayer(p,team){
  const coachDev = team&&team.staff.HC ? (team.staff.HC.dev*.5+(team.staff[POSGROUP[p.pos]==="o"?"OC":"DC"]||{dev:60}).dev*.5) : 60;
  const snaps = (p.stats.gp||0);
  const play = clamp(snaps/15,0,1);
  const peak = PEAK[p.pos];
  const devRate=[0.16,0.26,0.36,0.50,0.66][p.hidden.dev];
  let d=0;
  if(p.age<=peak){
    const room=p.hidden.pot-p.ovr;
    let traitDev = 1;
    if(hasTrait(p,"gymrat")) traitDev*=1.22;
    if(hasTrait(p,"film")) traitDev*=1.14;
    if(hasTrait(p,"coasts")) traitDev*=0.82;
    if(hasTrait(p,"motor")) traitDev*=1.06;
    const mood = 0.88 + moraleOf(p)/500;
    const fitBonus = 0.94 + schemeFit(p)/850;
    const f = devRate*(0.55+0.45*play)*(0.7+coachDev/200)*(0.75+p.hidden.wrk/260)
              *devMult(team)*traitDev*mood*fitBonus;
    d = room>0 ? room*f*rf(.6,1.4) : rf(-0.9,0.7);
    if(p.age<=23) d+= rf(0,1.0);
    if(p.exp>=5) d*=0.72;               // established men rarely take another jump
  } else {
    const over=p.age-peak;
    const declineRate=AGE_DECLINE_RATE[p.pos]!==undefined?AGE_DECLINE_RATE[p.pos]:1;
    // The position sets the average slope; this is the individual sitting on
    // it. 65 (the field's own mean) reproduces the position rate exactly, so
    // the league average is unchanged — two men at the same position and age
    // can still age nothing alike.
    const ac=p.hidden.agingCurve!==undefined?p.hidden.agingCurve:65;
    const personalAging=clamp(1.0+(65-ac)/62,0.5,1.7);
    d = -(1.32+over*1.05)*declineRate*personalAging*rf(.5,1.5) + (p.hidden.wrk-60)/60;
    if(p.hidden.dev>=3) d*=0.72;
    // "Coasts" is described as peaking before a contract and disappearing
    // after — that was only ever wired into growth and ceiling, never into
    // the actual falling-off. "Durable"/"injury prone" carry the same logic:
    // a body that holds up tends to hold up on the back end too.
    if(hasTrait(p,"coasts")) d*=1.22;
    if(hasTrait(p,"iron")) d*=0.85;
    if(hasTrait(p,"glass")) d*=1.12;
  }
  // injuries suppress
  if(p.injury>0) d-=1.2;
  d=clamp(d,-9,7.5);
  if(!team) d=Math.min(d,0)-rf(0.3,1.2);   // no facility, no coaching, no snaps
  const before=p.ovr;
  p.lastOvr=before;
  applyDelta(p,Math.round(d*10)/10);
  const gained=p.ovr-before;
  applyPotentialShift(p,team,gained);
  if(team) staffNoticeSynergies(p,team);
  return gained;
}
function retireCheck(p){
  const peak=PEAK[p.pos];
  let pr=0;
  if(p.age>=30) pr+=(p.age-29)*0.055;
  if(p.age>=34) pr+=0.18;
  if(p.ovr<62) pr+=0.16;
  if(p.ovr<55) pr+=0.30;
  if(p.age<28) pr=p.ovr<58?0.06:0.005;
  if(p.ovr>=82) pr*=0.45;
  if(p.pos==="K"||p.pos==="P") pr*=0.55;
  // a man nobody has signed in years stops waiting for the phone
  const idle=p.unsignedYears||0;
  if(idle>=1) pr+=0.10*idle*idle;
  return rnd()<clamp(pr,0,0.95);
}

/* ---------- roster ops ---------- */
/* what the books look like the moment after a release */
function capAfterRelease(p,team){
  const t=team||S.teams[p.teamId];
  if(!t||!p.contract) return capSpace(t||S.teams[0]);
  return capSpace(t)+capHit(p)-deadMoney(p);
}
function releasePlayer(p,team){
  const t=team||S.teams[p.teamId];
  const dead=deadMoney(p);
  const ceiling=S.cap*0.22;
  if(t.deadCap+dead>ceiling&&dead>S.cap*0.02){
    const now=Math.round(dead*0.5);
    t.deadCap+=now;
    t.deadCapNext=(t.deadCapNext||0)+(dead-now);   // the rest lands next season
  } else t.deadCap+=dead;
  t.roster=t.roster.filter(id=>id!==p.id);
  t.ir=(t.ir||[]).filter(id=>id!==p.id);
  t.ps=(t.ps||[]).filter(id=>id!==p.id);
  p.onIR=false; p.onPS=false;
  p.teamId=null; p.contract=null; p.holdout=false; p.holdoutWeeks=0;
  if(S.holdouts) S.holdouts=S.holdouts.filter(x=>x!==p.id);
  if(S.phase==="regular"&&capSpace(t)<0&&typeof enforceCap==="function") enforceCap(t);
  if(!S.freeAgents.includes(p.id)) S.freeAgents.push(p.id);
  autoDepth(t);
  return dead;
}
function addToTeam(p,t){
  // authoritative: a man belongs to exactly one club, on exactly one list
  for(const other of S.teams){
    if(other.id===t.id) continue;
    if(other.roster.includes(p.id)) other.roster=other.roster.filter(id=>id!==p.id);
    if((other.ir||[]).includes(p.id)) other.ir=other.ir.filter(id=>id!==p.id);
    if((other.ps||[]).includes(p.id)) other.ps=other.ps.filter(id=>id!==p.id);
  }
  t.ir=(t.ir||[]).filter(id=>id!==p.id);
  t.ps=(t.ps||[]).filter(id=>id!==p.id);
  p.onIR=false; p.onPS=false;
  S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
  p.teamId=t.id;
  if(!t.roster.includes(p.id)) t.roster.push(p.id);
  autoDepth(t);
}
function needScore(t,pos){
  const have=t.roster.map(id=>S.players[id]).filter(p=>p.pos===pos&&!p.retired).sort((a,b)=>b.ovr-a.ovr);
  const want=ROSTER_NEED[pos];
  const s1=have[0]?have[0].ovr:40, s2=have[1]?have[1].ovr:40;
  let n=(78-s1)*1.0 + (68-s2)*0.35 + Math.max(0,want-have.length)*7;
  n*= (POSVAL[pos]*0.55+0.6);
  return n;
}
function teamNeeds(t){
  return POS.map(pos=>({pos,n:needScore(t,pos)})).sort((a,b)=>b.n-a.n);
}
/* A position can look fine today and still be a real target — the starter
   is playing out his walk year and nobody behind him is ready. needScore
   alone only sees the roster as it stands right now; this adds the weight
   of who's about to leave it, scaled by how good he is (losing a great
   player is a bigger hole than losing a replaceable one), so scouting and
   draft advice reflects the roster a year from now, not just today's. */
function pendingFAWeight(t,pos){
  const leaving=t.roster.map(id=>S.players[id])
    .filter(p=>p&&p.pos===pos&&!p.retired&&p.contract&&p.contract.left<=1);
  return leaving.reduce((sum,p)=>sum+Math.max(0,p.ovr-62)*0.9,0);
}
function draftTargetScore(t,pos){
  return needScore(t,pos)+pendingFAWeight(t,pos);
}
function draftTargets(t,n){
  return POS.map(pos=>({pos,n:draftTargetScore(t,pos)}))
    .sort((a,b)=>b.n-a.n).slice(0,n||4).map(x=>x.pos);
}

/* ---------- free agency ---------- */
function faValue(p){ return marketAPY(p); }
function faDesire(p,t,offerAPY,years){
  const q=winPct(t)*30 + t.prestige*0.22;
  const playing = clamp(80-(unitRating(t,p.pos)-p.ovr)*1.4,20,120)*0.18;
  const money = offerAPY/1e6;
  return money*1.0 + q*0.10 + playing*0.10 + years*0.25 + rf(0,2.2);
}
function faMarkdown(p,round,rounds){
  // the longer a man goes unsigned, the less he holds out for
  const late=clamp((round+1)/rounds,0,1);
  const idle=clamp((p.unsignedYears||0)*0.12,0,0.30);
  return clamp(1-late*0.28-idle,0.45,1);
}
function runFreeAgency(rounds){
  rounds=rounds||6;
  for(let r=0;r<rounds;r++){
    const pool=S.freeAgents.map(id=>S.players[id]).filter(p=>p&&!p.retired).sort((a,b)=>b.ovr-a.ovr);
    if(!pool.length) break;
    for(const p of pool){
      const offers=[];
      // user offers are pre-registered
      const uo=S.userOffers[p.id];
      if(uo) offers.push({t:S.teams[S.userTeam],apy:uo.apy,years:uo.years,user:true});
      for(const t of S.teams){
        if(t.id===S.userTeam) continue;
        if(t.roster.length>=ROSTER_MAX+2) continue;
        const need=needScore(t,p.pos);
        // teams sitting well under the cap floor get pushed into the market
        const floorPush=clamp((S.cap*0.90-payroll(t))/(S.cap*0.32),0,1);
        // the bar to get involved falls as the market wears on
        const bar = (r<1?26 : r<2?18 : r<4?9 : 3) - floorPush*14;
        if(need<bar) continue;
        const mv=faValue(p)*faMarkdown(p,r,rounds);
        const space=capSpace(t);
        const bid=Math.round(mv*(0.86+t.ai.aggression*0.34+floorPush*0.50)*(1+clamp(need,0,60)/260));
        if(bid>space-(r<3?6e6:1.5e6)) continue;
        offers.push({t,apy:bid,years:contractYears(p),user:false});
      }
      if(!offers.length) continue;
      if(r<rounds-1 && offers.length===1 && !offers[0].user && chance(.45)) continue; // hold out
      let best=null,bs=-1e9;
      for(const o of offers){ const d=faDesire(p,o.t,o.apy,o.years); if(d>bs){bs=d;best=o;} }
      signPlayer(p,best.t.id,best.apy,best.years,rf(.35,.7));
      best.t.faGained=best.t.faGained||[]; if(p.ovr>=68) best.t.faGained.push(p.id);
      addToTeam(p,best.t);
      S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      delete S.userOffers[p.id];
      if(best.t.id===S.userTeam) news(`Signed ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr) — ${fmtM(best.apy)}/yr for ${best.years}`,"signing",p.id);
      else if(p.ovr>=80) news(`${best.t.city} signs ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr), ${fmtM(best.apy)}/yr`,"league",p.id);
    }
  }
}

/* ---------- pick value & trades ---------- */
function pickValue(round,slot){ // slot 1..32
  const overall=(round-1)*32+(slot||16);
  return Math.round(3000*Math.exp(-overall/38)+280*Math.exp(-overall/300));
}
function playerTradeValue(p){
  const young = clamp((30-p.age)/8,0,1);
  let v = Math.pow(Math.max(0,p.ovr-52),2.15)*1.05;
  v *= (0.55+0.75*young);
  v *= (POSVAL[p.pos]*0.5+0.62);
  if(p.hidden.dev>=3) v*=1.12;
  const capHit=p.contract?p.contract.apy:0;
  v -= capHit/1e6*11;
  return Math.max(20,Math.round(v));
}

/* ---------- season rollover ---------- */
function rollContracts(){
  for(const t of S.teams){
    t.deadCap=Math.round(t.deadCap*0.12)+(t.deadCapNext||0);
    t.deadCapNext=0;
    const keep=[];
    for(const id of t.roster){
      const p=S.players[id];
      if(!p.contract){keep.push(id);continue;}
      p.contract.left--;
      if(p.contract.left<=0){
        t.faLost=t.faLost||[]; if(p.ovr>=68) t.faLost.push(p.id);
        p.teamId=null; p.contract=null; S.freeAgents.push(p.id);
      } else keep.push(id);
    }
    t.roster=keep;
  }
}
function offseasonProgress(){
  const retirees=[];
  for(const p of Object.values(S.players)){
    if(p.retired||p.pos===undefined) continue;
    if(p.isProspect) continue;
    p.age++;
    if(p.teamId===null) p.unsignedYears=(p.unsignedYears||0)+1;
    else p.unsignedYears=0;
    p.exp++;
    p.career.gp+=(p.stats.gp||0);
    p.career.seasons++;
    const t=p.teamId!==null?S.teams[p.teamId]:null;
    progressPlayer(p,t);
    p.injury=0;p.injDesc="";
    if(retireCheck(p)){
      p.retired=true; p.lastTeam=t?t.abbr:(p.lastTeam||""); retirees.push(p);
      // Only the active roster was ever cleaned up here — a man who retired
      // while on IR or the practice squad stayed listed there forever, still
      // carrying his old teamId, which is exactly how a "retired" player can
      // still turn up as if he belongs to a team.
      if(t){
        t.roster=t.roster.filter(id=>id!==p.id);
        if(t.ir) t.ir=t.ir.filter(id=>id!==p.id);
        if(t.ps) t.ps=t.ps.filter(id=>id!==p.id);
      }
      p.teamId=null; p.onIR=false; p.onPS=false;
      S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      if(p.ovr>=78||p.accolades.length>2)
        news(`${p.pos} ${p.f} ${p.l} retires after ${p.career.seasons} `+
          `season${p.career.seasons===1?"":"s"}`,"league",p.id);
    }
    if(p.stats&&p.stats.gp){
      p.seasonLog=p.seasonLog||[];
      p.seasonLog.unshift({year:S.year,
        team:p.teamId!==null&&S.teams[p.teamId]?S.teams[p.teamId].abbr:"—",
        s:compactStatLine(p.stats)});
      if(p.seasonLog.length>14) p.seasonLog.length=14;
    }
    p.lastStats=p.stats; p.stats={};
  }
  return retirees;
}
function aiRosterCleanup(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    // cut bad contracts
    let guard=0;
    while(capSpace(t)<2e6 && guard++<40){
      const cands=t.roster.map(id=>S.players[id])
        .filter(p=>p.contract&&capHit(p)>2e6)
        .filter(p=>deadMoney(p)<capHit(p)*0.75)   // no point cutting a man you still have to pay
        .sort((a,b)=>((capHit(b)-deadMoney(b))/Math.max(1,playerTradeValue(b)))
                    -((capHit(a)-deadMoney(a))/Math.max(1,playerTradeValue(a))));
      if(!cands.length) break;
      releasePlayer(cands[0],t);
    }
    // fill holes with min contracts
    guard=0;
    while(t.roster.length<ROSTER_MAX && guard++<80){
      const need=teamNeeds(t)[0];
      const pool=S.freeAgents.map(id=>S.players[id]).filter(p=>p&&!p.retired&&p.pos===need.pos)
        .sort((a,b)=>b.ovr-a.ovr);
      let p=pool[0];
      if(!p){ p=makePlayer(need.pos,c99(gauss(58,4)),ri(23,28)); S.players[p.id]=p; }
      else S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
      signPlayer(p,t.id,minSalary(),1,.1); addToTeam(p,t);
    }
    while(t.roster.length>ROSTER_MAX){
      const worst=t.roster.map(id=>S.players[id]).sort((a,b)=>playerTradeValue(a)-playerTradeValue(b))[0];
      releasePlayer(worst,t);
    }
    autoDepth(t);
  }
}
function resetStandings(){
  for(const t of S.teams){
    t.history.push({year:S.year,w:t.w,l:t.l,t:t.t,pf:t.pf,pa:t.pa,
      champ:S.champion===t.id,playoffs:t.madePlayoffs});
    t.w=t.l=t.t=0;t.pf=t.pa=0;t.divW=t.divL=t.confW=t.confL=0;t.seed=0;t.madePlayoffs=false;
    t.postW=t.postL=t.postPf=t.postPa=0;
  }
}
function newDraftPicks(){
  for(const t of S.teams) t.picks=t.picks.filter(p=>p.year>S.year);
  // each year's picks are minted exactly once, league-wide, three drafts ahead
  S.seededYears=S.seededYears||[];
  for(const y of [S.year+1,S.year+2,S.year+3]){
    if(S.seededYears.indexOf(y)>=0) continue;
    S.seededYears.push(y);
    for(const t of S.teams) for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
  }
}
/* ============================================================
   Module 5: draft class, scouting fog-of-war, the draft itself
   ============================================================ */

const CLASS_POS = [["QB",16],["RB",22],["WR",40],["TE",18],["LT",12],["LG",12],["C",10],
  ["RG",12],["RT",12],["EDGE",34],["DT",30],["LB",28],["CB",34],["S",22],["K",4],["P",4]];

const OFF_SCHEMES=["air raid","triple option","spread","pro style","zone-run","gun option","pistol spread"];
const DEF_SCHEMES=["4-2-5 nickel","3-3-5","wide-9 front","two-gap 3-4","bear front","press-quarters","tite front"];
function collegeScheme(pos){
  return POSGROUP[pos]==="d" ? pick(DEF_SCHEMES)
       : POSGROUP[pos]==="o" ? pick(OFF_SCHEMES)
       : pick(OFF_SCHEMES.concat(DEF_SCHEMES));
}

/* projection: what the player is likely to become, blended with what he is now */
function projGrade(p){
  const potA=makeAttrs(p.pos,p.hidden.pot,3);
  return Math.round(p.ovr*0.40 + p.hidden.pot*0.60);
}

function combineFrom(p){
  const a=p.a;
  const forty = clamp(5.35-(a.spd-40)*0.0175-(a.acc-40)*0.0045+gauss(0,0.045),4.19,5.45);
  const vert  = clamp(20+(a.jmp-40)*0.42+gauss(0,1.6),22,46);
  const bench = clamp(4+(a.str-40)*0.42+gauss(0,2.4),4,42);
  const cone  = clamp(8.35-(a.agi-40)*0.0175+gauss(0,0.09),6.35,8.4);
  const broad = clamp(90+(a.jmp-40)*0.62+gauss(0,3),95,145);
  return {forty:+forty.toFixed(2),vert:Math.round(vert),bench:Math.round(bench),
    cone:+cone.toFixed(2),broad:Math.round(broad)};
}
function athScore(c,pos){
  // 0..100 relative athletic testing score
  const speed=clamp((5.05-c.forty)/0.75,0,1);
  const exp=clamp((c.vert-24)/20,0,1);
  const agi=clamp((8.2-c.cone)/1.5,0,1);
  const str=clamp((c.bench-8)/30,0,1);
  const w = (pos==="DT"||OL.includes(pos))?[.2,.2,.2,.4]:
            (pos==="CB"||pos==="WR")?[.42,.24,.28,.06]:[.34,.24,.24,.18];
  return Math.round((speed*w[0]+exp*w[1]+agi*w[2]+str*w[3])*100);
}

/* Where this league sits, so a class arrives on the same scale as the men
   already in it rather than on whatever scale the generator was written for. */
/* Where the class sits against the league. Rookies come in below the men
   already there; this holds that distance whatever scale the league is on. */
const ROOKIE_GAP=7;                       // how far a class sits below the league
function classOffset(){
  if(S.classOffset!==undefined) return S.classOffset;
  const men=S.teams.flatMap(t=>t.roster.map(id=>S.players[id]))
    .filter(p=>p&&!p.isProspect);
  const leagueMean = men.length>=400 ? avg(men.map(p=>p.ovr)) : LEAGUE_MEAN;
  // the generator's own class mean is about 63.5 before any shift
  S.classOffset=Math.round((leagueMean-ROOKIE_GAP-63.5)*10)/10;
  return S.classOffset;
}
/* No two classes are alike. Some years the room is full of players and some
   years the board runs out in the third round. */
function rollClassShape(){
  const strong=gauss(0,2.3) + (chance(.10)? (chance(.5)?3.2:-3.2) : 0);
  let depth=gauss(1,0.16);
  if(chance(.12)) depth = chance(.5)? rf(1.22,1.42) : rf(0.62,0.80);
  const top=chance(.14)? rf(1.5,2.6) : (chance(.14)? rf(0.35,0.7) : 1);
  S.classShape={
    strong:Math.round(strong*10)/10,
    depth:Math.round(clamp(depth,0.55,1.5)*100)/100,
    top:Math.round(clamp(top,0.3,2.8)*100)/100
  };
  return S.classShape;
}
function classShape(){ return S.classShape||rollClassShape(); }
function classWord(){
  const c=classShape();
  const s = c.strong>=2.2?"a strong class" : c.strong<=-2.2?"a weak class" : "an ordinary class";
  const d = c.depth>=1.18?"and a deep one" : c.depth<=0.8?"and a thin one" : "of usual depth";
  const t = c.top>=1.6?" There are real players at the top."
          : c.top<=0.65?" Nobody at the top of it excites anyone." : "";
  return `Regarded as ${s} ${d}.${t}`;
}
function makeProspect(){
  const pos=wpick(CLASS_POS);
  const age=wpick([[21,26],[22,46],[23,24],[24,4]]);
  const off=classOffset(), sh=classShape();
  // raw talent distribution — thin at the top, and shaped by the year
  let cur=c99(gauss(63+off+sh.strong, 7.5*sh.depth));
  if(chance(.06*sh.top)) cur=c99(gauss(74+off+sh.strong, 4));
  const gapRoll=Math.max(0,gauss(9,6.5)) + (age<=21?3:0);
  const p=makePlayer(pos,cur,age,{exp:0,potGap:gapRoll,spread:7.5});
  p.isProspect=true;

  const school=pickSchool();
  const tier=schoolTier(school);
  const ctx={
    school:school[0], tier, region:school[2],
    usage: clamp(gauss(0.85,0.16),0.30,1.0),
    scheme: collegeScheme(pos),
    fit:   clamp(gauss(0.86,0.15),0.35,1.0),
    mates: clamp(gauss(0.82,0.17),0.35,1.0),
    starts: ri(1,4),
    missed: wpick([[0,62],[2,18],[5,11],[9,6],[13,3]]),
    captain: chance(.22)
  };
  p.draft={ctx, combine:combineFrom(p), arch:"normal", tells:[], noteBank:[]};

  /* ---- archetype: the *cause* of any market mispricing ---- */
  const r=rnd();
  if(r<0.13){ // hidden gem — real talent the market can't see
    p.draft.arch="gem";
    const how=pick(["buried","badmates","misfit","smallschool","latebloom","postinjury","poortest"]);
    p.draft.how=how;
    if(how==="buried") ctx.usage=rf(.30,.52);
    if(how==="badmates") ctx.mates=rf(.32,.52);
    if(how==="misfit") ctx.fit=rf(.32,.55);
    if(how==="smallschool"){ const s=pick(SCHOOLS.filter(x=>x[1]>=4)); ctx.school=s[0];ctx.tier=4;ctx.region=s[2]; }
    if(how==="latebloom"){ ctx.starts=1; ctx.usage=clamp(ctx.usage,.45,.7); }
    if(how==="postinjury"){ ctx.missed=ri(7,14); }
    if(how==="poortest"){ // real skill, bad testing day
      const c=p.draft.combine;
      c.forty=+(c.forty+rf(.10,.24)).toFixed(2); c.vert-=ri(3,7); c.cone=+(c.cone+rf(.15,.4)).toFixed(2);
    }
    // and give him more real upside
    p.hidden.pot=c99(p.hidden.pot+ri(3,9));
    if(p.hidden.dev<2) p.hidden.dev=wpick([[2,60],[3,32],[4,8]]);
  } else if(r<0.26){ // overvalued — the market loves him more than the tape deserves
    p.draft.arch="fool";
    const how=pick(["testfreak","system","weakslate","bluehalo","stiff","character"]);
    p.draft.how=how;
    if(how==="testfreak"){ const c=p.draft.combine;
      c.forty=+(c.forty-rf(.11,.22)).toFixed(2); c.vert+=ri(4,8); c.cone=+(c.cone-rf(.2,.45)).toFixed(2); }
    if(how==="system"){ ctx.fit=1.0; ctx.mates=rf(.92,1.0); }
    if(how==="weakslate"){ ctx.usage=1.0; }
    if(how==="bluehalo"){ const s=pick(SCHOOLS.filter(x=>x[1]===1)); ctx.school=s[0];ctx.tier=1;ctx.region=s[2]; }
    if(how==="stiff"){ p.hidden.pot=c99(p.ovr+ri(0,2)); p.hidden.dev=0; }
    if(how==="character"){ p.hidden.chr=ri(20,42); p.hidden.wrk=ri(22,48); }
    // A real bust isn't a player who plateaus at his drafted grade — it's one
    // who looked the part on tape but genuinely can't get it done at this
    // level. Flooring his ceiling at p.ovr meant that outcome was structurally
    // impossible: every "fool" just stagnated at a mediocre-but-playable
    // level instead. A minority now get a real chance to fall hard, matching
    // the actual NFL history of complete first-round whiffs, not just
    // disappointments.
    if(chance(.15)) p.hidden.pot=c99(p.hidden.pot-ri(12,22));
    else p.hidden.pot=c99(Math.max(p.ovr-ri(0,3), p.hidden.pot-ri(3,10)));
    if(p.hidden.dev>1) p.hidden.dev=wpick([[0,50],[1,44],[2,6]]);
  }

  p.hidden.trueGrade = projGrade(p);

  /* ---- college production (what the public sees) ---- */
  const compAdj=[0,1.0,0.94,0.86,0.74][ctx.tier];
  const raw = (p.ovr-45)/45;
  let prod = clamp(raw*ctx.usage*ctx.fit*(0.55+0.45*ctx.mates)*(1/compAdj)*0.92 + gauss(0,.07),0,1.35);
  if(ctx.missed>6) prod*=0.72;
  p.draft.prod=+(prod).toFixed(3);
  p.draft.ath=athScore(p.draft.combine,pos);

  /* ---- raw public hype: production, brand, visible tape, résumé.
         Testing numbers are NOT in here yet — the combine hasn't happened. ---- */
  const brand=[0,86,70,54,36][ctx.tier];
  p.draft.hype = 0.46*(prod*100*0.86) + 0.24*brand + 0.20*p.ovr +
                 0.10*(ctx.starts*10 + (ctx.captain?6:0));
  p.draft.consensus = 60;

  buildNoteBank(p);
  return p;
}

function buildNoteBank(p){
  const c=p.draft.ctx, B=[], t=p.hidden.trueGrade, cons=p.draft.consensus;
  const add=(txt,req,k,truth,val)=>B.push({txt,req:req||"tape",k:k||25,truth:truth!==false,val:val||0});
  const S1=c.school;
  if(c.usage<0.6) add(`Rotational role at ${S1} — roughly half the snaps of the starter ahead of him. The per-snap numbers are a different story than the box score.`,"tape",20,true,1);
  if(c.mates<0.6) add(`Quarterback play around him was among the worst in the conference. He created almost everything himself.`,"tape",30,true,1);
  if(c.fit<0.6) add(`${S1} asked him to play a role that has nothing to do with what he'll be asked to do here. The ${c.scheme} scheme buried his best trait.`,"tape",30,true,1);
  if(c.tier>=4) add(`Level of competition is the whole argument. He was untouchable, but against opponents who won't play on Sundays.`,"tape",15,true,0);
  if(c.tier>=4 && t>cons+5) add(`Cross-checked him against the two power-conference tapes on his schedule. He was the best player on the field in both.`,"tape",55,true,2);
  if(c.missed>=7) add(`Missed ${c.missed} games over his career. Worth a hard look from the medical staff.`,"tape",20,true,-1);
  if(c.starts<=1) add(`One year of real starting experience. Everything is projection.`,"tape",15,true,0);
  if(c.captain) add(`Two-time captain. Teammates describe him running the room.`,"interview",20,true,1);

  if(p.draft.arch==="gem"){
    add(`The tape does not match the résumé. Grades out well above where the board has him.`,"tape",65,true,2);
    if(p.draft.how==="poortest") add(`Timed poorly, plays fast. Game speed and testing speed are two different things with him.`,"tape",45,true,2);
    if(p.draft.how==="postinjury") add(`Medicals are clean. The knee is a non-issue — full clearance, no arthritic changes.`,"medical",1,true,2);
    if(p.draft.how==="latebloom") add(`Only started taking the position seriously two years ago. The arrow is pointing straight up.`,"workout",1,true,2);
    if(p.draft.how==="buried") add(`Private workout confirmed it: the traits are a full tier above his college usage.`,"workout",1,true,2);
  }
  if(p.draft.arch==="fool"){
    add(`Workout numbers outrun the tape. Struggles when the play breaks down.`,"tape",55,true,-2);
    if(p.draft.how==="system") add(`Overwhelming majority of his production came schemed open. Very little of it was self-generated.`,"tape",45,true,-2);
    if(p.draft.how==="stiff") add(`Physically maxed out. What you see now is what you get in year four.`,"workout",1,true,-2);
    if(p.draft.how==="character") add(`Interview went sideways. Deflected on every question about the incident, blamed coaches for the benching.`,"interview",1,true,-2);
    if(p.draft.how==="weakslate") add(`Feasted on bad opponents. Against the two ranked teams on his schedule he disappeared.`,"tape",50,true,-2);
    if(p.draft.how==="bluehalo") add(`Benefits from the logo on the helmet. Was the fourth-best player on his own defense.`,"tape",60,true,-2);
  }
  if(p.hidden.wrk>=82) add(`Everyone at ${S1} tells the same story about his work habits. First in, last out.`,"interview",1,true,1);
  if(p.hidden.wrk<=42) add(`Two position coaches used the word "maintenance" without being asked.`,"interview",1,true,-2);
  if(p.hidden.chr<=42) add(`Character flags. Multiple sources described immaturity that will need managing.`,"interview",1,true,-2);
  if(p.hidden.inj>=68) add(`Body type and injury history suggest he'll miss time. Durability is a real risk.`,"medical",1,true,-2);
  if(p.hidden.inj<=32) add(`Never missed a practice. Built to hold up.`,"medical",1,true,1);
  if(p.hidden.dev>=3) add(`Rare learner. Coaches say he only needs to be told once.`,"workout",1,true,2);
  if(p.hidden.pot-p.ovr>=14) add(`Nowhere near his ceiling. Raw, but the traits are worth betting on.`,"workout",1,true,2);
  if(p.hidden.pot-p.ovr<=3) add(`Polished and ready, but there isn't much left to develop.`,"workout",1,true,0);
  // trait-level observations — always available, and always true
  const rel=POSATTRS[p.pos].filter(k=>k!=="dur");
  const ranked=rel.slice().sort((x,y)=>p.a[y]-p.a[x]);
  const best=ranked[0], second=ranked[1], worst=ranked[ranked.length-1];
  const strong=k=>{
    const v=p.a[k];
    return v>=85?`${ATTRNAME[k]} is a legitimate weapon — top of the class`:
           v>=75?`${ATTRNAME[k].toLowerCase()} is comfortably above the line`:
                 `${ATTRNAME[k].toLowerCase()} is his best trait, and it's ordinary`;
  };
  const weak=k=>{
    const v=p.a[k];
    return v<=45?`${ATTRNAME[k]} is a genuine problem. He will get exposed`:
           v<=58?`${ATTRNAME[k].toLowerCase()} needs work before he plays meaningful snaps`:
                 `${ATTRNAME[k].toLowerCase()} is the soft spot, though it isn't disqualifying`;
  };
  add(strong(best)+".","tape",22,true,p.a[best]>=82?1:0);
  add(`Second thing you notice: ${ATTRNAME[second].toLowerCase()} grades out at ${p.a[second]>=78?"a starter's level":p.a[second]>=66?"replacement level":"below the line"}.`,"tape",42,true,0);
  add(weak(worst)+".","tape",34,true,p.a[worst]<=52?-1:0);
  if(p.hidden.pot-p.ovr>=10) add(`Whatever he is now, he isn't finished. There's real growth left here.`,"tape",70,true,2);
  if(p.hidden.pot-p.ovr<=4) add(`He's a finished product. Draft him for what he is today.`,"tape",70,true,0);
  add(`Fits what we ask of the position. Nothing that jumps off the tape either way.`,"tape",10,true,0);
  p.draft.noteBank=B;
}
const HERRINGS=[
  "Loved him in the bowl game — might have been the best player on the field.",
  "Something about the way he carries himself. Locker room guy.",
  "Struggled badly in the second half of the season. Might have been worn down.",
  "Reminds me of a player I had in my last stop. Same build, same movement.",
  "Won't ever be a starter here. Special teams value only.",
  "Blew up the pro day. Every team in the building was talking about him after.",
  "Heard from a source at the school that other clubs have him circled.",
  "Hands are a problem. Counted four drops in the games I watched.",
  "Highest football IQ in the class at the position, full stop.",
  "The frame won't hold more weight. He's maxed out physically."

/* ---------- the consensus board ----------
   The league's shared opinion. Anchored to reality but compressed, noisy, and
   weighted toward what is easy to see: production, brand, and (after February)
   testing numbers. The gap between this and hidden.trueGrade is the whole game. */
function repriceBoard(useCombine){
  const list=S.prospects.map(id=>S.players[id]);
  if(!list.length) return;
  const raw=list.map(p=> useCombine
      ? p.draft.hype*0.66 + (p.draft.ath*0.62+22)*0.34
      : p.draft.hype);
  const m=avg(raw), sd=Math.sqrt(avg(raw.map(x=>(x-m)*(x-m))))||1;
  const tg=list.map(p=>p.hidden.trueGrade);
  const tm=avg(tg), tsd=Math.sqrt(avg(tg.map(x=>(x-tm)*(x-tm))))||1;
  list.forEach((p,i)=>{
    p.draft.consensus=clamp(Math.round(tm+(raw[i]-m)/sd*tsd*0.88+gauss(0,2.4)),32,97);
  });
  const grades=list.map(p=>({id:p.id,pos:p.pos,g:p.draft.consensus}));
  for(const p of list)
    p.draft.stock = draftStock(p.draft.consensus, p.pos, scarcityEdge(p,grades));
  list.slice().sort((a,b)=>b.draft.stock-a.draft.stock)
      .forEach((p,i)=>{p.draft.rank=i+1;});
}

/* ---------- class + scouting state ---------- */
function generateDraftClass(){
  rollClassShape();
  S.prospects=[];
  const n=278;
  for(let i=0;i<n;i++){
    const p=makeProspect();
    S.players[p.id]=p;
    S.prospects.push(p.id);
  }
  repriceBoard(false);
  // per-prospect stable evaluation error so your grade drifts toward truth, not jitters
  S.scout={};
  for(const id of S.prospects){
    S.scout[id]={k:0,notes:[],acts:{},err:gauss(0,1),scoutIds:[],medical:false,interview:false,workout:false};
  }
  // AI team boards
  for(const t of S.teams) buildAIBoard(t);
  S.classYear=S.year;
}
function buildAIBoard(t){
  t.board={};
  const skill=t.ai.scoutSkill;
  for(const id of S.prospects){
    const p=S.players[id];
    const blend=0.22+0.66*skill;
    const noise=gauss(0,13*(1-skill)+2.5);
    t.board[id]=p.hidden.trueGrade*blend + p.draft.consensus*(1-blend) + noise;
  }
}

/* ---------- your scouts ---------- */
function scoutBiasFor(p,sc){
  const d=p.draft;
  return sc.bias.athlete*((d.ath-55)/22) + sc.bias.school*((3-d.ctx.tier)/1.5) +
         sc.bias.prod*((d.prod-0.55)/0.35) + sc.bias.flat;
}
const GRADE_FLOOR=30, GRADE_CEIL=99;
function myGrade(pid){
  const p=S.players[pid], r=S.scout[pid];
  if(!r) return null;
  const k=r.k;
  // how far you trust your own eyes over the league's board
  const w = Math.pow(k/100,0.62);
  // even a finished workup leaves real uncertainty — nobody scouts a man perfectly
  const sd = 4.0 + 13*Math.pow(1-k/100,1.20);
  const scouts=r.scoutIds.map(i=>S.teams[S.userTeam].scouts.find(s=>s.id===i)).filter(Boolean);
  const bias = scouts.length? avg(scouts.map(s=>scoutBiasFor(p,s))) : 0;
  const own = p.hidden.trueGrade + r.err*sd + bias*(1-k/240);
  const est = own*w + p.draft.consensus*(1-w);
  const ana = analyticsEdge(S.teams[S.userTeam]);
  const band = (3.2 + 17*Math.pow(1-k/100,1.15))*(1-0.35*ana);
  return {est:clamp(est,30,99), band, k, lo:clamp(est-band,28,99), hi:clamp(est+band,30,99)};
}
const ACTIONS={
  tape:    {name:"Study tape",       cost:3,  gain:16, desc:"All-22 from the season. Your area men file these by the hundred."},
  game:    {name:"Scout live",       cost:6,  gain:30, desc:"Send somebody to see him play."},
  interview:{name:"Interview",       cost:4,  gain:10, desc:"Character, work habits, football intelligence."},
  medical: {name:"Medical check",    cost:3,  gain:8,  desc:"Injury history and long-term durability."},
  workout: {name:"Private workout",  cost:7,  gain:20, desc:"Bring him in. Reveals how much room is left to grow."}
};
function doScout(pid,action,scoutId){
  const t=S.teams[S.userTeam], r=S.scout[pid], p=S.players[pid];
  const A=ACTIONS[action];
  if(!A||!r) return {ok:false,msg:"Unavailable."};
  if(t.scoutPts<A.cost) return {ok:false,msg:`Not enough scouting hours — need ${A.cost}.`};
  const sc=t.scouts.find(s=>s.id===scoutId)||t.scouts[0];
  if(!sc) return {ok:false,msg:"No scouts on staff."};
  if((r.acts[action]||0)>= (action==="tape"?5: action==="game"?3:1))
    return {ok:false,msg:`${A.name} already exhausted for this prospect.`};
  t.scoutPts-=A.cost;
  r.acts[action]=(r.acts[action]||0)+1;
  if(!r.scoutIds.includes(sc.id)) r.scoutIds.push(sc.id);
  let mult=(0.62+sc.acc/150)*(1+0.05*(facLvl(t,"scoutdept")-1));
  if(sc.region&&sc.region===p.draft.ctx.region) mult*=1.22;
  if(sc.posSpec&&sc.posSpec.includes(p.pos)) mult*=1.20;
  r.k=clamp(r.k+A.gain*mult,0,100);
  if(action==="medical") r.medical=true;
  if(action==="interview") r.interview=true;
  if(action==="workout") r.workout=true;
  // the right kind of work turns up what a man is actually like
  if(typeof revealTrait==="function"&&(p.traits||[]).length){
    const window={medical:["glass","iron"],interview:["diva","leader","coasts","fragile"],
                  tape:["motor","clutch","fragile"],game:["motor","clutch"],
                  workout:["gymrat","iron","motor"]}[action]||[];
    const eye=clamp(sc.eye/140,0.15,0.75);
    for(const k of p.traits){
      if(!window.includes(k)) continue;
      if(rnd()<eye&&revealTrait(p,k))
        r.notes.push({txt:`${sc.name} on his makeup: ${TRAITS[k].name.toLowerCase()}.`,
                      src:sc.name, truth:true, val:0});
    }
  }
  // reveal notes
  const found=[];
  const pool=p.draft.noteBank.filter(n=>
     (n.req===action || (action==="game"&&n.req==="tape")) &&
     r.k>=n.k && !r.notes.some(x=>x.txt===n.txt));
  const nreveal = action==="tape"?1:2;
  for(let i=0;i<nreveal;i++){
    if(!pool.length) break;
    const falseChance=clamp((0.42-sc.eye/220)*(1-0.30*analyticsEdge(t)),0.02,0.40);
    if(rnd()<falseChance){
      let h=null;
      for(let tries=0;tries<6&&!h;tries++){ const c=pick(HERRINGS);
        if(!r.notes.some(x=>x.txt===c)) h=c; }
      if(h){ r.notes.push({txt:h,src:sc.name,truth:false,val:0}); found.push(h); }
      else { const n=pool.splice(Math.floor(rnd()*pool.length),1)[0];
             r.notes.push({txt:n.txt,src:sc.name,truth:true,val:n.val}); found.push(n.txt); }
    } else {
      const n=pool.splice(Math.floor(rnd()*pool.length),1)[0];
      r.notes.push({txt:n.txt,src:sc.name,truth:true,val:n.val});
      found.push(n.txt);
    }
  }
  return {ok:true,msg:`${A.name}: ${sc.name} filed a report.`,found};
}

/* ---------- draft order & the draft ---------- */
function buildDraftOrder(){
  const nonPlayoff=sortTeams(S.teams.filter(t=>!t.madePlayoffs)).reverse();
  const playoff=S.teams.filter(t=>t.madePlayoffs);
  const finish=id=>{
    if(S.champion===id) return 100;
    const r=S.playoffs.rounds;
    let best=0;
    r.forEach(x=>{ if(x.winner===id) best=Math.max(best,x.label.includes("Championship")?90:x.label.includes("Divisional")?70:50);
                   if(x.loser===id) best=Math.max(best,x.label.includes("Championship")?80:x.label.includes("Divisional")?60:40);});
    return best;
  };
  const po=playoff.slice().sort((a,b)=> finish(a)-finish(b) || winPct(a)-winPct(b));
  const order=[...nonPlayoff,...po].map(t=>t.id);
  S.draftOrder=[];
  const N=S.teams.length;
  for(let r=1;r<=7;r++){
    for(let i=0;i<N;i++){
      const teamId=order[i];
      const owner=S.teams.find(t=>t.picks.some(pk=>pk.year===S.year+1&&pk.round===r&&pk.orig===teamId&&!pk.comp));
      S.draftOrder.push({round:r,slot:i+1,orig:teamId,team:owner?owner.id:teamId,pid:null});
    }
    // compensatory selections hang off the end of their round
    let extra=0;
    for(const t of S.teams)
      for(const pk of t.picks.filter(p=>p.comp&&p.year===S.year+1&&p.round===r)){
        extra++;
        S.draftOrder.push({round:r,slot:N+extra,orig:pk.orig,team:t.id,pid:null,comp:true});
      }
  }
  S.draftOrder.forEach((s,i)=>{ s.overall=i+1; });
  S.draftIdx=0;
}
/* A man far clear of everyone else at his position is worth reaching for, even
   at a spot nobody normally spends a pick on — that is how a safety goes tenth. */
function scarcityEdge(p,grades){
  const peers=(grades||[]).filter(x=>x.pos===p.pos&&x.id!==p.id)
    .map(x=>x.g).sort((a,b)=>b-a);
  const next=peers.length?peers[0]:0;
  const g=(grades||[]).find(x=>x.id===p.id);
  const gap=(g?g.g:0)-next;
  // only a real gulf counts, and only for a man who is genuinely good
  if(gap<6||(g?g.g:0)<78) return 0;
  return clamp((gap-6)*0.9,0,9);
}
function aiPickValue(t,p,grades){
  const g=t.board[p.id];
  const need=needScore(t,p.pos);
  const fit = typeof schemeDraftBonus==="function" ? schemeDraftBonus(t,p) : 0;
  const rare = grades ? scarcityEdge(p,grades)*(1-t.ai.draftBPA*0.3) : 0;
  return draftStock(g,p.pos,rare) + need*(0.34-t.ai.draftBPA*0.22)
       + fit*(1-t.ai.draftBPA*0.5) + gauss(0,2.2);
}
function trimDraftRecord(p){
  if(p.draft){ delete p.draft.noteBank; delete p.draft.hype; }
}
/* once a man is three years a pro, keep the facts and drop the file */
function archiveDraftRecord(p){
  const d=p.draft;
  if(!d||d.archived) return 0;
  const before=JSON.stringify(d).length;
  const keep={
    archived:true,
    year:d.year, round:d.round, pick:d.pick, pickedAt:d.pickedAt,
    undrafted:d.undrafted, userEst:d.userEst,
    school:(d.ctx&&d.ctx.school)||d.school,
    region:(d.ctx&&d.ctx.region)||d.region,
    consensus:d.consensus!==undefined?Math.round(d.consensus):undefined
  };
  for(const k in keep) if(keep[k]===undefined) delete keep[k];
  p.draft=keep;
  return before-JSON.stringify(keep).length;
}
function makeDraftPick(pickObj,pid){
  const t=S.teams[pickObj.team], p=S.players[pid];
  pickObj.pid=pid;
  p.isProspect=false;
  trimDraftRecord(p);
  const rec=S.scout&&S.scout[pid];
  if(rec&&rec.k>=8){ const mg=myGrade(pid); if(mg) p.draft.userEst=Math.round(mg.est); }
  p.draft.pickedAt=pickObj.overall;
  p.draft.pickedRound=pickObj.round;
  p.draft.pickedSlot=pickObj.slot;
  p.draft.pickedBy=t.id;
  p.draft.pickedYear=S.year+1;
  signPlayer(p,t.id,rookieAPY(pickObj.overall-1),ROOKIE_YEARS,pickObj.round===1?1:0.6);
  p.rookieDeal=true;
  if(pickObj.round===FIFTH_YEAR_ROUND) p.fifthYear={available:true, from:S.year+ROOKIE_YEARS};
  addToTeam(p,t);
  S.prospects=S.prospects.filter(x=>x!==pid);
  if(t.id===S.userTeam) news(`Drafted ${p.pos} ${p.f} ${p.l}, ${p.draft.ctx.school} — round ${pickObj.round}, pick ${pickObj.slot}`,"draft",p.id);
  else if(pickObj.round===1) news(`${t.city} takes ${p.pos} ${p.f} ${p.l} (${p.draft.ctx.school}) at ${ordinal(pickObj.overall)}`,"draft",p.id);
}
function aiDraftPick(pickObj){
  const t=S.teams[pickObj.team];
  const avail=S.prospects.map(id=>S.players[id]);
  if(!avail.length) return false;
  if(t.roster.length>=ROSTER_MAX+8){ // still drafts, just BPA
  }
  let best=null,bv=-1e9;
  const grades=avail.map(x=>({id:x.id,pos:x.pos,g:t.board[x.id]||0}));
  for(const p of avail){ const v=aiPickValue(t,p,grades); if(v>bv){bv=v;best=p;} }
  makeDraftPick(pickObj,best.id);
  return true;
}
function advanceDraftToUser(){
  const picks=[];
  while(S.draftIdx<S.draftOrder.length){
    const pk=S.draftOrder[S.draftIdx];
    if(pk.team===S.userTeam) break;
    const before=pk.pid;
    aiDraftPick(pk); picks.push(pk); S.draftIdx++;
    const p=S.players[pk.pid];
    if(p){
      const r=S.scout[p.id], g=r?myGrade(p.id):null;
      if(r&&r.k>=30&&g&&g.est-p.draft.consensus>=6)
        news(`${S.teams[pk.team].abbr} takes ${p.pos} ${p.l} at ${ordinal(pk.overall)} — our board had him ${Math.round(g.est-p.draft.consensus)} points higher than the league did.`,"draft",p.id);
    }
    if(!S.prospects.length) break;
  }
  return picks;
}
function udfaSigning(){
  const rest=S.prospects.map(id=>S.players[id])
    .filter(p=>p&&p.teamId===null)          // anyone already signed is not on the market
    .sort((a,b)=>b.draft.consensus-a.draft.consensus);
  for(const p of rest){
    p.isProspect=false;
    trimDraftRecord(p);
    const teams=S.teams.filter(t=>t.roster.length<ROSTER_MAX+16&&capSpace(t)>MIN_SALARY*2);
    if(!teams.length||chance(.25)){ S.freeAgents.push(p.id); continue; }
    const t=teams.sort((a,b)=>needScore(b,p.pos)-needScore(a,p.pos))[Math.floor(rnd()*3)]||teams[0];
    signPlayer(p,t.id,minSalaryFor(p),3,.02); p.rookieDeal=true; addToTeam(p,t);
  }
  S.prospects=[];
}

function draftHindsight(p){
  return {trueGrade:p.hidden.trueGrade, consensus:p.draft.consensus,
    gap:p.hidden.trueGrade-p.draft.consensus};
}

    data-arg="${key}" data-arg2="${col}|${defDir||"desc"}">${label}<i class="ar">${
      on?(st.dir<0?"▼":"▲"):"·"}</i></th>`;
}
function applySort(key,rows,getters,defCol,defDir){
  const st=sortState(key,defCol,defDir);
  const g=getters[st.col];
  if(!g) return rows;
  return rows.slice().sort((a,b)=>{
    const x=g(a), y=g(b);
    const c = (typeof x==="string"||typeof y==="string")
      ? String(x).localeCompare(String(y))
      : ((x||0)-(y||0));
    return st.dir*c;
  });
}

/* ============================ STAT LEDGER RECONCILIATION ============================ */
let LEDGER_CACHE={sig:"",result:null};
function ledgerGames(){ return (S.schedule||[]).filter(g=>g&&g.played&&g.gamebook&&Array.isArray(g.gamebook.plays)); }
function ledgerSignature(games){
  // O(number of completed games), never O(number of plays). Detailed ledgers are not touched here.
  let out=`${games.length}|${S.__saveRev||0}`;
  for(const g of games){
    const b=g.gamebook;
    out+=`|${g.gamebookId||g.id}:${b?.version||0}:${Array.isArray(b?.plays)?b.plays.length:0}:${g.gamebookSeq||0}:${g.hs}:${g.as}`;
  }
  return out;
}
function invalidateLedgerCache(){ LEDGER_CACHE={sig:"",result:null}; }
function ledgerReconcile(){
  const games=ledgerGames();
  const sig=ledgerSignature(games);
  if(LEDGER_CACHE.result&&LEDGER_CACHE.sig===sig) return LEDGER_CACHE.result;
  const by={};
  const add=(id,k,v=1)=>{ if(id===null||id===undefined||!Number.isFinite(v)||!S.players[id]) return; const x=by[id]||(by[id]={}); x[k]=(x[k]||0)+v; };
  const teamBy={};
  const tadd=(tid,k,v=1)=>{ if(tid===null||tid===undefined||!Number.isFinite(v))return; const x=teamBy[tid]||(teamBy[tid]={}); x[k]=(x[k]||0)+v; };
  for(const g of games){
    for(const p of g.gamebook.plays){
      if(p.kind==="penalty") continue;
      const passAttempt=!!(p.kind==="pass"&&p.passResult?.attempted&&!p.sack);
      const completion=!!(passAttempt&&p.passResult?.completion);
      const interception=!!(passAttempt&&p.passResult?.interception);
      if(p.qb!=null&&p.kind==="pass"){
        add(p.qb,"dropbacks",1);
        if(passAttempt) add(p.qb,"pa",1);
        if(completion) add(p.qb,"pc",1);
        if(interception) add(p.qb,"pint",1);
        if(p.passResult?.drop) add(p.qb,"drop",1);
        if(completion) add(p.qb,"py",p.gain||0);
        if(p.sack){ add(p.qb,"sk",1); add(p.qb,"sackY",Math.abs(Math.min(0,p.gain||0))); }
        if(p.pressured) add(p.qb,"press",1);
        if(p.hurry) add(p.qb,"hrryFaced",1);
        if(p.hit) add(p.qb,"hitFaced",1);
        tadd(p.off,"pa",passAttempt?1:0); tadd(p.off,"pc",completion?1:0); tadd(p.off,"pint",interception?1:0);
        if(completion)tadd(p.off,"py",p.gain||0);
      }
      if(p.receiver!=null&&passAttempt){
        add(p.receiver,"tgt",1);
        if(completion){ add(p.receiver,"rec",1); add(p.receiver,"recy",p.gain||0); }
        if(p.passResult?.drop) add(p.receiver,"drop",1);
        if(p.td&&completion) add(p.receiver,"rectd",1);
      }
      if(p.runner!=null&&p.kind==="run"){
        add(p.runner,"ra",1); add(p.runner,"ry",p.gain||0);
        if(p.td) add(p.runner,"rtd",1);
      }
      if(p.primaryDef!=null&&passAttempt){
        add(p.primaryDef,"tgtDef",1);
        if(completion){add(p.primaryDef,"cmpDef",1);add(p.primaryDef,"ydsDef",p.gain||0);}
        if(interception)add(p.primaryDef,"int",1);
        if(!completion&&!interception)add(p.primaryDef,"pd",1);
      }
      if(p.pressureRusher!=null&&p.kind==="pass"){
        add(p.pressureRusher,"pressSnaps",1);
        if(p.pressured) add(p.pressureRusher,"press",1);
        if(p.sack){ add(p.pressureRusher,"sak",1); add(p.pressureRusher,"qbHit",1); }
        if(p.hurry) add(p.pressureRusher,"hrry",1);
        if(p.hit) add(p.pressureRusher,"qbHit",1);
      }
      if(p.turnover) tadd(p.off,"turnovers",1);
      if(p.td) tadd(p.off,"td",1);
    }
  }
  const checks=[];
  const fields=["pa","pc","pint","drop","tgt","rec","recy","rectd","ra","ry","rtd","sk","sackY","press","pressSnaps","hrry","qbHit","tgtDef","cmpDef","ydsDef","int","pd"];
  for(const id in by){ const p=S.players[id], r=by[id], s=p.stats||{};
    for(const k of fields){ const a=Number(s[k]||0),b=Number(r[k]||0); if(a!==b) checks.push({id:+id,name:`${p.f} ${p.l}`,stat:k,stats:a,ledger:b,diff:a-b}); }
  }
  const teamChecks=[];
  for(const g of games){
    for(const tid of [g.home,g.away]){
      const ts=g.gamebook.teamStats?.[tid]; if(!ts) continue;
      const derived=g.gamebook.plays.filter(p=>p.off===tid&&(p.kind==="pass"||p.kind==="run"));
      const yards=derived.reduce((n,p)=>p.kind==="pass"?(n+(p.passResult?.completion?(p.gain||0):0)):(n+(p.gain||0)),0);
      const passAtt=derived.filter(p=>p.kind==="pass"&&p.passResult?.attempted&&!p.sack).length;
      const completions=derived.filter(p=>p.kind==="pass"&&p.passResult?.attempted&&!p.sack&&p.passResult?.completion).length;
      const rushAtt=derived.filter(p=>p.kind==="run").length;
      const rushYds=derived.filter(p=>p.kind==="run").reduce((n,p)=>n+(p.gain||0),0);
      const sacks=derived.filter(p=>p.kind==="pass"&&p.sack).length;
      const ints=derived.filter(p=>p.kind==="pass"&&p.passResult?.interception&&!p.sack).length;
      const tests=[["yards",ts.yards||0,yards],["pass attempts",ts.passAtt||0,passAtt],["completions",ts.completions||0,completions],["rush attempts",ts.rushAtt||0,rushAtt],["rush yards",ts.rushYds||0,rushYds],["sacks",ts.sacks||0,sacks],["ints",ts.ints||0,ints]];
      for(const [kind,stored,derivedVal] of tests) if(stored!==derivedVal) teamChecks.push({week:g.week,team:S.teams[tid]?.abbr||tid,kind,stored,derived:derivedVal});
    }
  }
  const scoreChecks=[];
  for(const g of games){
    for(const tid of [g.home,g.away]){
      const pts=(g.gamebook?.scoring||[]).filter(x=>x.team===tid).reduce((n,x)=>n+(x.points||0),0);
      const final=tid===g.home?g.hs:g.as;
      if(pts!==final) scoreChecks.push({week:g.week,team:S.teams[tid]?.abbr||tid,kind:"scoring",stored:final,derived:pts});
    }
  }
  const result={games:games.length,playerMismatches:checks.slice(0,100),playerMismatchCount:checks.length,teamMismatches:teamChecks,scoreMismatches:scoreChecks,ok:checks.length===0&&teamChecks.length===0&&scoreChecks.length===0};
  LEDGER_CACHE={sig,result};
  return result;
}
function statIntegrityPanel(){
  const r=ledgerReconcile();
  const tone=r.ok?"good":"bad";
  return `<div class="panel"><div class="ph"><div><h3>Stat integrity</h3><span class="sub">${r.games} gamebooks reconciled</span></div><button class="chip" data-act="ledgerrefresh">Refresh audit</button></div><div class="pb">
    <div class="statgrid"><div class="stat"><b>${r.ok?"PASS":"CHECK"}</b><span>Ledger status</span></div><div class="stat"><b>${r.playerMismatchCount}</b><span>Player mismatches</span></div><div class="stat"><b>${r.teamMismatches.length}</b><span>Team mismatches</span></div><div class="stat"><b>${r.scoreMismatches.length}</b><span>Score mismatches</span></div></div>
    ${r.ok?`<p class="small good">Every audited player and team total agrees with the play ledger.</p>`:`<div class="scroll"><table><thead><tr><th>Player</th><th>Stat</th><th class="n">Stats</th><th class="n">Ledger</th><th class="n">Diff</th></tr></thead><tbody>${r.playerMismatches.slice(0,12).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stat}</td><td class="n">${x.stats}</td><td class="n">${x.ledger}</td><td class="n">${x.diff}</td></tr>`).join("")}</tbody></table></div>`}
  </div></div>`;
}

   Holds the franchise constant and changes only one starter's role attributes.
   This is diagnostic: it never writes the experiment results into season stats. */
let IMPACT_LAB_BUSY=false;
const IMPACT_LAB_ATTRS={
  QB:["tha","awr","thp","spd","elu"], WR:["cth","rte","spd","acc","elu","rbk"],
  LT:["pbk","rbk","str","awr"], RB:["elu","spd","acc","trk","str"],
  EDGE:["prs","spd","acc","str"], DT:["prs","str","tak","awr"],
  CB:["cov","spd","acc","agi","awr"], S:["cov","spd","tak","awr","str"]
};
function impactSnapshot(){
  const raw=serialiseState();
  return JSON.parse(raw);
}
function impactRestore(snap){ S=JSON.parse(JSON.stringify(snap)); invalidateLedgerCache(); }
function impactMetric(g,role){
  const ours=g.home===S.userTeam?g.home:g.away;
  const opp=g.home===S.userTeam?g.away:g.home;
  const oursPts=ours===g.home?g.hs:g.as, oppPts=opp===g.home?g.hs:g.as;
  const ots=g.gamebook?.teamStats?.[ours]||{}, otsOpp=g.gamebook?.teamStats?.[opp]||{};
  const defensive=["EDGE","DT","CB","S"].includes(role);
  return {points:defensive?oppPts:oursPts,yards:defensive?(otsOpp.totalYds||otsOpp.yards||0):(ots.totalYds||ots.yards||0),
    passYards:defensive?(otsOpp.passYds||otsOpp.py||0):(ots.passYds||ots.py||0),rushYards:defensive?(otsOpp.rushYds||0):(ots.rushYds||0)};
}
async function runImpactLab(role,reps=100){
  if(IMPACT_LAB_BUSY) return null;
  if(!IMPACT_LAB_ATTRS[role]) return null;
  IMPACT_LAB_BUSY=true;
  const snap=impactSnapshot();
  const team=S.teams[S.userTeam], opponent=S.teams.find(t=>t.id!==S.userTeam);
  const basePlayer=healthyStarter(team,role,0);
  if(!basePlayer||!opponent){ IMPACT_LAB_BUSY=false; return null; }
  const pid=basePlayer.id;
  const out={role,player:`${basePlayer.f} ${basePlayer.l}`,reps,low:null,elite:null,delta:null};
  for(const level of [55,99]){
    let sum={points:0,yards:0,passYards:0,rushYards:0};
    for(let i=0;i<reps;i++){
      impactRestore(snap); RNG=mulberry32((snap.seed>>>0)+i*7919+level*131+role.length*17);
      const p=S.players[pid]; if(!p){continue;}
      for(const k of IMPACT_LAB_ATTRS[role]) p.a[k]=level;
      p.ovr=computeOVR(role,p.a); p._at=null;
      const g={id:`impact-${role}-${level}-${i}`,home:team.id,away:opponent.id,week:S.week,played:false,gamebookId:null,hs:0,as:0};
      simGame(g,true);
      const m=impactMetric(g,role); for(const k in sum) sum[k]+=m[k];
      if((i%3)===2) await new Promise(r=>setTimeout(r,0));
    }
    out[level===55?"low":"elite"]=Object.fromEntries(Object.entries(sum).map(([k,v])=>[k,+(v/reps).toFixed(2)]));
  }
  out.delta={}; for(const k of Object.keys(out.low)) out.delta[k]=+(out.elite[k]-out.low[k]).toFixed(2);
  impactRestore(snap); IMPACT_LAB_BUSY=false;
  S.calibrationLab=S.calibrationLab||{}; S.calibrationLab[role]=out; S.__dirty=true; render();
  return out;
}

        return `<tr class="${mine?"mine":""}">
          <td><span class="${aw?"":"muted"}">${esc(A.abbr)}</span>
            <span class="dim">at</span> <span class="${hw?"":"muted"}">${esc(H.abbr)}</span></td>
          <td class="n">${g.played?`${g.as}–${g.hs}`:"—"}</td></tr>`;}).join("")}</tbody></table>`;
  } else {
    const rows=[];
    for(const t of S.teams) for(const h of t.history) if(h.champ) rows.push([h.year,t]);
    rows.sort((a,b)=>b[0]-a[0]);
    body=rows.length?`<div class="ph"><h3>Champions</h3></div><table><tbody>${rows.map(r=>
      `<tr class="click" data-act="team" data-arg="${r[1].id}"><td class="n">${r[0]}</td>
      <td>${esc(r[1].city)} ${esc(r[1].name)}</td></tr>`).join("")}</tbody></table>`
      :`<div class="pb muted">No champion crowned yet.</div>`;
    if(S.playoffs&&S.playoffs.rounds.length){
      body=`<div class="ph"><h3>${S.year} playoffs</h3></div><table><tbody>${
        S.playoffs.rounds.map(r=>`<tr><td class="small">${esc(r.label)}</td>
        <td>${esc(S.teams[r.winner].abbr)} <span class="num">${r.ws}</span>
        <span class="dim">over</span> ${esc(S.teams[r.loser].abbr)} <span class="num">${r.ls}</span></td></tr>`).join("")
      }</tbody></table>`+body;
    }
  }
  return `<div class="panel"><div class="pb"><div class="chips">${tabs.map(([k,l])=>
    `<button class="chip" aria-pressed="${V.leagueTab===k}" data-act="leaguetab" data-arg="${k}">${l}</button>`).join("")}</div></div>
    <div class="pb tight">${body}</div></div>`;
};

function gradeLetter(g){
  if(g>=88) return "blue chip"; if(g>=82) return "top 15";
  if(g>=76) return "first round"; if(g>=71) return "day two";
  if(g>=65) return "day three"; if(g>=58) return "late flier";
  return "priority free agent";
}
function tierMark(t){return ["","blue blood","major","mid-major","small school"][t];}

/* ============================ SCOUTING ============================ */
function collegeMapPanel(){
  const top=schoolStanding(8);
  const risen=SCHOOLS.filter(s=>(S.schoolW[s[0]]||s[3])>s[3]*1.35).map(s=>s[0]);
  const gone=SCHOOLS.filter(s=>s[3]>=8&&(S.schoolW[s[0]]||s[3])<s[3]*0.62).map(s=>s[0]);
  const word=["blue chip","strong","solid","small"];
  return `<div class="panel"><div class="ph"><h3>Where the players are coming from</h3>
      <span class="sub">our people's beat</span></div>
    <div class="pb tight"><table class="stat"><tbody>${top.map((s,i)=>`<tr>
      <td>${i+1}. ${esc(s[0])} <span class="dim">${esc(s[2])}</span></td>
      <td class="dim">${word[schoolTier(s)-1]}</td></tr>`).join("")}
    </tbody></table></div>
    ${risen.length||gone.length?`<div class="pb tight"><p class="tiny dim">${
      risen.length?`On the rise: ${risen.slice(0,3).map(esc).join(", ")}. `:""}${
      gone.length?`Gone quiet: ${gone.slice(0,3).map(esc).join(", ")}.`:""}</p></div>`:""}

}
const SCREENS_SCOUT=function(){
  const t=S.teams[S.userTeam];
  if(!S.prospects.length&&S.phase!=="draft")
    return `<div class="panel"><div class="pb">
      <h2>No class on the board</h2>
      <p class="muted">Next year's class is posted when the season kicks off.</p></div></div>`
      + collegeMapPanel();
  let list=S.prospects.map(id=>S.players[id]);
  if(V.scoutPos!=="ALL") list=list.filter(p=>p.pos===V.scoutPos||
    (V.scoutPos==="OL"&&OL.includes(p.pos))||(V.scoutPos==="DB"&&(p.pos==="CB"||p.pos==="S")));
  if(V.scoutOnly==="scouted") list=list.filter(p=>S.scout[p.id].k>0);
  if(V.scoutOnly==="gems") list=list.filter(p=>{const g=myGrade(p.id);
    return S.scout[p.id].k>=25 && g.est-p.draft.consensus>=4;});
  const sortFn={
    board:(a,b)=>a.draft.rank-b.draft.rank,
    mine:(a,b)=>myGrade(b.id).est-myGrade(a.id).est,
    gap:(a,b)=>(myGrade(b.id).est-b.draft.consensus)*(S.scout[b.id].k>15?1:0)
              -(myGrade(a.id).est-a.draft.consensus)*(S.scout[a.id].k>15?1:0),
    known:(a,b)=>S.scout[b.id].k-S.scout[a.id].k
  }[V.scoutSort];
  list=list.slice().sort(sortFn).slice(0,90);
  const posFilters=["ALL","QB","RB","WR","TE","OL","EDGE","DT","LB","DB"];
  const rows=list.map(p=>{
    const r=S.scout[p.id], g=myGrade(p.id);

        <br><span class="dim tiny">${known?`±${Math.round(g.band)}`:"unseen"}</span></td>
      <td class="n">${known&&Math.abs(gap)>=3?`<span class="tag ${gap>0?"gold":"red"}">${gap>0?"+":""}${Math.round(gap)}</span>`:""}
        <div class="meter" style="margin-top:4px"><i style="width:${Math.round(r.k)}%"></i></div></td>
    </tr>`;}).join("");
  return `<div class="panel"><div class="pb tight">
      <p class="small"><b>The ${S.year+1} class.</b> ${esc(classWord())}</p></div></div>`
    + collegeMapPanel()
    + `<div class="panel">
    <div class="ph"><h2>Scouting</h2><span class="sub">${Math.round(t.scoutPts)} hours banked · +${scoutBudget(t)}/week</span></div>
    <div class="pb small muted">Worth targeting: ${draftTargets(t,4).join(", ")} — current holes and starters on expiring deals.</div>
    <div class="pb stack">
      <div class="chips">${posFilters.map(p=>
        `<button class="chip" aria-pressed="${V.scoutPos===p}" data-act="spos" data-arg="${p}">${p}</button>`).join("")}</div>
      <div class="row wrap">
        <button class="btn sm" data-act="sweep">Area sweep <span class="dim">45h</span></button>
        <span class="tiny dim">A shallow look at twenty names at once.</span>
      </div>
      ${staffButtonsFor("scout")}
      <div class="row wrap">
        <select data-act="ssort">
          <option value="board" ${V.scoutSort==="board"?"selected":""}>Sort: consensus board</option>
          <option value="mine" ${V.scoutSort==="mine"?"selected":""}>Sort: my grade</option>
          <option value="gap" ${V.scoutSort==="gap"?"selected":""}>Sort: value gap</option>
          <option value="known" ${V.scoutSort==="known"?"selected":""}>Sort: most scouted</option>
        </select>
        <select data-act="sonly">
          <option value="all" ${V.scoutOnly==="all"?"selected":""}>Everyone</option>
          <option value="scouted" ${V.scoutOnly==="scouted"?"selected":""}>Scouted only</option>
          <option value="gems" ${V.scoutOnly==="gems"?"selected":""}>My risers</option>
        </select>
      </div>
    </div>
    <div class="scroll"><table><thead><tr><th>Bd</th><th></th><th>Prospect</th>
      <th class="n">Grade</th><th class="n">vs board</th></tr></thead>
      <tbody>${rows||`<tr><td class="muted" colspan="5">Nobody matches that filter.</td></tr>`}</tbody></table></div>
  </div>`;
};

function prospectSheet(pid){
  const p=S.players[pid], r=S.scout[pid], g=myGrade(pid), t=S.teams[S.userTeam];
  const c=p.draft.combine, ctx=p.draft.ctx;
  const known=r.k>=18;
  const GLO=GRADE_FLOOR, GHI=GRADE_CEIL, SPAN=GHI-GLO;
  const pos=v=>clamp((v-GLO)/SPAN*100,0,100);
  const bandLeft=pos(g.lo), bandW=clamp(pos(g.hi)-bandLeft,1,100-bandLeft);
  const estL=pos(g.est);
  const combineKnown = S.phase==="predraft"||S.phase==="draft"||S.phase==="postdraft";
  const acts=Object.keys(ACTIONS).map(k=>{
    const A=ACTIONS[k], usedMax=k==="tape"?5:k==="game"?3:1;
    const used=(r.acts[k]||0);
    const off=used>=usedMax||t.scoutPts<A.cost;
    return `<button class="btn sm" data-act="doscout" data-arg="${pid}" data-arg2="${k}" ${off?"disabled":""}>
      ${A.name} <span class="dim">${A.cost}h</span>${used?` <span class="tag">${used}/${usedMax}</span>`:""}</button>`;
  }).join(" ");
  const notes=r.notes.length?r.notes.map(n=>
    `<div class="note ${n.val>0?"tell":n.val<0?"warn":""}">${esc(n.txt)}
      <div class="src">— ${esc(n.src)}</div></div>`).join(""):
    `<p class="muted small">No reports filed. Send someone to look at him.</p>`;
  return `
  <div class="sh">
    <div>${posTag(p.pos)} <b>${esc(p.f)} ${esc(p.l)}</b>
      <div class="dim small">${esc(ctx.school)} · ${tierMark(ctx.tier)} · ${ctx.region}</div></div>
    <button class="x" data-act="closesheet">×</button>
  </div>
  <div class="sb stack">
    <div class="row"><button class="chip" data-act="boardadd" data-arg="${pid}">Add to our board</button></div>
    <div class="panel"><div class="pb stack">
      <div class="spread"><span class="muted small">Board consensus</span>
        <span><b class="num">${p.draft.consensus}</b> <span class="dim small">${gradeLetter(p.draft.consensus)} · #${p.draft.rank}</span></span></div>
      <div class="spread"><span class="muted small">Our grade</span>
        <span>${known?`<b class="num">${Math.round(g.est)}</b> <span class="dim small">± ${Math.round(g.band)}</span>`:`<span class="dim">not evaluated</span>`}</span></div>
      ${known?`<div class="band"><i style="left:${bandLeft}%;width:${bandW}%"></i>
        <u style="left:${estL}%"></u></div>
        <div class="spread tiny dim"><span>${GRADE_FLOOR}</span><span>${
          r.k>=85?"we know him":r.k>=55?"a fair read":r.k>=25?"early days":"barely looked"
        }</span><span>${GRADE_CEIL}</span></div>`:""}
      ${known&&Math.abs(g.est-p.draft.consensus)>=4?
        `<p class="small" style="margin:0">${g.est>p.draft.consensus?
          `We have him <b>${Math.round(g.est-p.draft.consensus)} points above</b> where the league has him.`:
          `We have him <b>${Math.round(p.draft.consensus-g.est)} points below</b> the board. Someone will take him before we would.`}</p>`:""}
    </div></div>

    <div class="panel"><div class="ph"><h3>Reports</h3><span class="sub">${r.notes.length} filed</span></div>
      <div class="pb stack">${notes}</div></div>

    ${(S.rumors&&S.rumors.length)?`<div class="panel">
      <div class="ph"><h3>The rumor mill</h3>
        <span class="sub">${(S.rumorReliability||0.5)>=0.75?"our sources are good"
          :(S.rumorReliability||0.5)>=0.55?"our sources are mixed":"take all of it lightly"}</span></div>
      <div class="pb stack">${S.rumors.map((r,i)=>`<div class="note">
        <div class="small">${esc(r.txt)}</div>
        ${r.checked?`<div class="tiny ${r.true_?"good":"warn"}">Ran it down — it ${r.verdict}.</div>`
          :`<button class="mini" data-act="rumorcheck" data-arg="${i}">Run it down (6h)</button>`}
      </div>`).join("")}
      <p class="tiny dim">Better analytics and a bigger department mean fewer stories that turn out to be nothing.</p>
      </div></div>`:""}
    <div class="panel"><div class="ph"><h3>Assign work</h3>
      <span class="sub">${Math.round(t.scoutPts)}h left</span></div>
      <div class="pb stack">
        <select data-act="setscout">${t.scouts.map(s=>
          `<option value="${s.id}" ${S.activeScout===s.id?"selected":""}>${esc(s.name)}${s.region?` · ${s.region}`:" · national"}${s.posSpec?` · ${s.posSpec[0]}s`:""}</option>`).join("")}</select>
        <div class="chips">${acts}</div>
        <p class="tiny dim" style="margin:0">Scouts differ. A regional scout learns his own area faster; a scout with a poor eye will file reports that aren't true.</p>
      </div></div>

    <div class="panel"><div class="ph"><h3>The file</h3></div><div class="pb">
      <table><tbody>
        <tr><td class="muted">Age / size</td><td class="n">${p.age} · ${Math.floor(p.ht/12)}-${p.ht%12}, ${p.wt}</td></tr>
        <tr><td class="muted">Career starts</td><td class="n">${ctx.starts} ${ctx.starts===1?"season":"seasons"}</td></tr>
        <tr><td class="muted">Games missed</td><td class="n">${ctx.missed}</td></tr>
        <tr><td class="muted">College scheme</td><td class="n">${esc(ctx.scheme)}</td></tr>
        <tr><td class="muted">Production score</td><td class="n">${Math.round(p.draft.prod*100)}</td></tr>
        ${combineKnown?`<tr><td class="muted">Forty</td><td class="n">${c.forty.toFixed(2)}</td></tr>
        <tr><td class="muted">Vertical / broad</td><td class="n">${c.vert}" · ${c.broad}"</td></tr>
        <tr><td class="muted">Three cone</td><td class="n">${c.cone.toFixed(2)}</td></tr>

        :`<tr><td class="muted">Combine</td><td class="n dim">not until February</td></tr>`}
        ${r.medical?`<tr><td class="muted">Durability</td><td class="n">${p.hidden.inj>62?"concern":p.hidden.inj>40?"average":"excellent"}</td></tr>`:""}
        ${r.interview?`<tr><td class="muted">Work ethic</td><td class="n">${p.hidden.wrk>75?"outstanding":p.hidden.wrk>50?"solid":"questionable"}</td></tr>
        <tr><td class="muted">Character</td><td class="n">${p.hidden.chr>70?"no concerns":p.hidden.chr>45?"minor flags":"real concerns"}</td></tr>`:""}
        ${r.workout?`<tr><td class="muted">Room to grow</td><td class="n">${p.hidden.pot-p.ovr>12?"substantial":p.hidden.pot-p.ovr>5?"some":"limited"}</td></tr>`:""}
      </tbody></table>
    </div></div>
    ${S.phase==="draft"&&onClock()&&onClock().team===S.userTeam?
      `<button class="btn primary big" data-act="pick" data-arg="${pid}">Draft ${esc(p.l)}</button>`:""}
  </div>`;
}

/* ============================ PLAYER SHEET ============================ */
function findCoachByPlayerId(pid){
  for(const t of S.teams) for(const role of ["HC","OC","DC","SD"])
    if(t.staff[role]&&t.staff[role].playerId===pid) return {c:t.staff[role],team:t};
  for(const c of (S.staffMarket||[])) if(c.playerId===pid) return {c,team:null};
  return null;
}
function playerSheet(pid){
  const p=S.players[pid];
  if(p.isProspect) return prospectSheet(pid);
  const t=p.teamId!==null?S.teams[p.teamId]:null;
  const own=t&&t.id===S.userTeam;
  const s=p.stats||{}, ls=p.lastStats||{};
  // A retired player who's since become a coach still exists as his own
  // record (his career stats and Hall of Fame case depend on it) — but
  // nothing used to say so. Without this, a coach and the retired man he
  // used to be look like two unrelated people who just share a name.
  const coaching=p.coached?findCoachByPlayerId(pid):null;
  const line=st=>{
    const out=[];
    if(st.pa) out.push(`${st.pc}/${st.pa}, ${st.py} yds, ${st.ptd||0} TD, ${st.pint||0} int`);
    if(st.ra) out.push(`${st.ra} car, ${st.ry} yds, ${st.rtd||0} TD`);
    if(st.rec) out.push(`${st.rec} rec, ${st.recy} yds, ${st.rectd||0} TD`);
    if(st.tkl) out.push(`${st.tkl} tkl, ${st.sak||0} sk, ${st.int||0} int, ${st.pd||0} pd`);
    if(st.fga) out.push(`${st.fgm}/${st.fga} FG`);
    return out.join(" · ");
  };
  const numbers=statHeadline(p)+statTablesFor(p);
  const attrs=POSATTRS[p.pos].map(k=>`
    <div class="spread" style="gap:10px"><span class="small" style="width:110px">${ATTRNAME[k]}</span>

      <span class="num small" style="width:22px;text-align:right">${p.a[k]}</span></div>`).join("");
  const dr=p.draft&&p.draft.pickedAt?`round ${p.draft.pickedRound||Math.ceil(p.draft.pickedAt/S.teams.length)}, pick ${p.draft.pickedSlot||((p.draft.pickedAt-1)%S.teams.length)+1} (${p.draft.pickedYear||""})`:
    p.draft?"undrafted":"";
  return `
  <div class="sh"><div>${posTag(p.pos)} <b>${esc(p.f)} ${esc(p.l)}</b>
    <div class="dim small">${t?`<span class="click ul" data-act="gototeam" data-arg="${t.id}">${esc(t.city)} ${esc(t.name)}</span>`:"Free agent"} · age ${p.age} · ${p.exp===0?"rookie":p.exp+" yrs"}</div>
    ${coaching?`<div class="tiny gold">Now coaching: ${esc(coaching.c.role)}${coaching.team?` for ${esc(coaching.team.abbr)}`:" (on the market)"}</div>`:""}</div>
    <button class="x" data-act="closesheet">×</button></div>
  <div class="sb stack">
    <div class="row"><button class="chip" data-act="addcompare" data-arg="${pid}">Compare</button></div>
    <div class="grid3">
      <div class="stat"><b class="midnum">${p.ovr}</b><span>Overall</span></div>
      <div class="stat"><b>${Math.floor(p.ht/12)}-${p.ht%12}</b><span>${p.wt} lbs</span></div>
      <div class="stat"><b>${p.contract?fmtM(p.contract.apy):"—"}</b><span>${p.contract?p.contract.left+" yrs left":"unsigned"}</span></div>
    </div>
    ${p.injury>0?`<div class="panel"><div class="pb"><span class="tag red">Out ${p.injury} weeks</span>
      <span class="small"> ${esc(p.injDesc)}</span></div></div>`:""}
    <div class="panel"><div class="ph"><h3>Attributes</h3></div><div class="pb stack">${attrs}</div></div>
    ${(()=>{ const ct=contractTable(p); return ct?`<div class="panel">${ct}</div>`:""; })()}
    ${confidenceLine(p)}
    ${numbers?`<div class="panel"><div class="ph"><h3>Production</h3>
      <span class="sub">${(p.seasonLog||[]).length+((p.stats&&p.stats.gp)?1:0)} season${
        ((p.seasonLog||[]).length+((p.stats&&p.stats.gp)?1:0))===1?"":"s"}</span></div>
      ${numbers}</div>`:`<div class="panel"><div class="pb muted small">He hasn't played a down yet.</div></div>`}
    ${p.accolades.length?`<div class="panel"><div class="ph"><h3>Honors</h3></div><div class="pb">
      ${p.accolades.slice(-8).reverse().map(a=>`<div class="small">${a.year} — ${esc(a.award)}</div>`).join("")}</div></div>`:""}
    ${p.draft&&p.draft.ctx?`<div class="panel"><div class="pb small muted">
      ${esc(p.draft.ctx.school)}${dr?" · "+dr:""}</div></div>`:""}
    ${(()=>{
      const kn=knownTraits(p), hidden=(p.traits||[]).length-kn.length;
      const m=moraleOf(p), fit=schemeFit(p);
      const side=POSGROUP[p.pos];
      return `<div class="panel"><div class="ph"><h3>The man</h3></div><div class="pb">
        <div class="row spread"><span class="small">Mood</span>
          <span class="small"><b>${moraleWord(m)}</b></span></div>
        <div class="meter"><i class="${m>=70?"green":m>=45?"":"red"}" style="width:${m}%"></i></div>
        ${side!=="s"?`<div class="row spread" style="margin-top:6px"><span class="small">Scheme fit</span>
          <span class="small"><b>${fitWord(fit)}</b></span></div>
          <div class="meter"><i class="${fit>=58?"green":fit>=44?"":"red"}" style="width:${fit}%"></i></div>`:""}
        <div style="margin-top:8px">${kn.length?kn.map(k=>
          `<div class="note"><div class="small"><b>${TRAITS[k].name}</b></div>

          :`<p class="tiny dim">Nothing has shown up in the file yet.</p>`}
          ${hidden?`<p class="tiny dim">${hidden} thing${hidden>1?"s":""} about him we haven't seen yet.</p>`:""}
        </div>
        ${(()=>{

        </div></div>`;})()}
    ${p.contract?`<div class="pb tight"><p class="tiny dim">${structureLabel(p)} ·

        ${own?`<p class="tiny dim" style="margin-top:4px">Tap a row to move him there — this is a permanent switch, meant for filling a roster hole, not a preview.</p>`:""}</div>`;})()}

function boxScoreRows(g,tid){
  const plays=g.gamebook?.plays||[];
  const pass={}, rush={}, rec={}, def={}, kicks={};
  const add=(o,id,k,v=1)=>{if(id==null||!S.players[id])return; const x=o[id]||(o[id]={id}); x[k]=(x[k]||0)+v;};
  for(const p of plays){
    if(p.off===tid && p.kind==="pass" && p.passResult?.attempted && !p.sack){
      add(pass,p.qb,"att");
      if(p.passResult.completion){add(pass,p.qb,"cmp");add(pass,p.qb,"yds",p.gain||0);}
      if(p.passResult.interception)add(pass,p.qb,"int");
      if(p.passResult.drop)add(pass,p.qb,"drop");
      if(p.td)add(pass,p.qb,"td");
      if(p.receiver!=null){add(rec,p.receiver,"tgt"); if(p.passResult.completion){add(rec,p.receiver,"rec");add(rec,p.receiver,"yds",p.gain||0);} if(p.passResult.drop)add(rec,p.receiver,"drop"); if(p.td)add(rec,p.receiver,"td");}
    }
    if(p.off===tid && p.kind==="run" && p.runner!=null){add(rush,p.runner,"car");add(rush,p.runner,"yds",p.gain||0);if(p.td)add(rush,p.runner,"td");}
    if(p.kind==="pass" && p.def===tid){
      if(p.primaryDef!=null && p.passResult?.attempted && !p.sack){add(def,p.primaryDef,"tgt"); if(p.passResult.completion){add(def,p.primaryDef,"cmp");add(def,p.primaryDef,"yds",Math.max(0,p.gain||0));} if(p.passResult.interception)add(def,p.primaryDef,"int");}
      if(p.pressureRusher!=null){if(p.sack)add(def,p.pressureRusher,"sk");if(p.hurry)add(def,p.pressureRusher,"hry");if(p.hit)add(def,p.pressureRusher,"hit");if(p.pressured)add(def,p.pressureRusher,"prs");}
    }
  }
  const fmt=o=>Object.values(o).sort((a,b)=>((b.yds||0)-(a.yds||0))||((b.tgt||0)-(a.tgt||0)));
  return {pass:fmt(pass),rush:fmt(rush),rec:fmt(rec),def:fmt(def),kicks:fmt(kicks)};
}
function gamebookTeamDerived(g,tid){
  const plays=g.gamebook?.plays||[];
  const rows=plays.filter(p=>p.off===tid && (p.kind==="pass"||p.kind==="run"));
  const scrimmage=rows.filter(p=>p.kind!=="penalty");
  const pass=rows.filter(p=>p.kind==="pass"), runs=rows.filter(p=>p.kind==="run");
  const passAtt=pass.filter(p=>p.passResult?.attempted&&!p.sack);
  const completions=passAtt.filter(p=>p.passResult?.completion).length;
  const sacks=pass.filter(p=>p.sack).length;
  const ints=passAtt.filter(p=>p.passResult?.interception).length;
  const rushYds=runs.reduce((n,p)=>n+(p.gain||0),0);
  const passYds=passAtt.filter(p=>p.passResult?.completion).reduce((n,p)=>n+Math.max(0,p.gain||0),0);
  const totalYds=rushYds+passYds;
  const firstDowns=rows.filter(p=>!p.sack && !p.repeatDown && (p.gain||0)>=Math.max(1,p.toGo||1)).length;
  const third=rows.filter(p=>p.down===3);
  const thirdConv=third.filter(p=>!p.repeatDown && ((p.gain||0)>=(p.toGo||1) || p.td)).length;
  const fourth=rows.filter(p=>p.down===4);
  const fourthConv=fourth.filter(p=>!p.repeatDown && ((p.gain||0)>=(p.toGo||1) || p.td)).length;
  const turnovers=rows.filter(p=>p.turnover).length;
  const penalties=plays.filter(p=>p.off===tid&&p.kind==="penalty").length;
  const penaltyYds=plays.filter(p=>p.off===tid&&p.kind==="penalty").reduce((n,p)=>n+Math.abs(p.penaltyYards||p.gain||0),0);
  const td=plays.filter(p=>p.off===tid&&p.td).length;
  return {plays:scrimmage.length,passAtt:passAtt.length,completions,passYds,rushAtt:runs.length,rushYds,totalYds,firstDowns,thirdAtt:third.length,thirdConv,fourthAtt:fourth.length,fourthConv,turnovers,sacks,ints,td,penalties,penaltyYds};
}
function gamebookScoreSummary(g,tid){ return (g.gamebook?.scoring||[]).filter(x=>x.team===tid); }
function gamebookQuarterScores(g,tid){
  const out={1:0,2:0,3:0,4:0,OT:0};
  for(const x of gamebookScoreSummary(g,tid)){ const q=Number(x.q); const k=q>=5?"OT":(q||1); out[k]=(out[k]||0)+(x.points||0); }
  return out;
}

    // Capture what he's worth at the new spot before touching p.pos — ovrAtRaw
    // reads his CURRENT position to judge how big a jump this is, so this has
    // to happen first, not after.
    const newOvr=ovrAtRaw(p,newPos);

    // He keeps the same amount of room to grow, just measured from his new
    // floor — a permanent move, not a one-week look, so his ceiling moves
    // with him rather than staying pinned to the job he's leaving.
    const room=(p.hidden.pot||p.ovr)-p.ovr;

    if(t.scoutPts<45){toast("Not enough hours for a sweep.");return;}
    const sc=t.scouts.find(x=>x.id===S.activeScout)||t.scouts[0];
    let pool=S.prospects.map(id=>S.players[id]).filter(p=>S.scout[p.id].k<55);
    if(V.scoutPos!=="ALL") pool=pool.filter(p=>p.pos===V.scoutPos||
      (V.scoutPos==="OL"&&OL.includes(p.pos))||(V.scoutPos==="DB"&&(p.pos==="CB"||p.pos==="S")));

    pool=pool.slice(0,20);
    if(!pool.length){toast("Nobody left to sweep.");return;}
    t.scoutPts-=45;

    for(const p of pool){

      let g=7*(0.6+sc.acc/150);
      if(sc.region&&sc.region===p.draft.ctx.region) g*=1.3;
      r.k=clamp(r.k+g,0,100);

      // A sweep used to just count how many names looked interesting and
      // throw the number away — the player had no way to know who, short of
      // re-scanning the whole board by hand afterward.
      if(myGrade(p.id).est-p.draft.consensus>=6) flagged.push(p);
    }
    const names=flagged.map(p=>`${p.pos} ${p.l}`);
    toast(`${sc.name} looked at ${pool.length} names${flagged.length?`; worth another look: ${names.join(", ")}`:""}.`);

  sim4:()=>{ for(let i=0;i<4&&S.phase==="regular"&&S.week<=WEEKS;i++) advance(); },
  simseason:()=>{
    // The full 25-week loop ran as one uninterrupted synchronous block —
    // measured at ~6.6 seconds of continuous main-thread work, well past
    // where a browser tab shows a "page unresponsive" prompt. Nothing could
    // paint during that time even though the game state was changing
    // underneath, because a browser only repaints when the JS thread
    // actually yields back to it — calling render() every week doesn't help
    // if the loop never lets the browser use it. Breaking it into small
    // chunks with a real yield between each one fixes both problems at
    // once: the page stays responsive, and the person watching sees the
    // season actually advance instead of a frozen screen that jumps to the
    // end.
    toast("Simulating to the playoffs…");
    const chunk=3;
    function stepChunk(){
      let g=0;
      while(g<chunk && S.phase==="regular" && S.week<=WEEKS){ advance(); g++; }
      render();
      if(S.phase==="regular" && S.week<=WEEKS) setTimeout(stepChunk,0);
    }
    setTimeout(stepChunk,0);
  },

document.addEventListener("click",e=>{
  // form controls speak through the change event — a click here would re-render
  // the page and close the dropdown before the user could choose anything
  if(e.target.closest("select,option,input,textarea")) return;
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const fn=ACT[el.dataset.act];
  if(fn){
    V.scrollY=window.scrollY;
    // Nothing between a click and its handler used to catch a thrown error —
    // one bad ACT call would just vanish with no explanation, leaving the
    // person staring at a screen that silently did nothing. Every action now
    // fails into a message instead of into the void.
    try{ fn(el.dataset.arg,el.dataset.arg2,e); }
    catch(err){ console.error(el.dataset.act,err); toast("That didn't go through — try again."); }
  }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const fn=ACT[el.dataset.act];
  if(fn){
    try{ fn(el.dataset.arg,el.dataset.arg2,e); }
    catch(err){ console.error(el.dataset.act,err); toast("That didn't go through — try again."); }
  }
  if(e.target.id==="importer") importSave(e.target.files[0]);
  if(e.target.id==="rosterfile") importRoster(e.target.files[0]);
});
