<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Front Office</title>
<style>
:root{
  --paper:#E3E2D3; --paper2:#EDECE2; --card:#F3F2E9;
  --ink:#1C2833; --ink2:#57616B; --ink3:#8A9099;
  --field:#2E5E4E; --field2:#3F7A66;
  --red:#A32B2B; --gold:#9C7220; --blue:#2B4E7A;
  --rule:#C7C4B2; --rule2:#D9D7C8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:19px} h3{font-size:16px}
a{color:var(--blue)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
header{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#EFEEE4;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex; align-items:center; gap:10px;
  border-bottom:3px solid var(--field);
}
header .crest{width:34px;height:34px;border-radius:2px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:14px;color:#fff}
.backbtn{width:34px;height:34px;flex:0 0 34px;border-radius:5px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);color:#fff;font-size:22px;line-height:1;cursor:pointer;
  display:grid;place-items:center;padding:0 0 3px}
.backbtn:active{background:rgba(255,255,255,.16)}
header .who{flex:1;min-width:0}
header .who b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who span{font-size:11.5px;color:#A9B4BC}
header .cap{text-align:right;font-family:var(--mono);font-size:12px;line-height:1.25}
header .cap i{font-style:normal;color:#A9B4BC;font-family:var(--sans);font-size:10.5px;display:block}

/* ---- layout ---- */
main{max-width:840px;margin:0 auto;padding:12px 12px 24px}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:3px; margin:0 0 12px}
.panel > .ph{display:flex;align-items:baseline;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule2)}
.panel > .ph h2,.panel > .ph h3{flex:1}
.panel > .ph .sub{font-size:12px;color:var(--ink2)}
.pb{padding:12px}
.pb.tight{padding:0}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
hr.rule{border:0;border-top:1px solid var(--rule2);margin:10px 0}

/* ---- buttons ---- */
button{font:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--ink2);color:var(--ink);
  padding:7px 12px;border-radius:3px;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--field);border-color:var(--field);color:#fff;font-weight:600}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.full{width:100%;justify-content:center}
.btn.big{padding:13px;font-size:16px;width:100%;font-family:var(--serif)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper2);border-radius:99px;
  padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
select,input[type=text],input[type=number]{font:inherit;font-size:14px;padding:6px 8px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--field)}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);
  padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--paper2)}
th.n,td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
th.sortable:active{opacity:.6}
th.sortable.on{color:var(--ink)}
th .ar{font-style:normal;font-size:8px;margin-left:3px;opacity:.45}
th.sortable.on .ar{opacity:1}
select{appearance:none;-webkit-appearance:none;padding:6px 26px 6px 10px;font-size:12.5px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),
    linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.searchbox{flex:1;min-width:120px;padding:6px 10px;font-size:12.5px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);color:var(--ink)}
.mini{border:1px solid var(--rule);background:var(--paper2);border-radius:3px;
  color:var(--ink2);font-size:11px;line-height:1;padding:3px 6px}
.mini:active{background:var(--ink);color:#fff}
.ul{text-decoration:underline;text-underline-offset:2px}
/* ---- the club's own colour, set on every render ---- */
:root{--team:#2E5E4E;--teamink:#fff}
.ph{border-left:3px solid transparent}
.panel>.ph:first-child{border-left-color:var(--team)}
.chip[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--teamink)}
nav button[aria-current="page"]{color:var(--team)}
nav button[aria-current="page"] .ic{background:var(--team);color:var(--teamink)}
.meter i{background:var(--team)}
.meter i.green{background:var(--field2)} .meter i.red{background:var(--red)}
.btn.primary{background:var(--team);border-color:var(--team);color:var(--teamink)}

/* ---- the number you are actually looking for ---- */
.bignum{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.midnum{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:22px;line-height:1;font-weight:600}
.stat b{font-size:19px}

/* ---- matchday ---- */
.hero{border-radius:4px;overflow:hidden;margin:0 0 10px}
.hero .top{display:flex;align-items:stretch}
.hero .side{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .side.us{color:#fff}
.hero .side.them{background:var(--paper2)}
.hero .side .ab{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em}
.hero .side .rec{font-size:11px;opacity:.75}
.hero .vs{display:grid;place-items:center;padding:0 10px;background:var(--card);
  font-family:var(--serif);font-size:12px;color:var(--ink3)}
.hero .line{padding:8px 12px;background:var(--card);border-top:1px solid var(--rule2);
  font-size:12px;color:var(--ink2)}
.hero .score{font-family:var(--mono);font-size:30px;line-height:1;font-weight:600}

/* ---- a moment that deserves the whole screen ---- */
.takeover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--ink);color:#fff;padding:28px;text-align:center}
.takeover .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
.takeover h1{font-size:34px;line-height:1.1;margin:10px 0;color:#fff}
.takeover p{font-size:14px;opacity:.8;max-width:30ch;margin:0 auto 20px}
.takeover .btn{background:#fff;color:var(--ink);border-color:#fff}
.takeover.win h1{color:#E8C87A}
.takeover.loss h1{color:#E39A9A}

/* ---- a phone is narrow ---- */
@media (max-width:430px){
  table{font-size:12.5px}
  td,th{padding:5px 6px}
  .hide-sm{display:none}
}
.attn{padding:7px 12px;border-bottom:1px solid var(--rule2)}
.attn:last-child{border-bottom:0}
.panel.hint{border-left:3px solid var(--field)}
.panel.guide{border-left:3px solid var(--gold)}
/* ---- depth chart ---- */
.depthgrp{margin:0 0 14px}
.depthhead{padding:0 2px 5px;border-bottom:1px solid var(--rule)}
.depthtable{width:100%;border-collapse:collapse}
.depthtable td{padding:7px 6px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.depthtable tr.starter{background:var(--paper2)}
.depthtable tr.starter td:first-child{color:var(--team);font-weight:700}
.ovrcell{font-family:var(--mono);font-size:17px;font-weight:600;width:44px;text-align:right}
.wrap{white-space:normal;overflow:visible}

/* ---- a player's numbers ---- */
.statwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.stat{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.stat th{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;padding:5px 7px;border-bottom:1px solid var(--rule);
  text-align:right;background:var(--paper2)}
table.stat th:first-child{text-align:left}
table.stat td{padding:7px;border-bottom:1px solid var(--rule2);text-align:right;
  font-family:var(--mono);font-size:14px}
table.stat td:first-child{text-align:left;font-family:var(--sans);font-size:12px;color:var(--ink2)}
table.stat tr.tot td{font-weight:700;border-top:1px solid var(--rule);background:var(--paper2)}
table.stat .big{font-size:16px;font-weight:600}

/* ---- the front door ---- */
body.at-menu nav{display:none}
body.at-menu #hdr .cap,body.at-menu #hdr .crest{display:none}
.menu{max-width:460px;margin:0 auto;padding:22px 4px 40px;text-align:center}
.menu-head{padding:26px 0 30px}
.menu-mark{width:58px;height:58px;border-radius:5px;background:var(--field);
  color:#fff;font-family:var(--serif);font-size:23px;font-weight:600;
  display:grid;place-items:center;margin:0 auto 16px;letter-spacing:.04em}
.menu h1{font-size:31px;margin:0 0 8px;letter-spacing:-.01em}
.menu-head p{font-size:13.5px;color:var(--ink2);margin:0 auto;max-width:30ch;line-height:1.5}
.menu-acts{display:flex;flex-direction:column;gap:9px;text-align:left}
.menu-acts .btn{padding:13px 15px;line-height:1.3}
.menu-acts .btn.big{font-size:16px}
.sub2{display:block;font-size:11.5px;font-weight:400;opacity:.72;margin-top:3px}
.menu-foot{font-size:11.5px;color:var(--ink3);margin:26px auto 0;max-width:34ch;line-height:1.55}
.panel.guide .ph{border-left-color:transparent}
.red{color:var(--loss)}
.depthgrp{padding:8px 12px;border-bottom:1px solid var(--rule2)}
.depthrow{padding:2px 0}
.depthrow .num.d{display:inline-block;width:14px;color:var(--ink3);font-size:11px}
tr.mine td{background:var(--paper2);font-weight:600}
.good{color:var(--field)}
.ph.tight{padding-top:4px;padding-bottom:2px}
h3.sm{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
td{padding:7px 8px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click:active{background:var(--paper2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:700;
  padding:2px 4px;border-radius:2px;background:var(--ink);color:#fff;font-family:var(--sans)}
.pos.o{background:var(--field)} .pos.d{background:var(--blue)} .pos.s{background:var(--ink2)}
.ovr{font-family:var(--mono);font-weight:700}

/* ---- misc marks ---- */
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--rule);background:var(--paper2);color:var(--ink2)}
.tag.gold{border-color:var(--gold);color:var(--gold);background:#F7F1DF}
.tag.red{border-color:var(--red);color:var(--red);background:#F8EAE8}
.tag.green{border-color:var(--field);color:var(--field);background:#E7F0EA}
.tag.blue{border-color:var(--blue);color:var(--blue);background:#E8EEF6}
.starmark{color:var(--gold)}
/* a text banner — says something, so it has to be readable */
.callout{padding:9px 12px;border-radius:4px;background:var(--paper2);
  border-left:3px solid var(--ink3);margin:0 0 8px;font-size:13px;line-height:1.45;
  color:var(--ink);white-space:normal;overflow:visible}
.callout b{font-weight:700}
.callout.green{border-left-color:var(--field2);background:rgba(46,94,78,.07)}
.callout.red{border-left-color:var(--loss);background:rgba(150,52,52,.07)}
.callout.warn{border-left-color:var(--gold);background:rgba(184,150,74,.09)}
/* the scouting grade meter, which is a bar and not words */
.band{position:relative;height:8px;background:var(--rule2);border-radius:2px;overflow:hidden}
.band i{position:absolute;top:0;bottom:0;background:var(--field);opacity:.35}
.band u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
.meter{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--field)}
.note{border-left:3px solid var(--rule);padding:6px 0 6px 10px;font-size:13px}
.note.tell{border-left-color:var(--field)}
.note.warn{border-left-color:var(--red)}
.note .src{font-size:11px;color:var(--ink3)}
.newsitem{padding:8px 12px;border-bottom:1px solid var(--rule2);font-size:13.5px}
.newsitem:last-child{border-bottom:0}
.newsitem .w{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper2);border:1px solid var(--rule2);border-radius:3px;padding:8px}
.stat b{display:block;font-family:var(--mono);font-size:18px;line-height:1.1}
.stat span{font-size:11px;color:var(--ink2)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);
  display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #000}
nav button{flex:1;min-width:0;background:none;border:0;color:#8D979F;padding:8px 1px 9px;
  font-size:9.5px;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:420px){ nav button{font-size:10.5px;padding:8px 2px 9px} }
nav button b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1}
nav button[aria-current="page"]{color:#F2F1E7;box-shadow:inset 0 3px 0 var(--field2)}

/* ---- sheet / modal ---- */
.veil{position:fixed;inset:0;background:rgba(20,26,32,.55);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:840px;max-height:92vh;overflow-y:auto;
  border-radius:8px 8px 0 0;border-top:3px solid var(--field);
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet .sh{position:sticky;top:0;background:var(--paper);padding:12px;border-bottom:1px solid var(--rule);
  display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet .sh .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink2);padding:0 4px}
.sheet .sb{padding:12px}
@media (min-width:700px){
  .veil{align-items:center}
  .sheet{border-radius:6px;border:1px solid var(--rule);border-top:3px solid var(--field);max-height:88vh}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:70;
  background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:13.5px;
  max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .18s ease-out}
  @keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
:focus-visible{outline:2px solid var(--field2);outline-offset:2px}
.split{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){ .split{grid-template-columns:1fr 1fr} }
.hidden{display:none !important}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
/* ============================================================
   THE FRONT OFFICE — a pro football front-office simulation
   Module 1: core utilities, constants, name data
   ============================================================ */
"use strict";

// Bump this every time a new index.html is produced, so the build showing
// on the front page always identifies which one is actually running.
const APP_VERSION = "2026-09-21.1";

/* ---------- deterministic RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG = mulberry32(12345);
const rnd = ()=>RNG();
const ri = (a,b)=>a+Math.floor(RNG()*(b-a+1));            // inclusive int
const rf = (a,b)=>a+RNG()*(b-a);
const pick = arr=>arr[Math.floor(RNG()*arr.length)];
/* A single gaussian centred on the situational mean, plus a bolted-on uniform
   "breakaway" ADDED on top, produced a fatter big-play tail than the real
   thing (measured: 2.7% of carries went 20+, real ball is ~1.5%) while also
   over-producing negative plays relative to real stuff rates. Football's
   yardage is not noise around a mean — most plays are a grind that falls
   short of the average, and the average is dragged up by a minority of
   explosive plays. Modelled here as three honest, mutually exclusive outcomes
   instead of one bell curve: stuffed at or behind the line (decaying the
   further back it goes), the ordinary grind (right-skewed, capped below the
   breakaway threshold so the two never blur into each other), and a
   breakaway that REPLACES the play outright rather than padding it, with a
   tail that decays smoothly (real explosive-run rates roughly halve every 5
   yards) instead of a flat uniform draw. Calibrated against nflfastR-era
   NFL play distributions: ~12% negative, ~9% zero, ~8%/4%/1.5% of carries at
   10+/15+/20+ yards, mean unchanged from whatever the situational model (m)
   already says it should be. */
/* Sum of three exponential draws (Erlang-3): a natural right-skewed shape
   with a genuine interior mode, not a fold-at-zero artifact. The folded
   normal this replaces put 37% of all grind outcomes on exactly 1 or 2
   yards — its mode sat at the boundary because folding a near-zero-centred
   normal always does that — plus an artificial pile-up at the hard cap from
   clamping. Real rushing yardage peaks at an interior value (2-4 yards), not
   at the boundary, and that shape difference is what was suppressing
   down-and-distance success rates independent of the mean: raising the mean
   stretches a wrongly-shaped curve without fixing where its mass sits.
   E[Erlang3] = 3*theta exactly, so the existing mean-matching algebra below
   needs no rework beyond feeding it this generator instead.
*/
function erlang3(theta){ return -theta*(Math.log(RNG()||1e-9)+Math.log(RNG()||1e-9)+Math.log(RNG()||1e-9)); }
// The grind bucket is bounded to [1,9] by design — that boundary means no
// input can push its own mean below ~2 or above ~7, the same structural
// limit any bounded "ordinary outcome" range has regardless of shape. Within
// that range, capping still biases Erlang-3's realized mean away from its
// nominal input by a measured, monotonic amount; this table corrects for it
// so a caller asking for mean X actually gets mean X, not "X before capping
// quietly ate some of it." Built from direct binary-search measurement, not
// derived algebraically — the capping interaction isn't clean enough to
// solve in closed form.
const GRIND_MEAN_CORRECTION=[[1.5,1.40],[2,1.96],[2.5,2.47],[3,2.99],[3.5,3.53],[4,4.05],[4.5,4.62],[5,5.26],[5.5,6.00],[6,6.80],[6.5,7.79],[7,9.01]];
function correctedGrindInput(target){
  const t=clamp(target,1.5,7);
  const tbl=GRIND_MEAN_CORRECTION;
  for(let i=0;i<tbl.length-1;i++){
    if(t>=tbl[i][0]&&t<=tbl[i+1][0]){
      const f=(t-tbl[i][0])/(tbl[i+1][0]-tbl[i][0]);
      return tbl[i][1]+f*(tbl[i+1][1]-tbl[i][1]);
    }
  }
  return tbl[tbl.length-1][1];
}
function drawRunYards(m,pBreakAdj,pStuffAdj){
  // pStuff/sigStuff are calibrated net of the ~3% of runs the clock-kill rule
  // below overrides to -1/-2 anyway; that's real, it just isn't this function's job
  const pStuff=clamp(0.205+(pStuffAdj||0),0.06,0.34), sigStuff=0.74, breakScale=6.4;
  const pBreak=clamp(0.074+pBreakAdj,0.02,0.18);
  const r=RNG();
  if(r<pBreak) return 10+Math.round(-breakScale*Math.log(RNG()||1e-6));
  if(r<pBreak+pStuff){
    // A play the front won isn't decided until the whistle — every so often
    // the back makes the first man miss anyway and it's off to the races.
    // Rare on purpose (three separate, disjoint buckets was calibration
    // convenience, not football: averages should fall out of a mechanism
    // permeable enough for this, not get anchored by treating "stuffed" and
    // "broke it" as two outcomes that can never touch), and scaled by the
    // same signal that already says how explosive this particular back is.
    const escapeP=clamp(0.02+Math.max(0,pBreakAdj)*3,0.008,0.06);
    if(RNG()<escapeP) return 8+Math.round(-breakScale*0.8*Math.log(RNG()||1e-6));
    return -Math.round(Math.abs(gauss(0,sigStuff)));

  const eBreak=10+breakScale, eStuff=-sigStuff*0.7979;
  const grindLoc=(m-pBreak*eBreak-pStuff*eStuff)/(1-pBreak-pStuff);
  if(typeof RECORD_M==="function") RECORD_M(m,grindLoc);
  // grind always gains something — the zero bucket belongs to "stuff" alone,
  // same as a real tackle-for-no-gain being scored differently from a stop
  return Math.max(1,Math.min(9,Math.round(erlang3(correctedGrindInput(grindLoc)/3))));

function drawYacYards(yacMean,pBreakAdj){
  const breakScale=11.5;
  const pBreak=clamp(0.046+pBreakAdj,0.015,0.11);
  if(RNG()<pBreak) return 9+Math.round(-breakScale*Math.log(RNG()||1e-6));
  const eBreak=9+breakScale;
  const grindLoc=(yacMean-pBreak*eBreak)/(1-pBreak);
  const YAC_MEAN_CORRECTION=[[1,1.00],[1.5,1.49],[2,2.00],[2.5,2.50],[3,3.02],[3.5,3.55],[4,4.15],[4.5,4.75],[5,5.48],[5.5,6.35],[6,7.44]];
  const t=clamp(grindLoc,1,6);
  let corrected=YAC_MEAN_CORRECTION[YAC_MEAN_CORRECTION.length-1][1];
  for(let i=0;i<YAC_MEAN_CORRECTION.length-1;i++){
    if(t>=YAC_MEAN_CORRECTION[i][0]&&t<=YAC_MEAN_CORRECTION[i+1][0]){
      const f=(t-YAC_MEAN_CORRECTION[i][0])/(YAC_MEAN_CORRECTION[i+1][0]-YAC_MEAN_CORRECTION[i][0]);

function driftSchoolWeights(){

  const newsLines=[];

    }
    w+= (base-w)*0.06;                      // nobody drifts away from what they are forever
    S.schoolW[name]=clamp(Math.round(w*10)/10,0.4,base*3+6);

function ageMult(age,pos){
  if(age<=23) return .92;
  if(age<=28) return 1.0;
  if(age<=30) return .90;
  if(age<=32) return .74;
  if(age<=34) return .55;
  return .38;
}
function capScaleSafe(){ return (S&&S.cap?S.cap:CAP_BASE)/CAP_BASE; }
function minSalary(){ return Math.round(MIN_SALARY*capScaleSafe()/1e4)*1e4; }
function marketAPY(p){
  // wages ride the cap: a flat scale would let the cap outrun the payroll
  const v = ovrMoney(p.ovr)*POSVAL[p.pos]*ageMult(p.age,p.pos)*(S.moneyScale||0.62)*capScaleSafe();
  const ceiling = S.cap*(p.pos==="QB"?0.175:0.125);
  return clamp(Math.round(v/1e5)*1e5, minSalary(), Math.round(ceiling));
}
/* what the floor is for this man, by service time, at today's cap */
function minSalaryFor(p){
  const yrs=clamp(Math.round((p&&p.exp)||0),0,MIN_LADDER.length-1);
  return Math.round(MIN_LADDER[yrs]*capScaleSafe()/1e3)*1e3;
}
/* a vested veteran on a one-year minimum counts at the two-year rate */
function vsbHit(p){
  if(!p||!p.contract) return null;
  if((p.exp||0)<VESTED_SEASONS) return null;
  if(p.contract.years>1) return null;
  if(p.contract.apy>minSalaryFor(p)*1.02) return null;
  if((p.contract.bonus||0)>Math.round(190e3*capScaleSafe())) return null;
  return Math.round(MIN_LADDER[2]*capScaleSafe()/1e3)*1e3;
}
function contractYears(p){
  if(p.age>=33) return ri(1,2);
  if(p.age>=30) return ri(1,3);
  if(p.ovr>=78) return ri(3,5);
  return ri(2,4);
}

/* ---------- players ---------- */
function devFromRoll(r){
  if(r>.985) return 4; if(r>.94) return 3; if(r>.78) return 2; if(r>.30) return 1; return 0;
}
const DEVNAME=["Slow","Steady","Quick","Star","Generational"];

function pickUniqueName(){
  // With ~13,000 first/last combinations and thousands of named people alive
  // over a long game, an exact collision was near-certain (birthday paradox)
  // — a coach sharing a full name with some unrelated active player is real
  // narrative confusion, not just an odd coincidence. A handful of reroll
  // attempts against currently-active people cuts that sharply without
  // touching the name pool or historical records.
  for(let i=0;i<6;i++){
    const f=pick(FIRST), l=pick(LAST);
    const clash=Object.values(S.players).some(p=>p&&!p.retired&&p.f===f&&p.l===l);
    if(!clash) return [f,l];
  }
  return [pick(FIRST),pick(LAST)];
}
function makePlayer(pos,target,age,opts){
  opts=opts||{};
  const a=makeAttrs(pos,target,opts.spread);
  const [hm,hs,wm,ws]=BODY[pos];
  const [nf,nl]=pickUniqueName();
  const p={
    id:S.nextId++, f:nf, l:nl, pos, age,
    ht:Math.round(gauss(hm,hs)), wt:Math.round(gauss(wm,ws)/2)*2,
    a, ovr:computeOVR(pos,a),
    exp:opts.exp!==undefined?opts.exp:Math.max(0,age-22),
    teamId:null, injury:0, injDesc:"", morale:ri(55,85),
    stats:{}, career:{gp:0,gs:0,seasons:0}, accolades:[], retired:false,
    hidden:{}
  };
  // hidden development profile
  const gap = opts.potGap!==undefined?opts.potGap:Math.max(0,gauss(age<=23?9:3,age<=23?6:3));
  p.hidden.pot = c99(p.ovr+gap);
  if(pos==="K"||pos==="P") p.hidden.pot = Math.max(p.ovr, Math.min(p.hidden.pot, ri(74,88))); // specialists don't become superstars
  p.hidden.dev = opts.dev!==undefined?opts.dev:devFromRoll(rnd());
  p.hidden.wrk = c99(gauss(65,15));            // work ethic
  p.hidden.inj = c99(gauss(100-p.a.dur,10));   // injury proneness
  p.hidden.chr = c99(gauss(68,16));            // character / locker room
  p.hidden.disc = c99(gauss(68,13));          // on-field discipline / foul avoidance
  // How gracefully HE ages, on top of what his position usually does. Two
  // corners at the same overall can have wildly different back halves of a
  // career; this is why. 65 is average (matches the position's own calibrated
  // rate); higher ages more gracefully, lower falls off a cliff earlier.
  p.hidden.agingCurve = c99(gauss(65,15));
  // Specialist / return traits are intentionally hidden: teams discover them through reps.
  if(pos==="K") { p.hidden.kpow=c99(gauss(72,9)); p.hidden.kacc=c99(gauss(70,10)); p.hidden.kclutch=c99(gauss(68,12)); }
  if(pos==="P") { p.hidden.ppow=c99(gauss(73,9)); p.hidden.phang=c99(gauss(70,9)); p.hidden.pplace=c99(gauss(69,11)); }
  if(["WR","RB","CB","S"].includes(pos)) {
    p.hidden.ret=c99(gauss(60 + (p.a.spd-65)*.18 + (p.a.agi-65)*.12,12));
    p.hidden.ball=c99(gauss(69,12));
    p.hidden.stcov=c99(gauss(62,13));
  }
  rollTraits(p);
  p.roleOVR = (pos==='CB'||pos==='S') ? roleOVRs(p) : null;
  p.morale = ri(62,80);
  p.tenure = 0;
  return p;
}

function refreshDefRoleRatings(p){
  if(!p || (p.pos!=='CB'&&p.pos!=='S')) return p;
  p.roleOVR=roleOVRs(p); return p;
}

function signPlayer(p,teamId,apy,years,gtdPct){
  p.teamId=teamId;
  if(S.freeAgents) S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
  const a=Math.round(apy);
  const share=clamp(a/(S.cap*0.11),0,1);
  const bonusPct=clamp(0.06+share*0.58+((gtdPct||.45)-0.45)*0.12,0.06,0.64);
  const st=contractHits(a,years,bonusPct,minSalaryFor(p));
  p.contract={apy:a,years,left:years,signedYear:S.year,
    gtd:Math.round(a*years*(gtdPct||.45)),
    bonus:st.bonus, prorate:st.prorate, hits:st.hits,
    gtdYears:Math.min(years, a>=12e6?3:a>=5e6?2:1)};
}

/* ---------- staff ---------- */
const SCOUT_FIRST=FIRST, SCOUT_LAST=LAST;
function makeScout(){
  const s={
    id:S.nextId++, f:pick(SCOUT_FIRST), l:pick(SCOUT_LAST),
    region: chance(.72)?pick(REGIONS):null,       // null = national
    posSpec: chance(.55)?pick([["QB","RB","WR","TE"],OL,["EDGE","DT","LB"],["CB","S"]]):null,
    acc: c99(gauss(62,14)),        // how fast/accurate knowledge accrues
    eye: c99(gauss(62,14)),        // low bias, low false-positive notes
    salary: 0, years: ri(1,3)
  };
  // personal biases (systematic, persistent) — this is what makes multiple scouts useful
  s.bias = {
    athlete: gauss(0,4.5)*(1-s.eye/140),   // overrates combine testing
    school:  gauss(0,4.0)*(1-s.eye/140),   // overrates blue bloods
    prod:    gauss(0,4.0)*(1-s.eye/140),   // overrates college production
    flat:    gauss(0,3.0)*(1-s.eye/140)
  };
  s.salary = Math.round((0.35e6 + (s.acc+s.eye)/200*1.1e6)/1e4)*1e4;
  s.name = s.f+" "+s.l;
  return s;
}
/* Roughly a third of a staff market comes out of the alumni pool rather than
   thin air, so the men you kept can turn up on a whiteboard years later. */
function alumniCandidates(role){
  const out=[];
  for(const id in S.players){
    const p=S.players[id];
    if(!p||!p.retired||p.coached) continue;
    if(!p.coachProj||p.coachProj<46) continue;
    if((S.year-(p.retiredYear||S.year))<2) continue;   // a year or two away first
    if(role==="HC") continue;                           // nobody walks straight in
    if(role!=="SD" && p.alumRole && p.alumRole!==role) continue;
    out.push(p);
  }
  return out;
}
function coachFromAlumnus(p,role){
  const proj=(p.coachProj||46)/100, h=p.hidden||{}, a=p.a||{};
  const base=52+proj*26;
  const c={id:S.nextId++, f:p.f, l:p.l, role,
    off:c99(gauss(base+(p.alumRole==="OC"?7:-7),8)),
    def:c99(gauss(base+(p.alumRole==="DC"?7:-7),8)),
    dev:c99(gauss(base+((h.wrk||65)-65)*.22,9)),
    gm:c99(gauss(base+((a.awr||62)-62)*.22,9)),
    disc:c99(gauss(base+((h.disc||68)-68)*.25,9)),
    years:ri(1,4),
    age:Math.max(32,(p.age||34)+(S.year-(p.retiredYear||S.year))),
    onMarket:0, playedAs:p.pos, playerId:p.id};
  if(role==="OC"){c.def=c99(c.def-14);} if(role==="DC"){c.off=c99(c.off-14);}
  c.name=c.f+" "+c.l;
  if(typeof TEAM_SCHEMES!=="undefined"&&TEAM_SCHEMES[role])
    c.scheme=pick(Object.keys(TEAM_SCHEMES[role]));
  if(typeof rollCoachPotential==="function"){ rollCoachPotential(c); c.salary=c.value=coachValue(c); }
  else c.salary=Math.round(1.6e6*(0.6+(c.off+c.def+c.dev)/300));
  p.coached=1;
  trimAlumnus(p);
  return c;
}
function makeCoach(role){
  // Re-enabled for testing: roughly a third of hires draw from the alumni
  // pool when eligible retirees exist for this role, matching the original
  // design intent, so the dead-money correlation can be traced directly
  // instead of reasoned about from code alone.
  if(role!=="HC" && rnd()<0.33){
    const cands=alumniCandidates(role);
    if(cands.length){
      const p=pick(cands);
      return coachFromAlumnus(p,role);
    }
  }
  const [cf,cl]=pickUniqueName();
  const c={id:S.nextId++, f:cf, l:cl, role,
    off:c99(gauss(62,13)), def:c99(gauss(62,13)),
    dev:c99(gauss(62,13)),      // player development
    gm:c99(gauss(62,13)),       // game management / clutch
    disc:c99(gauss(62,13)),     // discipline (penalties, morale)
    years:ri(1,4),
    age: role==="HC"? ri(41,63) : ri(33,58),
    onMarket:0};
  if(role==="OC"){c.def=c99(c.def-14);} if(role==="DC"){c.off=c99(c.off-14);}
  c.salary=Math.round((role==="HC"?4e6:1.6e6)*(0.6+ (c.off+c.def+c.dev)/300));
  c.name=c.f+" "+c.l;
  if(typeof TEAM_SCHEMES!=="undefined"&&TEAM_SCHEMES[role])
    c.scheme=pick(Object.keys(TEAM_SCHEMES[role]));
  if(typeof rollCoachPotential==="function"){
    rollCoachPotential(c);
    c.salary=c.value=coachValue(c);
  }
  return c;
}

/* ---------- roster construction ---------- */
function fillRoster(team,strength){
  const order=[];
  for(const pos in ROSTER_NEED) for(let i=0;i<ROSTER_NEED[pos];i++) order.push([pos,i]);
  for(const [pos,depth] of order){
    // starters good, backups worse
    // depth falls away sharply at first and then flattens — the back of an
    // NFL roster is marginal, not amateur
    let base = 77.0 - (depth<=1 ? depth*5.8 : 5.8+(depth-1)*3.0);
    if(pos==="WR"||pos==="CB") base = 77.0 - (depth<=1 ? depth*4.5 : 4.5+(depth-1)*2.5);
    // QB is the one position where the drop from starter to backup is
    // dramatic in real football — a true QB2 is nowhere near as close to a
    // starter as the generic depth curve assumes, and losing the starter is
    // by far the most catastrophic injury in the sport for exactly that
    // reason. The generic curve was giving QB the same ~5.8-point primary
    // dropoff as RB, EDGE, S — positions where a backup stepping in is a
    // real but survivable downgrade, not a cliff.
    if(pos==="QB") base = 77.0 - (depth<=1 ? depth*13.0 : 13.0+(depth-1)*4.0);
    if(pos==="K"||pos==="P") base = 70;
    const target=c99(gauss(base+strength, 5.4));
    const age=wpick([[ri(22,24),28],[ri(25,27),32],[ri(28,30),24],[ri(31,35),16]]);
    const p=makePlayer(pos,target,age);
    p.exp=Math.max(0,p.age-22-ri(0,1));
    const yrs=contractYears(p);
    signPlayer(p,team.id,marketAPY(p),yrs,rf(.3,.6));
    p.contract.left=ri(1,yrs);
    S.players[p.id]=p; team.roster.push(p.id);
  }
}

function makeTeam(i){
  const R=REAL_TEAMS[i];
  const [city,name,abbr,conf,div,color]=[R[0],R[1],R[2],+R[3],R[4],R[5]];
  return {
    id:i, city, name, abbr, conf, div, color,
    roster:[], picks:[], staff:{}, scouts:[],
    defShell:"mixed",
    w:0,l:0,t:0, pf:0, pa:0, divW:0,divL:0,confW:0,confL:0,
    streak:0, seed:0, madePlayoffs:false,
    scoutBudget:0, scoutPts:0,
    deadCap:0, history:[], ir:[], ps:[], _fill:null,
    ai:{ scoutSkill: clamp(gauss(.55,.18),.15,.95),
         aggression: rf(.3,.9), draftBPA: rf(.35,.85), winNow: rf(.2,.9) },
    prestige: c99(gauss(60,12))
  };
}

function calibrateMoney(){
  // set the league-wide pay scale so an average roster costs ~86% of the cap
  S.moneyScale=1;
  const raw=S.teams.map(t=>sum(t.roster.map(id=>{
    const p=S.players[id];
    return ovrMoney(p.ovr)*POSVAL[p.pos]*ageMult(p.age,p.pos);
  })));
  const mean=avg(raw)||1;
  S.moneyScale = clamp((S.cap*0.86)/mean,0.05,3);
  for(const t of S.teams) for(const id of t.roster){
    const p=S.players[id];
    const left=p.contract?p.contract.left:contractYears(p);
    signPlayer(p,t.id,marketAPY(p),Math.max(1,left),rf(.3,.6));
    p.contract.left=left;
  }
  // every club starts the game cap-legal: stars are on the books, the rest gets squeezed
  for(const t of S.teams){
    const target=S.cap*rf(0.84,0.965);
    let pr=payroll(t), guard=0;
    while(Math.abs(pr-target)/target>0.02&&guard++<7){
      const k=target/pr;
      for(const id of t.roster){ const p=S.players[id];
        setAPY(p,Math.round(p.contract.apy*k/1e5)*1e5); }
      pr=payroll(t);
    }
  }
}
function buildLeague(){
  initSchoolWeights();          // this league's own version of the college map
  S.teams = REAL_TEAMS.map((_,i)=>makeTeam(i));
  const strengths = shuffle(S.teams.map((_,i)=>gauss(0,3.6)));
  S.teams.forEach((t,i)=>{
    initOps(t);
    assignSchemes(t);
    fillRoster(t,strengths[i]);
    t.staff.HC=makeCoach("HC"); t.staff.OC=makeCoach("OC"); t.staff.DC=makeCoach("DC");
    t.staff.SD=makeCoach("SD"); // scouting director
    const n=ri(3,5); for(let k=0;k<n;k++) t.scouts.push(makeScout());
    for(const y of [S.year,S.year+1,S.year+2])
      for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
    autoDepth(t);
    assignDefensiveRoles(t);
  });
  calibrateMoney();
}

/* ---------- depth chart ---------- */
/* How near one job is to another. Nothing is impossible — a quarterback can
   line up at corner — but the further from home, the less of him you get.
   The OL block used to treat "same side" as the thing that made a move
   easy — LG->LT was rated as cheap as LG->RG, while LG->RT was rated
   harder, purely because of which side of the ball it was on. Side isn't
   the real divide; guard and tackle are different jobs regardless of side
   (tackle wants length and lateral quickness in space, guard wants power
   and a shorter set), so every guard-to-tackle move now costs the same
   whichever side it's headed to. Center is its own, more specialized job
   again — close enough to guard that either one can fill in there without
   much falling off, but a tackle stepping in isn't a near-miss the way a
   guard is; it's a real, separate skill (snapping, the line calls, a
   shorter drop) that his own position never asked of him. */
const POS_KIN={
  QB:{RB:3,WR:3,TE:4}, RB:{WR:2,TE:3,S:3,LB:3}, WR:{RB:2,TE:2,CB:3,S:3},
  TE:{WR:2,RB:3,LT:3,RT:3,LG:3,RG:3,C:4,EDGE:3},
  LT:{RT:1,LG:2,RG:2,C:3,TE:3}, RT:{LT:1,RG:2,LG:2,C:3,TE:3},
  LG:{RG:1,C:1,LT:2,RT:2}, RG:{LG:1,C:1,RT:2,LT:2}, C:{LG:1,RG:1,LT:3,RT:3},
  EDGE:{DT:1,LB:1,TE:3}, DT:{EDGE:1,LG:3,RG:3,C:3}, LB:{EDGE:1,S:1,DT:2,RB:3},
  CB:{S:2,WR:2,RB:3}, S:{CB:2,LB:1,WR:3,RB:3}, K:{P:1}, P:{K:1}
};
function posDistance(from,to){
  if(from===to) return 0;
  const k=POS_KIN[from];
  return (k&&k[to])||5;                  // anything unlisted is a long way from home
}
/* What a man is worth at a given spot, judged on what that spot actually asks
   for, not on his rating somewhere else. */
const SPECIALIST=["K","P"];
function ovrAt(p,pos){
  if(p.pos===pos) return p.ovr;
  // his attributes barely move, so work each spot out once and keep it
  if(p._at&&p._at.k===p.ovr){ const v=p._at[pos]; if(v!==undefined) return v; }
  else p._at={k:p.ovr};
  const val=ovrAtRaw(p,pos);
  p._at[pos]=val;
  return val;
}
function ovrAtRaw(p,pos){
  // a leg is a trade of its own; nobody picks it up because he can throw
  const meSpec=SPECIALIST.includes(p.pos), itSpec=SPECIALIST.includes(pos);
  if(itSpec&&!meSpec) return Math.max(20,Math.round(38+((p.a.str||55)+(p.a.awr||55))/14));
  if(meSpec&&!itSpec) return Math.max(20,Math.round(computeOVR(pos,p.a)*0.55));
  const raw=computeOVR(pos,p.a);
  const d=posDistance(p.pos,pos);
  // learning a new job costs less if he sees the game well
  // A generic mismatch (d=5, e.g. a quarterback at corner) was only costing
  // about 12 points off his rating — not nearly enough to keep a roster from
  // routinely stacking a depth chart with players out of position rather
  // than carrying (or signing) someone who actually plays the spot.
  const unfamiliar = d*3.6 * (1 - clamp(((p.a.awr||55)-50)/110,0,0.42));
  return Math.max(20, Math.round(raw - unfamiliar));
}
function posScore(p,pos){
  // what your coordinator asks for counts as much as what the rating says
  if(p.pos===pos){
    const fit = (typeof schemeFit==="function") ? (schemeFit(p)-50)*0.11 : 0;
    return p.ovr+fit;
  }
  return ovrAt(p,pos);
}
/* the spots he could fill, best first */
function bestOtherSpots(p,n){
  return POS.filter(x=>x!==p.pos)
    .map(x=>({pos:x, ovr:ovrAt(p,x), d:posDistance(p.pos,x)}))
    .sort((a,b)=>b.ovr-a.ovr).slice(0,n||3);
}
function autoDepth(t){
  // if you've taken the chart off the coaches, they leave it alone
  if(t.id===S.userTeam&&typeof autoOn==="function"&&!autoOn("depth")&&t.depth) return;
  const prev = t.depthManual ? (t.depth||{}) : null;
  t.depth={};
  const used={};
  const taken={};                 // a man can hold one first-choice job, no more
  // hand out the starting jobs first, best claim on each
  const claims=[];
  for(const pos of POS){
    const need = pos==="WR"?3 : (pos==="LB"||pos==="CB"||pos==="DT")?2 : pos==="S"?2 : 1;
    for(let slot=0;slot<need;slot++) claims.push({pos,slot});
  }
  claims.sort((a,b)=>a.slot-b.slot);
  const men=t.roster.map(id=>S.players[id]).filter(p=>p&&!p.retired);
  let sum=men.length*7919;
  for(const p of men) sum=(sum+p.id*31+p.ovr)|0;
  const oc=t.staff.OC, dc=t.staff.DC;
  const stamp=`${sum}|${oc&&oc.scheme}|${dc&&dc.scheme}`;
  let rank;
  if(t._rank&&t._rank.stamp===stamp) rank=t._rank.r;
  else {
    rank={};
    for(const pos of POS)
      rank[pos]=men.map(p=>({p,s:posScore(p,pos)})).sort((a,b)=>b.s-a.s);
    t._rank={stamp,r:rank};
  }
  for(const c of claims){
    const row=rank[c.pos];
    let best=null;
    for(const x of row) if(!taken[x.p.id]){ best=x; break; }
    if(best){ taken[best.p.id]=1; (t.depth[c.pos]=t.depth[c.pos]||[]).push(best.p.id); }
  }
  for(const pos of POS){
    const first=t.depth[pos]||[];
    first.forEach(id=>{used[id]=1;});
    const fresh=[], spare=[];
    for(const x of rank[pos]){
      if(first.includes(x.p.id)) continue;
      if(used[x.p.id]){ if(x.s-45>0) spare.push(x); }
      else if(x.s>0) fresh.push(x);
    }
    const cands=fresh.concat(spare);
    const n = pos==="WR"?4:(pos==="RB"||pos==="TE"||pos==="LB"||pos==="DT"||pos==="EDGE"||pos==="CB")?3:pos==="S"?3:2;
    let ids=first.concat(cands.slice(0,Math.max(0,n-first.length)).map(x=>x.p.id));
    if(prev&&prev[pos]){
      // a chart the user arranged by hand keeps its order; departed men drop out
      const keep=prev[pos].filter(id=>t.roster.includes(id)&&S.players[id]&&!S.players[id].retired);
      ids=keep.concat(ids.filter(id=>!keep.includes(id))).slice(0,n);
    }
    t.depth[pos]=ids; ids.forEach(id=>{used[id]=1;});
  }
}
/* ---------- modern defensive back roles ----------
   The roster still stores generic CB/S positions so legacy contracts, drafting,
   and imports remain compatible.  The depth chart now assigns functional roles
   on top of those positions: two outside CBs, a nickel/"Star", a FS and a SS.
   This reflects the modern NFL where nickel is effectively a starting role and
   safeties increasingly need interchangeable coverage/box skills. */
/* ---------- functional defensive-back role ratings ----------
   Generic CB/S ratings remain the roster ratings. These role ratings are the
   football skills a coordinator actually cares about when assigning a player
   to nickel/Star, free safety, strong safety, or big nickel.

   The role OVR is deliberately not a renamed positional OVR: each role weights
   different traits and exposes separate subskills used by the play simulator.
*/
const DEF_POS_SET=new Set(['EDGE','DT','LB','CB','S']);
const DEF_ROLE_WEIGHTS={
  NB:{ovr:{cov:.26,spd:.16,acc:.13,agi:.13,awr:.12,tak:.08,prs:.07,str:.03,jmp:.02,dur:0},
      slotCov:{cov:.42,spd:.16,acc:.15,agi:.13,awr:.11,jmp:.03},
      run:{tak:.31,str:.17,spd:.16,acc:.10,agi:.08,awr:.14,cov:.04},

  const roleOf=p=>{
    const t=p&&p.teamId!=null?S.teams[p.teamId]:null; const r=t&&t.defRoles;

function tryInjure(p,mult){
  if(!p||p.injury>0) return null;
  const club = p.teamId!==null&&p.teamId!==undefined ? S.teams[p.teamId] : null;
  let risk = club ? injuryMult(club)*0.92 : 0.92;
  if(hasTrait(p,"glass")) risk*=1.38;
  if(hasTrait(p,"iron")) risk*=0.66;
  if(rnd()>=risk) return null;
  // Wear and tear: a bellcow back (or any player) carrying a heavy season-
  // long workload is genuinely more injury-prone than a committee player at
  // the same talent level — this is the real mechanism behind why teams are
  // wary of feeding one back 25+ touches a game, distinct from anything about
  // his own skill. There's no in-game fatigue model here (deliberately —
  // that's a harder thing to calibrate honestly and easy to turn into another
  // post-hoc knob), just the accumulated cost of the touches he's actually
  // taken this season so far.
  const gamesPlayed=Math.max(1,p.stats?.gp||1);
  // Rushes and targets both end in contact essentially every time; a
  // dropback usually doesn't (only the fraction that end in a sack or hit
  // does), so it counts toward wear at a fraction of the weight — not zero,
  // since a QB's workload is real, just physically different in kind.
  const touchesPerGame=((p.stats?.ra||0)+(p.stats?.tgt||0)+(p.stats?.pa||0)*0.3)/gamesPlayed;
  const workloadMult=clamp(1+(touchesPerGame-12)*0.018,0.85,1.45);
  const base=0.165*mult*workloadMult*(0.55+p.hidden.inj/90);

    p.injDesc=pick(["hamstring","high ankle sprain","MCL sprain","shoulder","concussion protocol",
      "turf toe","groin","hip flexor","broken hand","ribs","Achilles strain","knee"]);
    return sev;
  }
  return null;
}

  // "longest attempt" of 59 was routinely being stretched to 69-71 as an
  // ordinary, non-desperation call. Real coaches essentially never send a
  // kicker out past the low 60s outside genuine desperation.
  const skill=k?(k.hidden?.kpow*.55+k.hidden?.kacc*.45):55;

    }

      // on a simple handoff he has essentially no contact exposure, but was
      // getting the same injury risk as the actual ball-carrier and a
      // tackling defender. Real QB injury exposure is concentrated on pass
      // plays (sacks, hits in the pocket) and on designed runs/scrambles
      // where he's the one being tackled — not on every play where someone
      // else has the ball.
      const qbExposed = isPass || (rb && rb===qb);
      const cands=[qbExposed?qb:null, ws(sho.carries), ws(sho.targets), ws(SH[def].def.map(x=>[x[0],1]))].filter(Boolean);
      const victim=pick(cands);
      const sev=tryInjure(victim,1);
      if(sev&&sev>=3) log.push({q:qtr,t:victim.teamId,txt:`${victim.pos} ${victim.l} left with a ${victim.injDesc}`});
    }
    // The touchdown check below runs after this play is already logged, so
    // the recorded play always showed td:false even on a scoring play — the
    // actual score was never affected (that logic is separate and correct),
    // but every downstream thing reading gamebook.plays[].td, including this
    // session's own drive-reconstruction probes, was reading a field that
    // could never be true. Compute the same condition here, just early enough
    // to log it right.
    const willScoreTD = !turnover && ballOn+gain>=100;
    gamebookPlay(g,{q:qtr,clock,off,def,down,toGo,playType,kind:(isPass&&!rb)?"pass":"run",gain,turnover,td:willScoreTD,repeatDown,viaPass,
      qb:typeof qb!=="undefined"&&qb?qb.id:null,runner:typeof rb!=="undefined"&&rb?rb.id:null,receiver:typeof rec!=="undefined"&&rec?rec.id:null,
      scorer:scorer?.id||null,fumbler:fumbler?.id||null,pressureRusher:typeof pressureRusher!=="undefined"&&pressureRusher?pressureRusher.id:null,
      pressured:typeof pressured!=="undefined"?!!pressured:false,pressure:typeof pressured!=="undefined"&&pressured,
      sack:typeof passSack!=="undefined"&&passSack,hurry:typeof passHurry!=="undefined"&&passHurry,hit:typeof passHit!=="undefined"&&passHit,
      primaryDef:typeof coverDef!=="undefined"&&coverDef?coverDef.id:null,
      passResult:(isPass&&!rb)?({attempted:passOfficial,completion:passOfficial&&passCompleted,interception:passOfficial&&passIntercepted,drop:typeof passDropped!=="undefined"&&passDropped,air:typeof targetAir!=="undefined"?targetAir:0,yac:passCompleted?Math.max(0,gain-targetAir):0}):null});
    plays++;

    }

      const fr=resolveFumble(S.teams[off],S.teams[def],fumbler,ballOn,"scrimmage");
      if(!fr.lost){ turnover=false; log.push({q:qtr,t:off,txt:`${fumbler?fumbler.pos+" "+fumbler.l:"Runner"} recovers the fumble`}); }
      else if(fr.td){

        gamebookScore(g,{q:qtr,team:def,points:7,type:"FUMBLE_RETURN_TD",player:fr.scooper?.id||null});
        log.push({q:qtr,t:def,txt:`${fr.scooper?fr.scooper.pos+" "+fr.scooper.l:"Defense"} scoops it up and scores`});
        gamebookPlay(g,{q:qtr,clock,off,def,down,toGo,playType,kind:"fumble_return_td",gain,turnover:true,fumbler:fumbler?.id||null,recoverer:fr.scooper?.id||null});
        driveAuditEnd(fumbler?"fumble":"interception",0);

      } else {
        if(fr.scooper){st(fr.scooper,"ff",1);track(fr.scooper);}
        log.push({q:qtr,t:def,txt:`Fumble lost — ${S.teams[def].abbr} takes over`});
        driveAuditEnd(fumbler?"fumble":"interception",0);

      }
    } else if(ballOn>=100){
      td=true; score[off]+=6;
      if(scorer){
        if(viaPass){ st(qb,"ptd",1); st(scorer,"rectd",1); }
        else st(scorer,"rtd",1);
      }
      let two=null;
      if(typeof momentHere==="function"){
        two = yield momentHere("twopoint",{off,def,qtr,clock,scoreDiff:scoreDiff+6,
          neutral,home:H.id,away:A.id,score});
      }
      let xtra=0;
      if(two==="two"){
        const oU=U[off];
        const p2=clamp(0.475+(oU.qbA-U[def].cov)/430,0.30,0.68);
        if(rnd()<p2){ score[off]+=2; xtra=2; gamebookScore(g,{q:qtr,team:off,points:2,type:"2PT"}); log.push({q:qtr,t:off,txt:"Two-point conversion is good"}); }

      gamebookScore(g,{q:qtr,team:off,points:6,type:"TD",player:scorer?.id||null});

    } else if(ballOn<=0){

    } else {
      if(freshFirstDown){

        // this is the actual bug: that block never told this logic it had
        // already happened, so this ran anyway. gain here is still whatever
        // the underlying incomplete pass or non-play produced (often 0), and
        // subtracting it from the just-reset toGo=10 almost always left
        // toGo>0, incrementing an automatic first down from 1 straight to 2 —
        // silently costing the offense the down it was just awarded, on
        // every DPI, defensive holding, illegal contact, roughing-the-passer,
        // and personal-foul call built to prevent exactly that.
      } else if(repeatDown){
        toGo=Math.min(99,toGo+10);
      } else {
        toGo-=gain;
        if(toGo<=0){ if(down===3) callAudit.thirdConv++; down=1; toGo=10; } else { down++; if(down>4){ driveAuditEnd("downs",0); changeposs(100-ballOn); } }
      }
    }
    if(clock<=0){ qtr++; clock=900;
      if(qtr===3){ const receiver=(off===H.id?A.id:H.id); const kicker=receiver===H.id?A.id:H.id; kickoffTo(receiver,kicker); }

  }

  if(score[H.id]===score[A.id]) simulateOvertime(H,A,score,log,U,SH,g);
  g.hs=score[H.id]; g.as=score[A.id]; g.played=true; g.log=log.slice(-14);
  if(g.gamebook){
    g.gamebook.finalScore={home:g.hs,away:g.as};
    g.gamebook.teamStats={};
    for(const tid of [H.id,A.id]){
      const d=gamebookTeamDerived(g,tid);
      const ts={...d,plays:d.plays,pass:d.passAtt,run:d.rushAtt,yards:d.totalYds,turnovers:d.turnovers};
      g.gamebook.teamStats[tid]=ts;
    }
  }
  // Lightweight audit fields for validation/debugging; harmless to the franchise UI.
  g.audit=g.audit||{}; g.audit.plays=plays; g.audit.drives={...drives}; g.audit.calls=callAudit;
  g.audit.reconciledAt=Date.now();
  invalidateLedgerCache();
  S.__saveRev=(S.__saveRev||0)+1;
  persistGamebook(g);
  if(g.week!==99){                     // the postseason has its own book
    H.pf+=g.hs; H.pa+=g.as; A.pf+=g.as; A.pa+=g.hs;
    recordResult(H,A,g.hs,g.as);
  } else {
    H.postPf=(H.postPf||0)+g.hs; H.postPa=(H.postPa||0)+g.as;
    A.postPf=(A.postPf||0)+g.as; A.postPa=(A.postPa||0)+g.hs;
    if(g.hs>g.as){H.postW=(H.postW||0)+1;A.postL=(A.postL||0)+1;}
    else {A.postW=(A.postW||0)+1;H.postL=(H.postL||0)+1;}
  }
  return g;
}
function recordResult(H,A,hs,as){
  const same=H.conf===A.conf, div=same&&H.div===A.div;
  if(hs>as){H.w++;A.l++; if(div){H.divW++;A.divL++;} if(same){H.confW++;A.confL++;}}
  else if(as>hs){A.w++;H.l++; if(div){A.divW++;H.divL++;} if(same){A.confW++;H.confL++;}}
  else {H.t++;A.t++;}
}

/* ---------- weekly advance ---------- */
function playWeek(){
  const wk=S.week;
  const games=S.schedule.filter(g=>g.week===wk&&!g.played);
  for(const g of games) simGame(g);
  // injuries tick, morale
  for(const t of S.teams){
    let healed=false;
    for(const id of t.roster){const p=S.players[id];
      if(p.injury>0){
        p.injury--;
        if(p.injury>0 && rnd()<0.28*(healMult(t)-1)) p.injury--;
        if(p.injury<=0){p.injury=0;p.injDesc=""; healed=true;}}}
    if(healed) autoDepth(t);   // only when somebody's actually available again
  }
  weeklyNews(wk,games);
  S.week++;
}

/* ---------- standings ---------- */
function winPct(t){const g=t.w+t.l+t.t; return g? (t.w+t.t*.5)/g : 0;}
function sortTeams(list){
  return list.slice().sort((a,b)=> winPct(b)-winPct(a) ||
    (b.divW-b.divL)-(a.divW-a.divL) || (b.confW-b.confL)-(a.confW-a.confL) ||
    (b.pf-b.pa)-(a.pf-a.pa) || b.pf-a.pf || a.id-b.id);
}
function confSeeds(conf){
  const divWinners=[];
  for(let d=0;d<4;d++) divWinners.push(sortTeams(S.teams.filter(t=>t.conf===conf&&t.div===d))[0]);
  const dw=sortTeams(divWinners);
  const rest=sortTeams(S.teams.filter(t=>t.conf===conf&&!dw.includes(t))).slice(0,3);
  const seeds=[...dw,...rest];
  seeds.forEach((t,i)=>{t.seed=i+1;t.madePlayoffs=true;});
  return seeds;
}

/* ---------- playoffs ---------- */
function simPlayoffs(){
  S.playoffs={rounds:[]};
  const res=[];
  const conf=[confSeeds(0),confSeeds(1)];
  const champs=[];
  for(let c=0;c<2;c++){
    let alive=conf[c].slice();
    const rnd1=[[alive[1],alive[6]],[alive[2],alive[5]],[alive[3],alive[4]]];
    const wc=rnd1.map(m=>playoffGame(m[0],m[1],`${CONFNAME[c]} Wild Card`));
    let next=sortTeams([alive[0],...wc]);
    const div=[[next[0],next[3]],[next[1],next[2]]];
    const dv=div.map(m=>playoffGame(m[0],m[1],`${CONFNAME[c]} Divisional`));
    const fin=sortTeams(dv);
    const cw=playoffGame(fin[0],fin[1],`${CONFNAME[c]} Championship`);
    champs.push(cw);
  }
  const champ=playoffGame(champs[0],champs[1],"The Championship",true);
  S.champion=champ.id;
  champ.wonTitle=S.year;   // the full season row is written when contracts roll over
  return champ;
}
function playoffGame(a,b,label,neutral){
  const g={week:99,home:a.id,away:b.id,played:false,hs:0,as:0,label};
  simGame(g,neutral);
  if(g.hs===g.as) g.hs++;
  const w=g.hs>g.as?a:b, l=g.hs>g.as?b:a;
  S.playoffs.rounds.push({label,winner:w.id,loser:l.id,ws:Math.max(g.hs,g.as),ls:Math.min(g.hs,g.as)});
  news(`${label}: ${w.city} ${w.name} ${Math.max(g.hs,g.as)}, ${l.city} ${l.name} ${Math.min(g.hs,g.as)}`,"playoff");
  return w;
}
