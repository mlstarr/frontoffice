  const dept=effLvl(t,"scoutdept");
  const bought=Math.round((t.scoutInvest||0)*5.5);
  return Math.round(115 + (sd?sd.dev:60)/1.1 + t.scouts.length*19 + (dept-2)*56 + bought);
}
function grantScoutPts(){
  for(const t of S.teams) if(t.id===S.userTeam) t.scoutPts+=scoutBudget(t);
}

/* ---------- the combine reprices the market ---------- */
function runCombine(){
  const before={};
  for(const id of S.prospects) before[id]=S.players[id].draft.rank;
  for(const id of S.prospects) S.players[id].draft.combineDone=true;
  repriceBoard(true);
  for(const t of S.teams) buildAIBoard(t);
  const moved=S.prospects.map(id=>S.players[id])
    .map(p=>({p,d:before[p.id]-p.draft.rank})).filter(x=>Math.abs(x.d)>=25);
  const up=moved.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3);
  const dn=moved.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,2);
  news("The combine is in the books. Boards are being redone across the league.","draft");
  up.forEach(x=>news(`Riser: ${x.p.pos} ${x.p.f} ${x.p.l} (${x.p.draft.ctx.school}) climbs ${x.d} spots on the consensus board`,"draft",x.p.id));
  dn.forEach(x=>news(`Faller: ${x.p.pos} ${x.p.f} ${x.p.l} slides ${-x.d} spots after a bad week in Indianapolis`,"draft",x.p.id));
}

/* ---------- AI re-signings ---------- */
function aiResign(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    const exp=t.roster.map(id=>S.players[id]).filter(p=>p.contract&&p.contract.left<=1);
    for(const p of exp){
      const v=playerTradeValue(p), apy=marketAPY(p);
      if(capSpace(t)>apy+8e6 && v>90 && chance(0.55+t.ai.winNow*0.25)){
        signPlayer(p,t.id,Math.round(apy*rf(.98,1.12)),contractYears(p),.5);
      }
    }
  }
}

/* ---------- draft wrap-up ---------- */
function endDraft(){
  recordTapeWatch();
  const t=S.teams[S.userTeam];
  const mine=t.roster.map(id=>S.players[id]).filter(p=>p.exp===0&&p.draft&&p.draft.pickedBy===t.id);
  for(const p of mine){
    const h=draftHindsight(p);
    if(h.gap>=8) news(`Our room had ${p.pos} ${p.l} well above the board — the tape said more than the résumé.`,"draft",p.id);
  }
  S.phase="postdraft";
  news(`${S.year+1} draft complete. ${mine.length} players added.`,"draft");
  // seven rounds are gone; the phones open before anyone gets cut
  if(typeof openScramble==="function" && S.prospects && S.prospects.length) openScramble();
  else udfaSigning();
}

function offseasonProgressReport(rooks){
  for(const p of rooks){
    const late=p.draft.pickedAt>96;
    if(late&&p.ovr>=72)
      news(`${p.pos} ${p.f} ${p.l}, taken ${ordinal(p.draft.pickedAt)} overall, finished his rookie year at ${p.ovr}. The rest of the league missed.`,"win",p.id);
    if((p.draft.pickedRound||1)===1&&p.ovr<=62)

/* ---------- housekeeping ---------- */
/* nobody takes the field a man short at a position, whatever the roster count */
function coverAllPositions(t){
  let fixed=0;
  for(const pos of POS){
    if(t.roster.some(id=>S.players[id]&&S.players[id].pos===pos)) continue;
    // make room by dropping the least useful man at an overstocked spot
    if(t.roster.length>=ROSTER_MAX){
      const surplus=t.roster.map(id=>S.players[id]).filter(p=>p&&!p.pinActive)
        .filter(p=>t.roster.filter(id=>S.players[id].pos===p.pos).length>(ROSTER_NEED[p.pos]||1))
        .sort((a,b)=>playerTradeValue(a)-playerTradeValue(b))[0];
      if(surplus) releasePlayer(surplus,t); else break;
    }
    const pool=S.freeAgents.map(id=>S.players[id])
      .filter(p=>p&&!p.retired&&p.teamId===null&&p.pos===pos).sort((a,b)=>b.ovr-a.ovr);
    let p=pool[0];
    if(!p){ p=makePlayer(pos,c99(gauss(57,4)),ri(23,27)); S.players[p.id]=p; }
    else S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
    signPlayer(p,t.id,minSalaryFor(p),1,.1);
    addToTeam(p,t);
    fixed++;
  }
  return fixed;
}
/* Trimming the free-agent pool right before every team fills its gaps from it
   would remove the very players teams are about to need — that emptied
   rosters league-wide the first time this was tried. Called instead from the
   end of startSeason, once every team has already taken what it needed for
   the year, so anyone left is provably surplus. */
function trimFreeAgentSurplus(){
  const byPos={};
  for(const id of S.freeAgents){
    const p=S.players[id]; if(!p||p.retired) continue;
    (byPos[p.pos]=byPos[p.pos]||[]).push(p);
  }
  const toRetire=new Set();
  for(const pos in byPos){
    // generous headroom on purpose: this only removes what's left over after
    // every team has already drawn what it needed this year
    const target=Math.ceil((ROSTER_NEED[pos]||2)*32*0.15);
    const surplus=byPos[pos].length-target;
    if(surplus<=0) continue;
    byPos[pos]
      .map(p=>({p,score:p.ovr-Math.max(0,p.age-27)*0.6-(p.unsignedYears||0)*3}))
      .sort((a,b)=>a.score-b.score)
      .slice(0,surplus)
      .forEach(c=>toRetire.add(c.p.id));
  }
  if(!toRetire.size) return;
  S.freeAgents=S.freeAgents.filter(id=>{
    const p=S.players[id];
    if(toRetire.has(id)){ p.retired=true; return false; }
    return true;
  });
}
function fillRosterFromFA(t,quiet){
  let added=0, guard=0;
  added+=coverAllPositions(t);
  while(t.roster.length<ROSTER_MAX&&guard++<90){
    const need=teamNeeds(t)[0];
    const pool=S.freeAgents.map(id=>S.players[id])
      .filter(p=>p&&!p.retired&&p.teamId===null&&p.pos===need.pos).sort((a,b)=>b.ovr-a.ovr);
    // a good player still has to be paid something like his worth
    const room=Math.max(minSalary(),capSpace(t));
    let p=pool.find(x=>marketAPY(x)*0.75<=room);
    if(!p){ p=makePlayer(need.pos,c99(gauss(57,4)),ri(23,27)); S.players[p.id]=p; }
    else S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
    const price=Math.max(minSalary(),Math.min(room,Math.round(marketAPY(p)*0.82)));
    signPlayer(p,t.id,price,p.ovr>=70?ri(1,3):1,.15); addToTeam(p,t); added++;
  }
  if(added&&!quiet) news(`Front office filled ${added} roster spots with minimum deals.`,"info");
  return added;
}
/* the league has a spending floor — clubs sitting on it get pushed into the market */
function enforceCapFloor(){
  const floor=S.cap*0.88;
  for(const t of S.teams){
    let guard=0;
    while(payroll(t)<floor&&guard++<40){
      const pool=S.freeAgents.map(id=>S.players[id])
        .filter(p=>p&&!p.retired&&p.teamId===null&&p.ovr>=64).sort((a,b)=>b.ovr-a.ovr);
      const p=pool[0];
      if(p&&t.roster.length<ROSTER_MAX&&marketAPY(p)*1.35<S.cap*0.97-payroll(t)){
        S.freeAgents=S.freeAgents.filter(id=>id!==p.id);
        signPlayer(p,t.id,Math.round(marketAPY(p)*rf(1.05,1.35)),contractYears(p),rf(.4,.75));
        addToTeam(p,t);
        if(p.ovr>=80) news(`${t.city} adds ${p.pos} ${p.f} ${p.l} (${p.ovr} ovr) to get to the spending floor.`,"league",p.id);
        continue;
      }
      // nothing worth signing: extend the best men already in the building
      const under=t.roster.map(id=>S.players[id])
        .filter(x=>x.contract&&x.contract.apy<marketAPY(x)*0.9)
        .sort((a,b)=>b.ovr-a.ovr);
      if(!under.length) break;
      const x=under[0];
      const raise=Math.round(marketAPY(x)*rf(1.0,1.2));
      if(payroll(t)-x.contract.apy+raise>S.cap*0.97) break;
      setAPY(x,raise);
      x.contract.left=Math.max(x.contract.left,contractYears(x));
    }
  }
}
/* keep the save file from growing forever */
function pruneState(){
  const keep=new Set();
  for(const t of S.teams){
    t.roster.forEach(id=>keep.add(id));
    (t.ir||[]).forEach(id=>keep.add(id));
    (t.ps||[]).forEach(id=>keep.add(id));
  }
  S.prospects.forEach(id=>keep.add(id));
  // let weak unsigned veterans drift out of the league (the real trim, gated
  // on supply, happens after the season fills its rosters — see startSeason)
  S.freeAgents=S.freeAgents.filter(id=>{
    const p=S.players[id];
    if(!p||p.retired) return false;
    if(p.ovr<50) { p.retired=true; return false; }   // only the truly unplayable
    return true;
  });
  S.freeAgents.forEach(id=>keep.add(id));
  const awardIds=new Set();
  for(const yr of (S.awards||[])) for(const a of (yr.list||[])) awardIds.add(a.id);
  for(const h of (S.hall||[])) awardIds.add(h.id);
  let legends=0;
  for(const id in S.players){
    const p=S.players[id];
    if(keep.has(p.id)||awardIds.has(p.id)) continue;
    if(p.retired&&(p.accolades||[]).length>=4&&legends<80){ legends++; continue; }
    delete S.players[id];
  }
  for(const id in S.players){
    const p=S.players[id];
    if(p.draft&&p.draft.noteBank&&!p.isProspect) delete p.draft.noteBank;
    delete p.lastStats;
  }
  // the paperwork on a man three years into his career is no longer needed
  const rostered=new Set();
  for(const t of S.teams) for(const id of t.roster.concat(t.ir||[],t.ps||[])) rostered.add(+id);
  for(const id in S.players){
    const p=S.players[id];
    if(!p) continue;
    if(!p.isProspect&&p.draft&&!p.draft.archived&&((p.exp||0)>=3||p.retired))
      archiveDraftRecord(p);
    // season-by-season lines are for men still in the league
    if(p.seasonLog&&p.seasonLog.length){
      const cap = rostered.has(+id) ? 14 : (p.retired?2:4);
      if(p.seasonLog.length>cap) p.seasonLog.length=cap;
      // old lines written before compaction still carry ninety zeroed keys
      for(const e of p.seasonLog) if(e&&e.s) e.s=compactStatLine(e.s);
    }
  }
  for(const t of S.teams){
    t.ir=(t.ir||[]).filter(id=>S.players[id]);
    t.ps=(t.ps||[]).filter(id=>S.players[id]);
    t.roster=t.roster.filter(id=>S.players[id]);
  }
  for(const g of S.schedule){ delete g.log; if(g.gamebook&&Array.isArray(g.gamebook.plays)){ persistGamebook(g); delete g.gamebook.plays; } }
  S.news=S.news.slice(0,120);
}

/* ---------- new season ---------- */
function startSeason(){
  resetPosNorms(); resetAttrNorms();
  runHoldouts();
  for(const t of S.teams) updateMorale(t);
  S.year++;
  resetStandings();
  newDraftPicks();
  buildSchedule();
  generateDraftClass();
  S.week=1; S.phase="regular";
  const wasCap=S.cap;
  S.cap=Math.round(S.cap*capGrowth());
  news(`The salary cap is set at ${fmtM(S.cap)} — ${S.capNote}, `+
       `${S.cap>=wasCap?"a rise of":"a fall of"} ${fmtM(Math.abs(S.cap-wasCap))}.`,"league");
  closeFifthYears();     // the deadline has passed on anything left undecided
  runAutoCuts();
  for(const t of S.teams){ t.scoutPts=0; fillRosterFromFA(t,t.id!==S.userTeam); assignSchemes(t); }
  for(const t of S.teams) coverAllPositions(t);
  aiStockPracticeSquads();
  enforceCapFloor();
  enforceCap();
  // enforceCap can (rightly) release players to fix a cap violation that
  // predates this call — but that can leave a team under the roster limit
  // again. Its own room-check means it will only sign what a now-compliant
  // team can actually afford, so this can't reopen the violation.
  for(const t of S.teams) if(t.roster.length<ROSTER_MAX) fillRosterFromFA(t,true);
  // fillRosterFromFA will always sign at least a minimum-salary man to reach
  // the roster floor even with zero cap room (Math.max(minSalary(),capSpace)),
  // which can put a team fractionally back over the cap right after the line
  // above just fixed it. Close that loop — but with the floor raised to the
  // roster we only just finished filling, so this cleanup can restructure or
  // defer, never undo the fill it's cleaning up after.
  enforceCap(null,{floor:ROSTER_MAX});
  for(const t of S.teams) autoDepth(t);
  // The whole offseason's hiring window (the "resign" phase) has now closed.
  // Your staff was yours to choose, but a season can't be played with an
  // empty chair — this is the actual last resort, not the one right after
  // the carousel, which ran before you'd even seen the vacancy.
  {
    const t=S.teams[S.userTeam];
    for(const role of ["HC","OC","DC","SD"]){
      if(t.staff[role]) continue;
      const pool=(S.staffMarket||[]).filter(x=>x.role===role)
        .sort((a,b)=>coachOverall(b)-coachOverall(a)+(rnd()-0.5)*8);
      const want=pool.length>1 ? (pool.find(x=>x.asking<t.cash*0.25)||pool[0]) : null;
      if(want){ want.salary=want.asking; t.staff[role]=want;
        S.staffMarket=(S.staffMarket||[]).filter(x=>x.id!==want.id); }
      else t.staff[role]=makeCoach(role);
      news(`With the chair still open, the front office hired ${esc(t.staff[role].name)} as ${role}.`,"info");
    }
  }
  trimFreeAgentSurplus();
  news(`${S.year} season kicks off. Next year's class is on the board.`,"info");
}

/* ---------- the one button ---------- */
function advance(){
  if(S.owner&&S.owner.fired) return;   // you don't work here any more
  topUpMarkets();                      // there is always somebody available
  const t=S.teams[S.userTeam];
  switch(S.phase){
    case "regular":
      if(S.week<=WEEKS){ tickHoldouts(); playWeek(); grantScoutPts(); aiManageIR(); psDevelop(); poachPracticeSquads(); }
      runAutoJobs();
      ownerInSeason();
      buildDigest();
      if(GAMEPLANS[planOf()]&&GAMEPLANS[planOf()].heals)
        for(const id of t.roster){ const p=S.players[id]; if(p&&p.injury>0&&chance(.35)) p.injury--; }
      S.gameplan="balanced";
      updateMorale(t);
      if(S.week>WEEKS){ S.phase="postseason"; news("Regular season complete.","info"); }
      break;
    case "postseason":{
      const champ=simPlayoffs();
      buildDraftOrder();
      news(`${champ.city} ${champ.name} win the championship.`,"playoff");
      if(champ.id===S.userTeam)
        raiseMoment("win","Champions",`${champ.city} ${champ.name}`,
          `${S.year}. Whatever else happens, they can't take this one off you.`);
      S.phase="offseason";
      break;}
    case "offseason":{
      const rooks=t.roster.map(id=>S.players[id])
        .filter(p=>p.exp===0&&p.draft&&p.draft.pickedBy===t.id);
      offseasonProgressReport(rooks);
      lifeSeasonEnd();
      ownerReview();
      settleBooks();
      refreshStaffMarket();
      aiStaffChurn();
      tapeRetrospective();
      aiTradeApproach();
      seasonAwards();
      clearIR();
      updatePrestige();
      logCareerSeason();
      ownerTenureRoll();
      aiOwnerChurn();
      resolveUserRelocation();
      considerRelocation();
      ageStaff();
      runCarousel();
      // ageStaff and runCarousel can both empty a chair, but aiStaffChurn —
      // the only thing that ever fills one — already ran earlier this same
      // offseason. Without this, a vacancy they create sits empty for an
      // entire season, which is exactly what "every club still has a head
      // coach" was catching in longrun testing.
      backfillVacantStaff();
      generateJobOffers();
      driftSchoolWeights();
      {const retirees=offseasonProgress(); evaluateAlumni(retirees); hallOfFameIntake(retirees);}
      buildRecap();          // now that everyone has developed or declined
      rollContracts();
      aiResign();
      S.phase="resign";
      S.userOffers={};
      news("Contracts have rolled over. Expiring players hit the market next.","info");
      break;}
    case "resign":
      aiUseTags();
      runCombine();          // late February, weeks before anybody can be signed
      S.phase="freeagency";
      break;
    case "freeagency":
      runFreeAgency(6);
      awardCompPicks();
      aiRosterCleanup();
      enforceCap();
      runFreeAgency(3);   // whoever the purge put on the street gets another market
      S.userOffers={};
      aiFifthYears();
      generateRumors();
      S.phase="predraft"; S.predraftWeek=1;
      t.scoutPts+=Math.round(scoutBudget(t)*2.4);
      break;
    case "predraft":
      S.predraftWeek=(S.predraftWeek||1)+1;
      t.scoutPts+=Math.round(scoutBudget(t)*2.2);
      if(S.predraftWeek>4){
        buildDraftOrder();   // rebuilt now, so trades made during the pre-draft window count
        S.phase="draft"; advanceDraftToUser();
        if(S.draftIdx>=S.draftOrder.length) endDraft(); }
      break;
    case "draft":{
      const pk=onClock();
      if(!pk){ endDraft(); break; }
      if(pk.team===S.userTeam){ toast("You're on the clock — make a pick."); V.screen="hub"; break; }
      advanceDraftToUser();
      if(S.draftIdx>=S.draftOrder.length||!S.prospects.length) endDraft();
      break;}
    case "postdraft":
      if(t.roster.length>ROSTER_MAX){ toast(`Cut down to ${ROSTER_MAX} first (${t.roster.length} on roster).`); break; }
      aiRosterCleanup();
      pruneState();
      startSeason();
      break;
  }
  render();
}

/* ---------- persistence ---------- */
const SAVEKEY="frontoffice.save.v1";
async function storePut(k,v){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  window.__mem=window.__mem||{}; window.__mem[k]=v;
  return false;                       // it is in memory only and will not survive a reload
}
async function storeGet(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value) return r.value; } }catch(e){}
  try{ const r=localStorage.getItem(k); if(r) return r; }catch(e){}
  return (window.__mem||{})[k]||null;
}
/* Full play-by-play ledgers live in separate storage records so the franchise save stays small. */
const GAMEBOOKKEY_PREFIX="frontoffice.gamebook.v1.";
function gamebookStoreKey(id){ return GAMEBOOKKEY_PREFIX+String(id); }
function serialiseState(){
  return JSON.stringify(S,function(k,v){
    if(k.charAt(0)==="_") return undefined;
    if(k==="plays" && this && this.gamebook) return undefined;
    // ninety zeroed keys per man, restored by ensurePlayerStats on load
    if(k==="stats" && v && typeof v==="object" && !Array.isArray(v)) return compactStatLine(v);
    return v;
  });
}
async function persistGamebook(g){
  if(!g||!g.gamebook||!g.gamebookId) return false;
  try{return await storePut(gamebookStoreKey(g.gamebookId),JSON.stringify(g.gamebook));}catch(e){return false;}
}
async function loadGamebook(g){
  if(!g||!g.gamebookId) return null;
  if(g.gamebook&&Array.isArray(g.gamebook.plays)) return g.gamebook;
  const raw=await storeGet(gamebookStoreKey(g.gamebookId));
  if(!raw) return g.gamebook||null;
  try{g.gamebook=JSON.parse(raw); return g.gamebook;}catch(e){return g.gamebook||null;}
}
function saveSignature(){return S?`${S.year}|${S.week}|${S.phase}|${(S.news||[]).length}|${S.draftIdx}|${S.schedule?.length||0}|${S.__saveRev||0}`:"";}
let SAVE_BUSY=false,SAVE_PENDING=false;
async function saveGame(force){
  if(!S||!S.teams)return;
  if(!force && !S.__dirty) return true;
  // The franchise state is now compact enough that autosave can safely write it on every tick.
  // Do not rely on a fragile signature: roster moves, finances, stats and staff changes can all
  // happen without changing week/news counts. The expensive play-by-play remains outside S.
  if(SAVE_BUSY){SAVE_PENDING=true;return;} SAVE_BUSY=true;
  try{const ok=await storePut(SAVEKEY,serialiseState()); S.__lastSig=saveSignature(); S.saveOK=ok; S.savedAt=Date.now(); S.__dirty=false;
    if(!ok&&!S.saveWarned){S.saveWarned=true;news("This browser won't store the league — it's only held in memory and will be lost when you close the tab. Download a copy from the Save screen.","loss");}
  }finally{SAVE_BUSY=false;if(SAVE_PENDING){SAVE_PENDING=false;setTimeout(()=>saveGame(false),0);}}
}
async function loadGame(){const raw=await storeGet(SAVEKEY);if(!raw)return false;try{S=JSON.parse(raw);migrateSave();return true;}catch(e){return false;}}
/* a save written before a system existed still has to open */
function migrateSave(){
  if(!S||!S.teams) return;
  if(!S.owner) initOwner();
  if(!S.records||!S.hall) ensureBooks();
  if(!S.rumors) S.rumors=[];
  if(!S.tapeWatch) S.tapeWatch=[];
  if(!S.staffMarket) S.staffMarket=[];
  if(!S.tradeInbox) S.tradeInbox=[];
  S.scramble=null; S.draftOffers=null;
  for(const id in S.players){ if(S.players[id]) ensurePlayerStats(S.players[id]); }
  for(const t of S.teams){
    ensureOps(t);
    assignSchemes(t);
    for(const r of ["HC","OC","DC","SD"]){
      const c=t.staff[r];
      if(!c) continue;
      if(c.age===undefined) c.age=r==="HC"?ri(41,63):ri(33,58);
      if(!c.hidden||c.hidden.pot===undefined) rollCoachPotential(c);
      if(c.value===undefined) c.value=coachValue(c);
    }
    if(!t.ir) t.ir=[];
    if(!t.ps) t.ps=[];
    if(t.irReturns===undefined) t.irReturns=0;
    if(!t.depth) autoDepth(t);
  }
  for(const c of (S.staffMarket||[])){
    if(c.age===undefined) c.age=c.role==="HC"?ri(41,63):ri(33,58);
    if(!c.hidden||c.hidden.pot===undefined) rollCoachPotential(c);
    if(c.value===undefined) c.value=coachValue(c);
  }
  if(S.owner&&!S.owner.traits) initOwnerTraits(S.owner);
  if(!S.schoolW) initSchoolWeights();
  if(!S.tagUsed) S.tagUsed={};
  if(!S.gameplan) S.gameplan="balanced";
  if(!Number.isFinite(S.__saveRev)) S.__saveRev=0;
  if(!S.hintsSeen) S.hintsSeen=[];
  if(!S.seededYears){
    // an old save only holds one year of picks; mint the next two
    S.seededYears=[...new Set(S.teams.flatMap(t=>t.picks.map(p=>p.year)))];
    for(const y of [S.year+1,S.year+2]){
      if(S.seededYears.indexOf(y)>=0) continue;
      S.seededYears.push(y);
      for(const t of S.teams) for(let r=1;r<=7;r++) t.picks.push({year:y,round:r,orig:t.id});
    }
  }
  if(!S.norms) S.norms={pos:{},attr:{}};   // a save from before the baselines existed
  for(const id in S.players){
    const p=S.players[id];
    if(!p||!p.pos) continue;
    delete p._syn; delete p._synOvr;
    if(!p.traits) rollTraits(p);
    if(p.morale===undefined) p.morale=ri(62,80);
    if(p.tenure===undefined) p.tenure=0;
  }
}

async function boot(){
  const __calibrationMode = new URLSearchParams(location.search).get("calibration");
  // Calibration runs are deliberately isolated from saved state/slot I/O so the
  // harness is deterministic and cannot hang waiting on storage adapters.
  if(__calibrationMode){
    // Calibration does not need the full 32-team league. Building all 32 clubs
    // runs expensive roster/depth/cap work before the experiment even starts.
    // Use two fully populated, engine-valid teams so the actual game simulator
    // is exercised while avoiding unrelated season initialization.
    S=freshState(0xC411B);
    S.teams=[0,1].map(i=>makeTeam(i));
    const strengths=[0,0];
    S.teams.forEach((t,i)=>{
      initOps(t); assignSchemes(t); fillRoster(t,strengths[i]);
      t.staff.HC=makeCoach("HC"); t.staff.OC=makeCoach("OC"); t.staff.DC=makeCoach("DC");
      t.staff.SD=makeCoach("SD");
      for(let k=0;k<3;k++) t.scouts.push(makeScout());
      autoDepth(t);
      assignDefensiveRoles(t);
    });
    calibrateMoney();
    seedFacilities("survey");
    V.screen="menu";
    if(__calibrationMode==="shell") render();
  } else {

    if(ok&&S&&S.teams&&S.teams.length){

      const t=S.teams[S.userTeam];
      MENU_SAVE={club:`${t.city} ${t.name}`, year:S.year,
                 record:`${t.w}-${t.l}${t.t?"-"+t.t:""}`, phase:phaseLabel()};
    } else {
      // a league has to exist behind the menu for the setup screen to work from

      applyRealIdentities(); seedFacilities("survey");
      await readSlots();

    }

  }
  if(!__calibrationMode) setInterval(()=>{ if(S&&S.teams&&S.teams.length) saveGame(); },30000);

/* ---------- what the cap does next ---------- */
function capGrowth(){
  // a shock is repaid over the following seasons, as the league has done before
  if(S.capRepay>0){
    S.capRepay--;
    const r=1+rf(0.10,0.135);
    S.capNote=`up sharply again as the league makes up lost ground`;
    return r;
  }
  if(chance(0.038)){                       // something goes badly wrong
    S.capRepay=ri(2,3);
    const r=1-rf(0.05,0.11);
    S.capNote=`down for the first time in years — the league has taken a hit`;
    return r;
  }
  if(chance(0.13)){                        // the television money is renegotiated
    const r=1+rf(0.115,0.145);
    S.capNote=`up steeply on the back of a new television deal`;
    return r;
  }
  const r=1+clamp(gauss(0.065,0.023),0.015,0.11);
  S.capNote=r>=1.085?`up strongly`:r<=1.045?`up only a little`:`up as usual`;
  return r;
}
/* ============================================================
   Module 9: running the business — money, facilities, staff,
   the trade market, and the long memory of a draft board
   ============================================================ */

/* ---------- market sizes ---------- */
function marketFor(t){
  const r=(typeof REAL_TEAMS!=="undefined")?REAL_TEAMS[t.id]:null;
  if(r) return r[6];
  return clamp(0.74 + ((t.id*37)%23)/23*0.58, 0.74, 1.32);
}

/* ---------- facilities ---------- */
const FACS = {
  train:     {name:"Training center",     short:"Training",
              blurb:"Strength staff, tech, the weight room. Players on the roster develop faster.",
              base:26e6, up:6.0e6},
  med:       {name:"Sports medicine",     short:"Medicine",
              blurb:"Trainers, imaging, recovery. Fewer soft-tissue injuries and quicker returns.",
              base:24e6, up:6.0e6},
  scoutdept: {name:"Scouting department", short:"Scouting",
              blurb:"Film rooms, travel budget, regional offices. More hours in the pre-draft window.",
              base:16e6, up:4.0e6},
  analytics: {name:"Analytics group",     short:"Analytics",
              blurb:"Modelling and cross-checking. Tightens the range on every grade and filters out bad intel.",
              base:18e6, up:4.0e6},
  stadium:   {name:"Stadium",             short:"Stadium",
              blurb:"Seats, suites, concessions. The single biggest lever on what the club earns.",
              base:55e6, up:12e6}
};
const FAC_KEYS = Object.keys(FACS);
const FAC_TIERS = 5;      // five tiers gets you level with the best in the league
const FAC_MAX = 99;       // but nothing stops a club going further
/* what a level is actually worth: linear to the fifth tier, then diminishing,
   so a club can always invest without the effects running away */
function effLvl(t,k){
  const l=facLvl(t,k);
  return l<=FAC_TIERS ? l : FAC_TIERS + (1-Math.pow(0.72,l-FAC_TIERS))*2.6;
}
function capScale(){ return S.cap/CAP_BASE; }
function facLvl(t,k){ return (t && t.fac && t.fac[k]) || 1; }
function facCost(t,k){
  const lvl=facLvl(t,k);
  // past the fifth tier you're paying for the cutting edge, and it is not cheap
  const beyond = lvl>=FAC_TIERS ? Math.pow(1.40,lvl-FAC_TIERS+1) : 1;
  return Math.round(FACS[k].base*Math.pow(lvl,1.35)*beyond*capScale()/1e6)*1e6;
}
function facUpkeep(t){
  return Math.round(sum(FAC_KEYS.map(k=>FACS[k].up*facLvl(t,k)))*capScale());
}
/* the levers facilities actually pull */
// level 2 is the league norm: level 1 is a small penalty, not a ruinous one
function devMult(t){        return 1 + 0.090*(effLvl(t,"train")-2); }
function injuryMult(t){     return Math.max(0.50, 1 - 0.085*(effLvl(t,"med")-2)); }
function healMult(t){       return 1 + 0.10*(effLvl(t,"med")-1); }
function analyticsEdge(t){  return clamp((effLvl(t,"analytics")-1)/4,0,1.35); }

function initOps(t){
  t.market = marketFor(t);
  t.fac = {train:2, med:2, scoutdept:2, analytics:2, stadium:2};
  t.scoutInvest = 0;                       // $M/yr of extra scouting money
  t.cash = Math.round(90e6*capScale()*rf(.7,1.3));
  t.books = [];                            // season-by-season P&L
}
function ensureOps(t){ if(!t.fac) initOps(t); }

/* ---------- the ledger ---------- */
function seasonRevenue(t){
  ensureOps(t);
  const cs=capScale(), mk=t.market, wp=winPct(t);
  const media = Math.round(340e6*cs);
  const gate  = Math.round(130e6*cs*mk*(0.80+0.34*wp)*(1+0.11*(effLvl(t,"stadium")-2)));
  const merch = Math.round( 92e6*cs*mk*(0.45+0.55*t.prestige/60)*(0.75+0.42*wp));
  let post=0;
  if(t.madePlayoffs)     post += Math.round(17e6*cs*mk);
  if(S.champion===t.id)  post += Math.round(28e6*cs*mk);
  return {media,gate,merch,post,total:media+gate+merch+post};
}
function seasonExpenses(t){
  ensureOps(t);
  const cs=capScale();
  const players = payroll(t);          // payroll already carries the dead money
  const staff = sum(["HC","OC","DC","SD"].map(k=>t.staff[k]?t.staff[k].salary:0))
              + t.scouts.length*Math.round(0.7e6*cs);
  const fac = facUpkeep(t);
  const ops = Math.round(196e6*cs*(0.75+0.35*t.market));
  const scouting = Math.round((t.scoutInvest||0)*1e6*cs);
  return {players,staff,fac,ops,scouting,total:players+staff+fac+ops+scouting};
}
function settleBooks(){
  for(const t of S.teams){
    ensureOps(t);
    const rev=seasonRevenue(t), exp=seasonExpenses(t);
    const net=rev.total-exp.total;
    t.cash=Math.round(t.cash+net);
    if(t.cash<0){
      const covered=-t.cash;
      t.cash=0;
      t.hadShortfall=true;
      if(t.id===S.userTeam&&S.owner){
        const hit=clamp(Math.round(covered/(S.cap*0.06)),1,14);
        S.owner.patience=clamp(S.owner.patience-hit,0,100);
        news(`The owner had to put ${fmtM(covered)} in to cover the shortfall. He noticed.`,"loss");
      }
    }
    const reserve=Math.round(400e6*capScale()*
      (t.id===S.userTeam&&typeof ownerPurseMult==="function"?ownerPurseMult():1));
    if(t.cash>reserve){
      const draw=Math.round((t.cash-reserve)*0.45);
      t.cash-=draw;
      if(t.id===S.userTeam) news(`The owner took ${fmtM(draw)} out of the club this year. ` +
        `Money left sitting is money he assumes you don't need.`,"info");
    }
    t.books.unshift({year:S.year, rev:rev.total, exp:exp.total, net, w:t.w, l:t.l});
    if(t.books.length>12) t.books.length=12;
    if(t.id===S.userTeam){
      news(`${S.year} books closed: ${fmtM(rev.total)} in, ${fmtM(exp.total)} out — ` +
           `${net>=0?"a "+fmtM(net)+" profit":fmtM(-net)+" in the red"}. ` +
           `${fmtM(t.cash)} on hand.`, net>=0?"info":"loss");
    }
    // the AI reinvests when it can
    if(t.id!==S.userTeam) aiSpend(t);
  }
}
function aiSpend(t){
  let guard=0;
  while(guard++<2){
    const wants=FAC_KEYS.filter(k=>facLvl(t,k)<12)
      .map(k=>({k,c:facCost(t,k),w:aiFacWeight(t,k)}))
      .filter(x=>x.c && x.c < t.cash-Math.round(90e6*capScale()))
      .sort((a,b)=>b.w-a.w);
    if(!wants.length) break;
    if(!chance(0.55+t.ai.aggression*0.3)) break;
    const x=wants[0];
    t.cash-=x.c; t.fac[x.k]++;
  }
}
function aiFacWeight(t,k){
  const lvl=facLvl(t,k);
  const base={train:1.00, med:0.86, scoutdept:0.74, analytics:0.70, stadium:0.92}[k];
  const tilt = k==="stadium" ? t.market*0.9
             : k==="scoutdept"||k==="analytics" ? (1-t.ai.winNow)*1.1
             : t.ai.winNow*0.8;
  return (base+tilt)/Math.pow(lvl,0.55) + rf(0,0.35);
}

/* ---------- staff market ---------- */
function coachOverall(c){
  return Math.round((Math.max(c.off,c.def)*0.34 + c.dev*0.34 + c.gm*0.18 + c.disc*0.14));
}
function refreshStaffMarket(){
  S.staffMarket=[];
  for(const role of ["HC","OC","DC","SD"]){
    // 3-5 candidates per role, shared across all 32 teams, never replenished
    // until next year's refresh, was running dry well before a season ended
    // — a handful of AI hires and the pool for a role could hit zero. Not
    // every extra name needs to be good; the point is having someone left
    // to look at.
    const n=ri(9,14);
    for(let i=0;i<n;i++){
      const c=makeCoach(role);
      if(TEAM_SCHEMES[role]) c.scheme=pick(Object.keys(TEAM_SCHEMES[role]));
      c.asking=Math.round(coachValue(c)*rf(1.0,1.40)/1e5)*1e5;
      c.years=ri(2,4);
      S.staffMarket.push(c);
    }
  }
}
function buyoutCost(c){ return Math.round((c.salary||0)*Math.max(1,c.years||1)*0.55); }
function fireCoach(t,role){
  const c=t.staff[role];
  if(!c) return {ok:false,msg:"Nobody in that chair."};
  const cost=buyoutCost(c);
  if(t.cash<cost) return {ok:false,msg:`Buying him out costs ${fmtM(cost)}. You don't have it.`};
  t.cash-=cost;
  delete t.staff[role];
  news(`${esc(c.name)} relieved of his duties. ${fmtM(cost)} buyout.`,"loss");
  return {ok:true,msg:`${c.name} is out. ${fmtM(cost)} buyout.`};
}
function hireCoach(t,cid){
  const c=S.staffMarket.find(x=>x.id===cid);
  if(!c) return {ok:false,msg:"He's off the market."};
  if(t.staff[c.role]) return {ok:false,msg:`Move on from your ${c.role} first.`};
  if(t.cash<c.asking) return {ok:false,msg:`He wants ${fmtM(c.asking)}. You can't cover it.`};
  c.salary=c.asking;
  t.staff[c.role]=c;
  S.staffMarket=S.staffMarket.filter(x=>x.id!==cid);
  news(`Hired ${esc(c.name)} as ${c.role} — ${fmtM(c.salary)} a year.`,"signing");
  return {ok:true,msg:`${c.name} takes the ${c.role} job.`};
}
/* AI clubs churn their staff after bad years, and fill anything the user vacated */
function aiStaffChurn(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;   // your staff is yours to choose
    for(const role of ["HC","OC","DC","SD"]){
      const c=t.staff[role];
      const bad = winPct(t)<0.34 && chance(0.55);
      const poached = c && chance(0.05);
      if(c && !bad && !poached) continue;
      if(c){ t.cash-=buyoutCost(c); delete t.staff[role]; }
      const pool=S.staffMarket.filter(x=>x.role===role)
        .sort((a,b)=>coachOverall(b)-coachOverall(a)+(rnd()-0.5)*8);
      // clubs don't strip the market bare — there is always someone left for you to hire
      const want=pool.length>2 ? (pool.find(x=>x.asking<t.cash*0.25)||pool[0]) : null;
      if(want){ want.salary=want.asking; t.staff[role]=want;
        S.staffMarket=S.staffMarket.filter(x=>x.id!==want.id); }
      else t.staff[role]=makeCoach(role);
    }
  }
}

/* ---------- scouting money ---------- */
function setScoutInvest(t,mil){
  t.scoutInvest=clamp(Math.round(mil),0,60);
}

/* ---------- the trade market ---------- */
function assetLabel(a){
  if(a.type==="pick"){
    const own = a.orig===a.holder;
    return `${a.year} round ${a.round}${own?"":` <span class="dim small">(${S.teams[a.orig].abbr})</span>`}`;
  }
  const p=S.players[a.pid];
  return `${posTag(p.pos)} ${esc(p.l)} <span class="dim small">${p.ovr} ovr · ${p.age}</span>`;
}
function assetValue(a){
  if(a.type!=="pick") return playerTradeValue(S.players[a.pid]);
  const out=Math.max(0,a.year-S.year);
  return pickValue(a.round,projectedSlot(a))*Math.pow(0.87,out);  // jam tomorrow is worth less
}
function projectedSlot(a){
  const t=S.teams[a.orig];
  if(!t) return 16;
  const order=S.teams.slice().sort((x,y)=>winPct(x)-winPct(y));
  const now=clamp(order.findIndex(x=>x.id===t.id)+1,1,32);
  // the further out you look, the more everyone resembles a .500 club
  const out=Math.max(0,a.year-S.year);
  const regress=clamp(out*0.40,0,0.85);
  return clamp(Math.round(now*(1-regress)+16.5*regress),1,32);
}
function teamAssets(t){
  ensureOps(t);
  const players=t.roster.map(id=>S.players[id]).filter(Boolean)
    .sort((a,b)=>playerTradeValue(b)-playerTradeValue(a))
    .map(p=>({type:"player",pid:p.id,holder:t.id}));
  const picks=t.picks.slice().sort((a,b)=>a.year-b.year||a.round-b.round)
    .map(pk=>({type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id}));
  return {players,picks};
}
function assetKey(a){
  return a.type==="pick" ? `k:${a.year}:${a.round}:${a.orig}` : `p:${a.pid}`;
}
function tradeVerdict(partner, theyGive, theyGet){
  const g=sum(theyGive.map(assetValue)), r=sum(theyGet.map(assetValue));
  const bar = 1.05 + partner.ai.aggression*0.10;
  // clubs pay a premium for a position they're desperate at
  let needBump=0;
  for(const a of theyGet) if(a.type==="player"){
    const p=S.players[a.pid];
    needBump += clamp(needScore(partner,p.pos),0,60)/60 * playerTradeValue(p)*0.16;
  }
  const effective=r+needBump;
  return {give:g, get:r, need:Math.round(needBump), accept: effective >= g*bar,
          margin: g>0 ? effective/g : (effective>0?9:1)};
}
function tradeLegal(a,b,aGive,bGive){
  // rosters and the cap both have to survive it
  const aRoster=a.roster.length-aGive.filter(x=>x.type==="player").length+bGive.filter(x=>x.type==="player").length;
  const bRoster=b.roster.length-bGive.filter(x=>x.type==="player").length+aGive.filter(x=>x.type==="player").length;
  if(aRoster>ROSTER_MAX+6||bRoster>ROSTER_MAX+6) return "That leaves someone with too many bodies.";
  const salIn =sum(bGive.filter(x=>x.type==="player").map(x=>S.players[x.pid].contract?S.players[x.pid].contract.apy:0));
  const salOut=sum(aGive.filter(x=>x.type==="player").map(x=>S.players[x.pid].contract?S.players[x.pid].contract.apy:0));
  if(capSpace(a)-salIn+salOut<0) return "You can't fit those contracts under the cap.";
  if(capSpace(b)+salIn-salOut<0) return "They can't fit those contracts under their cap.";
  return null;
}
function executeTrade(a,b,aGive,bGive){
  if(typeof tradesOpen==="function"&&!tradesOpen()) return false;
  if(tradeLegal(a,b,aGive,bGive)) return false;   // the cap and the roster limits bind everyone
  const move=(from,to,assets)=>{
    for(const x of assets){
      if(x.type==="player"){
        const p=S.players[x.pid];
        from.roster=from.roster.filter(id=>id!==p.id);
        from.ir=(from.ir||[]).filter(id=>id!==p.id);
        from.ps=(from.ps||[]).filter(id=>id!==p.id);
        p.onIR=false; p.onPS=false;
        addToTeam(p,to);
      } else {
        const i=from.picks.findIndex(pk=>pk.year===x.year&&pk.round===x.round&&pk.orig===x.orig);
        if(i>=0){ const pk=from.picks.splice(i,1)[0]; to.picks.push(pk); }
      }
    }
  };
  move(a,b,aGive); move(b,a,bGive);
  autoDepth(a); autoDepth(b);
  const desc=(assets)=>assets.map(x=>x.type==="player"
    ? `${S.players[x.pid].pos} ${S.players[x.pid].l}` : `${x.year} R${x.round}`).join(", ");
  news(`Trade with ${b.city}: out ${desc(aGive)||"nothing"} — in ${desc(bGive)||"nothing"}.`,"trade");
}

/* AI clubs come to you when they want something badly enough */
function aiTradeApproach(){
  const u=S.teams[S.userTeam];
  if(!u.roster.length) return;
  const targets=u.roster.map(id=>S.players[id])
    .filter(p=>p.ovr>=76 && p.age<=30).sort((a,b)=>playerTradeValue(b)-playerTradeValue(a)).slice(0,8);
  if(!targets.length) return;
  for(let attempt=0;attempt<3;attempt++){
    const p=pick(targets);
    const suitors=S.teams.filter(t=>t.id!==u.id && needScore(t,p.pos)>34 && t.ai.winNow>0.5);
    if(!suitors.length) continue;
    const t=pick(suitors);
    const want=playerTradeValue(p)*(1.08+t.ai.aggression*0.18);
    const cand=t.picks.filter(pk=>pk.year<=S.year+2)
      .map(pk=>({a:{type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id},v:pickValue(pk.round,16)}))
      .sort((x,y)=>y.v-x.v);
    const give=[]; let acc=0;
    for(const c of cand){ if(acc>=want) break; give.push(c.a); acc+=c.v; }
    if(acc<want*0.9||!give.length) continue;
    S.tradeInbox=(S.tradeInbox||[]).filter(o=>S.year-o.year<1).slice(-2);
    S.tradeInbox.push({team:t.id, want:[{type:"player",pid:p.id,holder:u.id}], give,
                       year:S.year, txt:`${t.city} want ${p.pos} ${p.l}.`});
    news(`${t.city} called about ${p.pos} ${p.l}. There's an offer on your desk.`,"trade",p.id);
    return;
  }
}

/* ---------- the long memory of a draft board ---------- */
function recordTapeWatch(){
  // every prospect we put real hours into but did not draft
  const u=S.teams[S.userTeam];
  const list=[];
  for(const id in S.scout){
    const r=S.scout[id], p=S.players[id];
    if(!p||!p.draft||r.k<12) continue;
    if(p.draft.pickedBy===u.id) continue;
    if(p.draft.pickedBy===undefined||p.draft.pickedBy===null) continue;
    list.push({pid:+id, year:S.year, k:Math.round(r.k),
               est:Math.round(p.draft.userEst!==undefined?p.draft.userEst:p.draft.consensus),
               cons:Math.round(p.draft.consensus),
               at:p.draft.pickedAt, by:p.draft.pickedBy});
  }
  S.tapeWatch=(S.tapeWatch||[]).concat(list).slice(-900);
}
function tapeRetrospective(){
  const now=S.year;
  const due=(S.tapeWatch||[]).filter(x=>now-x.year===3);
  const hits=[], misses=[];
  for(const x of due){
    const p=S.players[x.pid];
    if(!p||p.retired) continue;
    // he is a real player now, and our board had him below what was knowable at the time
    if(p.ovr>=80 && (x.est<=x.cons-3 || (x.at>=40 && x.est<=x.cons+1))) hits.push({x,p});
    if(p.ovr<=66 && x.est>=x.cons+5) misses.push({x,p});
  }
  hits.sort((a,b)=>b.p.ovr-a.p.ovr);
  for(const h of hits.slice(0,2)){
    const club=S.teams[h.x.by];
    const weGotItWrong = h.p.ovr - h.x.est >= 6;
    const wentLate = h.x.at>=60;
    news(weGotItWrong
      ? `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `He went ${ordinal(h.x.at)}. We had ${h.x.k} hours of tape on him and wrote him up as a ${h.x.est}. ` +
        `The tape was there and we read it wrong.`
      : wentLate
      ? `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `Our board had him at ${h.x.est} — we were right about him — and we sat there while he went ` +
        `${ordinal(h.x.at)} to somebody else.`
      : `Three years on, ${h.p.pos} ${h.p.f} ${h.p.l} is a ${h.p.ovr} in ${club.city}. ` +
        `We put ${h.x.k} hours into him, graded him ${h.x.est}, and never called his name.`,
      "loss", h.p.id);
  }
  for(const m of misses.slice(0,1)){
    news(`${m.p.pos} ${m.p.f} ${m.p.l} — the one our board loved at ${m.x.est} — is a ${m.p.ovr} ` +
         `three years in, and the league had him lower than we did the whole time. ` +
         `Somebody filed a report we nearly spent a pick on.`, "info", m.p.id);
  }
  S.tapeWatch=(S.tapeWatch||[]).filter(x=>now-x.year<4);
}

function tradeState(){
  if(!V.trade) V.trade={partner:null, mine:[], theirs:[]};
  return V.trade;
}
function inList(list,a){ return list.some(x=>assetKey(x)===assetKey(a)); }
function assetPickerRows(assets,selected,side){
  return assets.map(a=>{
    const on=inList(selected,a);
    return `<tr class="click ${on?"":""}" data-act="tradetoggle" data-arg="${side}" data-arg2="${assetKey(a)}">
      <td style="width:26px">${on?'<span class="num o">✓</span>':'<span class="num d">·</span>'}</td>
      <td>${assetLabel(a)}</td>
      </tr>`;
  }).join("");
}
const SCREENS_TRADE=function(){
  const st=tradeState(), u=S.teams[S.userTeam]; ensureOps(u);
  if(st.partner===null){
    const rows=S.teams.filter(t=>t.id!==u.id)
      .map(t=>`<tr class="click" data-act="tradepartner" data-arg="${t.id}">
        <td><span class="crest sm" style="background:${t.color}">${t.abbr}</span></td>
        <td>${esc(t.city)} ${esc(t.name)}</td>
        <td class="n dim small">${t.w}-${t.l}</td>
        <td class="n dim small">${fmtM(capSpace(t))}</td></tr>`).join("");
    const inbox=(S.tradeInbox||[]);
    return `<div class="panel"><div class="ph"><h3>Trade</h3>
        <span class="sub">${fmtM(capSpace(u))} of room</span></div>
      <div class="pb tight"><p class="tiny ${tradesOpen()?"dim":"warn"}">${esc(tradeWindowNote())}</p></div>
      ${inbox.length?`<div class="pb"><p class="small"><b>On your desk</b></p>
        ${inbox.map((o,i)=>`<div class="note"><div class="small">${esc(o.txt)}</div>
          <div class="tiny dim">They offer ${o.give.map(g=>`${g.year} R${g.round}`).join(", ")}</div>
          <div class="row"><button class="chip" data-act="inboxopen" data-arg="${i}">Look at it</button>
          <button class="chip" data-act="inboxdrop" data-arg="${i}">Pass</button></div></div>`).join("")}
        </div>`:""}
      <div class="pb tight"><table><tbody>${rows}</tbody></table></div></div>`;
  }
  const t=S.teams[st.partner]; ensureOps(t);
  const mineA=teamAssets(u), theirsA=teamAssets(t);
  const v=tradeVerdict(t, st.theirs, st.mine);
  const illegal=tradeLegal(u,t,st.mine,st.theirs);
  const both=st.mine.length&&st.theirs.length;
  const mood = !both ? "Put something on the table."
    : illegal ? illegal
    : v.accept ? `${t.city} would do this.`
    : v.margin>0.92 ? `${t.city} are close — a little more and they'd bite.`
    : v.margin>0.78 ? `${t.city} want considerably more than that.`
    : `${t.city} aren't remotely interested.`;
  return `<div class="panel"><div class="ph">
      <h3>${esc(t.city)} ${esc(t.name)}</h3>
      <span class="sub"><button class="chip" data-act="tradeback">Change club</button></span></div>
    <div class="pb">
      <div class="callout ${both&&!illegal&&v.accept?"green":"warn"}">${mood}</div>
      <div class="row spread small">
        <span class="dim">${st.mine.length} ${st.mine.length===1?"piece":"pieces"} out</span>
        <span class="dim">${st.theirs.length} back${v.need?" · they're short at that spot":""}</span>
      </div>
      <div class="row">
        <button class="btn ${both&&!illegal&&v.accept?"primary":""}" data-act="tradepropose"
          ${both&&!illegal?"":"disabled"}>Propose the trade</button>
        <button class="btn" data-act="tradeclear">Clear</button>
        <button class="btn" data-act="tradeask">Ask what they want</button>
      </div>
    </div>
    <div class="ph"><h3>You send</h3></div>
    <div class="scroll" style="max-height:230px"><table><tbody>
      ${assetPickerRows(mineA.picks,st.mine,"mine")}
      ${assetPickerRows(mineA.players,st.mine,"mine")}
    </tbody></table></div>
    <div class="ph"><h3>They send</h3></div>
    <div class="scroll" style="max-height:230px"><table><tbody>
      ${assetPickerRows(theirsA.picks,st.theirs,"theirs")}
      ${assetPickerRows(theirsA.players,st.theirs,"theirs")}
    </tbody></table></div>
  </div>`;
};
