    news(`${FACS[k].name} upgraded to level ${t.fac[k]} — ${fmtM(cost)}.`,"info");
    toast(`${FACS[k].short} now level ${t.fac[k]}.`); render();
  },
  scoutinvest:v=>{ setScoutInvest(S.teams[S.userTeam],+v); render(); },
  firecoach:k=>{ const r=fireCoach(S.teams[S.userTeam],k); toast(r.msg); render(); },
  hirecoach:id=>{ const r=hireCoach(S.teams[S.userTeam],+id); toast(r.msg); render(); },
  interview:id=>{
    const bad=interviewCoach(+id);
    toast(bad||"You've had him in. The room has a clearer view now.");
    render();
  },
  tradepartner:id=>{ V.trade={partner:+id,mine:[],theirs:[]}; render(); },
  tradeback:()=>{ V.trade={partner:null,mine:[],theirs:[]}; render(); },
  tradeclear:()=>{ const st=tradeState(); st.mine=[]; st.theirs=[]; render(); },
  tradetoggle:(side,key)=>{
    const st=tradeState();
    const u=S.teams[S.userTeam], t=S.teams[st.partner];
    const pool=side==="mine"?teamAssets(u):teamAssets(t);
    const all=pool.picks.concat(pool.players);
    const a=all.find(x=>assetKey(x)===key);
    if(!a) return;
    const list=side==="mine"?st.mine:st.theirs;
    const i=list.findIndex(x=>assetKey(x)===key);
    if(i>=0) list.splice(i,1); else list.push(a);
    render();
  },
  tradeask:()=>{
    const st=tradeState();
    if(!st.theirs.length){toast("Pick what you want from them first.");return;}
    const u=S.teams[S.userTeam], t=S.teams[st.partner];
    const target=sum(st.theirs.map(assetValue))*(1.05+t.ai.aggression*0.10);
    const mineA=teamAssets(u);
    const all=mineA.picks.concat(mineA.players)
      .map(a=>({a,v:assetValue(a)})).sort((x,y)=>y.v-x.v);
    const build=[]; let acc=0;
    for(const c of all){ if(acc>=target) break; if(c.v<=target*1.6){build.push(c.a);acc+=c.v;} }
    if(acc<target){ toast(`${t.city} don't see enough on your side for that.`); return; }
    st.mine=build;
    toast("That's roughly their number.");
    render();
  },
  tradepropose:()=>{
    if(!tradesOpen()){ toast("The deadline has passed. Nothing moves until the season ends."); return; }
    const st=tradeState();
    const u=S.teams[S.userTeam], t=S.teams[st.partner];
    const bad=tradeLegal(u,t,st.mine,st.theirs);
    if(bad){toast(bad);return;}
    const v=tradeVerdict(t,st.theirs,st.mine);
    if(!v.accept){ toast(`${t.city} turn it down.`); return; }
    executeTrade(u,t,st.mine,st.theirs);
    st.mine=[]; st.theirs=[];
    toast("Done.");
    render();
  },
  inboxopen:i=>{
    const o=(S.tradeInbox||[])[+i]; if(!o) return;
    V.trade={partner:o.team, mine:o.want.slice(), theirs:o.give.slice()};
    S.tradeInbox.splice(+i,1);
    render();
  },
  inboxdrop:i=>{ (S.tradeInbox||[]).splice(+i,1); render(); },
  hirescout:()=>{
    const t=S.teams[S.userTeam]; ensureOps(t);
    const cost=Math.round(0.6e6*capScale());
    if(t.cash<cost*3){toast("Not enough cash to add to the department.");return;}
    t.cash-=cost*3;
    t.scouts.push(makeScout());
    toast("New scout on staff."); render();
  }
});

/* ---------- shopping a player around the league ---------- */
function clubInterest(t,p){
  const need=needScore(t,p.pos);
  const upgrade=clamp(p.ovr-unitRating(t,p.pos),-25,32);
  const money=p.contract? p.contract.apy/1e6*0.30 : 0;
  const room=capSpace(t)/1e6*0.06;
  return Math.round(need*0.50 + upgrade*1.6 + t.ai.winNow*20
    + (p.age<=27?9:p.age>=31?-10:0) + room - money);
}
function spareAssets(t,ceiling){
  // picks they'd part with, plus men they are genuinely deep at
  const picks=t.picks.filter(pk=>pk.year<=S.year+3)
    .map(pk=>{const a={type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder:t.id};
              return {a, v:assetValue(a)};});
  const players=t.roster.map(id=>S.players[id]).filter(Boolean)
    .filter(x=>{
      const depth=t.roster.map(id=>S.players[id]).filter(y=>y.pos===x.pos).sort((a,b)=>b.ovr-a.ovr);
      const slot=depth.findIndex(y=>y.id===x.id);
      return slot>=(ROSTER_NEED[x.pos]||1) || x.ovr<62;   // a backup or a body
    })
    .map(x=>({a:{type:"player",pid:x.id,holder:t.id}, v:playerTradeValue(x)}));
  return picks.concat(players).filter(c=>c.v<=ceiling).sort((a,b)=>b.v-a.v);
}
function buildOfferFor(t,p){
  const val=playerTradeValue(p);
  const interest=clubInterest(t,p);
  if(interest<14) return null;
  const budget=val*(0.72+t.ai.aggression*0.30)*(1+clamp(interest,0,90)/230);
  const pool=spareAssets(t,budget*1.35);
  if(!pool.length) return null;
  // clubs don't all reach for the same package — some lead with picks, some move bodies
  const bodyFirst = t.ai.winNow<0.45 || t.picks.length<5 || chance(0.30);
  let best=null;
  for(let attempt=0;attempt<5;attempt++){
    const order=pool.slice().sort((a,b)=>{
      const bias=x=>(bodyFirst&&x.a.type==="player"?1.18:1)*(attempt?rf(0.80,1.25):1);
      return b.v*bias(b)-a.v*bias(a);
    });
    const give=[]; let acc=0;
    for(const c of order){
      if(acc>=budget*0.96) break;
      if(give.length>=4) break;
      if(acc+c.v>budget*1.10) continue;
      give.push(c.a); acc+=c.v;
    }
    if(!give.length) continue;
    if(!best||Math.abs(acc-budget)<Math.abs(best.acc-budget)) best={give,acc};
  }
  if(!best||best.acc<val*0.80) return null;
  const give=best.give, acc=best.acc;
  // the deal has to be legal on both sides
  const u=S.teams[S.userTeam];
  const mine=[{type:"player",pid:p.id,holder:u.id}];
  if(tradeLegal(u,t,mine,give)) return null;
  return {team:t.id, give, value:Math.round(acc), interest,
          keen: acc>=val*1.14 ? "aggressive" : acc>=val*0.95 ? "fair" : "lowball"};
}
function solicitOffers(pid){
  const p=S.players[pid];
  const out=[];
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    const o=buildOfferFor(t,p);
    if(o) out.push(o);
  }
  out.sort((a,b)=>b.value-a.value);
  return out.slice(0,6);
}
function shopSheet(pid){
  const p=S.players[pid];
  const list=(S.shopOffers&&S.shopOffers.pid===pid)?S.shopOffers.list:[];
  const val=playerTradeValue(p);
  const body = !list.length
    ? `<div class="panel"><div class="pb"><p class="small">Nobody wants him at anything like his price.
        Either he's paid too much, he's too old, or the clubs who need his position can't fit the contract.</p></div></div>`
    : list.map((o,i)=>{
        const t=S.teams[o.team];
        const tone = o.keen==="aggressive"?"green":o.keen==="lowball"?"warn":"";
        return `<div class="panel"><div class="pb">
          <div class="row spread"><b>${esc(t.city)} ${esc(t.name)}</b>
            <span class="tag ${tone}">${o.keen}</span></div>
          <div class="dim small">${t.w}-${t.l} · ${fmtM(capSpace(t))} of room</div>
          <div style="margin:6px 0">${o.give.map(a=>`<div class="small">${assetLabel(a)}</div>`).join("")}</div>
          <p class="tiny dim">${o.keen==="aggressive"?"They're reaching for him."
            :o.keen==="fair"?"About what he's worth."
            :"Less than he's worth, and they know it."}</p>
          <div class="row">
            <button class="btn primary" data-act="shopaccept" data-arg="${pid}" data-arg2="${i}">Accept</button>
            <button class="btn" data-act="shopnegotiate" data-arg="${pid}" data-arg2="${i}">Take it to the table</button>
          </div></div></div>`;
      }).join("");
  return `<div class="sh"><div><b>Shopping ${esc(p.f)} ${esc(p.l)}</b>
      <div class="dim small">${p.pos} · ${p.ovr} ovr · ${p.age} · ${p.contract?fmtM(p.contract.apy)+" × "+p.contract.left:"no deal"}</div></div>
    <button class="x" data-act="closesheet">×</button></div>
    <div class="sb stack">
      <p class="small dim">${list.length?`${list.length} club${list.length>1?"s":""} came back.`:"Calls made. "}
        Offers move with the standings — a club that's winning in November will pay more than it would in August.</p>
      ${body}
    </div>`;
}
Object.assign(ACT,{
  shop:a=>{
    const pid=+a;
    S.shopOffers={pid, list:solicitOffers(pid)};
    openSheet(shopSheet(pid));
  },
  shopaccept:(a,b)=>{
    if(!tradesOpen()){ toast("The deadline has passed."); return; }
    const pid=+a, o=(S.shopOffers&&S.shopOffers.list)[+b];
    if(!o){toast("That offer's gone.");return;}
    const u=S.teams[S.userTeam], t=S.teams[o.team];
    const mine=[{type:"player",pid,holder:u.id}];
    const bad=tradeLegal(u,t,mine,o.give);
    if(bad){toast(bad);return;}
    executeTrade(u,t,mine,o.give);
    S.shopOffers=null; closeSheet(); toast("Done."); render();
  },
  shopnegotiate:(a,b)=>{
    const pid=+a, o=(S.shopOffers&&S.shopOffers.list)[+b];
    if(!o) return;
    V.trade={partner:o.team, mine:[{type:"player",pid,holder:S.userTeam}], theirs:o.give.slice()};
    V.screen="trade"; S.shopOffers=null; closeSheet(); render();
  }
});
/* ============================================================
   Module 10: the things that make a roster feel like people —
   traits, morale, scheme, an owner with a temper, and a record book
   ============================================================ */

/* ---------- traits ---------- */
const TRAITS = {
  motor:   {name:"High motor",    good:1, hidden:0, blurb:"Plays to the whistle. Gets more out of himself than the measurables say."},
  gymrat:  {name:"Gym rat",       good:1, hidden:1, blurb:"First in the building. Develops faster than his age suggests."},
  film:    {name:"Film junkie",   good:1, hidden:1, blurb:"Sees it before it happens. Awareness climbs every year."},
  leader:  {name:"Quiet leader",  good:1, hidden:0, blurb:"The room follows him. Lifts everyone around him."},
  clutch:  {name:"Clutch",        good:1, hidden:1, blurb:"Bigger in the fourth quarter than the first."},
  iron:    {name:"Durable",       good:1, hidden:1, blurb:"Never comes off the field."},
  glass:   {name:"Injury prone",  good:0, hidden:1, blurb:"Something is always tight. Misses more than he plays."},
  diva:    {name:"Diva",          good:0, hidden:1, blurb:"Wants the ball and wants to be paid. Sours quickly when either stops."},
  coasts:  {name:"Coasts",        good:0, hidden:1, blurb:"Peaks the year before a contract and disappears the year after."},
  fragile: {name:"Rattles",       good:0, hidden:1, blurb:"Loses the thread when the game gets away from him."}
};
const TRAIT_KEYS=Object.keys(TRAITS);
function rollTraits(p){
  p.traits=[];
  const n = chance(.30)?2:chance(.62)?1:0;
  const pool=TRAIT_KEYS.slice();
  for(let i=0;i<n;i++){
    const k=pool.splice(ri(0,pool.length-1),1)[0];
    if(k) p.traits.push(k);
  }
  // the work-ethic number the player never sees is where gym rats come from
  if(p.hidden&&p.hidden.wrk>=88&&!p.traits.includes("gymrat")&&chance(.5)) p.traits.push("gymrat");
  if(p.hidden&&p.hidden.wrk<=32&&!p.traits.includes("coasts")&&chance(.5)) p.traits.push("coasts");
}
function hasTrait(p,k){ return !!(p&&p.traits&&p.traits.includes(k)); }
/* what the club actually knows about a man */
function knownTraits(p){
  const own = p.teamId===S.userTeam;
  const yrs = p.tenure||0;
  return (p.traits||[]).filter(k=>{
    if(!TRAITS[k].hidden) return true;
    if(p.traitsSeen&&p.traitsSeen.includes(k)) return true;
    return own&&yrs>=2;
  });
}
function revealTrait(p,k){
  if(!hasTrait(p,k)) return false;
  p.traitsSeen=p.traitsSeen||[];
  if(p.traitsSeen.includes(k)) return false;
  p.traitsSeen.push(k);
  return true;
}

/* ---------- morale ---------- */
const MORALE_MIN=5, MORALE_MAX=99;
function moraleOf(p){ return p.morale===undefined?70:p.morale; }
function updateMorale(t){
  const wp=winPct(t);
  const hcDisc=t.staff.HC?t.staff.HC.disc:60;
  let leaders=0;
  for(const id of t.roster) if(hasTrait(S.players[id],"leader")) leaders++;
  for(const id of t.roster){
    const p=S.players[id]; if(!p) continue;
    if(p.morale===undefined) p.morale=ri(62,80);
    const depth=(t.depth[p.pos]||[]).indexOf(p.id);
    const playing = depth===0?10 : depth===1?0 : depth<0?-9 : -5;
    const paid = p.contract ? clamp((p.contract.apy-marketAPY(p))/Math.max(1e6,marketAPY(p))*14,-12,8) : 0;
    const winning = (wp-0.5)*26;
    const culture = (hcDisc-60)/7 + leaders*1.1;
    const diva = hasTrait(p,"diva") ? -6 : 0;
    const target = clamp(66 + playing + paid + winning + culture + diva, MORALE_MIN, MORALE_MAX);
    p.morale = Math.round(p.morale + (target-p.morale)*0.34);
  }
}
function moraleWord(m){
  return m>=86?"thrilled":m>=72?"happy":m>=56?"content":m>=40?"restless":m>=25?"unhappy":"wants out";
}
/* morale and traits both bend what a man is worth on Sunday */
function gameOvr(p,ctx){
  if(!p) return p;
  let adj=0;
  const m=moraleOf(p);
  adj += (m-66)/13;                                   // ±2.5 or so
  if(ctx&&ctx.late){
    if(hasTrait(p,"clutch")) adj+=3.0;
    if(hasTrait(p,"fragile")) adj-=2.6;
  }
  if(hasTrait(p,"motor")) adj+=1.1;
  if(hasTrait(p,"coasts")) adj += (p.contract&&p.contract.left<=1)? 2.4 : -1.2;
  const fit=schemeFit(p);
  adj += (fit-50)/16;                                 // ±3
  return adj;
}

/* ---------- scheme ---------- */
const TEAM_SCHEMES={
  OC:{
    airraid:  {name:"Air raid",       key:{QB:["tha","thp"],WR:["spd","rte"],TE:["rte"],RB:["cth"]}, run:-0.10},
    westcoast:{name:"West coast",     key:{QB:["tha","awr"],WR:["cth","rte"],TE:["cth"],RB:["cth","elu"]}, run:-0.02},
    power:    {name:"Power run",      key:{RB:["pwr","brk"],LT:["rblk"],LG:["rblk"],C:["rblk"],RG:["rblk"],RT:["rblk"],TE:["rblk"]}, run:0.12},
    spread:   {name:"Spread option",  key:{QB:["spd","tha"],RB:["spd","elu"],WR:["spd"]}, run:0.05}
  },
  DC:{
    attack43: {name:"Attacking 4-3",  key:{EDGE:["prs","spd"],DT:["prs"],LB:["spd","tak"]}},
    base34:   {name:"Two-gap 3-4",    key:{DT:["pwr","tak"],EDGE:["pwr","prs"],LB:["awr","tak"]}},
    cover2:   {name:"Cover two zone", key:{CB:["awr","cov"],S:["awr","cov"],LB:["cov"]}},
    manpress: {name:"Man press",      key:{CB:["cov","spd"],S:["cov"],EDGE:["prs"]}}
  }
};
function schemeOf(t,side){
  const c=t&&t.staff&&t.staff[side];
  return c&&c.scheme ? c.scheme : (side==="OC"?"westcoast":"cover2");
}
function schemeFit(p){
  const t=p.teamId!==null&&p.teamId!==undefined?S.teams[p.teamId]:null;
  if(!t) return 50;
  const side = POSGROUP[p.pos]==="o" ? "OC" : POSGROUP[p.pos]==="d" ? "DC" : null;
  if(!side) return 50;
  const sc=TEAM_SCHEMES[side][schemeOf(t,side)];
  if(!sc||!sc.key[p.pos]) return 50;
  const attrs=sc.key[p.pos];
  const keyMean=avg(attrs.map(a=>p.a[a]||55));
  // measured against what a man at his position and level normally brings
  const n=posAttrNorm(p.pos,attrs);
  // given how good he is, are the scheme's attributes ahead of the rest of his game?
  const expected=n.attr+(p.ovr-n.ovr);
  return clamp(50+(keyMean-expected)*4.6,8,95);
}
function normStore(which){
  if(!S.norms) S.norms={pos:{},attr:{}};
  if(!S.norms[which]) S.norms[which]={};
  return S.norms[which];
}
function posAttrNorm(pos,attrs){
  const POSNORM=normStore("pos");
  const key=pos+"|"+attrs.join(",");
  if(POSNORM[key]!==undefined) return POSNORM[key];
  const men=[], ovrs=[];
  for(const t of S.teams) for(const id of t.roster){
    const p=S.players[id];
    if(p&&p.pos===pos){ men.push(avg(attrs.map(a=>p.a[a]||55))); ovrs.push(p.ovr); }
  }
  POSNORM[key]= men.length? {attr:avg(men), ovr:avg(ovrs)} : {attr:60, ovr:66};
  return POSNORM[key];
}
function resetPosNorms(){ if(S.norms) S.norms.pos={}; }
function fitWord(f){ return f>=72?"ideal fit":f>=58?"good fit":f>=44?"neutral":f>=30?"awkward":"wrong scheme"; }
function assignSchemes(t){
  for(const side of ["OC","DC"]){
    const c=t.staff[side];
    if(c&&!c.scheme) c.scheme=pick(Object.keys(TEAM_SCHEMES[side]));
  }
}

/* ---------- the owner ---------- */
const MANDATES={
  winnow:   {name:"Win now",        blurb:"I'm not getting younger. I want to watch this team win a title.",
             judge:t=>(t.w-9)*7 + (t.madePlayoffs?18:0) + (S.champion===t.id?60:0)},
  playoffs: {name:"Get us relevant",blurb:"Three years. I want to be playing in January.",
             judge:t=>(t.w-8)*6 + (t.madePlayoffs?26:0) + (S.champion===t.id?55:0)},
  build:    {name:"Build it right", blurb:"I don't care about this year. Bring me a young roster worth watching.",
             judge:t=>{
               const young=t.roster.map(id=>S.players[id]).filter(p=>p&&p.age<=25);
               return (young.filter(p=>p.ovr>=76).length-2)*11 + (t.w-6)*3
                 + (S.champion===t.id?45:0) + (t.madePlayoffs?10:0);
             }},
  frugal:   {name:"Run it lean",    blurb:"Win, and don't hand my money to agents to do it.",
             judge:t=>(t.w-8)*6 + (t.madePlayoffs?14:0)
               + Math.round((S.cap*0.90-payroll(t))/1e6*0.55) + (S.champion===t.id?45:0)}
};
function initOwner(){
  const k=pick(Object.keys(MANDATES));
  S.owner={mandate:k, patience:64, years:0, grace:2, history:[], fired:false};
  initOwnerTraits(S.owner);
}
function ownerName(){ return (MANDATES[S.owner.mandate]||MANDATES.playoffs).name; }
function ownerVerdict(){
  const t=S.teams[S.userTeam];
  const m=MANDATES[S.owner.mandate]||MANDATES.playoffs;
  let delta=clamp(Math.round(m.judge(t)),-36,40);
  if(S.owner.grace>0){ delta=Math.round(delta*0.45)+6; S.owner.grace--; }
  return delta;
}
function ownerReview(){
  if(!S.owner) initOwner();
  if(S.owner.fired) return;
  const t=S.teams[S.userTeam];
  const delta=ownerTemperMult(ownerVerdict());
  S.owner.patience=clamp(S.owner.patience+delta,0,100);
  S.owner.years++;
  S.owner.history.unshift({year:S.year,w:t.w,l:t.l,delta,patience:S.owner.patience,
    champ:S.champion===t.id, playoffs:!!t.madePlayoffs, shortfall:!!t.hadShortfall});
  t.hadShortfall=false;
  evolveMandate();
  driftOwnerTraits();
  if(S.owner.history.length>15) S.owner.history.length=15;
  const mood = S.owner.patience>=75?"delighted":S.owner.patience>=55?"satisfied"
             : S.owner.patience>=35?"restless":S.owner.patience>=18?"openly unhappy":"finished with you";
  news(`The owner is ${mood} after ${t.w}-${t.l}. ${delta>=0?"+":""}${delta} on your standing with him.`,
       delta>=0?"info":"loss");
  if(S.owner.patience<=Math.max(0,-ownerRope())){
    S.owner.fired=true;
    if(S.career){ S.career.firedFrom=S.career.firedFrom||[];
      S.career.firedFrom.push({club:t.city+" "+t.name,year:S.year}); }
    news(`You have been relieved of your duties as general manager of the ${t.city} ${t.name}.`,"loss");
    raiseMoment("loss","Relieved of your duties",`${t.city} ${t.name}`,
      `${S.year} was one season too many. Clear your desk — somebody will call.`);
  }
}

/* ---------- records and the hall ---------- */
const RECORD_CATS=[["py","Passing yards"],["ptd","Passing touchdowns"],["ry","Rushing yards"],
  ["rtd","Rushing touchdowns"],["recy","Receiving yards"],["rectd","Receiving touchdowns"],
  ["sak","Sacks"],["int","Interceptions"],["tkl","Tackles"]];
function ensureBooks(){
  if(!S.records) S.records={season:{},career:{}};
  if(!S.hall) S.hall=[];
}
function logSeasonRecords(){
  ensureBooks();
  for(const [k] of RECORD_CATS){
    let best=null;
    for(const id in S.players){
      const p=S.players[id];
      if(!p||p.teamId===null||!p.stats||!p.stats[k]) continue;
      if(!best||p.stats[k]>best.v) best={v:p.stats[k],id:p.id,name:`${p.f} ${p.l}`,pos:p.pos,
        team:S.teams[p.teamId]?S.teams[p.teamId].abbr:"",year:S.year};
    }
    if(!best) continue;
    const cur=S.records.season[k];
    if(!cur||best.v>cur.v){
      S.records.season[k]=best;
      if(cur){
        const label=RECORD_CATS.find(c=>c[0]===k)[1].toLowerCase();
        news(`${best.name} breaks the league record for ${label} — ${best.v}.`,"info",best.id);
        if(S.players[best.id]&&S.players[best.id].teamId===S.userTeam)
          raiseMoment("win","A league record",best.name,
            `${best.v} ${label} in a season. Nobody has ever done that.`);
      }
    }
  }
}
function accumulateCareer(){
  for(const id in S.players){
    const p=S.players[id];
    if(!p||p.teamId===null||!p.stats) continue;
    p.career=p.career||{};
    for(const k of STAT_ZERO_KEYS){
      if(k==="gp"||k==="gs") continue; // GP is rolled separately below; GS is not currently charted.
      if(p.stats[k]) p.career[k]=(p.career[k]||0)+p.stats[k];
    }
    if(p.teamId===S.userTeam) p.career.usYears=(p.career.usYears||0)+1;
  }
}
/* ---------- what happens to a man after he stops playing ----------
   Every retiring player is looked at twice: once for Canton, once for the
   whiteboard. Whoever clears either bar is kept — trimmed to the bone but
   kept — and everybody else is released so the next class has room. */

/* Coaching is not evenly distributed across the field. Quarterbacks, centres,
   linebackers and safeties become coaches far out of proportion to their share
   of a roster; running backs, receivers and specialists rarely do. */
const COACH_POS_AFFINITY={QB:1.00,C:.74,LB:.70,S:.66,TE:.56,LG:.52,RG:.52,LT:.46,RT:.46,
  FB:.46,EDGE:.44,DT:.42,CB:.38,RB:.32,WR:.28,K:.05,P:.05};
function coachProjection(p){
  if(!p) return 0;
  const c=p.career||{}, h=p.hidden||{}, a=p.a||{};
  const seasons=c.seasons||0;
  if(seasons<3) return 0;              // you need a career before you get a room
  let s=0;
  s += (COACH_POS_AFFINITY[p.pos]!==undefined?COACH_POS_AFFINITY[p.pos]:.40)*34;
  s += ((a.awr||60)-60)*.42;           // the single biggest tell
  s += ((h.chr||65)-65)*.22;           // does the building want him back
  s += ((h.wrk||65)-65)*.20;
  s += ((h.disc||68)-68)*.10;
  s += Math.min(14,seasons)*.95;       // time in the league, with diminishing returns
  if(hasTrait(p,"film")) s+=13;
  if(hasTrait(p,"leader")) s+=11;
  if(hasTrait(p,"gymrat")) s+=5;
  if(hasTrait(p,"diva")) s-=14;
  if(hasTrait(p,"coasts")) s-=10;
  // a long career as a backup is a coaching career in waiting; a decade of
  // stardom more often means broadcasting or a boat
  const peak=p.peakOvr||p.ovr||60;
  if(peak>=90) s-=6; else if(peak<=72&&seasons>=6) s+=6;
  if((p.accolades||[]).length>=3) s-=3;
  return clamp(s/100,0,1);
}
/* which side of the ball, and how far he might go */
function alumnusRole(p){
  const off=["QB","RB","WR","TE","LT","LG","C","RG","RT","FB"];
  if(p.pos==="K"||p.pos==="P") return "SD";
  return off.includes(p.pos)?"OC":"DC";
}
function evaluateAlumni(retirees){
  for(const p of (retirees||[])){
    if(!p) continue;
    p.hofScore=hofScore(p);
    p.coachProj=Math.round(coachProjection(p)*100);
    p.alumRole=alumnusRole(p);
    p.retiredYear=S.year;
  }
}
/* everything a coaching candidate or a Hall case needs, and nothing else */
function trimAlumnus(p){
  delete p.seasonLog; delete p.lastStats; delete p.potLog; delete p.traitsSeen;
  delete p.fifthYear; delete p.roleOVR;   // NOT p.contract — dead money reads it
  if(p.draft) delete p.draft.noteBank;
  p.stats={};
  if(p.hidden) p.hidden={wrk:p.hidden.wrk,chr:p.hidden.chr,disc:p.hidden.disc,pot:p.hidden.pot};
  if(p.a) p.a={awr:p.a.awr};
  return p;
}
function hofScore(p){
  const c=p.career||{};
  let s=0;
  s += (c.py||0)/380 + (c.ptd||0)*2.4 + (c.ry||0)/230 + (c.rtd||0)*2.2
     + (c.recy||0)/240 + (c.rectd||0)*2.2 + (c.sak||0)*3.4 + (c.int||0)*3.0 + (c.tkl||0)/26;
  s += (p.accolades||[]).length*7;
  s += (p.peakOvr||p.ovr||0)>=92?18:(p.peakOvr||p.ovr||0)>=87?9:0;
  return Math.round(s);
}
function hallOfFameIntake(retirees){
  ensureBooks();
  const classOf=(retirees||[]).map(p=>({p,sc:hofScore(p)}))
    .filter(x=>x.sc>=210).sort((a,b)=>b.sc-a.sc).slice(0,6);
  for(const {p,sc} of classOf){
    S.hall.push({id:p.id, name:`${p.f} ${p.l}`, pos:p.pos, score:sc, year:S.year,
      career:Object.assign({},p.career||{}),
      team:p.career&&p.career.usYears>=4?S.teams[S.userTeam].abbr:(p.lastTeam||"")});
    news(`${p.pos} ${p.f} ${p.l} is elected to the Hall of Fame.`,"info");
    if(p.draft&&p.draft.pickedBy===S.userTeam&&S.career) S.career.hof++;
  }
  S.hall.sort((a,b)=>b.score-a.score);
  if(S.hall.length>120) S.hall.length=120;
}

/* ---------- war-room rumors ---------- */
function generateRumors(){
  const t=S.teams[S.userTeam];
  S.rumors=[];
  const ana=analyticsEdge(t), dept=facLvl(t,"scoutdept");
  const reliability=clamp(0.42+ana*0.34+(dept-1)*0.055,0.35,0.92);
  const board=S.prospects.map(id=>S.players[id]).filter(Boolean)
    .sort((a,b)=>b.draft.consensus-a.draft.consensus).slice(0,70);
  const n=ri(4,7);
  for(let i=0;i<n;i++){
    const p=pick(board); if(!p) continue;
    const true_=chance(reliability);
    const kind=ri(0,3);
    let txt="";
    const club=pick(S.teams.filter(x=>x.id!==t.id));
    if(kind===0) txt=`${club.city} are said to have ${p.pos} ${p.l} high on their board.`;
    else if(kind===1) txt=`Word is ${p.pos} ${p.l} interviewed badly. Some clubs have taken him off.`;
    else if(kind===2) txt=`Two teams picking ahead of us are believed to be circling ${p.pos} ${p.l}.`;
    else txt=`${p.pos} ${p.l} is reportedly sliding — a medical flag nobody will confirm.`;
    S.rumors.push({pid:p.id, txt, true_, checked:false});
  }
  S.rumorReliability=reliability;
}

/* ---------- hooks into the rest of the game ---------- */
function lifeSeasonEnd(){
  logSeasonRecords();
  accumulateCareer();
  for(const id in S.players){
    const p=S.players[id];
    if(p&&p.teamId!==null){ p.peakOvr=Math.max(p.peakOvr||0,p.ovr); p.tenure=(p.tenure||0)+1; }
  }
}

/* ============================================================
   An owner changes his mind, and tells you why
   ============================================================ */
function ownerHistoryRun(n,test){
  const h=(S.owner.history||[]).slice(0,n);
  return h.length>=n && h.every(test);
}
function evolveMandate(){
  const o=S.owner, t=S.teams[S.userTeam];
  if(!o||o.fired) return;
  o.years=(o.years||0)+1;
  const cur=o.mandate;
  const h=o.history||[];
  const last=h[0]||{};
  const titles=h.filter(x=>x.champ).length;
  const young=t.roster.map(id=>S.players[id]).filter(p=>p&&p.age<=25&&p.ovr>=76).length;
  const cash=t.cash||0;
  const broke=h.slice(0,2).filter(x=>x.shortfall).length;
  let next=cur, why=null;

  // he got what he asked for
  if(cur==="winnow"&&last.champ){
    next="build";
    why="We did it. Now I don't want a five-year hole afterwards — keep this thing going.";
  } else if(cur==="playoffs"&&last.champ){
    next="winnow";
    why="I asked for January and you gave me a parade. Do it again.";
  }
  // he has stopped believing in the short term
  else if((cur==="winnow"||cur==="playoffs")&&ownerHistoryRun(3,x=>!x.playoffs&&x.w<=7)){
    next="build";
    why="Three years of this. I'm done pretending we're close — tear it down and do it properly.";
  }
  // the young roster he asked for has arrived
  else if(cur==="build"&&young>=4&&last.w>=9){
    next="winnow";
    why="That's the team I wanted. I'm not waiting any longer — go and win with it.";
  } else if(cur==="build"&&young>=3&&ownerHistoryRun(2,x=>x.w>=8)){
    next="playoffs";
    why="They're good enough now. I want to see them in January.";
  }
  // the money got his attention
  else if(cur!=="frugal"&&broke>=2){
    next="frugal";
    why="I've covered this club's bills twice. That stops now — win, but win cheaply.";
  }
  // or stopped being a worry
  else if(cur==="frugal"&&cash>S.cap*1.1&&ownerHistoryRun(2,x=>x.w>=9)){
    next="playoffs";
    why="The books are healthy and the team's close. Spend what you need to.";
  }
  // he's been at it a long time and wants one before he's finished
  else if(cur!=="winnow"&&(o.years||0)>=8&&titles===0&&last.w>=9){
    next="winnow";
    why="I've owned this club a long time and never held that trophy. I'd like to, while I can.";
  }

  if(next!==cur&&MANDATES[next]){
    o.mandate=next;
    o.grace=Math.max(o.grace||0,1);      // a new brief comes with a little room
    o.changed=S.year;
    news(`The owner has changed what he wants: ${MANDATES[next].name}. "${why}"`,"info");
  }
}

/* ============================================================
   The man himself — and how the years change him
   ============================================================ */
const OWNER_TRAITS={
  patienceTrait:{name:"Patience",   low:"itchy trigger finger", high:"lets you work"},
  purse:        {name:"The purse",  low:"tight",                high:"open"},
  temper:       {name:"Temper",     low:"even",                 high:"volatile"}
};
function initOwnerTraits(o){
  o.traits={
    patienceTrait: c99(gauss(52,16)),
    purse:         c99(gauss(52,16)),
    temper:        c99(gauss(50,17))
  };
  o.base=Object.assign({},o.traits);   // the man he fundamentally is
}
function trait(k){
  const o=S.owner;
  if(!o) return 50;
  if(!o.traits) initOwnerTraits(o);
  return o.traits[k];
}
/* what the traits actually do */
function ownerRope(){        return Math.round((trait("patienceTrait")-50)*0.30); }  // firing threshold
function ownerPurseMult(){   return 0.72 + trait("purse")/100*0.78; }                // cash he leaves you
function ownerTemperMult(d){
  if(d>=0) return d;
  const sharp = 0.72 + trait("temper")/100*0.62;          // how hard he takes it
  const cushion = 1.28 - trait("patienceTrait")/100*0.56; // how long he'll wear it
  return Math.round(d*sharp*cushion);
}
function traitWord(k){
  const v=trait(k), t=OWNER_TRAITS[k];
  return v>=72?t.high : v>=45?"about average" : t.low;
}
/* a man is shaped by what happens to him */
function driftOwnerTraits(){
  const o=S.owner, t=S.teams[S.userTeam];
  if(!o) return;
  if(!o.traits) initOwnerTraits(o);
  const h=o.history||[], last=h[0]||{};
  const good=h.slice(0,3).filter(x=>x.playoffs).length;
  const bad=h.slice(0,3).filter(x=>!x.playoffs&&x.w<=7).length;
  const before=Object.assign({},o.traits);
  const T=o.traits;

  // winning mellows a man; losing wears him down
  if(last.champ){ T.patienceTrait+=6; T.purse+=5; T.temper-=4; }
  else if(good>=2){ T.patienceTrait+=2.5; T.temper-=1.5; }
  if(bad>=2){ T.patienceTrait-=4; T.temper+=3.5; }
  else if(last.w<=5){ T.patienceTrait-=1.5; T.temper+=1.5; }

  // money talks
  if(last.shortfall){ T.purse-=7; T.temper+=2; }
  else if((t.cash||0)>S.cap*1.2){ T.purse+=2.5; }
  else if((t.cash||0)<S.cap*0.15){ T.purse-=2; }

  // and a long relationship with the same man softens him
  if((o.years||0)>=6) T.patienceTrait+=1.2;

  // he bends, but he doesn't become somebody else
  if(!o.base) o.base=Object.assign({},T);
  for(const k in T) T[k]=clamp(Math.round(T[k]+(o.base[k]-T[k])*0.16),12,90);
  // tell him when something in him has really moved
  for(const k in T){
    if(Math.abs(T[k]-before[k])>=5){
      const up=T[k]>before[k];
      const line={
        patienceTrait: up?"seems willing to let this play out":"is not waiting around any more",
        purse:         up?"has opened his wallet":"has gone quiet about money",
        temper:        up?"is quicker to anger than he was":"has calmed down"
      }[k];
      news(`The owner ${line}.`, up?"info":"loss");
    }
  }
}

/* ============================================================
   A volatile owner doesn't wait for the review
   ============================================================ */
function ownerInSeason(){
  const o=S.owner, t=S.teams[S.userTeam];
  if(!o||o.fired||S.phase!=="regular") return;
  const vol=trait("temper");
  if(vol<58) return;                       // an even man keeps his counsel
  const games=S.schedule.filter(g=>g.played&&(g.home===t.id||g.away===t.id))
    .sort((a,b)=>b.week-a.week);
  if(games.length<3) return;
  const res=games.map(g=>{
    const us=g.home===t.id?g.hs:g.as, them=g.home===t.id?g.as:g.hs;
    return {won:us>them, margin:us-them};
  });
  const heat=(vol-58)/42;                  // how far past even he is
  const say=(txt,hit,kind)=>{
    o.patience=clamp(o.patience+hit,0,100);
    o.spoke=S.week;
    news(txt,kind);
  };
  if((o.spoke||-9)>=S.week-2) return;      // he isn't on the phone every week

  if(!res[0].won&&!res[1].won&&!res[2].won){
    say(`The owner has been talking to reporters about "accountability" after a third straight defeat.`,
        -Math.round(3+heat*7),"loss");
  } else if(!res[0].won&&res[0].margin<=-21){
    say(`The owner was seen leaving before the end. He hasn't called.`,
        -Math.round(2+heat*5),"loss");
  } else if(res[0].won&&res[1].won&&res[2].won){
    say(`The owner has been telling anyone who'll listen that he backed you all along.`,
        Math.round(2+heat*5),"win");
  } else if(res[0].won&&res[0].margin>=21){
    say(`The owner called after that one. He was still shouting.`,
        Math.round(1+heat*3),"win");
  }
}
/* ============================================================
   Module 11: the moments you actually play — fourth downs,
   draft-day deals, the undrafted scramble, and the screens for all of it
   ============================================================ */

/* ---------- key moments ---------- */
let LIVE=null;                       // the game currently paused on a decision
function momentHere(kind,c){
  if(!LIVE||!LIVE.on) return null;          // AI games never stop
  if(c.off!==S.userTeam) return null;       // only our calls are ours to make
  if(LIVE.used>=LIVE.budget) return null;
  const late = c.qtr>=4 || (c.qtr===3 && Math.abs(c.scoreDiff)<=10);
  if(kind==="fourth"){
    const bigSpot = c.ballOn>=60 || (c.toGo<=3 && c.ballOn>=45);
    const trailing = c.qtr>=4 && c.scoreDiff<0 && c.ballOn>=35;
    const ok = late ? (bigSpot||trailing||(c.toGo<=6&&c.ballOn>=40)) : bigSpot;
    if(!ok) return null;
    // hold something back for the end of the game
    if(!late && LIVE.used>=2) return null;
    LIVE.used++;
    return {kind,ctx:c};
  }
  if(kind==="twopoint"){
    if(c.qtr<4 || Math.abs(c.scoreDiff)>8) return null;
    LIVE.used++;
    return {kind,ctx:c};
  }
  return null;
}
function autoChoice(m){
  if(!m) return null;
  if(m.kind==="fourth") return m.ctx.goP?"go":"kick";
  if(m.kind==="twopoint"){
    const d=m.ctx.scoreDiff;   // our margin with the touchdown counted, before the try
    return (d===-2||d===1||d===5||d===-5||d===-10||d===-9)?"two":"kick";
  }
  return null;
}
function userGameThisWeek(){
  return S.schedule.find(g=>!g.played&&g.week===S.week&&(g.home===S.userTeam||g.away===S.userTeam));
}
function startLiveGame(){
  const g=userGameThisWeek();
  if(!g) return false;
  LIVE={on:true, g, used:0, budget:4, it:null, pending:null, done:false, resolved:null};
  LIVE.it=simGamePlay(g,false);
  return stepLive(undefined);
}
function stepLive(send){
  if(!LIVE||!LIVE.it) return false;
  let r;
  try{ r = send===undefined?LIVE.it.next():LIVE.it.next(send); }
  catch(err){ LIVE=null; return false; }
  while(!r.done && !r.value){ r=LIVE.it.next(null); }
  if(r.done){
    LIVE.done=true; LIVE.pending=null;
    finishLiveWeek();
    return false;
  }
  LIVE.pending=r.value;
  return true;
}
function finishLiveWeek(){
  LIVE=null;
  advance();                        // the generator already banked the result; the league plays on
}
function momentCard(){
  if(!LIVE||!LIVE.pending) return "";
  const m=LIVE.pending, c=m.ctx;
  const t=S.teams[S.userTeam], opp=S.teams[c.off===S.userTeam?c.def:c.off];
  const mins=Math.floor(c.clock/60), secs=String(c.clock%60).padStart(2,"0");
  const us=c.score[S.userTeam], them=c.score[opp.id];
  const head=`<div class="row spread"><b>${t.abbr} ${us} — ${them} ${opp.abbr}</b>
    <span class="dim small">Q${c.qtr} · ${mins}:${secs}</span></div>`;
  if(m.kind==="fourth"){
    const yardline = c.ballOn>50 ? `${opp.abbr} ${100-c.ballOn}` : `own ${c.ballOn}`;
    const canKick = c.fgDist<=c.rng+4;
    return `<div class="sh"><div><b>Fourth down</b>
        <div class="dim small">${c.toGo} to go at the ${yardline}</div></div></div>
      <div class="sb stack">
        <div class="panel"><div class="pb">${head}
          <p class="small">Fourth and ${c.toGo}. ${canKick
            ? `A ${c.fgDist}-yarder is on if you want it.`
            : `Too far for the kicker — it's go or punt.`}</p>
          <p class="tiny dim">The room's recommendation: <b>${c.goP?"go for it":canKick?"take the points":"punt"}</b>.</p>
        </div></div>
        <button class="btn primary big" data-act="moment" data-arg="go">Go for it</button>
        <button class="btn big" data-act="moment" data-arg="kick">${canKick?`Kick the ${c.fgDist}-yarder`:"Punt it away"}</button>
        <button class="btn" data-act="momentauto">Let the room handle the rest</button>
      </div>`;
  }
  const d=c.scoreDiff;
  const why = d===-2?"Two ties it." : d===1?"Two puts you up three." :
              d===5?"Two makes it a touchdown game." : d===-5?"Two makes it a field goal." :
              d===4?"Two puts you up six." : "The chart is close here.";
  return `<div class="sh"><div><b>After the touchdown</b>
      <div class="dim small">${why}</div></div></div>
    <div class="sb stack">
      <div class="panel"><div class="pb">${head}
        <p class="small">Kick it and take the point, or go for two.</p>
        <p class="tiny dim">The room's recommendation: <b>${autoChoice(m)==="two"?"go for two":"kick the point"}</b>.</p>
      </div></div>
      <button class="btn primary big" data-act="moment" data-arg="two">Go for two</button>
      <button class="btn big" data-act="moment" data-arg="kick">Kick the point</button>
      <button class="btn" data-act="momentauto">Let the room handle the rest</button>
    </div>`;
}

/* ---------- draft-day trades ---------- */
function draftPickAsset(pk,holder){
  return {type:"pick",year:pk.year,round:pk.round,orig:pk.orig,holder};
}
function slotOf(pk){ return clamp(pk.slot||1,1,S.teams.length); }
function draftTradeOffers(){
  const pk=onClock();
  if(!pk||pk.team!==S.userTeam) return [];
  const u=S.teams[S.userTeam];
  const mine=pickValue(pk.round,slotOf(pk));
  const out=[];
  for(const t of S.teams){
    if(t.id===u.id) continue;
    // does anyone badly want to come up for a man still on the board?
    if(!t.board) buildAIBoard(t);
    const board=S.prospects.map(id=>S.players[id]).filter(Boolean)
      .sort((a,b)=>aiPickValue(t,b)-aiPickValue(t,a));
    const want=board[0];
    if(!want) continue;
    const heat=aiPickValue(t,want)-(board[4]?aiPickValue(t,board[4]):0);
    if(heat<6&&!chance(0.25)) continue;
    const premium=1.06+clamp(heat,0,26)/95+t.ai.aggression*0.10;
    const budget=mine*premium;
    const cand=t.picks.filter(x=>x.year<=S.year+3)
      .map(x=>({a:draftPickAsset(x,t.id),v:assetValue(draftPickAsset(x,t.id))}))
      .sort((a,b)=>b.v-a.v);
    const give=[]; let acc=0;
    for(const c of cand){
      if(acc>=budget*0.97) break;
      if(give.length>=3) break;
      if(acc+c.v>budget*1.15) continue;
      give.push(c.a); acc+=c.v;
    }
    if(!give.length||acc<mine*1.02) continue;
    out.push({team:t.id, give, value:Math.round(acc), mine:Math.round(mine),
              heat:Math.round(heat)});
  }
  out.sort((a,b)=>b.value-a.value);
  return out.slice(0,4);
}
function acceptDraftTrade(i){
  const offers=S.draftOffers||[];
  const o=offers[+i];
  const pk=onClock();
  if(!o||!pk||pk.team!==S.userTeam) return false;
  const u=S.teams[S.userTeam], t=S.teams[o.team];
  // they take our slot, we take their picks
  pk.team=t.id;
  for(const a of o.give){
    const idx=t.picks.findIndex(x=>x.year===a.year&&x.round===a.round&&x.orig===a.orig);
    if(idx>=0) u.picks.push(t.picks.splice(idx,1)[0]);
  }
  const draftYear=S.year+1;
  const mineIdx=u.picks.findIndex(x=>x.round===pk.round&&x.orig===u.id&&x.year<=draftYear);
  if(mineIdx>=0) t.picks.push(u.picks.splice(mineIdx,1)[0]);
  news(`Traded down: ${t.city} move up to ${ordinal(pk.overall)}. We collect ` +
       `${o.give.map(a=>`${a.year} R${a.round}`).join(", ")}.`,"trade");
  S.draftOffers=null;
  return true;
}
/* the draft fast-forwards to our slot, so "moving up" always means moving up
   the pick after this one — everything before the clock is already spent */
function nextUserPick(skipClock){
  let start=S.draftIdx;
  const cur=S.draftOrder[S.draftIdx];
  if(skipClock&&cur&&cur.team===S.userTeam) start=S.draftIdx+1;
  for(let i=start;i<S.draftOrder.length;i++)
    if(S.draftOrder[i].team===S.userTeam&&!S.draftOrder[i].pid) return S.draftOrder[i];
  return null;
}
function tradeUpTargets(){
  const mine=nextUserPick(true);
  if(!mine) return [];
  const out=[];
  for(let i=S.draftIdx;i<S.draftOrder.length;i++){
    const slot=S.draftOrder[i];
    if(slot.overall>=mine.overall) break;
    if(slot.team===S.userTeam||slot.pid) continue;
    out.push(slot.overall);
  }
  if(out.length<=4) return out;
  const step=Math.ceil(out.length/4);
  return out.filter((_,i)=>i%step===0).slice(0,4);
}
function tradeUpCost(targetOverall){
  const pk=nextUserPick(true);
  if(!pk) return null;
  const u=S.teams[S.userTeam];
  const target=S.draftOrder.find(x=>x.overall===targetOverall);
  if(!target||target.team===u.id||target.overall>=pk.overall) return null;
  const t=S.teams[target.team];
  const theirs=pickValue(target.round,slotOf(target));
  const ours=pickValue(pk.round,slotOf(pk));
  const need=theirs*(1.10+t.ai.aggression*0.12)-ours;
  if(need<=0) return {team:t.id,target,extra:[],ok:true};
  const cand=u.picks.filter(x=>x.year<=S.year+3)
    .map(x=>({a:draftPickAsset(x,u.id),v:assetValue(draftPickAsset(x,u.id))}))
    .sort((a,b)=>a.v-b.v);
  const extra=[]; let acc=0;
  for(const c of cand){ if(acc>=need) break; extra.push(c.a); acc+=c.v; }
  return {team:t.id,target,extra,ok:acc>=need,short:Math.round(need-acc)};
}

/* ---------- the undrafted scramble ---------- */
function boardGrade(p){
  const g = typeof myGrade==="function" ? myGrade(p.id) : null;
  return g && g.est!==undefined ? g.est : (p.draft?p.draft.consensus:60);
}
function openScramble(){
  const left=S.prospects.map(id=>S.players[id]).filter(Boolean)
    .sort((a,b)=>b.draft.consensus-a.draft.consensus).slice(0,70);
  S.scramble={pool:left.map(p=>p.id), signed:[], clock:8};
  V.screen="scramble";
}
function scrambleSign(pid){
  const t=S.teams[S.userTeam], p=S.players[+pid];
  if(!S.scramble||!p) return;
  if(t.roster.length>=ROSTER_MAX+6){
    toast(`No room — you're carrying ${t.roster.length}. Release someone or finish up.`);
    return "full";
  }
  // the better the man, the likelier somebody else gets there first
  const grade=boardGrade(p);
  const contested=clamp((grade-56)/26,0,0.92)*(1-analyticsEdge(t)*0.25);
  if(chance(contested)){
    const rival=pick(S.teams.filter(x=>x.id!==t.id));
    S.scramble.pool=S.scramble.pool.filter(id=>id!==p.id);
    p.isProspect=false; trimDraftRecord(p);
    signPlayer(p,rival.id,minSalary(),2,.25); addToTeam(p,rival);
    toast(`${rival.city} got to ${p.l} first.`);
  } else {
    S.scramble.pool=S.scramble.pool.filter(id=>id!==p.id);
    S.scramble.signed.push(p.id);
    p.isProspect=false; trimDraftRecord(p);
    signPlayer(p,t.id,minSalary(),2,.30); addToTeam(p,t);
    toast(`Signed ${p.l}.`);
  }
  S.scramble.clock--;
  if(S.scramble.clock<=0) closeScramble();
  render();
}
function closeScramble(){
  const wasOpen=!!S.scramble;
  S.scramble=null;
  if(wasOpen) udfaSigning();   // everyone left finds a home around the league
  V.screen="hub";
  render();
}

const SYN_KEYS=Object.keys(SYNERGIES);

/* how far an attribute sits above what a man of his quality normally has
   at his position — synergies are about the shape of a player, not his level */
function attrNorm(pos,a){
  const ATTRNORM=normStore("attr");
  const key=pos+"|"+a;
  if(ATTRNORM[key]) return ATTRNORM[key];
  const vals=[],ovrs=[];
  for(const t of S.teams) for(const id of t.roster){
    const q=S.players[id];
    if(q&&q.pos===pos){ vals.push(q.a[a]||50); ovrs.push(q.ovr); }
  }
  ATTRNORM[key]= vals.length?{v:avg(vals),o:avg(ovrs)}:{v:60,o:68};
  return ATTRNORM[key];
}
function resetAttrNorms(){ if(S.norms) S.norms.attr={}; }
function attrEdge(p,a){
  const n=attrNorm(p.pos,a);
  // attributes don't scale one-for-one with the headline number, and they
  // run into the ceiling — without both corrections stars can't show shape
  const expected=Math.min(94,n.v+(p.ovr-n.o)*0.90);
  return (p.a[a]||50)-expected;
}
function computeSynergies(p){
  const out=[];
  for(const k of SYN_KEYS){
    const s=SYNERGIES[k];
    if(s.pos.indexOf(p.pos)<0) continue;
    const eg=s.req.map(a=>attrEdge(p,a));
    if(!eg.every(v=>v>=1)) continue;
    if(sum(eg)<s.sum) continue;
    if(s.avoid&&s.avoid.some(a=>attrEdge(p,a)>=0)) continue;
    out.push(k);
  }
  return out;
}
function synOf(p){
  if(!p) return [];
  if(p._synOvr!==p.ovr || !p._syn){ p._syn=computeSynergies(p); p._synOvr=p.ovr; }
  return p._syn;
}
function hasSyn(p,k){ return synOf(p).indexOf(k)>=0; }
/* how much a synergy is worth here, given what this club runs */
function synWeight(p,k){
  if(!hasSyn(p,k)) return 0;
  const s=SYNERGIES[k];
  const t=(p.teamId!==null&&p.teamId!==undefined)?S.teams[p.teamId]:null;
  if(!t||!s.scheme) return 1;
  const side=POSGROUP[p.pos]==="o"?"OC":"DC";
  const sc=schemeOf(t,side);
  return s.scheme[sc]||1;
}
/* what the club has actually noticed */
function knownSynergies(p){
  return synOf(p).filter(k=>p.synSeen&&p.synSeen.indexOf(k)>=0);
}
function staffNoticeSynergies(p,team){
  if(!team||!team.staff) return;
  const side=POSGROUP[p.pos]==="o"?"OC":"DC";
  const coach=team.staff[side]||team.staff.HC;
  if(!coach) return;
  const eye=clamp(0.16+(coach.dev-55)/210+(coach.gm-55)/280,0.08,0.62);
  const snaps=clamp((p.stats&&p.stats.gp?p.stats.gp:0)/12,0.15,1);
  for(const k of synOf(p)){
    p.synSeen=p.synSeen||[];
    if(p.synSeen.indexOf(k)>=0) continue;
    if(rnd()<eye*snaps){
      p.synSeen.push(k);
      if(team.id===S.userTeam)
        news(`${coach.name} on ${p.pos} ${p.l}: "${SYNERGIES[k].hint}"`,"info",p.id);
    }
  }
}

/* ---------- dynamic potential ----------
   The ceiling is not fixed. It responds to coaching, facilities,
   how the man is treated, whether he plays, and who he is. The
   recipe stays hidden; the movement is visible after the fact.   */
const POT_BASELINE=-0.23;   // an average environment should move nobody
function potentialShift(p,team,gainThisYear){
  const peak=PEAK[p.pos];
  let s=0;
  if(team){
    const coachDev = team.staff.HC
      ? (team.staff.HC.dev*.5+(team.staff[POSGROUP[p.pos]==="o"?"OC":"DC"]||{dev:60}).dev*.5) : 60;
    s += (coachDev-62)/20;                       // a real developer moves ceilings
    s += (effLvl(team,"train")-2)*0.19;
    s += (effLvl(team,"med")-2)*0.10;
    s += (moraleOf(p)-66)/30;
    s += (schemeFit(p)-50)/30;
    s += (team.staff.HC?(team.staff.HC.disc-60)/55:0);
  } else s -= 0.6;                               // nobody develops sitting at home
  s += (p.hidden.wrk-60)/40;
  if(hasTrait(p,"gymrat")) s+=0.85;
  if(hasTrait(p,"film"))   s+=0.55;
  if(hasTrait(p,"motor"))  s+=0.30;
  if(hasTrait(p,"leader")) s+=0.15;
  if(hasTrait(p,"coasts")) s-=0.80;
  if(hasTrait(p,"diva"))   s-=0.35;
  if(hasTrait(p,"glass"))  s-=0.25;
  const snaps=(p.stats&&p.stats.gp)||0;
  s += snaps>=11 ? 0.45 : snaps>=5 ? 0.10 : -0.40;
  if(gainThisYear>=3) s+=0.75;                   // a breakout says the ceiling was low
  else if(gainThisYear<=-1.5) s-=0.55;
  if(p.injury>0) s-=0.45;
  // young men move; old men only ever move one way
  const ageMult = p.age<=22?1.45 : p.age<=25?1.15 : p.age<=peak?0.70 : 0.25;
  s = (s-POT_BASELINE)*ageMult + gauss(0,0.85);
  if(p.age>peak) s -= (p.age-peak)*0.55;
  // a ceiling already far above a man's play is harder to push further, and
  // this is what stops the whole league drifting upward year on year
  s -= (p.hidden.pot-p.ovr-3.6)*0.32;
  return clamp(s,-4.5,4.5);
}
function applyPotentialShift(p,team,gain){
  const before=p.hidden.pot;
  const shift=potentialShift(p,team,gain);
  let next=Math.max(p.ovr, before+shift);
  // past his peak a man's ceiling collapses onto what he actually is —
  // without this, declining veterans keep a phantom ceiling forever
  if(p.age>PEAK[p.pos]) next=Math.min(next, p.ovr+Math.max(0, 3.5-(p.age-PEAK[p.pos])*1.1));
  p.hidden.pot=c99(next);
  const moved=p.hidden.pot-before;
  p.potLog=p.potLog||[];
  if(Math.abs(moved)>=0.5){
    p.potLog.unshift({year:S.year,d:Math.round(moved*10)/10});
    if(p.potLog.length>6) p.potLog.length=6;
  }
  // you can see that it happened, never why
  if(team&&team.id===S.userTeam&&p.age<=27){
    if(moved>=2.4)
      news(`The staff have moved ${p.pos} ${p.l} up. Whatever they're doing with him is working.`,"win",p.id);
    else if(moved<=-2.4)
      news(`Quiet word on ${p.pos} ${p.l} — the room has cooled on where he ends up.`,"loss",p.id);
  }
  return moved;
}
/* the arrow the player sees on the sheet: direction only, and only for our own */
function ceilingTrend(p){
  if(!p.potLog||!p.potLog.length) return null;
  const recent=p.potLog.slice(0,3);
  const net=sum(recent.map(x=>x.d));
  if(net>=2.5) return {dir:"up",word:"climbing",n:recent.length};
  if(net<=-2.5) return {dir:"down",word:"slipping",n:recent.length};
  return {dir:"flat",word:"holding",n:recent.length};
}

function applyRealIdentities(){

/* an owner's brief shapes how his club actually operates */
function applyOwnerTendencies(){
  for(const t of S.teams){
    switch(t.ownerTend){
      case "winnow":   t.ai.winNow=clamp(t.ai.winNow+0.22,0.05,0.95);
                       t.ai.aggression=clamp(t.ai.aggression+0.15,0.05,0.95); break;
      case "build":    t.ai.winNow=clamp(t.ai.winNow-0.22,0.05,0.95);
                       t.ai.draftBPA=clamp((t.ai.draftBPA||0.5)+0.18,0,1); break;
      case "frugal":   t.ai.aggression=clamp(t.ai.aggression-0.24,0.05,0.95); break;

function randomIdentities(){
  const pool=REAL_TEAMS.map(r=>r.slice());
  for(let i=pool.length-1;i>0;i--){ const j=ri(0,i); const x=pool[i]; pool[i]=pool[j]; pool[j]=x; }
  for(let i=0;i<S.teams.length&&i<pool.length;i++){
    const t=S.teams[i], r=pool[i];
    // the club itself moves — a different franchise now sits in this division slot
    t.city=r[0]; t.name=r[1]; t.abbr=r[2]; t.color=r[5];
    t.market=clamp(rf(0.66,1.34),0.6,1.4);

/* facilities start spread around the league, so level one is genuinely behind */
function seedFacilities(style){
  if(style==="survey"){ seedFacilitiesFromSurvey(); return; }
  for(const t of S.teams){
    for(const k of FAC_KEYS){
      if(style==="equal") t.fac[k]=2;
      else if(style==="poor") t.fac[k]=1;
      else t.fac[k]=wpick([[1,26],[2,44],[3,22],[4,8]]);
    }
    if(style!=="varied") continue;   // "equal" and "poor" mean exactly that
    if(t.market>1.12&&t.fac.stadium<3&&chance(.6)) t.fac.stadium++;
    if(t.market<0.80&&t.fac.stadium>1&&chance(.5)) t.fac.stadium--;
  }
}
function applyParity(style){
  if(style==="normal") return;
  const men=S.teams.flatMap(t=>t.roster.map(id=>S.players[id])).filter(Boolean);
  const mean=avg(men.map(p=>p.ovr));
  const k = style==="tight" ? 0.62 : 1.35;   // squeeze toward the middle, or stretch it out
  for(const t of S.teams){
    const roster=t.roster.map(id=>S.players[id]).filter(Boolean);
    const tm=avg(roster.map(p=>p.ovr));
    const shift=(mean-tm)*(1-k);
    for(const p of roster){ applyDelta(p, shift*0.55); }
  }
}

const OWNER_FIRST=["Marcus","Eleanor","Grant","Priya","Douglas","Rosalind","Nate","Adele",
  "Curtis","Ingrid","Roman","Delia","Warren","Simone","Hollis","Junia"];
const OWNER_LAST=["Calloway","Ridgeway","Vantassel","Okafor","Brennan","Sandoval","Whitlock",
  "Ashworth","Pemberton","Nakamura","Delacroix","Stroud","Hargrove","Beaumont"];
function newOwnerName(){ return pick(OWNER_FIRST)+" "+pick(OWNER_LAST); }
function ownerTenureRoll(){
  if(!S.owner) return;
  S.owner.tenure=(S.owner.tenure||0)+1;
  const t=S.teams[S.userTeam];
  // the longer a man has held the club, the likelier he is to hand it on
  const p = 0.018 + (S.owner.tenure>9?0.030:0) + (S.owner.tenure>16?0.045:0);
  if(!chance(p)) return;
  const kind=wpick([["family",52],["sale",34],["group",14]]);
  const oldName=t.ownerName||"The owner";
  const oldMandate=S.owner.mandate;
  let name, blurb;
  if(kind==="family"){
    const parts=oldName.replace(/\s+(group|families|family|trust|shareholders)$/i,"").split(/\s+/);
    const surname=parts.length>1&&!/^(and|&|the)$/i.test(parts[parts.length-1])
      ? parts[parts.length-1] : pick(OWNER_LAST);
    name=pick(OWNER_FIRST)+" "+surname;
    blurb=`${oldName} has handed the club to ${name}.`;
    S.owner.patience=clamp(S.owner.patience+ri(2,14),12,96);
  } else if(kind==="sale"){
    name=newOwnerName();
    blurb=`${oldName} has sold the club. ${name} takes over.`;
    S.owner.patience=clamp(ri(48,72),20,90);
  } else {
    name=newOwnerName()+" group";
    blurb=`An investment group led by ${name.replace(" group","")} has bought the club from ${oldName}.`;
    S.owner.patience=clamp(ri(42,66),20,90);
  }
  t.ownerName=name;
  // and his own temperament: family resembles family, a buyer is a stranger
  const old=S.owner.traits||{};
  initOwnerTraits(S.owner);
  if(kind==="family"){
    for(const k in S.owner.traits)
      S.owner.traits[k]=clamp(Math.round((old[k]||50)*0.55+S.owner.traits[k]*0.45),12,90);
    S.owner.base=Object.assign({},S.owner.traits);
  }
  S.owner.years=0; S.owner.changed=null;
  // a new owner brings his own idea of what this is for
  const keys=Object.keys(MANDATES).filter(k=>k!==oldMandate);
  S.owner.mandate = chance(kind==="family"?0.45:0.80) ? pick(keys) : oldMandate;
  S.owner.grace = kind==="family"?1:2;
  S.owner.tenure=0;
  const m=MANDATES[S.owner.mandate];
  news(`${blurb} His brief: "${m.blurb}"`,"info");
  raiseMoment(kind==="family"?"":"win", "The club changes hands", name, blurb);
}
/* AI clubs change hands too, quietly */
function aiOwnerChurn(){
  for(const t of S.teams){
    if(t.id===S.userTeam) continue;
    if(!chance(0.022)) continue;
    const old=t.ownerName||"the owner";
    t.ownerName=chance(.5)?newOwnerName():newOwnerName()+" group";
    t.ownerTend=pick(Object.keys(MANDATES));
    t.newOwnerSince=S.year;
    // a new owner resets how a club behaves
    t.ai.winNow=clamp(t.ai.winNow+rf(-0.3,0.3),0.05,0.95);
    t.ai.aggression=clamp(t.ai.aggression+rf(-0.3,0.3),0.05,0.95);
    if(chance(.35)) news(`${t.city} ${t.name} change hands — ${esc(t.ownerName)} takes over from ${esc(old)}.`,"league");
  }
}

const GRADE_POINTS={"A+":13,"A":12,"A-":11,"B+":10,"B":9,"B-":8,"C+":7,"C":6,
  "C-":5,"D+":4,"D":3,"D-":2,"F":1,"F-":0};
function gradePts(g){ return GRADE_POINTS[g]!==undefined?GRADE_POINTS[g]:6; }
function gradeToLevel(pts){
  return pts>=12?5 : pts>=10?4 : pts>=8?3 : pts>=6?2 : 1;

function seedFacilitiesFromSurvey(){
  for(const t of S.teams){
    const card=NFLPA_2026[t.abbr];
    if(!card){ for(const k of FAC_KEYS) t.fac[k]=2; continue; }
    const [wr,sc,tr,ts,lr,hf,ow]=card.map(gradePts);

/* What a club can put on the table to prise you away. Each offer draws two
   or three of these, weighted by what that club can actually afford.      */
const PERKS = {
  upgrades:{name:"Facility budget", blurb:n=>`${n} upgrade${n>1?"s":""} to place wherever you want, day one.`},
  patience:{name:"A long leash",    blurb:n=>`${n} extra years before the owner starts judging you.`},
  cash:{name:"War chest",           blurb:n=>`${fmtM(n)} in the account to spend as you see fit.`},
  scouting:{name:"Scouting money",  blurb:n=>`$${n}M a year of scouting budget already signed off.`},
  picks:{name:"Extra picks",        blurb:n=>`${n} additional draft pick${n>1?"s":""} in the next two classes.`}
};
function jobAppeal(t){
  // what makes a job worth taking: the roster, the picks, the money, the market
  const roster=t.roster.map(id=>S.players[id]).filter(Boolean);
  const core=roster.filter(p=>p.age<=26&&p.ovr>=78).length;
  const cap=capSpace(t)/1e6;
  return Math.round(clamp(
    (avg(roster.map(p=>p.ovr))-64)*3.2 + core*4.5 + cap*0.10 + t.market*10
    + (t.picks?t.picks.filter(p=>p.round<=2).length*1.6:0) - 12, 0, 100));
}
function buildJobOffer(t){
  const appeal=jobAppeal(t);
  ensureOps(t);
  // a poor job has to pay for itself; a plum job doesn't
  const generosity=clamp(1.35-appeal/95,0.35,1.30);
  const perks=[];
  const budget=Math.round(3+generosity*5);
  const pool=["upgrades","patience","cash","scouting","picks"];
  shuffle(pool);
  let spent=0;
  for(const k of pool){
    if(perks.length>=3||spent>=budget) break;
    if(k==="upgrades"){ const n=clamp(Math.round(generosity*3),1,5); perks.push({k,n}); spent+=n*1.4; }
    else if(k==="patience"){ const n=clamp(Math.round(generosity*3),1,4); perks.push({k,n}); spent+=n; }
    else if(k==="cash"){ const n=Math.round(30e6*generosity*capScale()/5e6)*5e6; if(n>0){perks.push({k,n}); spent+=2;} }
    else if(k==="scouting"){ const n=clamp(Math.round(generosity*30/5)*5,5,45); perks.push({k,n}); spent+=1.5; }
    else if(k==="picks"){ const n=clamp(Math.round(generosity*2),1,3); perks.push({k,n}); spent+=n*1.6; }
  }
  return {team:t.id, appeal, perks, year:S.year,
          mandate:t.ownerTend&&MANDATES[t.ownerTend]?t.ownerTend:pick(Object.keys(MANDATES))};
}
/* who comes calling, and when */
function generateJobOffers(){
  S.jobOffers=[];
  if(!S.owner||S.owner.fired) return;
  const me=S.teams[S.userTeam];
  // your reputation: what you've done lately, and what the league thinks of it
  const rep = clamp((S.owner.patience-40)*0.5
    + (me.history||[]).slice(-3).reduce((a,h)=>a+(h.w-8)*1.6+(h.champ?18:h.playoffs?6:0),0), -40, 70);
  if(rep<8) return;                       // nobody headhunts a GM who hasn't done anything
  const n = rep>52?ri(1,3) : rep>28?ri(0,2) : chance(.5)?1:0;
  if(!n) return;
  // clubs with a vacancy: bad year, or an owner who has run out of patience with his own man
  const candidates=S.teams.filter(t=>t.id!==S.userTeam)
    .filter(t=>winPct(t)<0.45||chance(0.10))
    .sort(()=>rnd()-0.5).slice(0,n);
  for(const t of candidates) S.jobOffers.push(buildJobOffer(t));
  if(S.jobOffers.length)
    news(`${S.jobOffers.length===1?"A club has":"Clubs have"} been in touch about their general manager job.`,"info");
}
function acceptJob(i){
  const o=(S.jobOffers||[])[+i];
  if(!o) return false;
  const from=S.teams[S.userTeam], to=S.teams[o.team];
  S.userTeam=to.id;
  ensureOps(to);
  // the inducements are real
  S.setupPoints=0;
  for(const p of o.perks){
    if(p.k==="upgrades") S.setupPoints+=p.n;
    else if(p.k==="cash") to.cash+=p.n;
    else if(p.k==="scouting") to.scoutInvest=Math.max(to.scoutInvest||0,p.n);
    else if(p.k==="picks"){
      for(let x=0;x<p.n;x++)
        to.picks.push({year:S.year+1+(x%2),round:ri(2,4),orig:to.id});
    }
  }
  const patienceYears=(o.perks.find(p=>p.k==="patience")||{}).n||0;
  S.owner={mandate:o.mandate, patience:62+patienceYears*4, years:0,
           grace:2+patienceYears, history:[], fired:false, tenure:0};
  S.activeScout=to.scouts[0]?to.scouts[0].id:null;
  S.userOffers={}; S.shopOffers=null; S.tradeInbox=[]; S.jobOffers=[];
  V.viewTeam=null; V.screen="hub";
  news(`You've left ${from.city} to take over the ${to.city} ${to.name}.`,"info");
  news(`Your new owner: ${esc(to.ownerName||"the owner")} — "${MANDATES[S.owner.mandate].blurb}"`,"info");
  return true;
}
function jobOfferSheet(){

/* ---------- markets waiting for a club ---------- */
const OPEN_MARKETS = [
  ["St. Louis","Gateway","STL",0.86,"#0B3B6B"],
  ["San Diego","Surf","SD",1.02,"#0F6A8C"],
  ["Oakland","Seals","OAK",1.06,"#2B2B2B"],
  ["San Antonio","Alamo","SA",0.92,"#7A1E1E"],
  ["Portland","Timber","POR",0.88,"#2A5230"],
  ["Salt Lake City","Summit","SLC",0.76,"#5B1F3B"],
  ["Toronto","Northmen","TOR",1.12,"#8C1F2E"],
  ["Mexico City","Aztecas","MEX",1.24,"#0E6B4F"],
  ["London","Monarchs","LDN",1.28,"#3E2B6B"],
  ["Orlando","Thunder","ORL",0.90,"#7A3A0F"],
  ["Austin","Armadillos","AUS",0.94,"#8C6A18"],
  ["Columbus","Ironmen","CMH",0.74,"#12305C"],
  ["Oklahoma City","Drillers","OKC",0.70,"#B0561A"],
  ["Sacramento","Rivermen","SAC",0.84,"#1F4E63"],
  ["Norfolk","Admirals","NOR",0.78,"#0C5148"],
  ["Birmingham","Ironworks","BHM",0.68,"#5E4B12"],
  ["Memphis","Bluff City","MEM",0.72,"#4A2C6B"],
  ["Las Vegas","Neon","LVN",0.90,"#A5ACAF"]
];
function availableMarkets(){
  const taken=new Set(S.teams.map(t=>t.city));
  return OPEN_MARKETS.filter(m=>!taken.has(m[0]));
}

/* ---------- when a move is allowed at all ----------
   Timing rules exist so the map doesn't churn: nothing in the first six
   seasons, one move at a time league-wide, a five-year league cooldown,
   and no club moves twice inside fifteen years.                         */
const RELO_FIRST_SEASON=6, RELO_LEAGUE_COOLDOWN=5, RELO_CLUB_COOLDOWN=15;
function reloAllowed(){
  if(!S.leagueStart) S.leagueStart=S.year;
  if(S.year-S.leagueStart < RELO_FIRST_SEASON) return false;
  if(S.lastRelocation && S.year-S.lastRelocation < RELO_LEAGUE_COOLDOWN) return false;
  return availableMarkets().length>0;
}
/* how badly a club wants out: small market, empty seats, losing, no stadium */
function reloPressure(t){
  ensureOps(t);
  if(t.movedYear && S.year-t.movedYear < RELO_CLUB_COOLDOWN) return 0;
  const recent=(t.history||[]).slice(-5);
  const wp = recent.length? avg(recent.map(h=>h.w/(h.w+h.l||1))) : 0.5;
  const money = (t.books||[]).slice(0,3);
  const losses = money.length? avg(money.map(b=>b.net))/1e6 : 0;
  let p=0;
  p += clamp((0.92-t.market)*55,0,34);            // a market that can't support it
  p += clamp((0.44-wp)*70,0,26);                  // nobody is coming to watch
  p += clamp((2-facLvl(t,"stadium"))*13,0,26);    // and the building is a relic
  p += clamp(-losses*0.35,0,22);                  // losing money every year
  p += (t.newOwnerSince && S.year-t.newOwnerSince<=2) ? 10 : 0;  // new owners move clubs
  return Math.round(p);
}
function bestDestinationFor(t){
  const open=availableMarkets();
  if(!open.length) return null;
  return open.map(m=>({m, v:m[3]*100 + rf(-12,12) - (m[3]<t.market?25:0)}))
             .sort((a,b)=>b.v-a.v)[0].m;
}
function relocateTeam(t,dest,quiet){
  const oldCity=t.city, oldName=t.name;
  t.city=dest[0]; t.name=dest[1]; t.abbr=dest[2];
  t.market=dest[3]; t.color=dest[4];
  t.movedYear=S.year;
  t.fac.stadium=Math.max(3,facLvl(t,"stadium")+2);   // a new building is the point
  t.prestige=clamp((t.prestige||60)-6,PRESTIGE_MIN,PRESTIGE_MAX);
  t.cash=Math.round((t.cash||0)+120e6*capScale());                    // relocation fee and new revenue
  S.lastRelocation=S.year;
  S.relocations=S.relocations||[];
  S.relocations.push({year:S.year,from:oldCity+" "+oldName,to:t.city+" "+t.name,id:t.id});
  if(!quiet)
    news(`The ${oldCity} ${oldName} are moving. From next season they are the ${t.city} ${t.name}.`,
         t.id===S.userTeam?"loss":"league");
  return t;
}
function considerRelocation(){
  if(!reloAllowed()) return;
  const ranked=S.teams.map(t=>({t,p:reloPressure(t)+rf(0,6)})).filter(x=>x.p>=52)
    .sort((a,b)=>b.p-a.p);
  if(!ranked.length) return;
  const top=ranked[0];
  if(!chance(clamp((top.p-46)/85,0.05,0.55))) return;
  const dest=bestDestinationFor(top.t);
  if(!dest) return;
  if(top.t.id===S.userTeam){
    // your owner tells you rather than asks, but you get the year's warning
    S.reloNotice={to:dest, year:S.year};
    news(`Ownership has filed to move the club to ${dest[0]}. The vote is next spring.`,"loss");
    return;
  }
  relocateTeam(top.t,dest);
}
/* a filed move goes through the following offseason */
function resolveUserRelocation(){
  if(!S.reloNotice) return;
  if(S.year-S.reloNotice.year<1) return;
  const t=S.teams[S.userTeam];
  const dest=S.reloNotice.to;
  S.reloNotice=null;
  if(availableMarkets().some(m=>m[0]===dest[0])) relocateTeam(t,dest);
}

/* ---------- the career record ---------- */
function ensureCareer(){
  if(!S.career) S.career={seasons:0,w:0,l:0,playoffs:0,divisions:0,confs:0,champs:0,
    clubs:[],firedFrom:[],drafted:0,hof:0,best:0};
  const t=S.teams[S.userTeam];
  const label=t.city+" "+t.name;
  if(!S.career.clubs.length||S.career.clubs[S.career.clubs.length-1].club!==label)
    S.career.clubs.push({club:label,from:S.year});
  return S.career;
}
function logCareerSeason(){
  const c=ensureCareer(), t=S.teams[S.userTeam];
  c.seasons++; c.w+=t.w; c.l+=t.l;
  if(t.madePlayoffs) c.playoffs++;
  const div=sortTeams(S.teams.filter(x=>x.conf===t.conf&&x.div===t.div));
  if(div.length&&div[0].id===t.id) c.divisions++;
  if(S.playoffs&&S.playoffs.rounds.some(r=>
      /Championship$/.test(r.label)&&r.label!=="The Championship"&&r.winner===t.id)) c.confs++;
  if(S.champion===t.id) c.champs++;
  c.best=Math.max(c.best,t.w);
  const last=c.clubs[c.clubs.length-1];
  if(last) last.to=S.year;
}
const PRESTIGE_MIN=20, PRESTIGE_MAX=100;
/* a club's standing in the game rises and falls with what it does */
function updatePrestige(){
  for(const t of S.teams){
    const wp=winPct(t);
    let d=(wp-0.5)*7;
    if(t.madePlayoffs) d+=2.5;
    if(S.champion===t.id) d+=9;
    if(wp<0.30) d-=2.5;
    // it drifts back toward the middle: nobody stays a giant on reputation alone
    d+=(62-(t.prestige||60))*0.10;
    t.prestige=clamp(Math.round(((t.prestige||60)+d)*10)/10,PRESTIGE_MIN,PRESTIGE_MAX);
  }
}
function careerScore(){
  const c=S.career;
  if(!c) return 0;
  return Math.max(0,Math.round(
      c.champs*2500            // everything else is a footnote next to this
    + c.confs*200
    + c.divisions*60
    + c.playoffs*70
    + (c.w-c.l)*6
    + c.hof*160
    + c.seasons*10
    - (c.firedFrom?c.firedFrom.length:0)*250
  ));
}
const CAREER_TIERS=[
  [9000,"Immortal","They name the trophy after men like you."],
  [5500,"Hall of Fame executive","A career the league will teach from."],
  [3000,"Great","One title and a decade of good football."],
  [1500,"Respected","A safe pair of hands. Something on the shelf would help."],
  [700,"Established","Long enough in the job to have a record worth reading."],
  [250,"Journeyman","Some good years, nothing anyone will remember."],
  [0,"Unproven","The career is still ahead of you."]
];
function careerTier(){
  const s=careerScore();
  return CAREER_TIERS.find(t=>s>=t[0])||CAREER_TIERS[CAREER_TIERS.length-1];
}
function careerPanel(){
  const c=ensureCareer();
  const s=careerScore(), tier=careerTier();
  const nextTier=CAREER_TIERS.filter(t=>t[0]>s).pop();
  const rows=[["Seasons",c.seasons],["Record",`${c.w}-${c.l}`],
    ["Playoff seasons",c.playoffs],["Division titles",c.divisions],
